name: toolchain
description: Go and the pinned deno of internal/versions/versions.json, with the job's cache and temp directories

runs:
  using: composite
  steps:
    - name: Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false

    - name: deno
      shell: bash
      run: |
        set -euo pipefail
        test -n "${HOME:-}"
        test "$(id -u)" != 0
        state="$RUNNER_TEMP/ci"
        export CI_STATE="$state"
        export TMPDIR="$state/tmp" GOCACHE="$state/go-build" GOMODCACHE="$state/go-mod" DENO_DIR="$state/deno-dir"
        mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$DENO_DIR"
        platform="$(go env GOOS)/$(go env GOARCH)"
        deno_url="$(jq -er --arg p "$platform" '.assets.deno.fetch[$p].url' internal/versions/versions.json)"
        deno_sha="$(jq -er --arg p "$platform" '.assets.deno.fetch[$p].sha256' internal/versions/versions.json)"
        export DENO_BIN="$CI_STATE/deno/$deno_sha/deno"
        if [ ! -x "$DENO_BIN" ]; then
          curl -fsSL --max-time 120 -o "$TMPDIR/deno.zip" "$deno_url"
          echo "$deno_sha  $TMPDIR/deno.zip" | sha256sum -c --quiet -
          mkdir -p "$(dirname "$DENO_BIN")"
          unzip -q -o "$TMPDIR/deno.zip" deno -d "$(dirname "$DENO_BIN")"
        fi
        export PATH="$(dirname "$DENO_BIN"):$PATH"
        echo "OUT=$CI_STATE/out/$GITHUB_SHA" >>"$GITHUB_ENV"
        for v in CI_STATE TMPDIR GOCACHE GOMODCACHE DENO_DIR DENO_BIN; do
          echo "$v=${!v}" >>"$GITHUB_ENV"
        done
        echo "$(dirname "$DENO_BIN")" >>"$GITHUB_PATH"
        go version && deno --version | head -1
