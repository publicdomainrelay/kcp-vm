name: prod-canary

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prod-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.repository == 'publicdomainrelay/socialweb-computer-kcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - name: canary
        run: deno run -A --node-modules-dir=none scripts/prod-canary.ts --log "$RUNNER_TEMP/results.jsonl"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-canary-results
          path: ${{ runner.temp }}/results.jsonl
          if-no-files-found: ignore
