name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - name: deno.lock is current
        run: deno install --frozen --node-modules-dir=none
      - name: deno check (every entry of deploy/ts-entries.yaml)
        run: deno task check
      - name: deno test (the root workspace)
        run: deno task test
