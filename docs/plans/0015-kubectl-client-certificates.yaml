plan: 0015-kubectl-client-certificates
written: 2026-10-12
revised: >
  2026-10-12, first version. A runbook: a smaller model executes it item by item, in order, with no design
  decision of its own. Every design decision is in the `decision` field of an item. When a STOP condition
  is met, the executor stops, does not guess, and reports the output to the lead.
  Carved out of plan 0014 M3-KUBECTL-CLIENT-CERT. That item stays in plan 0014. This plan does the same
  user-visible result WITHOUT the plan 0014 OpenBao atproto auth plugin and WITHOUT the plan 0014 web app
  sign-in: the existing XRPC com.publicdomainrelay.temp.cluster.getKubeconfig returns a kubeconfig whose user
  is a short-lived x509 client key and certificate issued by the PKI of the cluster's own OpenBaoServer.
queued: >
  May start now. It needs no other open plan item. Items run in the order of the `items` list. M3-PROD-READING
  is run by the lead only. M5-RETIRE-EXEC-PLUGIN starts only after M3-PROD-READING is done.
relation_to_0014: >
  Plan 0014 M3-KUBECTL-CLIENT-CERT later adds what this plan leaves out: the kind ClusterClientCertificate,
  the web app download through a bao DPoP proof, and the front check against that kind. It builds on the
  issuer, the PKI role and the client certificate front of this plan; it does not replace them. Plan 0014
  M3-RETIRE-EXEC-PLUGIN is the same work as M5-RETIRE-EXEC-PLUGIN here; whichever runs first closes both.
source: >
  Read on main at c1d7026e (2026-10-12). How auth reaches the tenant k3s today:
  (1) kubectl -> https://kcp.socialweb.computer. Caddy ends TLS there (scripts/deploy.sh:142-152, site
  ${KCP_ORIGIN}) and opens a new TLS connection to kcp on 127.0.0.1:6443. A client certificate stops at Caddy.
  (2) kcp serves /clusters/root:<acct>:<cluster>:clusters through its local proxy (kcp v0.33.0,
  pkg/server/localproxy.go:103-189, in the Go module cache). The local proxy wraps the whole handler chain
  (pkg/server/config.go:672), so it runs BEFORE kcp authentication. It forwards the request with all client
  headers through httputil.ReverseProxy to the mount child's spec.URL, with InsecureSkipVerify and no client
  certificate (we do not set --mount-proxy-client-cert-file; grep finds no use). docs/ARCHITECTURE.md
  section 7 (line 1156) states the rule: "Bearer only through the mount".
  (3) spec.URL is the cluster's apiserver front (internal/apiserverfront/front.go:270-305, a TCP pipe, no
  TLS end) in front of k3s. The front also carries the kubelets of market nodes, so it must stay a TCP pipe.
  (4) The bearer today is a ServiceAccount token: the kubeconfig exec plugin (cmd/socialweb-credential,
  internal/execplugin) trades SOCIALWEB_DEVICE_KEY at POST /v1/credential (internal/xrpcserver/xrpcserver.go:31,
  186, 452-490; internal/mint/mint.go:85-131) for a TokenRequest token of the ServiceAccount
  users/did-<base32(did)> (internal/tenantclient/tenantclient.go:164-196; internal/kcpclient/names.go:62-66).
  (5) RBAC: deploy/tenant-grant.yaml:42-56, ClusterRoleBinding socialweb-owner binds that ServiceAccount to
  cluster-admin. FINDING: the exec-plugin path uses NO owners group. Its identity is the ServiceAccount
  user name; its groups are only system:serviceaccounts and system:serviceaccounts:users. This plan adds
  the group socialweb.computer:cluster-owners as a second subject of the same binding (M1-OWNERS-GROUP-RBAC).
  (6) The per-cluster OpenBaoServer (internal/clusterprovider/openbaoserver.go:186-212, name from
  VaultServerName, line 151) already has a pki mount "pki" (internal/clusterprovider/vault.go:26) whose CA IS
  the k3s client CA: CustodyClusterVault (vault.go:176-200) calls ImportClientCA (vault.go:116-131), which
  writes <dataDir>/server/tls/client-ca.{crt,key} to pki/config/ca. CustodyClusterVault runs for every cluster
  from the Harvest hook (internal/providermain/main.go:263-280). So every certificate from pki/issue is
  already signed by the CA that k3s trusts for client certificates. The existing roles are tenant-superuser
  (O system:masters, ttl 8760h) and node-client (internal/clusterprovider/vaultdeclared.go:79-83).
  (7) The gateway (internal/gatewaymain, internal/gateway, internal/kcpclient) and the clusterprovider run in
  ONE process as the same account (internal/stack/gatewaykcp/gatewaykcp.go:450-524). The gateway can read
  the cluster data dirs and use clusterprovider.ClusterVaultClient (openbaoserver.go:112).
  (8) kubeconfig.AssertClean (internal/kubeconfig/kubeconfig.go:104-121) refuses client-certificate-data and
  client-key-data today. docs/ARCHITECTURE.md:1235-1241 records that as a rule. This plan changes that rule
  for the user path on purpose (decided by the user 2026-10-12, plan 0014 revision 2).
  (9) k3s sets request-header authentication by default: --requestheader-client-ca-file
  <dataDir>/server/tls/request-header-ca.crt, --requestheader-allowed-names system:auth-proxy, headers
  X-Remote-User and X-Remote-Group, and it writes the proxy client pair <dataDir>/server/tls/client-auth-proxy.{crt,key}.
  request-header-ca is part of the identity bundle (internal/identitybundle/identitybundle.go:18-19), so
  every slot of a cluster trusts the same proxy client. M2-CLIENT-CERT-FRONT checks these facts live first.
principle:
  stated: >
    A user reaches a tenant cluster with plain kubectl and a short-lived client certificate from that
    cluster's own OpenBao PKI. The certificate is checked where its TLS ends, by our own code, against the
    cluster's CA, the PKI CRL and the deny record. The private key is made by OpenBao, returned once in the
    getKubeconfig response, and stored nowhere.
  rules:
    - "The tenant identity comes only from a verified source: the iss of a checked service JWT when the certificate is issued, and the CN of a checked certificate when a request is forwarded."
    - "The client certificate front is the only component that turns a certificate into a tenant identity. kcp never forwards an identity header that a client wrote."
    - "The apiserver front stays a TCP pipe; k3s stays unchanged."
    - "No migration and no back-compat: the exec-plugin path keeps working until M5-RETIRE-EXEC-PLUGIN removes it."
security_rules:
  - "KEY: the client private key is made by OpenBao (pki/issue). It exists only in the getKubeconfig response body. Never write it to kcp, to a file, to an atproto record, to a DenoPod or HostProcess argument, or to a log line. Never put it, the certificate or the kubeconfig text in an error message. The response has Cache-Control: no-store (gateway XRPC and web app)."
  - "KEY LOG CHECK: after every live check of M1-GETKUBECONFIG-HANDLER, M2 and M4, run `grep -rl 'PRIVATE KEY' <gateway dir>/logs <gateway dir>/denokcp/runs` and `grep -rl 'client-key-data' <same>`. Any match is a STOP."
  - "TTL: default 8 h (28800 s). ttlSeconds below 60 or above 86400 is refused with InvalidRequest, never clamped. The PKI role kubeconfig-user has ttl 8h and max_ttl 24h as a second limit. The front refuses a certificate from that role whose NotAfter minus NotBefore is more than 24 h plus 5 minutes. EXCEPTION (user decision 2026-10-13, M2-NO-EXPIRY-CERT): `noExpiry: true` issues from the separate role kubeconfig-user-noexpiry, NotAfter = 9999-12-31T23:59:59Z (RFC 5280 no-expiry value) truncated to the cluster CA NotAfter; such a certificate carries OU socialweb.computer:no-expiry (set by the role, never by the request) and the front accepts its long lifetime only with that OU. It ends only by revocation (CRL + deny, checked every request), cluster delete (fresh CA per creation, M2-FRESH-CA-PER-CREATION), or CA expiry."
  - "CN: the issuer sets common_name to the verified caller DID (gateway.Caller, from atprotoauth.Verify of the service JWT iss). Never from a request field. The front takes the user name only from the CN of a certificate that chains to the cluster's client CA, and refuses it when kcpclient.AccountHash(CN) is not the account segment of the request path."
  - "O: exactly one organization, socialweb.computer:cluster-owners, set by the PKI role, never by the request. The front refuses any other O (this refuses tenant-superuser and node-client certificates of the same CA). The front never forwards system:masters."
  - "HEADERS: the front deletes Authorization, every X-Remote-* header and X-Socialweb-Client-Certificate from the incoming request before it adds its own X-Remote-User and X-Remote-Group."
  - "EDGE: the front believes X-Socialweb-Client-Certificate only when the TLS peer certificate is byte-equal to the edge client certificate that the front made (<gateway state>/tls/edge-client.crt). Any other peer that sends the header is refused with 400."
  - "REVOCATION: the front checks, on every request, the deny record (revocation.Admit; a Granted answer is cached at most 2 s, a refusal is never cached) and the cluster PKI CRL (cached at most 60 s; no CRL newer than 10 minutes means 503). A request ends at the certificate's NotAfter."
state_rules:
  - "No unit tests (user, 2026-10-12). Each item is proven by a build and a live reading on the executor's own market network. The only test written is the integration test of M4-INTEGRATION-TEST."
  - "Delete any existing _test.go test that a change breaks, in the same commit (AGENTS.md: do not repair old tests)."
  - "Real names only (AGENTS.md). Commit and push only socialweb-computer-kcp on task/<worktree>. The lead flips status."
  - "No comments in code except the ponytail: form. ASCII only."
  - "Task agents never touch prod. M3-PROD-READING is the lead's."
ownership:
  repository: socialweb-computer-kcp
  go: "internal/xrpcserver (lexicons, no-store), internal/gateway (ttl, revocation hooks), internal/gatewaymain (wiring), internal/kcpclient (OwnersGroup), internal/kubeconfig (certificate kubeconfig), internal/openbao (CertRequest), internal/clientcert (new: issue and revoke), internal/clientcertfront (new: the client certificate front), internal/clusterprovider (PKI role, policy), internal/openbaoctl (cn_validations), api/v1alpha1 (OpenBaoPKIRole.CNValidations), internal/stack/gatewaykcp, internal/install, internal/clicfg, cmd/socialweb-computer"
  typescript: "socialweb-computer-k8s (kubeconfig ttl choices, no-store)"
  other: "deploy/tenant-grant.yaml, scripts/deploy.sh (caddy), README.md, docs/ARCHITECTURE.md, test/integration"
how_to_run:
  worktree: "git -C /home/johnandersen777/src/publicdomainrelay-kcp/socialweb-computer-kcp fetch origin; git -C <same> worktree add /home/johnandersen777/src/swc-worktrees/<name> -b task/<name> origin/main. Work only there."
  build_while_iterating: "go build ./internal/<the packages you touched>/... ./cmd/socialweb-computer ; deno check <entry> for TypeScript (deploy/ts-entries.yaml). Never the full gate per change; CI runs it on push."
  dev_binary: "scripts/build-socialweb-computer.sh --dev --publish /var/tmp/<name>. The binary is printed at the end (under ~/.tmp/socialweb-computer-build/dev/<worktree>/)."
  live_slot: "deno run -A /home/johnandersen777/.tmp/swc-lead/live-slot.ts acquire <name> before dev up; beat every 30 min; release after dev down, also on failure."
  market_network_up: "As test-0001: sudo -n -u test-0001 <binary> dev up --instance <name> --profile market-network --bidders 0 --with-gateway --guest-image-source file:///var/lib/socialweb-computer/guest-image --vm-host-backend systemd-user --state-dir /var/tmp/<name>-state. Run it with run_in_background. It prints a JSON report; Ready is .network.status.phase == Ready. The gateway brings up the tenant cluster `tenant` (owner: the account in owner-sessions.json). No item of this plan needs a VM, so --bidders 0."
  market_network_down: "sudo -n -u test-0001 <binary> dev down --instance <name> --state-dir /var/tmp/<name>-state, then live-slot release."
  paths:
    gateway_dir: "/var/tmp/<name>-state/dev/<name>/apps/dev/<name>-gateway (test/integration/tenant.go:83-85)."
    owner_sessions: "<gateway_dir>/owner-sessions.json: {\"<did>\": {\"service\", \"identifier\", \"password\"}} (internal/appctl/gatewaychild.go:25-29). Mode 0600. Never print it."
    cluster_data_dir: "<gateway_dir>/clusterprovider/pdr-<accountHash>-tenant (internal/clusterprovider/name.go:39-45; test/integration/tenant.go:136-142)."
    cluster_tls: "<cluster_data_dir>/server/tls: client-ca.crt, server-ca.crt, client-admin.{crt,key}, request-header-ca.crt, client-auth-proxy.{crt,key}."
    front_state: "<cluster_data_dir>/front.json, field address (internal/clusterprovider/front.go:36; internal/apiserverfront/front.go:37-43)."
    vault_access: "<cluster_data_dir>/openbao/access.json: address, caFile, clientCert, clientKey, certMount, certRole (internal/clusterprovider/openbaoserver.go:38-66)."
    network_ca: "the CA bundle of the market network: `dev status --instance <name>` .network.status.network.caBundleRef."
    listeners: "`dev status --instance <name>` .network.status.apps[] | select(.name == \"<name>-gateway\") | .listeners[]: xrpc (http, loopback), tls (https), and after M2 client-cert (https)."
    gateway_log: "<gateway_dir>/logs/core.log (JSON lines; test/integration/tenant.go:122-134 reads it)."
    audience: "did:web:socialweb.local in a market network (internal/stack/gatewaykcp/env.go:19, 101). Confirm it in the gateway log line \"serving\" field audiences."
  helper_scripts: >
    Write these three one-off scripts once under ~/.tmp/runbook-cert/ (Deno built-ins only, no imports, so test-0001
    needs no network). Copy them and ~/.deno/bin/deno to /var/tmp/runbook-cert/ (deno mode 0755, scripts 0644).
    Run them as `sudo -n -u test-0001 env DENO_DIR=/var/tmp/runbook-cert/deno-dir /var/tmp/runbook-cert/deno run -A
    --cert <network_ca> /var/tmp/runbook-cert/<script>.ts <args>`. STOP if test-0001 cannot run that deno.
    (1) xrpc.ts --gateway-dir D --xrpc http://<xrpc listener> --aud A --nsid <method name without prefix> --name N
    [--ttl S] [--out FILE]: reads the first entry of D/owner-sessions.json; POST <service>/xrpc/com.atproto.server.createSession
    {identifier, password}; GET <service>/xrpc/com.atproto.server.getServiceAuth?aud=A&lxm=com.publicdomainrelay.temp.cluster.<nsid>&exp=<now+60>
    with Bearer accessJwt; POST <xrpc>/xrpc/com.publicdomainrelay.temp.cluster.<nsid> with JSON {name, ttlSeconds?} and
    Bearer <service JWT>. It prints the HTTP status, the Cache-Control header and the JSON body EXCEPT the field kubeconfig.
    With --out it writes the kubeconfig field to FILE with mode 0600 and prints only its byte count. It never prints a
    password, a token or the kubeconfig. This is what goat does on prod (README.md:86-104).
    (2) bao.ts --data-dir C --method GET|LIST --path P [--unauth]: reads C/openbao/access.json; builds Deno.createHttpClient
    with caCerts = [caFile] and the client pair clientCert/clientKey; unless --unauth, POST <address>/v1/auth/<certMount>/login
    {"name": <certRole>} and takes auth.client_token; then requests <address>/v1/<P> with X-Vault-Token and prints the JSON
    data. It never prints the token. For a PEM path (pki/crl/pem, pki/ca/pem) it prints the body as text.
    (3) certinfo.ts --kubeconfig FILE: parses the YAML by hand (look for client-certificate-data:, client-key-data:,
    exec:, token:), prints which of those keys exist, base64-decodes client-certificate-data to a temp file under
    $TMPDIR, runs `openssl x509 -noout -subject -issuer -serial -dates -ext extendedKeyUsage,subjectAltName` on it,
    prints that output, and removes the temp file. It never prints client-key-data.
items:
  - id: M1-LEXICON-TTL
    milestone: M1
    title: getKubeconfig lexicon - ttlSeconds is the certificate lifetime; output shape unchanged
    depends_on: []
    decision: >
      ttlSeconds already exists (an integer). Keep the name and the output shape {kubeconfig, instance}. Add
      minimum 60 and maximum 86400 so the lexicon validation refuses an out-of-range value as InvalidRequest
      before the handler runs (decodeBody, internal/xrpcserver/xrpcserver.go:246-272). Absent means 28800. Add
      the error ClusterNotRunning (409) for a cluster whose spec.running is false: a stopped cluster has no
      running vault to issue from. Rewrite the descriptions so they no longer name the exec plugin, the device
      key or SOCIALWEB_MINT_URL.
    files:
      - "internal/xrpcserver/lexicons/getKubeconfig.json (the embedded copy that xrpcserver loads: lexicons.go:13-19)"
      - "lexicons/com/publicdomainrelay/temp/cluster/getKubeconfig.json (the published copy; must stay byte-equal)"
    change: |
      1. In both files, defs.main.description: replace the last sentence ("The caller may ask for a shorter-lived
         device credential ...") with: "The kubeconfig carries a client key and a short-lived x509 client
         certificate issued by the cluster's own OpenBao PKI. The key is made by OpenBao and returned only in this
         response; nothing stores it. ttlSeconds sets the certificate lifetime." Also replace "A COLD cluster is NOT
         an error here: the kubeconfig is returned and its mount answers 503 until controlPlaneUp is called. This
         call does not wake the control plane." with "A cluster whose spec.running is false answers
         ClusterNotRunning; call createCluster or controlPlaneUp first. This call does not wake the control plane."
      2. properties.ttlSeconds: add "minimum": 60, "maximum": 86400. description: "Lifetime of the client
         certificate in seconds. Absent is 28800 (8 h). Below 60 or above 86400 is InvalidRequest: refused, never
         clamped."
      3. output.properties.kubeconfig.description: "The whole kubeconfig, as YAML text. users[0].user holds
         client-certificate-data and client-key-data; there is no exec block and no token. The certificate's CN is
         the caller DID and its O is socialweb.computer:cluster-owners. Keep the file mode 0600; never commit it."
         Do not change output.required or the property names.
      4. errors: add {"name": "ClusterNotRunning", "description": "The cluster exists but spec.running is false.
         Call createCluster or controlPlaneUp, then call this again."} and {"name": "ClusterInitializing",
         "description": "The control plane or its vault is coming up. Retry after the Retry-After header."}.
    check: |
      diff internal/xrpcserver/lexicons/getKubeconfig.json lexicons/com/publicdomainrelay/temp/cluster/getKubeconfig.json   (no output)
      yq -o=json '.' internal/xrpcserver/lexicons/getKubeconfig.json > /dev/null   (exit 0)
      go build ./internal/xrpcserver/... ./cmd/socialweb-computer   (exit 0)
    stop: |
      - diff prints anything after you copied the file.
      - go build fails with "has no lexicon" or a lexicon parse error from loadCatalog (xrpcserver.go:104-107).
    done_when: "both copies are equal, carry minimum/maximum and the two errors, and the binary builds."
    risks: []
    status: done
    evidence:
  - id: M1-PKI-ROLE
    milestone: M1
    title: OpenBaoServer declaration - PKI role kubeconfig-user, cn_validations, and the policy paths
    depends_on: [M1-LEXICON-TTL]
    decision: >
      New role kubeconfig-user on the pki mount of every cluster's OpenBaoServer, declared next to
      tenant-superuser. A DID ("did:plc:...") is not a hostname or an e-mail, and OpenBao checks the CN with
      cn_validations ["email", "hostname"] by default, so the role needs cn_validations ["disabled"].
      OpenBaoPKIRole has no such field, so this item adds CNValidations to the API type and to the openbao
      controller. The gateway logs in to the cluster vault with the existing clusterprovider client
      (ClusterVaultClient); its policy gets the issue, list, read and revoke paths. A separate vault client for
      the gateway is not added (smallest change; risk below). no_store stays false (the default) so that
      pki/revoke by serial and LIST pki/certs work.
    files:
      - "api/v1alpha1/types_openbaoserver.go:202-236 (type OpenBaoPKIRole)"
      - "internal/openbaoctl/layout.go:258-270 (the decl.PKIRoles loop)"
      - "internal/clusterprovider/vault.go:25-29 (const block with VaultPKIPath, VaultPKIRoleTenant)"
      - "internal/clusterprovider/vaultdeclared.go:26-37 (clusterProviderRules), :79-83 (d.PKIRoles append)"
      - "internal/kcpclient/names.go:62 (TenantNamespace)"
    change: |
      1. api/v1alpha1/types_openbaoserver.go, in OpenBaoPKIRole after Organization, add:
         CNValidations []string `json:"cnValidations,omitempty"`
         Then run `go generate ./api/...` at the repository root. It rewrites the schemas under deploy/ and the
         TypeScript wire types. Commit those generated files with this change. If the generator asks for a
         Revision bump (deploy/apiresourceschema-revisions.txt), do what it says.
      2. internal/openbaoctl/layout.go, in the decl.PKIRoles loop, after put(data, "organization", r.Organization) add:
         put(data, "cn_validations", r.CNValidations)
      3. internal/kcpclient/names.go, after TenantNamespace add:
         const OwnersGroup = "socialweb.computer:cluster-owners"
      4. internal/clusterprovider/vault.go, in the const block add:
         VaultPKIRoleKubeconfig = "kubeconfig-user"
      5. internal/clusterprovider/vaultdeclared.go, staticClusterDeclared, append to d.PKIRoles (after the
         tenant-superuser entry):
         v1alpha1.OpenBaoPKIRole{Mount: VaultPKIPath, Name: VaultPKIRoleKubeconfig, AllowAnyName: true,
           EnforceHostnames: false, ClientFlag: true, ServerFlag: false, RequireCN: true, KeyType: "ec", KeyBits: 256,
           KeyUsage: []string{"DigitalSignature"}, Organization: []string{kcpclient.OwnersGroup},
           CNValidations: []string{"disabled"}, TTL: "8h", MaxTTL: "24h"}
         (import internal/kcpclient if the file does not import it yet; clusterprovider already depends on it.)
      6. vaultdeclared.go, clusterProviderRules, add these rules:
         {Path: VaultPKIPath + "/issue/" + VaultPKIRoleKubeconfig, Capabilities: cu},
         {Path: VaultPKIPath + "/revoke", Capabilities: cu},
         {Path: VaultPKIPath + "/certs", Capabilities: []string{"list"}},
         {Path: VaultPKIPath + "/certs/", Capabilities: []string{"list"}},
         {Path: VaultPKIPath + "/cert/*", Capabilities: []string{"read"}},
    check: |
      go build ./api/... ./internal/openbaoctl/... ./internal/clusterprovider/... ./cmd/socialweb-computer
      git status --short deploy/   (shows the regenerated OpenBaoServer schema)
      Live (dev binary, market network up, tenant cluster answers /readyz, see how_to_run):
        bao.ts --data-dir <cluster_data_dir> --method GET --path pki/roles/kubeconfig-user
          expect: cn_validations ["disabled"], organization ["socialweb.computer:cluster-owners"], ttl 28800,
          max_ttl 86400, client_flag true, server_flag false, allow_any_name true, no_store false.
        bao.ts --data-dir <cluster_data_dir> --method GET --path pki/ca/pem --unauth
          expect: the same PEM as <cluster_data_dir>/server/tls/client-ca.crt (compare with
          `openssl x509 -noout -fingerprint -sha256` of both).
        bao.ts --data-dir <cluster_data_dir> --method GET --path sys/policies/acl/clusterprovider
          expect: the policy text holds pki/issue/kubeconfig-user, pki/revoke, pki/certs, pki/cert/*.
    stop: |
      - go generate fails, or wants a hand edit of a generated file.
      - The role read answers 404 two minutes after the tenant cluster is Ready, or the OpenBaoServer status
        (kcp, workspace of the clusterprovider; kubectl get openbaoservers -A -o yaml) reports a sync error.
      - cn_validations is missing or not ["disabled"] in the role read (the OpenBao version does not know it).
      - The pki/ca/pem fingerprint differs from client-ca.crt: the design assumption of this plan (source (6)) is
        false.
    done_when: "the role and the policy paths are live on a market network tenant cluster vault, and the PKI CA equals the k3s client CA."
    risks:
      - "Decided by the user 2026-10-13: the gateway does NOT share the clusterprovider vault identity. Each cluster OpenBao declares a gateway-only client (cert-auth role `gateway-kubeconfig`, its own client certificate) whose policy allows ONLY pki/issue/kubeconfig-user, pki/revoke and pki/certs listing for that role; M1-PKI-ROLE adds the client and policy, M1-CERT-ISSUER logs in with it. A gateway bug can then never issue tenant-superuser or node certificates."
      - "Plan 0013 M3-VAULT-TIDY must keep no_store false for kubeconfig-user; pki tidy removes its expired certificates."
    status: done
    evidence:
  - id: M1-OWNERS-GROUP-RBAC
    milestone: M1
    title: RBAC - the owners group gets the same binding as the owner ServiceAccount
    depends_on: [M1-PKI-ROLE]
    decision: >
      The exec-plugin path has no owners group (source (5)). To give a certificate user the same permissions as
      today, the ClusterRoleBinding socialweb-owner gets a second subject: the group
      socialweb.computer:cluster-owners. Only the client certificate front sends that group to k3s (by
      request-header authentication), and only for a certificate whose CN hashes to the cluster's account, so
      the group grants nothing to another account. The ServiceAccount subject stays until M5. The grant is
      applied when a cluster is created; existing clusters are not changed (no migration; prod is disposable).
    files:
      - "deploy/tenant-grant.yaml:42-56 (ClusterRoleBinding socialweb-owner)"
    change: |
      1. In deploy/tenant-grant.yaml, ClusterRoleBinding socialweb-owner, subjects: add after the ServiceAccount entry:
           - kind: Group
             apiGroup: rbac.authorization.k8s.io
             name: socialweb.computer:cluster-owners
         Do not change roleRef (cluster-admin), the ValidatingAdmissionPolicy or the gwmint objects.
    check: |
      go build ./internal/stack/gatewaykcp/... ./cmd/socialweb-computer   (the file is embedded: deploy/embed.go)
      Live (new market network, so the tenant cluster gets the new grant): with the k3s admin kubeconfig of the
      tenant cluster (<cluster_data_dir>/server/cred/admin.kubeconfig; if it is missing, build a kubeconfig from
      front.json address + server/tls/server-ca.crt + client-admin.{crt,key} as test/integration/tenant.go:143-166 does):
        kubectl --kubeconfig <admin> auth can-i '*' '*' --as did:plc:runbookcheck --as-group socialweb.computer:cluster-owners
          expect: yes
