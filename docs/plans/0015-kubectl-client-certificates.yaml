    milestone: M4
    title: Integration test - service JWT, getKubeconfig, kubectl without a helper, revoked certificate refused
    depends_on: [M3-PROD-READING]
    decision: >
      One Go test in test/integration on the existing harness (plan 0010 G2): its own market network with a gateway
      and no bidders. It does in Go what goat does on prod: createSession and getServiceAuth on the owner's PDS,
      then the gateway XRPC with the service JWT. kubectl runs with a PATH that has no socialweb-credential.
    files:
      - "test/integration/kubeconfig_client_cert_test.go (new, //go:build integration, package integration)"
      - "test/integration/harness.go:393-441 (StartNetwork), :697-708 (App), test/integration/tenant.go:83-85 (GatewayDir), :95-120 (Tenant)"
    change: |
      Test name: TestKubeconfigClientCertificateWithoutCredentialHelper. t.Parallel().
      1. n := StartNetwork(t, NetworkOptions{Bidders: 0, WithGateway: true, UpTimeout: 5*time.Minute}); n.Tenant(t, "tenant", tenantReady).
      2. Read <GatewayDir>/owner-sessions.json with n.read (never log it). Read the network CA from
         n.Up.Network.Status.Network.CaBundleRef with n.read. Find the gateway app with n.App(n.Instance+"-gateway");
         take its listeners xrpc (http) and client-cert (https). t.Fatal when one is missing.
      3. HTTP client with the network CA as RootCAs and a 15 s timeout. createSession -> accessJwt.
         serviceJWT(lxm) := GET getServiceAuth?aud=did:web:socialweb.local&lxm=<nsid>&exp=<now+60>.
      4. getKubeconfig {name: "tenant", ttlSeconds: 3600} with the JWT -> 200, header Cache-Control "no-store".
         Write the kubeconfig to t.TempDir()/kc.yaml with mode 0600 through n.h.WriteFile (owned by the VM account).
         Parse it with clientcmd.Load: AuthInfo has ClientCertificateData and ClientKeyData, Exec == nil, Token == "".
         Parse the certificate: CN == owner DID, Organization == ["socialweb.computer:cluster-owners"],
         NotAfter-NotBefore within [3600 s, 3600 s + 5 min].
      5. getKubeconfig with ttlSeconds 59 and 86401 -> 400 InvalidRequest. A JWT with lxm listClusters on
         getKubeconfig -> 401 Unauthorized.
      6. r := n.h.As(ctx, "env", "PATH=/usr/local/bin:/usr/bin:/bin", "sh", "-c", "command -v socialweb-credential") -> empty stdout.
         r = n.h.As(ctx, "env", "PATH=/usr/local/bin:/usr/bin:/bin", "kubectl", "--kubeconfig", kc, "get", "nodes", "-o", "name") -> exit 0.
         Also clientcmd.RESTConfigFromKubeConfig + kubernetes.NewForConfig + Nodes().List -> no error.
         t.Skip with a clear message when `kubectl` is not on that PATH; the client-go call still runs.
      7. revokeIdentity {name: "tenant"} with a JWT for that lxm -> 200. Within 2 s (poll every 200 ms, end at once
         on n.health() error) kubectl get nodes fails and client-go List returns Forbidden.
      8. Leak check: n.h.As(ctx, "grep", "-rl", "-e", "PRIVATE KEY", "-e", "client-key-data", <GatewayDir>/logs,
         <GatewayDir>/denokcp/runs) prints nothing.
    check: |
      go vet -tags integration ./test/integration/
      go test -tags integration -count=1 -v -timeout 40m ./test/integration/ -run TestKubeconfigClientCertificateWithoutCredentialHelper
