  - id: M2-NO-EXPIRY-CERT
    milestone: M2
    title: getKubeconfig can issue a client certificate that never expires (explicit opt-in, revocable)
    depends_on: [M1-GETKUBECONFIG-HANDLER, M1-WEB-APP-TTL, M2-CLIENT-CERT-FRONT]
    decision: >
      Decided by the user 2026-10-13: "we want to enable creating a cert that never expires for the kubeconfig".
      x509 has no "never": RFC 5280 says NotAfter 99991231235959Z means no well-defined expiration. A leaf can not
      outlive its CA in a chain check, so OpenBao issues with not_after 9999-12-31T23:59:59Z and the issuer's
      leaf_not_after_behavior "truncate": NotAfter becomes the cluster client CA's NotAfter (k3s CA, about 10 years).
      Opt-in only: lexicon boolean `noExpiry` (default false); `noExpiry: true` together with ttlSeconds is
      InvalidRequest. A separate PKI role kubeconfig-user-noexpiry (same CN rule, same O, plus OU
      socialweb.computer:no-expiry, allowed_* as kubeconfig-user, max_ttl = the mount's max, not_after allowed)
      so the 24 h role stays tight; the gateway-only OpenBao client policy allows issue on both roles. The front
      keeps the 24 h + 5 min lifetime check for every certificate WITHOUT that OU and skips it only for certificates
      WITH it (CRL, deny, CN and O checks still apply on every request). Every issued no-expiry serial is listed in a
      kcp record without key material (serial, DID, cluster, issuedAt) so the owner can see and revoke it;
      revokeIdentity and deleteCluster revoke them like the others (M2-REVOCATION). The web app offers "never
      expires" only behind an explicit confirm, never as default. The README says the certificate lives until revoked,
      the cluster is deleted, or the CA expires.
    files:
      - "internal/xrpcserver/lexicons/getKubeconfig.json (input: noExpiry boolean; description)"
      - "the OpenBaoServer declaration of the cluster vault (M1-PKI-ROLE): role kubeconfig-user-noexpiry, issuer leaf_not_after_behavior truncate, mount max_lease_ttl large enough for not_after"
      - "internal/clientcert (M1-CERT-ISSUER): Issue(..., noExpiry bool) -> pki/issue/kubeconfig-user-noexpiry with not_after"
      - "the getKubeconfig handler (M1-GETKUBECONFIG-HANDLER): validate the pair noExpiry/ttlSeconds; record the serial"
      - "internal/clientcertfront (M2-CLIENT-CERT-FRONT): OU-gated lifetime check"
      - "the web app lifetime choices (M1-WEB-APP-TTL): add 'never expires' behind a confirm"
      - "README.md 'Cluster XRPC with goat': example `call procedure getKubeconfig name=demo noExpiry:=true`"
    change: |
      1. Lexicon: add properties.noExpiry {type: boolean, default false, description: "Issue a certificate with no
         expiry (NotAfter 9999-12-31T23:59:59Z truncated to the cluster CA). Revoke with revokeIdentity or deleteCluster."}.
      2. PKI role + issuer settings as in decision; policy for the gateway-only client covers both issue paths.
      3. Issuer: noExpiry -> issue from the no-expiry role with not_after; otherwise unchanged.
      4. Handler: noExpiry && ttlSeconds present -> InvalidRequest; record {serial, did, cluster, issuedAt, noExpiry: true}
         (no key, no cert body) in the gateway kcp; log "kubeconfig no-expiry certificate issued" with serial only.
      5. Front: lifetime check only when the cert lacks OU socialweb.computer:no-expiry; everything else unchanged.
      6. Web app + README as in files.
    check: |
      go build ./internal/... ./cmd/socialweb-computer
      Live (market network with gateway, live slot): getKubeconfig noExpiry:=true -> openssl x509 -noout -enddate of
      the client cert equals the cluster client CA NotAfter (or 99991231235959Z if the CA has it); OU present;
      kubectl get ns works; getKubeconfig noExpiry:=true ttlSeconds:=3600 -> InvalidRequest; a 24 h-role cert with
      a forged long lifetime is impossible (role refuses) and the front refuses any non-OU cert over 24 h + 5 min;
      revokeIdentity -> the no-expiry kubeconfig is refused within 2 s and its serial is in the CRL; deleteCluster +
      createCluster same name -> refused (fresh CA). Key log check (security_rules KEY LOG CHECK) passes.
    stop: |
      - OpenBao refuses not_after beyond the mount/role limits after the settings above (report the error text).
      - The tenant k3s/front chain check refuses a cert whose NotAfter equals the CA NotAfter (report).
    done_when: "an opt-in no-expiry kubeconfig works, is visible as a serial record, and is refused within 2 s after revoke or cluster delete; the 24 h path is unchanged."
    status: done
