         - var ErrVaultUnavailable = gateway.ErrIssuerUnavailable
         - type Issuer struct { StateDir string; CAFile string; Log *slog.Logger }
           StateDir = the clusterprovider state dir. CAFile = optional PEM file for certificate-authority-data.
         - func DataDir(stateDir, did, cluster string) (string, error):
             key, err := kcpclient.ClusterKey(kcpclient.HomePath(did, cluster)); return clusterprovider.ClusterDataDir(stateDir, key)
         - func (i *Issuer) Grant(ctx context.Context, in kcpclient.GrantInput) (string, error):
             a. refuse an empty in.Caller, in.Cluster or in.Server.
             b. ttl := in.TTL; if ttl == 0 { ttl = gateway.DefaultClientCertTTL }; refuse ttl < gateway.MinDeviceKeyTTL or
                ttl > gateway.MaxClientCertTTL.
             c. dir := DataDir(i.StateDir, string(in.Caller), in.Cluster); client, _, err := clusterprovider.ClusterVaultClient(ctx, dir);
                on error return fmt.Errorf("%w: %v", ErrVaultUnavailable, err).
             d. cctx, cancel := context.WithTimeout(ctx, 10*time.Second); cert, err := client.IssueCert(cctx, clusterprovider.VaultPKIPath,
                clusterprovider.VaultPKIRoleKubeconfig, openbao.CertRequest{CommonName: string(in.Caller),
                TTL: strconv.FormatInt(int64(ttl/time.Second), 10) + "s", ExcludeCNFromSANs: true}).
