             dir := DataDir(...); client := ClusterVaultClient(...); serials := client.List(ctx, "pki/certs");
             for each serial: m := client.Read(ctx, "pki/cert/"+serial); parse m["certificate"] (string PEM);
             skip unless CN == did and Organization == [kcpclient.OwnersGroup] and NotAfter after now;
             client.Write(ctx, "pki/revoke", map[string]any{"serial_number": serial}); count it.
             Log at info: "clientcert: revoked kubeconfig certificates", did, cluster, count. Return count.
             Use a 30 s context for the whole loop.
