  - id: M2-CLIENT-CERT-FRONT
    milestone: M2
    title: The client certificate front - checks the certificate where TLS ends and forwards to k3s by request-header authentication
    depends_on: [M1-WEB-APP-TTL]
    decision: >
      Why not k3s --client-ca-file alone: k3s already trusts the PKI CA (source (6)), but the certificate never
      reaches k3s. Caddy ends TLS for kcp.socialweb.computer and kcp's mount proxy opens a new TLS connection
      without a client certificate (source (1), (2)). A TLS pass-through needs Caddy layer4 (not installed) or a
      new public port per cluster. k3s also does not check a CRL.
      Why not kcp --mount-proxy-client-cert-file plus request-header at k3s: kcp's local proxy runs before
      authentication and forwards every client header, so any client that reaches kcp could write X-Remote-User.
      Chosen (smallest safe change): a new HTTPS listener in the gateway process, the client certificate front
      (Go package internal/clientcertfront, member "client certificate front" of the gateway). It serves the
      same path form /clusters/root:<acct>:<cluster>:clusters/... as kcp, so the kubeconfig server keeps its form.
      It requires a TLS client certificate (crypto/tls checks the CertificateVerify signature, so the client
      holds the key). Two ways in:
      (a) direct: the peer certificate is the user certificate (a market network; kubectl dials the front);
      (b) edge (prod): Caddy ends TLS with `client_auth mode request`, puts the peer certificate in
      X-Socialweb-Client-Certificate (base64 DER) and connects to the front with the edge client certificate
      that the front made; the front believes the header only from that exact peer (M3-PROD-EDGE).
      For each request the front: maps the path to the cluster data dir; verifies the user certificate against
      <dataDir>/server/tls/client-ca.crt with ExtKeyUsageClientAuth; checks CN (a DID whose AccountHash is the
      path account), O (exactly the owners group) and lifetime (at most 24 h + 5 min); checks the PKI CRL and the
      deny record; then reverse-proxies to the cluster's apiserver front address (front.json) over TLS that
      trusts server-ca.crt and presents client-auth-proxy.{crt,key}, with Authorization and X-Remote-* removed
      and X-Remote-User = CN, X-Remote-Group = socialweb.computer:cluster-owners. k3s already accepts that
      (source (9)). No change to k3s, the apiserver front or kcp.
      Address: an application front with a known address in prod (127.0.0.1:8444, option cert-front-address,
      like tls-front-address 127.0.0.1:8443), port 0 in a market network. Its bound address is reported in the
      gateway listeners as client-cert (https). In a market network the gateway defaults
      SOCIALWEB_GATEWAY_KCP_PUBLIC_HOST to https://<that address> and SOCIALWEB_GATEWAY_KCP_PUBLIC_CA_FILE to the
      gateway TLS certificate, so getKubeconfig points kubectl at the front. In prod both come from gateway.env
      (https://kcp.socialweb.computer, no CA file).
    files:
      - "internal/clientcertfront/clientcertfront.go (new)"
      - "internal/stack/gatewaykcp/gatewaykcp.go:51-55 (listener names), :75-95 (Config), :450-524 (members: gateway member :497-500, tls front member :505-509)"
      - "internal/stack/gatewaykcp/env.go:92-150 (defaults), :147-148 (TLS cert env)"
      - "internal/install/install.go:117-125 (OptKcpFront, OptTLSFront, GatewayListen, Passed)"
