      DID, ttl = the requested seconds, exclude_cn_from_sans = true (a DID must not become a DNS SAN). It checks
      the returned certificate (CN, O, lifetime) before it uses it, builds the kubeconfig with a new function in
      internal/kubeconfig, and returns it. The key is held only in local variables. The kubeconfig carries
      certificate-authority-data only when the deployment names a CA file for the public server
      (market network: the gateway's self-signed TLS certificate; prod: none, Caddy has a public certificate).
