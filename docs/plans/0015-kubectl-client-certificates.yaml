                Subject.Organization == [kcpclient.OwnersGroup], NotAfter.Sub(NotBefore) <= MaxClientCertTTL + 5*time.Minute,
                ExtKeyUsage contains ClientAuth, and cert.PrivateKey != "". The refusal message names only the field.
