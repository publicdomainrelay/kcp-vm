  - id: M2-FRESH-CA-PER-CREATION
    milestone: M2
    title: A deleted and recreated cluster of the same name never reuses the old cluster's CAs
    depends_on: [M2-REVOCATION]
    decision: >
      Decided by the user 2026-10-13: required, not a stop condition. Every k3s CA of a cluster (the 13 entries of
      the persisted identity bundle, client CA included) belongs to ONE creation of that cluster. Today the cluster
      key is deterministic (<accountHash>-<name>) and the identity bundle is persisted under the cluster data dir
      (internal/clusterprovider/bundle.go BundleDir: <state>/clusterprovider/<key>/identity-bundle) and in the
      cluster OpenBao (internal/vaultlayout class identity-bundle), and every start pre-seeds and verifies it
      (internal/clusterprovider/guard.go). If anything of it survives a delete, a new cluster with the same name is
      seeded with the old CAs and every certificate issued before the delete is valid again. Two guards, both required:
      (1) PURGE: deleteCluster (internal/gateway/gateway.go DeleteCluster -> Store.Delete -> the clusterprovider's
      teardown of that key: Reap in internal/clusterprovider/units.go plus the store and vault removal) removes the
      identity-bundle dir, the whole cluster data dir, and the cluster OpenBao's identity-bundle KV entries (or the
      whole cluster OpenBao and its storage). (2) BIND: the bundle records the Cluster object's metadata.uid
      (a field in the persisted bundle manifest, internal/identitybundle); guard.go refuses to seed or verify a
      bundle whose uid differs from the current Cluster object's uid and fails the start with "identity bundle
      belongs to an earlier creation of this cluster" (fail fast, never seed it). A cluster created before this
      change has no uid in its bundle: adopt it once by writing the current uid (prod is disposable; no other
      migration).
    files:
      - "internal/clusterprovider/bundle.go (BundleDir, PersistedBundle, the harvest that writes the bundle)"
      - "internal/clusterprovider/guard.go (seed + verify before k3s starts)"
      - "internal/identitybundle (bundle manifest: add uid)"
      - "internal/clusterprovider/units.go:918 Reap; the store/vault teardown it calls (DeleteStore units.go:389, the OpenBaoServer delete)"
      - "internal/gateway/gateway.go:241 DeleteCluster; internal/materialiser (where the Cluster object and its uid are read)"
