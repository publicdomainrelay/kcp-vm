  - id: M3-PROD-EDGE
    milestone: M3
    title: Caddy on kcp.socialweb.computer asks for a client certificate and forwards it to the client certificate front
    depends_on: [M2-REVOCATION, M2-FRESH-CA-PER-CREATION]
    decision: >
      In prod kubectl reaches kcp.socialweb.computer, where Caddy ends TLS (source (1)). The site asks for a
      client certificate without checking it (`client_auth mode request`; Go TLS still checks the client's
      CertificateVerify signature). A request that came with a certificate goes to the client certificate front
      on 127.0.0.1:8444 with the certificate in X-Socialweb-Client-Certificate, over TLS that trusts the gateway
      certificate and presents the edge client certificate. Every other request goes to kcp as today, so the
      exec-plugin kubeconfigs keep working until M5. This item changes files only; the lead deploys it in
      M3-PROD-READING. Task agents never run scripts/deploy.sh.
