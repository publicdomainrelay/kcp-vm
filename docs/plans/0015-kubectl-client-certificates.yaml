           type ClientCertInput struct { ClusterName, Server string; CACertPEM, CertPEM, KeyPEM []byte }
           func BuildClientCert(in ClientCertInput) (string, error)
         It refuses an empty ClusterName, a server that is not https (ErrNotHTTPS), an empty CertPEM or KeyPEM.
         It renders the same document as Build (clusters, users, contexts, current-context), with
         cluster = {"server": in.Server} plus "certificate-authority-data": in.CACertPEM when len > 0, and
