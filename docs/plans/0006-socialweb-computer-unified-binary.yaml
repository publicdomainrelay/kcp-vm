  - id: M3-CP-SLOTS
    milestone: M3
    title: Blue/green k3s+kine slots per cluster on the same postgres, swapped behind the front, idle first
    depends_on: [M3-APISERVER-FRONT, M2-POSTGRES]
    decision: >
      Decided by the user 2026-10-12: a new k3s+kine slot starts beside the old on the same postgres, the
      front swaps, the old stops; market kube-scheduler leader election ON with a short lease; the k3s
      hostname leader-lease problem solved; idle-first swaps. Procedure (control-plane-handover.md 5(a)),
      decided by Claude, user may veto: (1) preconditions: target k3s minor in {active, active+1}; target >=
      every joined guest's minor and <= guest minor + 3; cluster Ready; EndpointSlice == (advertise address,
      front port). (2) Idle first (Q-H4, decided by Claude, user may veto): the swap waits while any
      non-kube-system pod is Running on a market node, up to a bounded deferral (default 30 min), then
      proceeds as blue/green; a cluster at zero nodes swaps at once. (3) Minor bump: pg_dump of the k3s and
      openbao databases to <dataDir>/backups/<ts> first (exit 0, size > 0); minors one at a time; rollback
      only within the same minor (Q-H8, decided by Claude, user may veto). (4) Lease the green ports; start
      kine@green (target kine) on the same DSN (log 'tables and indexes are up to date'; no lock wait > 2 s
      on the active kine); start k3s@green with identical cluster flags, the same token file, the same
      advertise pair and its own data dir; gate: green CA hash == active CA hash, /readyz 200 on the green
      port with the admin cert, first kube-system Deployment listed. (5) Persist controlplane.json
      (activeSlot=green) BEFORE the front switch is acknowledged; switch; immediately stop k3s@blue (exits in
      ~0.1 s) and kine@blue. (6) Watch 60 s: kcm/scheduler/ccm leases held by green, agent tunnels back (an
      exec into one pod per node), ClusterLinks Listening, every held Node Ready with no transition. (7) Keep
      blue's data dir and unit definition for a same-minor rollback (the same procedure reversed). Scheduler:
      internal/clusterstack/scheduler.go renders leaderElect true with leaseDuration 4s, renewDeadline 3s,
      retryPeriod 1s (reverts 1cbf945's false; first-pod delay after scale from zero up to ~4 s, measured).
      k3s hostname lease: wrangler's kube-system/k3s lease identity is os.Hostname(), so each k3s slot runs
      with its own UTS hostname swc-<key12>-<slot>: systemd ProtectHostname=private:<name> on the slot unit
      where the host's systemd supports it in a user manager, else a one-shot `internal uts-exec` that
      enters a user+UTS namespace, sethostname()s and execve's k3s (no resident code); the mechanism is
      measured in this item and probed by check-host. A kine bump is its own green slot; one whose release
      notes name a schema migration (ACCESS EXCLUSIVE) gets a stand-in test with old+new kine on one database
      before it ships. Triggered by `units roll cluster <key> --k3s <version> [--kine <version>]` and by the
      reconciler when versions.json pins change.
    files: ["internal/clusterprovider (slots, swap procedure, idle check)", "internal/clusterstack/scheduler.go (leaderElect)", "internal/clusterstack (per-slot argv, hostname)", "cmd/socialweb-computer units roll cluster", "internal/versions/versions.json (k3s and kine pins, skew rule)"]
    test_first: >
      Offline: TestASwapIsDeferredWhileWorkRunsUpToTheBoundThenProceeds, TestAZeroNodeClusterSwapsAtOnce,
      TestAMinorSkipIsRefused, TestATargetOlderThanAGuestOrMoreThanThreeMinorsNewerIsRefused,
      TestControlplaneJsonIsPersistedBeforeTheFrontSwitchIsAcknowledged, TestTheMarketSchedulerElectsWithAShortLease,
      TestAMinorBumpTakesAPgDumpFirst. Behind livegate on hat-8 with stand-ins (no guest):
      TestAGreenSlotSharesCAAndTokenWithBlue, TestTwoSlotsOnOneHostNeverBothHoldTheK3sLease,
      TestTheSchedulerIsNotDoubledDuringOverlap (two slots and a fake Node: one kube-scheduler lease holder,
      one bind per pod), TestAPatchSwapFailsNoPollThroughTheFront. On the market bed (node via
      runComputeContract): TestABlueGreenSwapKeepsAMarketNodeReadyAndExecWorksAfter (no NotReady, no claim
      change, no vm.delete; EndpointSlice never empties; exec into the node's pod succeeds within N s of the
      swap, N = the measured agent tunnel reconnect, recorded). Red first.
    done_when: "green on hat-8 and the bed; a k3s patch swap's readings recorded (poll failures 0, lease handover seconds, tunnel reconnect seconds, first-pod delay with the 4 s lease)."
    risks:
      - "k3s's own wrangler lease is 45 s; after blue stops, green's k3s controllers (addons, helm) may wait up to 45 s unless blue releases on cancel - measured."
      - "exec/attach/log streams through blue reset on every swap; that is why swaps are idle-first."
