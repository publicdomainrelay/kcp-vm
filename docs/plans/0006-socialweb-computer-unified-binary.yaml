  - id: M1-INSTALL
    milestone: M1
    title: Content-addressed install, upgrade and rollback of the core binary, and the one-time root install of an account
    depends_on: [M1-ASSETS, M1-CLI]
    decision: >
      Decided by the user 2026-10-11: VMs survive a core upgrade; the gateway and bidders each live in the
      user manager of a lingering account; ONE shared lingering account (swc-bidder) for all bidder handles.
      Decided by Claude, user may veto (exploration A-x-upgrade, linux-proofs E6): (1) Layout under the
      account's state dir: bin/<sha256>/socialweb-computer, bin/current and bin/previous symlinks,
      runtime/<sha256>/ (M1-ASSETS). A unit's ExecStart names bin/current only for the core unit; anything
      the core starts (cluster member units) names the resolved bin/<sha256>/ path
      (filepath.EvalSymlinks(os.Executable()) once at start), so no rename-over ever changes code inside a
      running chain. (2) `upgrade --binary <path>`: verify the manifest and sha256 (signature later), copy to
      bin/<sha>/, run `<new> self-check` (version --json, asset extract + verify, check-host), refuse on any
      failure, retarget current atomically (symlink rename), record previous, then `systemctl --user
      restart` the core unit (gateway or bidder@<handle>). (3) `rollback` retargets current to previous and
      restarts. (4) GC of bin/<sha>/ follows M1-ASSETS' rule (never current, previous, or a path a loaded
      unit names). (5) `install gateway|bidder` is the ONLY root step, run once: create the account
      (socialweb for the gateway, swc-bidder for bidders); for bidders add it to group kvm BEFORE enabling
      linger and before user@<uid> first starts (supplementary groups are fixed when the user manager
      starts; adding kvm later needs a user@<uid> restart, which kills every VM); `loginctl enable-linger`;
      a user@<uid>.service drop-in `Delegate=cpu memory pids` where the host delegates less (stock systemd
      delegates memory+pids only, linux-proofs E0); on Ubuntu 24.04+ an AppArmor profile granting userns to
      <state>/runtime/*/pasta (decided by the user 2026-10-11); for the gateway /etc/rancher/node/password
      0600 owned by the account (the k3s invariant); the user unit file under the account's
      ~/.config/systemd/user; then check-host as the account. run bidder and serve gateway kcp never escalate.
