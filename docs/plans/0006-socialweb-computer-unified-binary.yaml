  - id: M3-BAO-SYNC
    milestone: M3
    title: Every OpenBao this binary runs holds exactly the backends, roles, policies and KV entries live objects ask for
    depends_on: [M2-OPENBAO-SERVER, M3-CLUSTER-SCOPES, "0005:M3-BAO-SYNC"]
    decision: >
      User asked 2026-10-07 that the plans keep OpenBao backends and roles in sync with what is active;
      plan 0005 M3-BAO-SYNC found 5 jwt-* mounts in one cluster OpenBao, one per issuer a bidder ever had,
      only one serving a live node. Carried to every OpenBao this plan introduces or moves, decided by
      Claude, user may veto. One reconcile library, internal/baosync: desired state is a pure function of
      live objects; the reconciler lists actual auth mounts, roles, ACL policies and KV paths under the
      prefixes it owns, creates what is missing, deletes what no live object asks for, and disables a
      jwt-* auth mount left with no role. It runs every pass, at controller startup, and at adoption of
      a server or cluster group after a restart or upgrade (M3-CLUSTER-SCOPES), so a crash between a
      release and its revoke is repaired by the next pass. Owned prefixes only: a mount, policy or path
      outside them is reported, never touched. Applied to: (1) each cluster's OpenBao, now a member of a
      host-scoped group: the plan 0005 M3-BAO-SYNC rule moves into internal/baosync unchanged (per live
      claim with a grant: mount jwt-<sha12(issuer)>, role <node>, policy node-<node>, KV
      socialweb-nodes/<node>; plus the ClusterLink keys in socialweb-links and the ESO cert role, derived
      from the cluster's live ClusterLinks and its ESO pair); (2) the gateway's root vault
      (OpenBaoServer object): internal/vaultlayout's static layout plus per-cluster and per-account
      entries derived from live Cluster and AtprotoIdentity objects; an entry for a deleted cluster or
      revoked identity is removed. The layout's static paths (vaultlayout.go Path* constants) are owned
      too: a path the layout no longer names (for example secret/data/k3s/ssh once nothing reads it) is
      deleted only by a layout change, and the reconcile's report lists it until then.
    files: ["internal/baosync/ (Desired, Actual, Diff, Apply; fake OpenBao for tests)", "internal/clusterprovider (cluster vault reconcile moves onto baosync)", "internal/openbaoctl (root vault reconcile)", "internal/vaultlayout (owned prefixes declared)"]
    test_first: >
      internal/baosync TestAVaultSeededWithStaleMountsRolesPoliciesAndKVIsReducedToExactlyTheLiveSet (fake
      OpenBao seeded with five jwt-* mounts, roles and policies for released nodes, a deleted cluster's
      root-vault entries, and one foreign mount: after one pass only the live set remains, the foreign
      mount untouched), TestAJwtMountWithNoRoleLeftIsDisabled, TestTheReconcileRunsOnAdoptionBeforeTheFirstPass;
      behind livegate on a real bao: TestARestartBetweenReleaseAndRevokeIsRepairedByTheNextPass. Red first.
    done_when: >
      Tests green; on hat-8 after a release and after an upgrade of the binary, `bao auth list`, `bao list
      auth/<m>/role`, `bao policy list` and the owned KV listings in every cluster vault and the root
      vault name exactly the live set (reading recorded).
    risks:
      - "A reconcile that deletes from a wrong desired set (for example a claim list that failed to load) would revoke live nodes; an empty or failed listing of live objects aborts the pass instead of reading as 'nothing is live'."
      - "Plan 0005 M3-BAO-SYNC may land first; this item then moves its code into internal/baosync without changing behaviour, proved by its existing test."
    status: todo
    evidence: []
