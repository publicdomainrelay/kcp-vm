  - id: M3-APISERVER-FRONT
    milestone: M3
    title: A per-cluster L4 front owns the apiserver port; k3s moves behind it on slot ports
    depends_on: [M3-CLUSTER-UNITS]
    decision: >
      Decided by the user 2026-10-12: a per-cluster TCP front owns the existing apiserver port, so guest
      tickets, node secrets, kubeconfigs and status.URL are unchanged across control-plane swaps. Decided by
      Claude, user may veto (control-plane-handover.md 4, Q-H2): `internal apiserver-front --cluster <key>`
      (Go, in the core binary, ~150 lines) runs as member unit socialweb-c-<key>-front and binds
      BindAddress:<k3s-secure lease port> - the number k3s binds today - so dumbpipe's --host, every node
      secret's apiserverPort, status.URL, every kubeconfig and the advertise port keep their value. k3s slots
      take new leases k3s-slot-a and k3s-slot-b (width 2 each) plus per-slot controller ports and a per-slot
      kine lease. The backend is chosen per NEW connection from a state the reconciler sets over a control
      socket in the cluster's data dir (path < 108 bytes); open connections stay on their backend until it
      closes them (that is the drain). Pure TCP passthrough: TLS stays end to end with k3s (its serving SANs
      already cover 127.0.0.1 and the advertise address). The front never fails over by itself (auto-failover
      would hide a dead green). Its listening socket is kept in systemd's fd store (FDSTORE=1,
      FileDescriptorStoreMax=1) so a front restart refuses no connection and only resets open ones; check-host
      probes fd-store support in the user manager (M2-HOST-CONTRACT). Every slot runs --advertise-address
      <identical> --advertise-port <front port>; slot listen ports are never advertised; the provider's admin
      client, the CCM, ESO and the kcp mount (status.URL) name the front port. AssertMarketAdvertiseInvariant
      (internal/clusterprovider/steps.go:164-174) is rewritten: advertise port == front port, advertise
      address identical across slots, no slot listen port in the kubernetes EndpointSlice. ARCHITECTURE
      section 8 (Ports) is updated in the same change.
    files: ["cmd/socialweb-computer internal apiserver-front", "internal/apiserverfront/", "internal/clusterprovider (front member, slot leases, AssertMarketAdvertiseInvariant)", "internal/portallocator (k3s-slot-a/b, per-slot purposes)", "docs/ARCHITECTURE.md section 8"]
    test_first: >
      Offline: TestTheFrontPicksTheBackendPerNewConnectionAndLeavesOpenOnesAlone,
      TestTheFrontNeverSwitchesByItselfWhenItsBackendDies, TestTheAdvertiseInvariantRefusesASlotListenPort.
      Behind livegate on hat-8 with stand-ins (two k3s --disable-agent on their own kine over one postgres; no
      guest): TestTheFrontSwitchFailsNoPoll (authenticated /readyz every 200 ms through the front across
      switch + SIGTERM of the old slot: 0 failures - control-plane-handover.md 2.1 as a test),
      TestEverySlotAdvertisesTheFrontPair (EndpointSlice == (advertise address, front port) with one, two and
      the remaining slot), TestAFrontRestartRefusesNoConnection (fd store). On the market bed (node via
      runComputeContract): TestAMarketNodeStaysReadyAcrossAFrontSwitch (the EndpointSlice never empties, no
      Ready transition). Red first.
    done_when: "green on hat-8 and the bed; the front unit's port equals the k3s-secure lease the cluster had before the change."
    risks:
      - "User-manager fd-store support is unverified on the target systemd; without it a front restart has a refused-connection window of its restart time, recorded."
      - "On graceful stop the lease endpoint reconciler may RemoveEndpoints for the shared IP; not observed (k3s exits in 0.1 s), asserted on the bed."
