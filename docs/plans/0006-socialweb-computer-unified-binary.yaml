questions_for_user:
  - "kcp route, after M0-KCP-SPIKE records its numbers: in-process on kcp's fork, or the patched release binary in its own unit? Recommended: out-of-process unless the spike shows the fork's fallout fixed within one day, go test green on the fork, and two in-process kcps working - out-of-process keeps kcp up across core upgrades and avoids moving the whole module onto 1.37-alpha."
  - "Hosts whose user@ delegation lacks cpu (stock systemd delegates memory and pids only): `install` writes a user@<uid>.service drop-in `Delegate=cpu memory pids`. Recommended: yes; without it CPUQuota is accepted and silently unenforced."
  - "systemd 253 as the floor (decided 2026-10-11) refuses Debian 12 and RHEL 9 (both ship 252, to be verified in M2-HOST-CONTRACT). Recommended: accept; support there would mean dropping GetUnitByPIDFD for our own pidfd + cgroup check."
