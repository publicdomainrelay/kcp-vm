plan: 0006-socialweb-computer-unified-binary
written: 2026-10-07
revised: >
    2026-10-07, with the user's answers to the plan's questions (decisions below marked 'decided by the user
    2026-10-07'). 2026-10-11, folded from docs/research/2026-10-11-vm-lifecycle/ (user-decisions.md, plan-0006-0007-linux-exploration.md,
    linux-proofs.md, lifecycle-synthesis.md). Decisions from user-decisions.md are marked 'decided by the user
    2026-10-11'; recommendations of the exploration not covered there are 'decided by Claude, user may veto'.
    Linux-only execution with cross-OS seams; the seven known gaps fixed (kcp before the root vault, postgres to
    cluster-group ordering, the gateway in a user manager, KillMode=mixed removed, vacuous kill -9 tests
    replaced, DetachProcess removed, the WHPX/QEMU capability code removed); kcp route left to the M0 spike;
    control-plane continuity at cutover left PENDING for the user (M3-CP-CONTINUITY). Renamed: M2-HOST-SCOPES
    -> M2-HOST-UNITS, M3-CLUSTER-SCOPES -> M3-CLUSTER-UNITS, M1-KCP-PORT0 -> M2-KCP-PORT0. New: M0-XOS-GATE,
    M1-INSTALL, M2-KCP-UNIT, M2-HOST-CONTRACT, M2-VM-TREE-AUDIT, M3-CP-CONTINUITY.
queued: >
  QUEUED. Plan 0005 is complete (2026-10-10, NEXT.yaml P5), but the user paused plans 0006, 0007 and 0008
  while they are refined; no item below moves to doing until the user says so.
source: >
  The user's request of 2026-10-07: take the test setup (the vendored deno-kcp market bed) and expand it
  into a prod environment, so one Go binary, socialweb-computer, is the entrypoint for the whole stack;
  it runs kcp and does Go-programmatic kubectl-apply-equivalents of templated YAML held in an embed.FS; it
  supports `socialweb-computer run {request,bidder,gateway ssh}` and `socialweb-computer serve gateway kcp`;
  Go and TypeScript are both first class, with the TypeScript codebase shipped inside the binary in the
  style of sshai's policy_engine. The user then decided (2026-10-07): ONE binary; kcp binds port 0 and
  reports the bound port; no container at runtime, with postgres and everything else the container
  supplied embedded and driven by CRDs; the user runs the prod cutover with no rehearsal; the core binary
  and its deno processes must be upgradable while VMs keep running. On 2026-10-11 the user decided: this
  plan executes on Linux only and builds the cross-OS seams (Windows is plan 0011, macOS plan 0012); VMs
  survive a core crash, upgrade and logout, a reboot is Lost; no socialweb-computer code is in a running
  VM's process tree; the gateway and the bidder each live in the USER manager of a lingering account; the
  in-process kcp of 2026-10-07 is re-opened and decided after the M0 spike, both routes carried. This plan
  holds the Go binary, kcp, assets, the install and upgrade layout, host processes as units and reconciled
  resources, programmatic apply, the gateway composition, the build and the prod move. The embedded deno,
  the TypeScript closure and DenoPods are plan 0008; the compute provider and VM lifecycle are plan 0007.
state_rules:
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, prod or hat-8 readings with UTC timestamps).
  - Open items are mirrored in NEXT.yaml (P6-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user; one marked
    "decided by the user 2026-10-07" or "decided by the user 2026-10-11" was.
  - An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>.
  - >
    kcp route (decided by the user 2026-10-11: decide after the M0 spike, carry both paths). An item whose
    decision says "route: in-process" or "route: out-of-process" is built only on the route M0-KCP-SPIKE's
    recorded choice names; the item of the other route is closed done with the evidence "route not chosen:
    <M0-KCP-SPIKE evidence ref>" and nothing is built for it. Items with no route tag are built on either.
  - >
    Linux only (decided by the user 2026-10-11). Every OS-specific body lives in a GOOS-tagged file; darwin
    and windows get stubs returning ErrUnsupported until plans 0012 and 0011 replace them. check.sh proves on
    every run that GOOS=darwin and GOOS=windows build and vet (M0-XOS-GATE).
  - >
    RFP flow is the spine (org-root CLAUDE.md). This plan boots no guest. Live tests of unit mechanics use
    stand-in executables in transient units (not guests); any live guest is plan 0007's market-bed tests.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment on socialweb.computer, the vendored deno-kcp
    test bed, the atproto-market requester libraries, and (decided by the user 2026-10-07) the vendored
    copies of kcp v0.33.0, its staging modules and github.com/kcp-dev/embeddedetcd (linked on the
    in-process route, built into a patched release asset on the out-of-process route). hono-compute-provider
    and atproto-market may be changed by commit; never pushed.
  not_owned: >
    The market protocol records and lexicons, and the core architecture: kcp in front of
    k3s --disable-agent clusters at zero nodes, with nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data.
