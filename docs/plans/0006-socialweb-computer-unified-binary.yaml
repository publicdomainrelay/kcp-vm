      bin/<core-sha>/socialweb-computer internal cluster-group --cluster <key> (the group supervisor:
      socialweb code, allowed - the invariant is about VMs), After=socialweb-pg-<key>.service and
      Wants=socialweb-pg-<key>.service - NOT Requires or BindsTo, so a postgres crash or restart does not
      cascade-stop the control plane - Restart=on-failure. Members (openbao, kine, k3s, ccm, eso-webhook,
      eso, the two dumbpipe links) keep Pdeathsig SIGKILL INSIDE the group: they die with the group
      supervisor, not with the core (plan 0005 M6-LIMITS restated). Start (fresh): clusterprovider ensures the
      Postgres object -> Ready{port, instance} -> starts the group unit with the pg port in its params; the
      supervisor still gates openbao and kine on its own PostgresUp probe (ErrPostgresUnavailable kept).
      Adoption (core restart or upgrade): group active + pg active -> adopt both, no writes; group active +
      pg missing or failed -> start pg only (kine and bao reconnect; measured); group missing + pg Ready ->
      start the group; both missing (reboot, or user manager restarted) -> start pg, then the group. A pg
      restart by systemd changes its InvocationID; postgresctl re-probes; bao's behaviour on losing its
      postgresql storage connection is measured. Teardown: stop the group, wait inactive, then stop pg (the
      controller sequences it). Port leases after adoption are attributed from the unit's cgroup.procs, not
      pid cmdlines (internal/portscan), so a restarted provider never re-leases a live group's port. A core
      upgrade does NOT restart groups (they keep the old bin/<sha>, which GC keeps); `units roll clusters`
      restarts groups one at a time later (policy in questions_for_user; continuity of control planes across
