  - id: M3-BAO-SYNC
    milestone: M3
    title: Every OpenBao this binary runs holds exactly the backends, roles, policies and KV entries live objects ask for
    depends_on: [M2-OPENBAO-SERVER, M3-CLUSTER-UNITS, "0005:M3-BAO-SYNC"]
    decision: >
      User asked 2026-10-07 that the plans keep OpenBao backends and roles in sync with what is active;
      plan 0005 M3-BAO-SYNC found 5 jwt-* mounts in one cluster OpenBao, one per issuer a bidder ever had,
      only one serving a live node. Carried to every OpenBao this plan introduces or moves, decided by
      Claude, user may veto. One reconcile library, internal/baosync: desired state is a pure function of
      live objects; the reconciler lists actual auth mounts, roles, ACL policies and KV paths under the
      prefixes it owns, creates what is missing, deletes what no live object asks for, and disables a
      jwt-* auth mount left with no role. It runs every pass, at controller startup, at adoption of a
      server or cluster's member units after a restart or upgrade, and whenever a vault unit's InvocationID changed
      (it restarted while the core was down; M2-OPENBAO-SERVER unseals first), so a crash between a release
      and its revoke is repaired by the next pass. Owned prefixes only: a mount, policy or path outside them
      is reported, never touched. Applied to: (1) each cluster's OpenBao, a member unit of the cluster's slice
      (M3-CLUSTER-UNITS): the plan 0005 M3-BAO-SYNC rule moves into internal/baosync unchanged (per live
      claim with a grant: mount jwt-<sha12(issuer)>, role <node>, policy node-<node>, KV
      socialweb-nodes/<node>; plus the ClusterLink keys in socialweb-links and the ESO cert role, derived
      from the cluster's live ClusterLinks and its ESO pair; plus each live claim's door secrets-ingress key
      socialweb-door/claims/<claim>, 0007:M6-CLAIM-RESUME); (2) the gateway's root vault (OpenBaoServer
      object): internal/vaultlayout's static layout plus per-cluster and per-account entries derived from
      live Cluster and AtprotoIdentity objects; an entry for a deleted cluster or revoked identity is
      removed. The layout's static paths (vaultlayout.go Path* constants) are owned too: a path the layout
      no longer names is deleted only by a layout change, and the reconcile's report lists it until then.
    files: ["internal/baosync/ (Desired, Actual, Diff, Apply; fake OpenBao for tests)", "internal/clusterprovider (cluster vault reconcile moves onto baosync)", "internal/openbaoctl (root vault reconcile)", "internal/vaultlayout (owned prefixes declared)"]
