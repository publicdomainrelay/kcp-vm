      TestTheReconcileRunsWhenAVaultUnitsInvocationIDChanged; behind livegate on a real bao:
      TestARestartBetweenReleaseAndRevokeIsRepairedByTheNextPass. Red first.
    done_when: >
      Tests green; on hat-8 after a release and after an upgrade of the binary, `bao auth list`, `bao list
