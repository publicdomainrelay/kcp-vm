  - id: M2-HOST-UNITS
    milestone: M2
    title: Long-lived children as transient SERVICES in the account's user manager, adopted never re-created
    depends_on: [M1-ASSETS]
    decision: >
      Decided by the user 2026-10-07: the core binary and its deno processes are upgradable while VMs keep
      running. Decided by the user 2026-10-11: the gateway and bidders use the USER manager of a lingering
      account (the gateway too; cluster groups are transient services there); only cpu, memory and pids
      delegation is relied on; minimum systemd 253. Decided by Claude, user may veto, from linux-proofs E1-E3:
      internal/hostsvc (interface Manager {Start, Inspect, Stop, ResetFailed, List(prefix), Close};
      UnitSpec, UnitStatus; ErrUnsupported, ErrUnreachable) with systemd_linux.go over
      github.com/coreos/go-systemd/v22/dbus (pure Go, CGO_ENABLED=0; sdjournal is cgo and not used) and
      unsupported_other.go (`//go:build !linux`) returning ErrUnsupported (plan 0011 adds scm_windows.go, plan
      0012 launchd_darwin.go). Each long-lived child that must outlive the core (a VM, plan 0007; a postgres;
      an OpenBao; each member of a cluster's slice, M3-CLUSTER-UNITS; kcp on the out-of-process route) is a transient SERVICE
      started by StartTransientUnit - never a scope, because a scope adopts a pid the starter forked and makes
      our code its parent. Rules: connect over $XDG_RUNTIME_DIR/systemd/private with a custom dialer (EXTERNAL
      auth, no Hello; go-systemd has no user private-socket constructor); every call carries a context with a
      deadline; only dial, auth and timeout errors are ErrUnreachable (Unknown); ExecStart is set with
      PropExecStart(argv, false) (go-systemd's bool is ignore-failure: true makes a crash report success and
      the unit vanish); CollectMode=inactive so Result, ExecMainCode and ExecMainStatus stay readable until
      the owner records them and calls ResetFailedUnit; a unit whose name already exists is ADOPTED, never
      re-created (StartTransientUnit fails "already loaded"); ownership is the unit-name prefix
      (socialweb-<kind>-<owner>-<name>), and List never returns another prefix. Limits offered: MemoryMax,
      MemorySwapMax (0 whenever MemoryMax is set), OOMPolicy, TasksMax, CPUQuota, CPUWeight; NOT offered:
      AllowedCPUs (no cpuset delegated, silently unenforced), IOWeight (no effect without BFQ/io.cost, and
      ManagedOOMPreference resets it on 259.9). Units go in a socialweb slice of their own, never app.slice
      (Fedora's systemd-oomd watches the user app.slice with ManagedOOMMemoryPressure=kill). Adoption identity
      read FROM systemd, never from a file the child writes: unit name, InvocationID, MainPID + start ticks,
      boot_id, checked pidfd_open -> stat ticks -> pidfd_send_signal(0) -> GetUnitByPIDFD. Children that must
      die with the core (deno, the TLS proxy) stay plain children in the core unit's cgroup, which systemd
      kills on any stop, restart or crash of the core (default KillMode=control-group).
    files: ["internal/hostsvc/ (hostsvc.go, busdial_linux.go, systemd_linux.go, identity_linux.go, unsupported_other.go)", "internal/hostos (ProcIdentity, BootID)", "go.mod (go-systemd, godbus)"]
    test_first: >
      Offline (fake bus): TestOnlyDialAuthAndTimeoutAreUnreachable, TestAnExistingUnitNameIsAdoptedNotRestarted,
      TestEveryCallCarriesADeadline, TestExecStartIsNeverIgnoreFailure. Behind livegate on hat-8 under the real
      user manager, with stand-in executables (sleep/a Go stand-in, never a guest):
      TestAUnitSurvivesSystemctlRestartStopAndKill9OfItsStarter, TestAUnitSurvivesDaemonReloadAndDaemonReexec,
      TestAFailedUnitsResultIsReadableUntilReset (kill -9 the stand-in: failed/signal read, then reset),
      TestMemoryMaxWithSwapZeroIsAnOomKillNotSwap, TestUnitsOfAnotherPrefixAreNeverListed. Red first.
    done_when: "green on hat-8; `systemctl --user list-units 'socialweb-*'` readings before and after each restart/reexec recorded with UTC times."
    risks:
      - "Transient units vanish at reboot and when the user manager stops (linger removed, `loginctl terminate-user`, user@<uid> restart); each is treated as a reboot - every child Lost - and documented as an operator action of that weight."
      - "Whether systemd-oomd acts under user@<uid>.service outside app.slice is not stress-tested; check-host records which cgroups oomd monitors."
    status: done
    evidence:
      - "started before M1-ASSETS with the user's approval (2026-10-12): the seam and backend need no embedded asset"
      - "branch host-units: 07209da (internal/hostsvc Manager {Start, Inspect, Stop, ResetFailed, List, Identify, Check, Close}; go-systemd v22.7.0 + godbus v5.1.0 from the offline module cache), c6698f9 (live tests); merged to main 2026-10-12"
