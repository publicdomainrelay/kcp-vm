  - id: M3-CLUSTER-SCOPES
    milestone: M3
    title: A gateway upgrade does not restart tenant control planes
    depends_on: [M2-HOST-SCOPES, M2-POSTGRES]
    decision: >
      Decided by Claude, user may veto, from the user's upgrade requirement: a gateway restart that takes
      every tenant control plane down for longer than 90 s makes plan 0005 M3-NODE-LOSS release market
      nodes, so VMs would die of a core-binary upgrade. Each cluster's process group (kine, k3s server,
      the cluster bao, the dumbpipe links, ESO, the CCM; postgres is already its own object) moves into
      one transient unit per cluster (socialweb-cluster-<key>), started by a re-exec of the binary as the
      group's supervisor, so it outlives the core binary; the restarted clusterprovider adopts each group
      by unit name and the port leases it already attributes (internal/portscan). Pdeathsig (plan 0005
      M6-LIMITS) still applies inside the group: its members die with the group's supervisor, not with
      the core binary.
    files: ["internal/clusterprovider (group supervisor verb, adoption)", "internal/procgroup", "internal/hostunit"]
    test_first: >
      Behind livegate: cmd/socialweb-computer TestAGatewayRestartLeavesEveryClusterApiserverAnswering
      (a zero-node market cluster's /readyz polled every 200 ms across a kill -9 and restart of the core
      process: no failed poll). Red first.
    done_when: "green on hat-8; across the restart the provider logs adoption, not respawn, for every cluster."
    risks: ["Changes plan 0005 M6-LIMITS's 'every member dies with the provider' to 'with its group supervisor'; ARCHITECTURE section 5 is updated in the same change."]
