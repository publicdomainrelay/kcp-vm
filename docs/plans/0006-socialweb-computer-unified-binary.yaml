  vm_lifecycle_2026_10_11:
    files:
      - "docs/research/2026-10-11-vm-lifecycle/user-decisions.md (authoritative user decisions)"
      - "docs/research/2026-10-11-vm-lifecycle/plan-0006-0007-linux-exploration.md (gap list A, seam design B, revised items C, questions D)"
      - "docs/research/2026-10-11-vm-lifecycle/linux-proofs.md (live proofs E0-E7, hat-8 Fedora 44, systemd 259.9, 2026-10-11 23:12-23:25Z)"
      - "docs/research/2026-10-11-vm-lifecycle/lifecycle-synthesis.md (per-OS lifecycle research 2026-10-09)"
    proven_on_linux:
      - "E1: a transient service started in the user manager over D-Bus survives `systemctl --user restart`, `kill -9` and `stop` of its starter unit (same InvocationID and MainPID), over the session bus and over $XDG_RUNTIME_DIR/systemd/private; plain children of the starter die in all three cases with or without Pdeathsig/setsid; StartTransientUnit on an existing name fails 'already loaded' (adopt, never re-create)"
      - "E1: go-systemd has no constructor for the USER private socket; a 5-line custom dialer (EXTERNAL auth, no Hello) is needed; every call takes a context with a deadline (godbus Auth otherwise blocks forever, E3)"
      - "E2: go-systemd PropExecStart(argv, true) sets ignore_errors=yes: a SIGKILLed unit reports success and is garbage-collected; PropExecStart(argv, false) with CollectMode=inactive keeps `failed signal`/`oom-kill` readable until reset-failed"
      - "E2: MemoryMax without MemorySwapMax=0 swaps instead of OOM-killing; MemorySwapMax=0 + OOMPolicy=stop gives Result=oom-kill; TasksMax and CPUQuota enforced; AllowedCPUs accepted but NOT enforced (no cpuset delegated); IOWeight has no effect (scheduler none) and ManagedOOMPreference=avoid|omit resets IOWeight to 100 on systemd 259.9; Fedora's user app.slice is ManagedOOMMemoryPressure=kill under systemd-oomd"
      - "E0: stock systemd delegates memory+pids to user@; Fedora adds cpu/io via uresourced; linger is off by default and mandatory (without it every unit stops at the last logout); transient unit definitions live on tmpfs and vanish at reboot"
      - "E3: identity check order pidfd_open -> /proc/<pid>/stat start ticks -> pidfd_send_signal(0) -> GetUnitByPIDFD (systemd >= 253) -> InvocationID; ESRCH, ticks mismatch, UnixProcessIdUnknown, NoUnitForPID, NoSuchUnit are Lost; only dial/auth/timeout errors are Unknown"
      - "E6: os.Executable() after a rename-over returns the path, so re-exec runs the NEW build (version skew inside a booting chain); after a delete it is ENOENT; install to immutable content-addressed paths"
      - "E7: GOOS=darwin build fails (internal/hostos has no darwin files; 23 packages blocked); GOOS=windows build fails (internal/nodevm/disk.go untagged unix.IoctlFileClone/SEEK_DATA; 10 packages blocked); GOOS=windows vet also fails on internal/apigen/live_upgrade_test.go:71 Setpgid; deploy/check.sh:30,54 builds and vets only the host GOOS"
      - "code today: internal/hostos/caps_{linux,windows}.go (Firecracker/QEMU/NetworkMode/Accel incl. AccelWHPX) are dead since 9d85916 retired nodeqemu and the local substrates, read only by cmd/socialweb-computer-kcp-check-host (platform.go:14-88, checks.go:23, config.go:197); hostos.DetachProcess (sysproc_linux.go:10) is Pdeathsig SIGKILL, i.e. it ATTACHES the VMM's life to its parent, used only by internal/nodefirecracker/namespace.go:45"
      - "E8 (live, RFP flow, 2026-10-12): see plan 0007 research; firecracker CtrlAltDel -> exit 0.21 s on an idle guest"
    control_plane_handover_2026_10_11:
      file: "docs/research/2026-10-11-vm-lifecycle/control-plane-handover.md (design, procedures, Q-H1..Q-H9)"
      measured_on_stand_ins:
        - "hat-8, stand-ins only (PostgreSQL 18.6, two kine v0.17.1 on one database, two k3s v1.36.4+k3s1 --disable-agent, a ~100-line L4 front): a second server with the same token file and its own data dir and kine reconciled the bootstrap data from the datastore, had byte-identical server-ca, client-ca, request-header-ca, service.key and server/token, and served the first server's admin client certificate 2.2 s after start"
        - "front switched to green, blue SIGTERMed: blue exited in 0.10 s; authenticated /readyz through the front every 200 ms: 515 polls, 0 failures; fake Node lease heartbeats 0 failures, Node stayed Ready; kcm/scheduler/ccm leases moved to green 16-18 s later (15 s lease)"
        - "the kubernetes EndpointSlice read (advertise address, advertise port) throughout: k3s passes --advertise-port to its apiserver, so a split advertise port (the front's) is honoured"
        - "hazards: the kube-system/k3s wrangler leader lease uses the OS hostname as identity (--node-name does not change it), so two slots on one host BOTH lead k3s's own controllers during the overlap; the market kube-scheduler runs leaderElect false (internal/clusterstack/scheduler.go:51-52, 1cbf945); k3s exits 0.1 s after SIGTERM, so exec/attach/log streams through it reset on any swap"
        - "two kine on one postgres: the normal k3s HA shape; unique (name, prev_revision) is the compare; no compaction leader (the apiserver compacts with a CAS); a kine schema migration takes ACCESS EXCLUSIVE, so a migrating kine bump is its own tested step"
      decided_2026_10_12: "user-decisions.md: blue/green behind a front, each cluster a systemd slice of member units, new k3s+kine slot beside the old on the same postgres, front swaps, old stops; scheduler and k3s leader election fixed; idle-first swaps; link keeps its iroh key"
      code_today_store: "internal/clusterprovider/stack.go:39-43 (ErrNoStore): k3s dials kine at http://127.0.0.1:<kine lease> (DaemonURL); kine's --endpoint is the cluster's own postgres DSN (cmd/socialweb-clusterprovider/main.go:370-375 storeEndpoint, unless SOCIALWEB_CLUSTERPROVIDER_STORE_ENDPOINT names an operator store); measured against k3s v1.36.4+k3s1 the S3 form is refused ('unknown driver') and a t4 endpoint makes k3s start its OWN kine. Leftover rustfs/t4 names: internal/vaultlayout PathCentralStore, PolicyCentralStore, ClassCentralStore; cmd/socialweb-vault SOCIALWEB_CENTRAL_STORE_* and its apply branch; internal/portallocator/portallocator.go:200 message; internal/versions/versions.json rustfs and t4 entries (M1-STORE-CLEANUP)"
items:
  - id: M0-XOS-GATE
    milestone: M0
    title: darwin and windows build and vet green, and gated on every check.sh run
    depends_on: []
    decision: >
      Decided by the user 2026-10-11: Linux-only execution with cross-OS seams built now. Decided by Claude,
      user may veto, from linux-proofs E7 and exploration B7: the first commit of this plan makes
      `GOOS=darwin` and `GOOS=windows` build and vet clean and keeps them so. (1) internal/hostos becomes
      primitives only: lock_unix.go (`//go:build unix`, flock), proc_{linux,darwin,windows}.go,
      portrange_{linux,darwin,windows}.go, bootid_{linux,darwin,windows}.go, sysproc_{linux,darwin,windows}.go;
      darwin bodies are stubs returning ErrUnsupported where no portable answer exists (plan 0012 fills them),
      plus internal/portallocator probe_darwin.go. (2) The capability predicates are deleted: caps_linux.go,
      caps_windows.go (Firecracker, QEMU, NetworkMode, Accel, AccelWHPX); check-host stops reading them and
      reads the compiled backend registry (vmruntime/hostsvc capabilities, plan 0007 M2-VM-RUNTIME and
      M2-HOST-UNITS here; until those land, check-host reports "no VM runtime compiled" on non-linux).
      (3) hostos.DetachProcess is deleted: it is Pdeathsig SIGKILL under a name that says the opposite; its
      one caller (nodefirecracker/namespace.go:45) uses hostos.DieWithParent until plan 0007 M2-VM-RUNTIME
      deletes that resident verb. (4) internal/nodevm/disk.go's reflink clone splits into clone_linux.go
      (FICLONE + SEEK_DATA) and clone_other.go (plain copy). (5) internal/apigen/live_upgrade_test.go is
      tagged `//go:build linux`. (6) deploy/check.sh --fast runs, before tests, for darwin/arm64,
      darwin/amd64, windows/amd64, windows/arm64 and linux/arm64: `go build ./... && go vet ./...` with the
      default (non-release) tags, so no embedded blob is needed (M1-ASSETS). (7) An import-boundary test
      (`go list -deps -json` per GOOS) asserts the OS-neutral packages (api, kcpapply, the ComputeVM
      controller core, the vmruntime and hostsvc interfaces) never import go-systemd, netlink or the
      firecracker client. ARCHITECTURE section 9 "The host platform" is rewritten to the seam table in the
      same change (it claims windows build and vet are clean and describes a deleted QEMU substrate).
    files: ["internal/hostos/*", "internal/portallocator/probe_darwin.go", "internal/nodevm/clone_linux.go, clone_other.go (from disk.go)", "internal/apigen/live_upgrade_test.go", "cmd/socialweb-computer-kcp-check-host (platform.go, checks.go, config.go)", "internal/nodefirecracker/namespace.go", "deploy/check.sh", "internal/xosgate (import-boundary test)", "docs/ARCHITECTURE.md section 9 The host platform"]
    test_first: >
      check.sh's new cross-OS step run on today's tree, red with the E7 errors recorded (darwin: hostos
      symbols undefined in 23 packages; windows: nodevm/disk.go in 10 packages, apigen Setpgid in vet), then
      green; internal/xosgate TestOSNeutralPackagesImportNoLinuxBackend red with a deliberate go-systemd
      import in a fixture, then green.
    done_when: "check.sh --fast green with the five cross-OS build+vet runs; no caps*.go or DetachProcess left; ARCHITECTURE host-platform section matches the code."
    risks:
      - "A later item adds an untagged OS-specific file; the gate fails that commit, which is the point."
      - "Plan 0008 M2-DENOKCP-FORK brings kcp-libs' execrunner (Setpgid, untagged) into the module; it must arrive build-tagged or this gate goes red."
    status: done
    evidence:
      - "branch xos-gate: 2c83e70 (check.sh cross-OS step + internal/xosgate, committed red), bb744f4 (hostos primitives only, darwin twins; caps_*.go and DetachProcess deleted), 16a4a93 (ARCHITECTURE section 9 seam table); merged to main 2026-10-12"
      - "red 2026-10-12T00:40:41Z: build:darwin/arm64, darwin/amd64, windows/amd64, windows/arm64 failed with the E7 errors (24 darwin packages via hostos/portallocator, windows nodevm/disk.go); TestOSNeutralPackagesImportNoLinuxBackend red 00:42:06Z with the go-systemd fixture, then green with TestBoundaryFlagsAGoSystemdImportInAFixture"
      - "green: check.sh --fast exit 0 at 00:47:02Z and 00:49:02Z; beyond E7 the gate also fixed portscan on darwin, nodeimage buildlock on windows and five untagged linux-only test files"
      - "linux go test ./... offline: before 1439 pass / 63 skip / 0 fail (00:39:52Z), after 1442 / 63 / 0; on merged main 2026-10-12 58/58 packages ok uncached, GOOS=darwin/arm64 and windows/amd64 build+vet ok"
  - id: M0-KCP-SPIKE
    milestone: M0
    title: Measure both kcp routes - in-process on kcp's fork, or a patched release binary in its own unit - and record the route
    depends_on: []
    decision: >
      Decided by the user 2026-10-11: the in-process fork is decided after this spike; the plan carries
      both paths (in-process fork vs exec'd kcp asset with port 0 and a port-report patch), gated on the
      spike's breakage count and effort. In a scratch branch, time box two executor days. In-process route:
