    milestone: M2
    title: The Linux host contract, probed by check-host, refused by name
    depends_on: [M1-ASSETS, M2-HOST-UNITS]
    decision: >
      Decided by the user 2026-10-11: minimum systemd 253 (GetUnitByPIDFD), check-host refuses older, and
      features are also probed directly; Ubuntu 24.04+ gets an install-time AppArmor profile for the pinned
      pasta path that check-host verifies. Decided by Claude, user may veto: check-host (as the account)
      checks and names each failure: systemd Manager.Version >= 253 over the private socket; a throwaway
      transient service socialweb-probe-<rand> started with every property the runtime uses (MemoryMax,
      MemorySwapMax=0, OOMPolicy, TasksMax, CPUQuota, CPUWeight, CollectMode, After/Wants, Slice, KillSignal,
      TimeoutStopSec, StandardOutput=append:) and each read back; cgroup v2 unified; the user@<uid>
      cgroup.controllers include cpu, memory, pids (else CPUQuota is accepted but unenforced); linger on;
      $XDG_RUNTIME_DIR short enough that the longest socket path the runtime builds is < 108 bytes; boot_id
      readable; for bidders: /dev/kvm read-write for the account, the user manager's own Groups (from
      /proc/<user@ pid>/status) include kvm (else "the account is in kvm in /etc/group but its user manager
      started before; restart user@<uid> - this stops every VM - or reboot"; never "chmod /dev/kvm" and never
      "log in again", which does not refresh a lingering manager), /dev/net/tun usable, the embedded
      runtime/<sha>/pasta creates a user+net namespace and execs through the /bin/sh trampoline (SELinux
      pasta_t may not exec our binaries directly, linux-proofs E4-sel), the AppArmor profile loaded where
      AppArmor restricts userns; oomd's monitored cgroups reported; for the gateway, the user manager's fd
      store (M3-APISERVER-FRONT) and the k3s slot hostname mechanism (M3-CP-SLOTS). The written contract is
      docs/host-contract.md.
