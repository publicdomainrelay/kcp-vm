  - id: M2-KCP-PORT0
    milestone: M2
    title: kcp and its embedded etcd bind port 0 and report the ports they got, on either route
    depends_on: [M1-KCP-INPROC, M2-KCP-UNIT]
    decision: >
      Decided by the user 2026-10-07: kcp supports binding port 0 and the caller learns the bound port, the
      Go twin of createServe's onListen. Both routes (decided by the user 2026-10-11). Secure port: on the
      in-process route socialweb-computer creates the listener itself and hands it to
      SecureServing.Listener (the --experimental-bind-free-port path, options.go:355-361); on the
      out-of-process route kcp runs with --experimental-bind-free-port --secure-port=0. Embedded etcd: a
      patch to the vendored embeddedetcd lets ClientPort and PeerPort be 0 by binding the listeners first and
      formatting the apiserver's ServerList (embedded.go:70) from the bound client address. Every URL kcp
      derives from the port (ExternalHost and shard base URL, options.go:339-353, the written admin.kubeconfig
      server, virtual workspace URLs) uses the bound address. Report: in-process, kcpserver.Config gains
      OnListen(func(name string, addr net.Addr)) called once per listener (secure, etcd-client, etcd-peer)
      before readiness; out-of-process, a patch makes kcp write <root>/.kcp-ports.json atomically once all
      three are bound (the org's port-file pattern), and the unit implementation reads it and calls the same
      OnListen. Prod keeps an explicit 6443 (caddy fronts kcp.socialweb.computer); run bidder, run gateway
      ssh, run request and every test use 0. The patches live in third_party/kcp-patches/*.patch and the
      vendor record names them.
    files: ["internal/kcpserver (OnListen, listener injection, port file reader)", "third_party/kcp-patches/embeddedetcd-port-zero.patch, kcp-bound-address.patch, kcp-port-file.patch (out-of-process only)", "third_party/vendor.json"]
    test_first: >
