  - id: M2-POSTGRES
    milestone: M2
    title: An embedded PostgreSQL driven by a Postgres CRD, one user unit per server
    depends_on: [M1-HOST-INVENTORY, M2-HOST-UNITS, M2-APPLY]
    decision: >
      Decided by the user 2026-10-07: postgres is embedded and is a reconciled resource, not a container
      package. Decided by the user 2026-10-11: KEEP the Postgres CRD with its own unit. Decided by Claude,
      user may veto: a pinned relocatable PostgreSQL 18 linux build (amd64, arm64; source chosen in
      M1-HOST-INVENTORY between a prebuilt relocatable set and a CI build from source, its locale/ICU and
      glibc collation versions recorded in versions.json), extracted by internal/assets.
      Kind Postgres (socialweb.computer/v1alpha1, export hostprocesses, apigen-generated) with spec {version,
      port (0 = leased), dataDir, listen 127.0.0.1, deleteData} and an OS-neutral status {phase, port,
      runtime {backend, ref, instance, pid, startTime, hostBootID}, message}. The controller runs initdb
      one-shot in-process (never ExecStartPre), writes pg_hba (127.0.0.1/32 only, today's rule), starts
      socialweb-pg-<clusterKey>.service (ExecStart runtime/<pg-sha>/bin/postgres -D ... -p <lease> -c
      listen_addresses=127.0.0.1 -c unix_socket_directories=; Restart=on-failure; KillSignal=SIGINT, fast
      shutdown; TimeoutStopSec=60), and reports Ready only after its own pgx `SELECT 1` on the leased port
      (relocatable builds are not --with-systemd, so systemd cannot see readiness). Adoption on a core restart
      by unit name + identity (M2-HOST-UNITS); a unit whose InvocationID changed (systemd restarted it) is
      re-probed and status bumped. On deletion it stops the unit and keeps the data dir unless
      spec.deleteData. The clusterprovider's per-cluster store (postgres.go:286-364 today execs initdb,
      postgres and psql from PATH) creates a Postgres object in the cluster's home workspace and waits for
      Ready; psql calls (bootstraprows.go:28, postgres.go:364) become pgx; clearStalePid/pidIsOurPostmaster
      (postgres.go:222-257) are replaced by unit identity. Postgres refuses root; the gateway account is not
      root (M1-INSTALL). Upgrades of the finished system (amended 2026-10-12 from control-plane-handover.md
      5(e), decided by Claude, user may veto): a MINOR upgrade (new pin, same major, same collation versions)
      is a unit restart with the new ExecStart (fast shutdown + start, seconds; kine and bao reconnect); a
      MAJOR upgrade is logical replication into a NEW Postgres object of the new major, then a write freeze
      of 1-2 s: stop the cluster's kine slot units (M3-CP-SLOTS), wait for catch-up, setval('kine_id_seq',
      max(id)) on the new primary (sequences are not replicated by logical replication before PG 19, verified
      for the target major in this item), switch the DSN of kine and bao, start kine; below a size bound
      measured here, dump/restore under the same write freeze instead. A pin whose collation provider version
      differs from the one a data dir was initdb'd with is treated as a major-class change (reindex or
      replication), never opened silently. Before every k3s MINOR bump M3-CP-SLOTS takes a pg_dump of the
      k3s and openbao databases. Readiness and ordering against the cluster's member units:
      M3-CLUSTER-UNITS.
    files: ["api/v1alpha1/postgres_types.go", "internal/postgresctl/", "internal/clusterprovider/postgres.go, bootstraprows.go", "deploy/sets.yaml (hostprocesses)"]
    test_first: >
      Behind livegate: internal/postgresctl TestAPostgresObjectBecomesAServerOnItsReportedPortAndSurvivesItsControllersRestart,
      TestAPostgresUnitRestartedBySystemdIsReprobedAndStaysReady,
      TestAMinorUpgradeIsAUnitRestartAndKineReconnects (a stand-in kine polled through the restart; SELECT 1
      and a kine write succeed after it), TestAMajorUpgradeByLogicalReplicationKeepsEveryKineRowAndTheSequence
      (stand-in data: rows and kine_id_seq equal after the switch, writes resume past max(id)),
      TestADataDirFromAnotherCollationVersionIsRefusedNotOpened; internal/clusterprovider
      TestTheClusterStoreIsAPostgresObjectNotAProcessGroupMember. Red first.
    done_when: "a market cluster reaches Ready on hat-8 with its store as a Postgres object; no postgres or psql binary from the host is on the path; the minor and major upgrade tests green with their write-freeze durations recorded."
    risks:
      - "A cluster's store is adopted, never re-initialised (refused if PG_VERSION differs from the pin's major)."
      - "Logical replication needs wal_level=logical on the old server; set from the first start so a major upgrade needs no restart of the old server."
    status: todo
