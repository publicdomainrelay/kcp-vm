  - id: M3-CP-CONTINUITY
    milestone: M3
    title: Control-plane continuity across upgrades and restarts of the finished system, proved end to end on the market bed
    depends_on: [M3-CLUSTER-UNITS, M3-APISERVER-FRONT, M3-CP-SLOTS, M3-LINK-HANDOVER, M2-POSTGRES, M3-HOST-INSTALL, "0007:M3-NODE-LOSS-CLOCK", "0007:M6-CLAIM-RESUME"]
    decision: >
      Decided by the user 2026-10-12: continuity is planned only for upgrades of the finished system (no
      cutover, no container); tenant control-plane upgrades are blue/green behind a per-cluster front. The
      user's goal (2026-10-11): the gateway durably tracks which clusters own which market-rented VMs, so
      after any restart or upgrade the nodes re-join their control planes, with zero downtime for clusters.
      Ownership model, decided by Claude, user may veto (control-plane-handover.md 7): the owner of a VM is
      exactly one NodeClaim (claim name = tenant Node name = guest vmName; market records are evidence, the
      claim is the index); the owner of a control plane is the host (member units + controlplane.json +
      leases.json; the Cluster CR is desired state and status mirror); join material is the cluster vault,
      keyed by claim name, link keys never regenerated; liveness is the tenant Node judged by the rebased
      loss clock (0007:M3-NODE-LOSS-CLOCK); a restart adopts, never reaps; the door resumes Bidding and
      Provisioning claims (0007:M6-CLAIM-RESUME, decided by the user 2026-10-12). Upgrade kinds and the item
      that makes each continuous: core binary (M3-CLUSTER-UNITS adoption; ccm stop/start; front restart from
      the fd store), k3s and kine (M3-CP-SLOTS), dumbpipe (M3-LINK-HANDOVER), postgres minor and major
      (M2-POSTGRES), bao pin (unit restart + unseal on the new InvocationID; joined nodes need no bao, new
      joins and ESO wait), ESO pin (stop/start, no election). kcp upgrades are NOT covered here: they follow
      the same front pattern through caddy (user 2026-10-12) and are folded into the kcp items after the
      pending kcp blue/green research. This item builds no new mechanism; it is the end-to-end proof.
    files: ["internal/marketbed/live_test.go (continuity tests)", "docs/ARCHITECTURE.md section 5 (stated limits rewritten to the built design)"]
    test_first: >
      On the market bed (node joined via runComputeContract, RFP -> bid -> accept -> cloud-init):
      TestEveryUpgradeKindKeepsAMarketNodeReadyAndOwned (in sequence: core upgrade, k3s patch swap, dumbpipe
      replacement, postgres minor restart, bao restart; /readyz through the front polled every 200 ms with the
      failure count recorded per step and 0 for the core upgrade and the k3s swap; no Ready transition, no
      claim deleted, no RFP, no vm.delete) and TestAColdStartOfEveryClusterReleasesNoNodeWhosePathReturns
      (`systemctl --user stop` of every member unit, then the gateway restarted: every cluster cold-starts,
      the node is kept because its path returns within the rebased clock). Red first.
    done_when: "both bed tests green with readings recorded (UTC); ACC6-UPGRADE and ACC6-CP-SWAP recorded."
    risks: ["A user-manager restart or reboot of the gateway host is a cold start of every cluster; the rebased clock bounds its cost, it is not zero-downtime."]
    status: todo
