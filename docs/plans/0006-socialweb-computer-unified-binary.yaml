items:
  - id: M0-KCP-EMBED-SPIKE
    milestone: M0
    title: Measure linking kcp v0.33.0 in-process against embedding its release binary, and record the choice
    depends_on: []
    decision: >
      Default (decided by Claude, user may veto): "embedded kcp" means the pinned kcp release binary
      carried inside socialweb-computer (zstd, sha256-pinned, extracted content-addressed and exec'd as a
      supervised child with Pdeathsig), NOT kcp linked as a Go library, because linking it forces the
      kcp-dev fork of every k8s.io module onto every package of this repo (kcp go.mod :61-103) and the
      prod store is the exact same kcp v0.33.0 binary today, so state compatibility is free. This spike
      measures the library route so the default is a reading, not a guess: in a scratch branch, add
      github.com/kcp-dev/kcp v0.33.0 with the full replace set (kcp-dev/kubernetes staging at
      e006560fc76a, kcp-dev staging modules vendored under third_party/kcp at the tag), build
      cmd/socialweb-computer with an in-process kcp start, and record: does go build ./... succeed, does
      go test ./... stay green (list every failure), binary size delta, cold start to /readyz, and
      whether the kcp-libs/deno-kcp modules (k8s.io v0.36.4) still build under the fork. The in-process
      route is chosen only if all four are green; otherwise it is recorded as refused with the reading.
    files: ["scratch branch only; the result is recorded here and in ARCHITECTURE section 12"]
    test_first: >
      None (measurement). The reading is the build log, the go test summary and a timed /readyz from a
      fresh root directory for both routes, all with UTC timestamps.
    done_when: >
      Both routes measured on hat-8; the decision line above is confirmed or replaced, with the numbers,
      and the losing route's blockers listed by package.
    risks:
      - "The fork's k8s.io/client-go is 1.37.0-alpha (kcp-dev/kubernetes v1.37.0-alpha.0.0.20260602065202); our code compiled against v0.36.4 may break in subtle generated-code ways."
      - "Time box: one executor day. If it does not build in that time, that is the reading."
    status: todo
    evidence: []
  - id: M0-SIZE-BUDGET
    milestone: M0
    title: Fix a size budget for the binary from measured asset sizes
    depends_on: []
    decision: >
      Decided by Claude, user may veto: one release artifact, socialweb-computer-linux-amd64, carrying
      every server-side asset (kcp, bao, k3s, kine, external-secrets, dumbpipe, deno, the TypeScript
      closure), zstd-compressed inside the binary. Budget 450 MiB on disk for linux/amd64, measured by
      check.sh on every build; arm64 follows once a second arch is asked for. The client-side kubectl
      exec plugin (socialweb-credential) is NOT folded in, because users download it for four platforms
      and it must stay a few MiB. Measured basis (zstd -19): deno 34 MB, kcp 60 MB, bao 64 MB, k3s 73 MB,
      kine 25 MB; the TypeScript closure with its node_modules is estimated at 30-40 MB and is measured by
      0008:M1-TS-CLOSURE.
    files: ["internal/versions/versions.json (add size budget and per-asset sha256 fields)", "deploy/check.sh (size gate)"]
    test_first: >
      internal/versions TestTheReleaseBinaryFitsItsSizeBudget reads the budget from versions.json and the
      built binary's size from SOCIALWEB_COMPUTER_BINARY; red with a 1-byte budget, then green.
    done_when: "budget recorded in versions.json and enforced by check.sh --full; sizes recorded here."
    risks:
      - "k3s is barely compressible (79 MB -> 73 MB); if the budget is breached, k3s is the first asset to move to a sibling download verified by sha256 at first start."
    status: todo
    evidence: []
  - id: M1-CLI
    milestone: M1
    title: cmd/socialweb-computer, a multi-call CLI whose subcommand tree is the stack
    depends_on: []
    decision: >
      Subcommands (decided by Claude, user may veto, except the four the user named):
        serve gateway kcp       prod: root vault, kcp, provider manifests, gateway, TLS front, clusterprovider, door (replaces container-entrypoint.sh)
        run bidder              plan 0007: local kcp + deno-kcp + the bidder DenoPod + the ComputeVM controller
        run gateway ssh         plan 0008: local kcp + deno-kcp + the ssh door DenoPod (socialweb-computer-ssh)
        run request             plan 0008: one requester contract through requestCompute, no kcp
        serve provider          clusterprovider alone against a kcp it is pointed at (today's cmd/socialweb-clusterprovider)
        vault prepare-root|apply-root   today's cmd/socialweb-vault
        migrate                 today's socialweb-clusterprovider migrate (container-entrypoint.sh:278-281)
        apply <set> [--set k=v] [--dry-run]   render and server-side apply one embedded manifest set (M2-APPLY)
        manifests list|render <set>           print the embedded sets and their rendered YAML
        check-host              today's cmd/socialweb-computer-kcp-check-host
        nodeimage ...           today's cmd/socialweb-nodeimage
        version [--json]        every embedded asset with its version and sha256
        internal <verb>         re-exec targets of /proc/self/exe: cloud-controller-manager, tenantcredential
      Config resolution in Go mirrors the TypeScript cli-args-env priority chain so both stacks read
      alike: flag, then the option's env var, then a JSON config file (SOCIALWEB_COMPUTER_CONFIG or
      <state-dir>/config.json), then the default declared beside the option. Every existing
      SOCIALWEB_* variable keeps working as the env name of its option, so today's container.env and
      prod env file are valid inputs unchanged. Stdlib flag only, no new CLI dependency (decided by
      Claude, user may veto).
    files:
      - "cmd/socialweb-computer/main.go (dispatch only)"
      - "internal/clicfg/ (option table, priority chain, env aliases)"
      - "internal/clicfg/options.json (every option: name, type, env, default, description; the Go twin of cli-args-env.json)"
    test_first: >
      internal/clicfg TestTheFlagBeatsTheEnvBeatsTheConfigBeatsTheDefault and
      TestEveryEnvVariableTheEntrypointReadsIsAnOptionsEnvName (parses deploy/container-entrypoint.sh and
      deploy/container.env.example for SOCIALWEB_* names and fails on any not in options.json); red
      before options.json exists.
    done_when: >
      socialweb-computer --help lists the tree; every subcommand above exists and the not-yet-built ones
      exit 2 naming the plan item that builds them; check.sh --fast green.
    risks:
      - "A second config system beside cli-args-env.json; mitigated by mirroring its JSON shape exactly so a later generator can emit both."
    status: todo
    evidence: []
  - id: M1-ASSETS
    milestone: M1
    title: Content-addressed embedded assets, verified on every start
    depends_on: [M0-SIZE-BUDGET]
    decision: >
      internal/assets embeds each third-party binary as <name>-<goos>-<goarch>.zst through per-platform
      files guarded by build tags, the sshai pattern (sshai a00ab8c9
      src/policy_engine/common/deno_embed_linux_amd64.go:1-7 and deno_noembed.go), with three changes
      decided by Claude, user may veto: (1) extraction goes to <state-dir>/runtime/<sha256>/<name> and a
      file already there is re-hashed before use, because sshai reuses whatever sits at
      <cache>/deno-embedded/deno without a version or hash check (deno_manager.go:105-115) so an upgrade
      can silently run the old runtime; (2) a release build has NO PATH or download fallback (sshai
      falls back to PATH then to a GitHub download, deno_manager.go:51-90); a missing or mismatching
      asset refuses to start and names the expected sha256; (3) the noembed build tag (development only)
      resolves each asset from an explicit path option, never from PATH, and `version` prints that the
      build is noembed. Pins (version, upstream URL, sha256 of the uncompressed binary) live in
      internal/versions/versions.json beside the existing invariants, and a test holds the Dockerfile
      ARGs and versions.json equal as today. zstd via github.com/klauspost/compress/zstd (already in
      go.sum as an indirect dependency).
    files:
      - "internal/assets/ (Extract, Verify, Path; embed_linux_amd64.go, noembed.go)"
      - "internal/assets/blobs/ (gitignored; filled by scripts/stage-assets.sh)"
      - "scripts/stage-assets.sh (fetch or copy each pinned upstream binary, check sha256, zstd -19 --long, write blobs)"
      - "internal/versions/versions.json"
    test_first: >
      internal/assets TestAnExtractedAssetThatNoLongerMatchesItsPinIsReplacedNotRun (tamper one byte of
      the extracted file; Path must re-extract and the result must hash to the pin) and
      TestAReleaseBuildWithAMissingAssetRefusesToStart; both red against a naive sshai-style extractor.
    done_when: >
      kcp, bao, k3s, kine, external-secrets, dumbpipe and deno (the last consumed by 0008) extract and
      verify; `socialweb-computer version --json` lists each with version and sha256; extraction is
      atomic (temp file + rename) so two processes starting at once never exec a half-written file.
    risks:
      - "kine needs CGO (versions.json); it is an exec'd asset, so the Go binary itself stays CGO_ENABLED=0."
      - "Extraction cost on first start (~600 MB written); measured and recorded; later starts only re-hash."
      - "/tmp is a 24 GiB tmpfs on hat-8: the state dir, never /tmp, holds the runtime."
    status: todo
    evidence: []
  - id: M1-KCP-CHILD
    milestone: M1
    title: The embedded kcp as a supervised child with today's exact flags
    depends_on: [M0-KCP-EMBED-SPIKE, M1-ASSETS]
    decision: >
      internal/kcpserver starts the extracted kcp with the flags container-entrypoint.sh:227-234 uses
      (--root-directory, --bind-address, --secure-port, --feature-gates=WorkspaceMounts=true,
      --audit-policy-file from the embedded deploy/kcp-audit-policy.yaml written next to the root,
      --audit-log-*), Pdeathsig SIGKILL from a thread locked for the child's life (the procgroup pattern
      from plan 0005 M6-LIMITS), stdout/stderr drained into the structured log, readiness by GET /readyz
      with the admin kubeconfig kcp writes, and a refusal to start when the WorkspaceMounts gate is
      absent from the argv (versions.json kcp invariant). If M0 chose the library route, this item
      instead wraps the cmd/kcp/kcp.go:95-162 sequence behind the same interface.
    files: ["internal/kcpserver/", "deploy/embed.go (exports the audit policy bytes; see M2-MANIFESTS)"]
    test_first: >
      internal/kcpserver TestKcpIsRefusedWithoutTheWorkspaceMountsGate (offline) and, behind livegate,
      TestTheEmbeddedKcpOpensTheRootDirectoryTheContainerWrote: start the child on a copy of a root dir
      written by the release kcp started the old way, list workspaces, compare to the list read before.
    done_when: "both green; a SIGKILL of socialweb-computer leaves no kcp process (ps reading recorded)."
    risks:
      - "Two kcp processes on one root directory corrupt it; the child takes an flock on <root>/.socialweb-computer.lock before exec and refuses if held."
    status: todo
    evidence: []
  - id: M2-MANIFESTS
    milestone: M2
    title: Every YAML the stack applies lives in one embed.FS, grouped into named, ordered sets
    depends_on: [M1-CLI]
    decision: >
      deploy/embed.go (package deploy, at the directory that already holds the files, so nothing is
      copied) embeds deploy/*.yaml, deploy/denokcp/*.yaml, deploy/eso/*.yaml and
      deploy/examples/atproto/market/*.yaml, and declares named sets in deploy/sets.yaml: provider
      (install-provider.sh:55-64), permission-inventory (apply-permission-inventory.sh), denoruntime
      (deploy/denokcp schemas, exports, workspace types), bootstrap-cluster (container-entrypoint.sh
      :129-213 as templates), market-testbed (deploy/examples/atproto/market/00-70), plus the sets plans
      0007 and 0008 add. Each set is an ordered list of phases, each phase a list of files plus a wait
      condition (workspace Ready, APIExport endpoint slice published, APIBinding bound, OpenBao
      status.ready, DenoPod Running). internal/marketbed's vendored-tree record check keeps covering the
      vendored files byte for byte, so embedding changes nothing about the vendoring rules.
    files: ["deploy/embed.go", "deploy/sets.yaml", "internal/marketbed (record check unchanged; add sets.yaml as ours)"]
    test_first: >
      deploy TestEveryYAMLUnderDeployIsInExactlyOneSetOrListedAsUnapplied and
      TestEverySetDecodesStrictlyIntoKcpAndKubernetesTypes (reusing internal/marketbed's strict decoder);
      red before sets.yaml exists.
    done_when: "`socialweb-computer manifests list` prints every set and its phases; tests green."
    risks:
      - "go:embed cannot reach outside the package directory; deploy/embed.go must sit in deploy/, which makes deploy a Go package; check.sh and the Dockerfile COPY deploy/ keep working."
    status: todo
    evidence: []
  - id: M2-TEMPLATE
    milestone: M2
    title: Templating with typed values and no silent blanks
    depends_on: [M2-MANIFESTS]
    decision: >
      text/template with Option("missingkey=error") over a typed values struct per set (no
      map[string]any), rendered then strictly decoded before any apply; a value that would render an
      empty string into a field the schema requires is refused at render time. The test bed's
      __PLACEHOLDER__ tokens (twelve, in 15-70 yaml) and apply.sh:171's sed rewrite of the org root
      become template fields ({{.OrgRoot}} becomes the extracted TypeScript tree of plan 0008).
      Decided by Claude, user may veto: vendored upstream files keep their bytes; templating is applied
      only to files recorded as "adapted" in deploy/denokcp/vendor.json, so the vendoring check still
      means something.
    files: ["internal/manifests/ (Render, Values types)", "deploy/denokcp/vendor.json (adapted entries name their template fields)"]
    test_first: >
      internal/manifests TestAMissingValueIsARenderErrorNotAnEmptyField and
      TestTheRenderedMarketBedEqualsWhatApplyShProduced (golden: apply.sh's sed output for a fixed org
      root, captured once into testdata); red first.
    done_when: "`manifests render market-testbed --set orgRoot=/x` byte-equals the golden; tests green."
    risks: ["A template field inside a vendored file breaks the byte-for-byte record; only adapted files may carry one."]
    status: todo
    evidence: []
  - id: M2-APPLY
    milestone: M2
    title: Server-side apply into kcp workspaces from Go, phase by phase, never kubectl
    depends_on: [M2-TEMPLATE]
    decision: >
      internal/kcpapply applies rendered objects with the dynamic client and types.ApplyPatchType under
      field manager socialweb-computer and Force true (the precedent at
      internal/clusterprovider/tenant.go:101-102), addressing a workspace by rest.Config Host
      <kcp>/clusters/<path> (precedent internal/clusterprovider/registry.go:293), with a fresh discovery
      RESTMapper per phase because discovery caches outlive a schema change (the reason apply.sh disables
      kubectl's cache). Waits are typed conditions polled with the kcp-sdk types
      (github.com/kcp-dev/sdk v0.33.1). APIResourceSchemas are create-only and compared, never
      patched (APIResourceSchema.spec is immutable; versions.json our-crds invariant); a differing
      existing schema is a refusal naming the revision lock. Ownership migration (decided by Claude,
      user may veto): objects kubectl client-side-applied today carry manager kubectl-client-side-apply
      and the last-applied annotation; the first SSA takes ownership with Force, then removes the
      last-applied-configuration annotation in the same patch, and a dry-run report
      (`apply --dry-run`) lists every field whose manager changes before prod sees it.
    files: ["internal/kcpapply/", "cmd/socialweb-computer apply subcommand"]
    test_first: >
      Behind livegate on kcp v0.33.0: TestApplyingTheProviderSetTwiceChangesNothingTheSecondTime (second
      apply: zero resourceVersion changes), TestAnObjectKubectlAppliedIsAdoptedWithoutLosingAField
      (apply with kubectl first, then kcpapply; managedFields name socialweb-computer, spec unchanged),
      TestAChangedAPIResourceSchemaIsRefusedNotPatched. Red against an empty package.
    done_when: >
      install-provider.sh, apply-permission-inventory.sh, the denokcp install and the market bed's
      apply.sh are each reproduced by `socialweb-computer apply <set>` with the same objects in the
      same workspaces (object-by-object diff recorded); no kubectl or yq invoked anywhere in the path.
    risks:
      - "apply-permission-inventory.sh holds logic in yq (subjects vs grants split, :52-53); the port must keep the split and its DRY_RUN server mode."
      - "kcp returns 429 while storage initialises right after start (plan 0005 M2-CODEGEN evidence); waits retry 429 with a bound."
    status: todo
    evidence: []
  - id: M3-SERVE-GATEWAY-KCP
    milestone: M3
    title: socialweb-computer serve gateway kcp replaces container-entrypoint.sh
    depends_on: [M1-KCP-CHILD, M2-APPLY, M3-FOLD]
    decision: >
      One Go supervisor composes, in the entrypoint's order: root vault (extracted bao, config from
      `vault prepare-root`), kcp (M1-KCP-CHILD), vault apply-root, `apply provider` and
      `apply permission-inventory`, bootstrap-cluster set (when SOCIALWEB_CONTAINER_BOOTSTRAP=1),
      migrate, gateway (in-process, today's cmd/socialweb-gateway run function), TLS front, the
      clusterprovider (in-process), and the door. Supervision semantics are kept exactly: any member
      exiting ends the whole process with exit 1 so docker restarts it (container-entrypoint.sh:321-341).
      Decided by Claude, user may veto: the socat TLS terminator (one fork per connection, flagged at
      :289) becomes a Go crypto/tls reverse proxy to the gateway address with the same certificate and
      key files; in this item the door stays what it is today, a deno child started with the same argv
      and env (container-entrypoint.sh:297-317) from the image's /opt/org-root, so the cutover does not
      wait on DenoPods. Moving the door into a DenoPod run by the in-process deno-kcp provider is
      0008:M3-DOOR-DENOPOD, which depends on this item.
    files:
      - "internal/stack/gatewaykcp/ (composition)"
      - "cmd/socialweb-gateway, cmd/socialweb-clusterprovider: main bodies moved into importable run(ctx, cfg) functions"
      - "deploy/control-plane-container/Dockerfile (k8s target ENTRYPOINT socialweb-computer serve gateway kcp)"
    test_first: >
      cmd/socialweb-computer TestServeGatewayKcpStartsMembersInTheEntrypointsOrderAndDiesWithAnyOfThem
      (fake members recording start order; killing one ends the run with exit 1) and, behind livegate,
      TestServeGatewayKcpOnACopyOfAProdShapedVolumeServesTheDoorAndTheSameWorkspaces. Red first.
    done_when: >
      The k8s image boots with the new entrypoint on hat-8 against a copy of a volume written by the old
      one: same workspaces, bindings and claims, door /api/config 200, clusterprovider scale passes
      logging None nodes 0, and no kubectl, yq, socat or shell in the process tree.
    risks:
      - "Moving the gateway and clusterprovider into one process shares one address space: a panic in one kills both. Today a crash also kills the container, so the blast radius is unchanged; recovered panics are not added."
      - "SOCIALWEB_* env surface must be identical; enforced by M1-CLI's test."
    status: todo
    evidence: []
  - id: M3-FOLD
    milestone: M3
    title: Fold the server-side Go binaries into verbs; keep the ones that must stay small or guest-side
    depends_on: [M1-CLI]
    decision: >
      Fold (decided by Claude, user may veto): socialweb-gateway, socialweb-clusterprovider,
      socialweb-vault, socialweb-computer-kcp-check-host, socialweb-nodeimage, and the two binaries the
      clusterprovider execs per cluster, socialweb-cloud-controller-manager and
      socialweb-tenantcredential, which become `socialweb-computer internal <verb>` re-execs of
      /proc/self/exe (the nodeboot precedent: it re-execs itself for the namespace verb). The
      clusterprovider's path options for them default to /proc/self/exe plus the verb. Stay separate:
      socialweb-nodeinit (guest /init, static, must stay tiny), socialweb-nodeboot (entrypoint of the
      bidder's privileged runner image, which must not carry 450 MiB), socialweb-credential (client
      exec plugin for four platforms), socialweb-meshd (Rust, guest-side, served by sha256),
      socialweb-apigen (go generate tool). Each folded cmd/ keeps a one-line main calling the verb for
      one release so scripts and units keep working, then is deleted by M5-RETIRE.
    files: ["cmd/socialweb-computer", "cmd/socialweb-*/main.go (thin shims)", "internal/clusterprovider (exec path defaults)", "deploy/control-plane-container/Dockerfile"]
    test_first: >
      cmd/socialweb-computer TestEveryFoldedBinaryIsAVerbWithTheSameUsageAndExitCodes (table over the
      seven, comparing usage text and exit code for no args and --help against the old binaries built
      in the test) and TestTheClusterProviderSpawnsTheCCMAsAReExecOfItself; red first.
    done_when: "the k8s image carries socialweb-computer plus the stay-separate binaries only; tests green."
    risks: ["A re-exec'd verb inherits the parent's environment; the CCM today gets a curated env, so the re-exec builds the same env explicitly."]
    status: todo
    evidence: []
  - id: M4-BUILD
    milestone: M4
    title: Reproducible static build with pinned, verified assets
    depends_on: [M1-ASSETS, M3-FOLD]
    decision: >
      CGO_ENABLED=0, -trimpath, -buildvcs=true, -ldflags "-s -w -X version", GOTOOLCHAIN=local with the
      toolchain the Dockerfile already pins, GOFLAGS=-mod=mod with GOPROXY=off from the staged module
      cache (Dockerfile:32-45 does this today). Assets are staged by scripts/stage-assets.sh from pinned
      URLs or host copies, each checked against versions.json before compression; zstd output is
      deterministic for a given input and level. Reproducibility is proven, not assumed: two builds from
      two clean staging dirs must be byte-identical (sha256 recorded). The build writes
      socialweb-computer.manifest.json (every asset, version, sha256, the TypeScript closure's manifest
      from plan 0008) next to the binary, and `socialweb-computer version --json` prints the same bytes.
    files: ["scripts/build-socialweb-computer.sh", "deploy/check.sh (--full: build twice, compare, size gate)"]
    test_first: >
      deploy/check.sh --full step reproducible-build fails when the two sha256s differ (proved red by
      injecting a timestamp into one build), then green.
    done_when: "two clean builds on hat-8 byte-identical; manifest and size recorded here."
    risks: ["The TypeScript closure's tar must be deterministic too (sorted entries, fixed mtime, uid 0); owned by 0008:M1-TS-CLOSURE."]
    status: todo
    evidence: []
  - id: M5-SHADOW
    milestone: M5
    title: Shadow run of the unified image against a copy of the prod volume
    depends_on: [M3-SERVE-GATEWAY-KCP, M4-BUILD]
    decision: >
      On hat-8, never on prod: copy the prod volume (docker run --rm -v socialweb-k8s-state:/v ... tar)
      to hat-8, start the unified image on it with the prod env file minus public listeners, and read:
      workspaces, APIBindings and their bound schema revisions, ClusterLinks, NodeClaims (count and
      phases), the door's /api/config, the clusterprovider's scale passes, `apply --dry-run` ownership
      report. Nothing may be written that the old image would not have written: zero NodeClaims created,
      zero RFPs, zero schema revisions created.
    files: ["docs/plans/0006 evidence only"]
    test_first: "None (reading). The reading is compared line by line to the same reading taken with the old image on the same copy."
    done_when: "both readings recorded with UTC timestamps and identical except for process names."
    risks: ["The prod volume holds secrets (root vault, mint keys); the copy lives under a 0700 root-owned dir on hat-8 and is deleted after the reading, deletion recorded."]
    status: todo
    evidence: []
  - id: M5-CUTOVER
    milestone: M5
    title: Prod cutover with a measured window and a one-command rollback
    depends_on: [M5-SHADOW]
    decision: >
      Zero downtime is NOT achievable for this store: kcp's embedded etcd under one root directory admits
      one process, and today's deploy is already stop-then-start (scripts/deploy.sh:114-124). Decided by
      Claude, user may veto: the cutover is the same stop-then-start with the unified image and the SAME
      volume and kcp version, so rollback is re-running deploy.sh with the previous image, which deploy.sh
      keeps tagged socialweb-k8s:previous before loading the new one; RESET_KCP is never set. The window
      is measured (docker rm to door /api/config 200) and must be no worse than the old image's window
      measured the same day. Pre-flight: the old image's own deploy is measured first, the same day.
    files: ["scripts/deploy.sh (keep :previous tag; IMAGE default unchanged)"]
    test_first: >
      test/deploy_script_test.go TestTheDeployKeepsThePreviousImageTaggedBeforeLoadingTheNewOne (runs
      deploy.sh --dry-run style against a fake docker on PATH); red first.
    done_when: >
      Prod runs the unified image; window recorded; 30 minutes of scale passes None nodes 0 with no new
      RFPs; a rollback rehearsal on hat-8 restored the old image on the same volume and read the same.
    risks:
      - "The kubectl-applied objects change field manager on first start; M2-APPLY's dry-run report must have been read on the shadow copy first."
      - "User deploys prod; this item's executor prepares and rehearses, the user runs the cutover."
    status: todo
    evidence: []
  - id: M5-RETIRE
    milestone: M5
    title: Delete the shell path once prod has run the unified binary for seven days
    depends_on: [M5-CUTOVER]
    decision: >
      Delete deploy/container-entrypoint.sh, deploy/install-provider.sh,
      deploy/apply-permission-inventory.sh, deploy/denokcp/install-provider.sh, the folded cmd/ shims and
      kubectl/yq/socat from the image. Seven days decided by Claude, user may veto.
    files: ["the files listed in the decision", "docs/ARCHITECTURE.md section 5 and 12"]
    test_first: "test/ TestNoScriptInTheImageInvokesKubectl (greps the built image's file list); red while the scripts exist."
    done_when: "image rebuilt without them; check.sh --full green; ARCHITECTURE updated."
    risks: ["accept.sh of the test bed still uses kubectl until 0008:M4-TESTBED-PORT lands; it is a test asset, not shipped in the image."]
    status: todo
    evidence: []
acceptance:
  where: "hat-8 for every proof, prod only for M5-CUTOVER readings"
  checks:
    - id: ACC6-ONE-BINARY
      text: The prod container's process tree under PID 1 is socialweb-computer plus the exec'd children it extracted (kcp, bao, k3s/kine/postgres per cluster, external-secrets, dumbpipe, deno), and no shell, kubectl, yq or socat.
      status: todo
      evidence: []
    - id: ACC6-STATE
      text: After cutover the same workspaces, APIBindings (same bound schema revisions), ClusterLinks and NodeClaims list as before it, and an idle cluster still reads None nodes 0.
      status: todo
      evidence: []
    - id: ACC6-ROLLBACK
      text: A rollback to the previous image on the same volume, rehearsed on hat-8, reads the same as before the cutover.
      status: todo
      evidence: []
    - id: ACC6-REPRO
      text: Two clean builds are byte-identical and the binary is within its size budget.
      status: todo
      evidence: []
questions_for_user:
  - "Embedded kcp: is exec'ing the pinned kcp release binary carried inside socialweb-computer acceptable as 'embedded', or do you want kcp linked in-process even if M0-KCP-EMBED-SPIKE shows it forces the kcp-dev Kubernetes fork onto every package of this repo?"
  - "One 450 MiB release artifact, or separate flavours (a server build with kcp/bao/k3s/kine and a bidder build without bao/k3s/kine)?"
  - "Should the prod deploy keep the container (Fedora base supplying PostgreSQL 18 for the per-cluster stores) with socialweb-computer as its entrypoint, or do you want a bare-host install (systemd unit, host PostgreSQL) as the target?"
  - "Is a stop-then-start cutover with a measured window acceptable, given a single kcp root directory cannot be served by two processes at once?"
  - "May socialweb-cloud-controller-manager and socialweb-tenantcredential become internal verbs of socialweb-computer, or must they remain separately named executables for operators?"
