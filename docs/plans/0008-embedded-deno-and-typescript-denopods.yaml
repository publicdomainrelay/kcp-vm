    decision: >
      kcp on port 0 (0006 slot shape behind a port-0 front, 0006:M2-KCP-PORT0) under <state-dir>/kcp, the owned deno-kcp provider, one DenoPod running
      hono-socialweb-computer-ssh/mod.ts with its cli-args-env options passed through; its json-file-store
