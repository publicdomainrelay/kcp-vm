source: >
  Split out of plan 0006 (same user request of 2026-10-07): Go and TypeScript are both first class in
  socialweb-computer. The binary carries a pinned deno and the TypeScript codebase; every long-running
  TypeScript service runs as a DenoPod reconciled by a deno-kcp provider that this repo now owns (the
  user decided to fork and vendor deno-kcp); kcp records which services run, and the core binary and its
  deno processes can be upgraded while VMs keep running.
principle:
  stated: >
    Decided by the user 2026-10-12, the ORGANIZING PRINCIPLE of plans 0006-0008 (full text and rules: plan
    0006 `principle`): kcp is a core part of APPLICATIONS; the virtual Kubernetes clusters project is the one
    traditional use.
  in_this_plan:
    - "DenoPods are how an application's TypeScript components become objects of that application's own kcp. An application instance (the gateway with its door, a bidder handle, a requester `run request`, a market test bed) = its own kcp + a manifest set (DenoPod values over M2-SERVICE-TEMPLATE) + a profile."
    - "Modes are profiles over one manifest set, rendered by 0006 M2-TEMPLATE: a bidder in OAuth QR mode against a real account has no PDS pod; a bidder in the market test bed has its own PDS pod."
    - "Applications talk to each other ONLY over the atproto market protocol, never by sharing a kcp: a DenoPod never reads another application instance's objects, and the servicenames table a pod resolves through holds only its own instance's services."
    - "Every DenoPod listener behind the edge binds port 0; the runner reads the pod's port file and records status.address; peers resolve by service name through kcp (0006 principle.port0_rule; port-audit.md ranked blocker 1). Only edge entry points keep known addresses (the door's 8788 behind caddy)."
    - "The market test bed (deploy/examples/atproto/market) is the seed of this model and the vehicle for parallel workstreams: M1-BED-PARALLEL and M4-TESTBED-PORT are what every workstream tests in."
    - "How today's multi-server deno processes split into DenoPods per application is folded (fifth fold 2026-10-12; 0006 principle.decomposition): one root object per application (0006 M2-APP-CONTROLLER); STRICT kcp per application, inside a bed too (the bed is a MarketNetwork application whose children each run their own kcp, M4-TESTBED-PORT); every listener reports into DenoPod.status.listeners (M2-DENOPOD-LISTENERS); network values only through the composer and one fetch adapter (M2-MARKET-NETWORK); the requester is a fresh kcp per invocation with a durable state dir (M4-RUN-REQUEST); secrets only in each application's OpenBao (M3-DOOR-STATE-VAULT for the door); iroh is the only guest transport (M1-SSH-GATEWAY-IROH, then M1-STRIP-LEGACY-TRANSPORTS)."
state_rules:
  - Item status (todo, doing, done, blocked) lives here; the git history is the evidence. No evidence lists are added (user, 2026-10-12).
  - status is one of todo, doing, done, blocked.
  - An item is done when its done_when holds on main; the commits say how.
  - Open items are mirrored in NEXT.yaml (P8-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user; one marked
    "decided by the user 2026-10-07", "decided by the user 2026-10-11" or "decided by the user 2026-10-12"
    was.
  - >
    RFP flow is the spine (org-root CLAUDE.md). The market bed's guests come up only through `run bidder`
    and the requester's RFP, bid, accept and cloud-init user_data; no item boots a guest any other way.
  - >
    Linux only (decided by the user 2026-10-11). OS-specific process code (Setpgid, Pdeathsig) lives in
    GOOS-tagged files; darwin and windows stubs return ErrUnsupported until plans 0012 and 0011, and
    0006:M0-XOS-GATE keeps both building and vetting.
  - An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>.
  - >
    Dev run mode is kcp-native now (decided by the user 2026-10-12; 0006 state rule): every test harness
    and every bed passes host-backend=proc and runs inside its own dev instance (0006 M1-DEV-INSTANCE); a
    production-shaped run passes systemd-user. DenoPods stay children of the core on both backends.
  - >
    Bed per workstream (decided by the user 2026-10-12; 0006 state rule). Each workstream's live tests run
    in the task's own market test bed: a task tree from the org root's `./scripts/task-tree.ts`
    (docs/task-tree.md in the org root) brings up its own isolated atproto network (fake PLC, relay, PDSes,
    ingress proxy, bidders, requesters) through M1-BED-PARALLEL now and `dev up --profile bed` later. No
    workstream test uses a real account or the shared real bidder; bobvmbuilder + alice are a final soak
    only.
  - >
    Every org repo works on `main` and is pushed to GitHub as work lands (decided by the user 2026-10-12).
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment, the vendored deno-kcp test bed, the
    atproto-market requester libraries, and (decided by the user 2026-10-07) the forked copies of
    deno-kcp and kcp-libs this plan brings into the repo. hono-compute-provider and atproto-market may
    be changed by commit on main, pushed to GitHub as work lands (decided by the user 2026-10-12; replaces
    "never pushed").
  not_owned: >
    The market protocol records and lexicons; the core architecture (nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data).
