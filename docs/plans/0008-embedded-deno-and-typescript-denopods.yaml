plan: 0008-embedded-deno-and-typescript-denopods
written: 2026-10-07
revised: >
  2026-10-07, with the user's answers to the plan's questions (decisions below marked 'decided by the user
  2026-10-07'). 2026-10-11, folded from docs/research/2026-10-11-vm-lifecycle/ (user-decisions.md,
  plan-0006-0007-linux-exploration.md, linux-proofs.md); decisions from user-decisions.md are marked
  'decided by the user 2026-10-11': Linux only with cross-OS seams (the forked DenoPod runner arrives
  build-tagged; Windows and macOS runners are plans 0011 and 0012); deno processes are plain children of the
  core USER unit and die with it (control-group); explicit deno permissions in the service template, no -A;
