items:
  - id: M1-DENO
    milestone: M1
    title: A pinned deno inside the binary; a DENO_DIR that can never hold another version's code
    depends_on: ["0006:M1-ASSETS"]
    decision: >
      deno 2.9.3 per platform is an internal/assets entry. internal/denorun builds every deno argv. From
      the live finding (13349d6): every run passes --no-code-cache, AND each DENO_DIR is keyed by the
      sha256 of the TypeScript it serves (<state>/deno/<closure sha256>/ under the account's state dir,
      0006:M1-INSTALL), so an upgrade starts from an empty code cache by construction and the old directory
      is removed once no DenoPod names it and it is not the current or previous binary's closure (the same
      rule as 0006:M1-ASSETS' runtime GC).
      Production runs add --cached-only and --frozen (no jsr.io or npm at runtime; lockfile drift is a
      start failure) and DENO_NO_UPDATE_CHECK=1. Decided by Claude, user may veto.
    files: ["internal/assets (deno)", "internal/denorun/", "internal/versions/versions.json"]
    test_first: >
      internal/denorun TestAnUpgradedClosureNeverRunsTheOldCodeCache (run a fixture entry, swap its source
      for a new closure sha256, run again: the new behaviour, even with the old DENO_DIR left on disk) and
      TestAProductionRunNeverReachesTheNetworkForItsModules (under unshare -rn). Red first.
    done_when: "both green; `version` prints deno 2.9.3 and its sha256."
    risks: ["A cache missing one module fails at first import; M1-TS-CLOSURE runs every entry with --cached-only at build time."]
    status: todo
    evidence: []
  - id: M1-TS-SOURCE
    milestone: M1
    title: Where the TypeScript comes from - the embedded archive in production, the org root otherwise
    depends_on: [M1-DENO]
    decision: >
      Decided by the user 2026-10-07: production builds run the TypeScript from the embed.FS archive;
      non-production builds take the org-root path from an env var with an auto-detected fallback that
      walks up ../ until the org root is found. Details decided by Claude, user may veto: the variable is
      SOCIALWEB_COMPUTER_ORG_ROOT (an option in internal/clicfg); the walk starts at the working
      directory, then at the executable's directory, and stops at the first directory holding
      typescript-helpers/, atproto-market/ and socialweb-computer-kcp/ as real directories; a symlinked
      sibling is refused by name, because the live market test proved a symlinked sibling is not a
      directory to Deno.readDir and the guest's tunnel then 404s. Non-production runs allow network
      module fetches into a DENO_DIR keyed by the org root path. Production is the build without the
      `dev` tag; it has no org-root option at all.
    files: ["internal/tsbundle/source.go (Source interface: Embedded, OrgRoot)", "internal/clicfg/options.json"]
    test_first: >
      internal/tsbundle TestTheOrgRootIsFoundByWalkingUpAndASymlinkedSiblingIsRefused and
      TestAProductionBuildHasNoOrgRootOption; red first.
    done_when: "tests green; a dev build run from a worktree three levels deep finds the org root."
    risks: ["A worktree's own sibling imports (../../) do not resolve from a worktree (plan 0005 evidence); the walk finds the org root above the worktree, which is the checkout the user runs."]
    status: todo
    evidence: []
  - id: M1-TS-CLOSURE
    milestone: M1
    title: The production TypeScript closure and its module cache as one deterministic embedded archive
    depends_on: [M1-TS-SOURCE]
    decision: >
      cmd/socialweb-tsbundle (build tool, not shipped) reads deploy/ts-entries.yaml (the door and its
      undici-preload.ts, hono-bidder, hono-socialweb-computer-ssh, the request CLI of M4-RUN-REQUEST, the
      test bed's hono-plc, hono-atproto-relay, hono-did-key-ingress-proxy and hono-pds), stages each
      needed sibling repo in org-root layout, fills one DENO_DIR with `deno install --frozen
      --node-modules-dir=none --entrypoint` per entry (the flag the bidder launcher already runs with,
      13349d6, so no node_modules symlink tree is shipped), runs each entry once with --cached-only, and
      writes a tar (sorted, mtime SOURCE_DATE_EPOCH, uid/gid 0) compressed with zstd plus manifest.json
      (every repo's git commit, every file's sha256, every entry). A dirty sibling repo is refused. The
      archive and manifest are files in an embed.FS. An entry that cannot run without node_modules is
      recorded by name with the reason, not silently given one.
    files: ["cmd/socialweb-tsbundle/", "deploy/ts-entries.yaml", "internal/tsbundle/ (embed, extract to <state>/ts/<sha256>/, read-only)", "deploy/check.sh"]
    test_first: >
      TestTwoBundlesOfTheSameCommitsAreByteIdentical, TestAnExtractedTreeWhoseFileChangedIsRefused,
      TestADirtySiblingRepoIsRefusedForARelease; red first.
    done_when: "archive built; size recorded (feeds 0006:M0-SIZE-BUDGET); every entry starts offline from the extracted tree."
    risks: ["The door today runs with node_modules (nodeModulesDir auto); its suite is run under --node-modules-dir=none before the switch."]
    status: todo
    evidence: []
  - id: M1-BED-PARALLEL
    milestone: M1
    title: "EARLY: today's market bed runs N per host - no fixed ports, no one-bed check - so live tests in parallel worktrees stop colliding"
    depends_on: ["0006:M1-PORT-LEASE-INSTANCE"]
    decision: >
      Decided by the user 2026-10-12: live tests collide on fixed ports until the dev-instance / testbed-port
      items land, so those come early; M4-TESTBED-PORT drops the fixed ports 2583-2589 and the one-bed lock.
      Decided by Claude, user may veto: this item does that for TODAY's bed (internal/marketbed driving the
      vendored deno-kcp bed, accept.sh and apply.sh) without waiting for M4-TESTBED-PORT's long dependency
      chain. Every fixed bed port - the services' 2583-2589 (internal/marketbed/live_test.go:18; the vendored
      manifests; accept.sh), the deno-kcp kcp 6443 and kine 23791 (deploy/denokcp/start-kcp.sh:5-6, already
      env-overridable), and every place that names them (live_m3_test.go:38-41, :96, :582-599) - is read from
      a per-run bed record whose ports are leased from the per-user lease file keyed by instance
      (0006:M1-PORT-LEASE-INSTANCE; instance = the dev instance id once 0006:M1-DEV-INSTANCE lands, the
      worktree-derived id before) or bound at 0 and read back where the service reports its port (onListen
      logs); the bed's *.localhost names stay, resolved per bed. Port 0 is the rule, leases the exception
      (0006 principle.port0_rule, user 2026-10-12): the first change is port-audit.md ranked blocker 1 (B2) -
      the deno-kcp runner reads each pod's <runDir>/port-bound-to (PORT_FILE set per run, B3), records it as
      the DenoPod's status.address, and servicenames builds the table from status.address, so peers resolve
      by service name through the bed's kcp and never by a configured port. Every literal this item removes
      deletes its line from 0006 M1-NO-FIXED-PORTS' ratchet. This item is what makes 'bed per workstream'
      (state rule) possible: each task tree's live tests run in its own bed. The livegate "port held by another process"
      refusal (live_test.go:115) is replaced by the lease. Bed units and processes carry the run id
      (socialweb-bed-<runid>-...), so two beds never touch each other's processes. Guests still come up only
      through the bed's requester (runComputeContract -> RFP -> bid -> accept -> cloud-init) against the
      bed's own bidder; the bed adds no provisioning path.
    files: ["internal/marketbed/ (bed record, leases, live tests read ports from it)", "deploy/denokcp/start-kcp.sh (ports from the record)", "deploy/examples/atproto/market/ (manifests templated on ports; accept.sh, apply.sh read the record)", "deploy/denokcp/vendor.json (adapted files recorded)"]
    test_first: >
      internal/marketbed TestNoBedPortIsALiteral (scans the bed's Go, shell and manifests for 2583-2589, 6443
      and 23791 outside the record; red on today's tree), TestTwoBedRecordsLeaseDisjointPorts; behind
      livegate on hat-8: TestTwoBedsOnOneHostEachRentAGuestThroughTheRFPFlow (two worktrees' beds at once,
      each guest born via runComputeContract; both pass; no ssh to a guest). Red first.
    done_when: "the two-bed live run passes on hat-8 with its readings (ports, run ids, guest names, UTC); M1-TESTBED's accept checks still pass on one bed; 0006 M1-NO-FIXED-PORTS' ratchet holds no bed entry."
    risks: ["Two beds double the guests on hat-8 (memory, /dev/kvm); the run records host memory before and after and refuses a third bed when free memory is below the bed's guest budget."]
    status: todo
    evidence: []
  - id: M2-DENOKCP-FORK
    milestone: M2
    title: Fork deno-kcp and kcp-libs into this repo and own them
    depends_on: ["0006:M0-KCP-SPIKE", "0006:M0-XOS-GATE"]
    decision: >
      Decided by the user 2026-10-07: fork/vendor the deno-kcp provider into this repo and own the copy.
      Decided by Claude, user may veto: deno-kcp's api, internal/provider, internal/denopod, denojob,
      denorun and the rest it needs, and the kcp-libs packages they import, are copied into
      internal/denokcp/... and internal/kcplibs/... with import paths rewritten, the carried
      kcp-libs-no-default-issuer.patch applied as an ordinary commit, and deploy/denokcp/vendor.json
      recording the upstream commits they started from. They build with the rest of the module on today's
      k8s.io v0.36.4: the kcp route is out of process (decided by the user 2026-10-12, 0006 M0-KCP-SPIKE), so
      0006:M1-K8S-FORK is closed as not chosen and this item needs only the route record and the cross-OS
      gate (0006:M0-XOS-GATE) its build-tagged runner must keep green (M0-KCP-SPIKE also measured deno-kcp
      25d10f92 and kcp-libs f6911d2 green on the fork, so either module graph builds). The CRDs (DenoPod,
      OpenBao, ...) keep their group deno.computer so existing manifests and the test bed apply unchanged.
      Upstream is no longer followed automatically; a later upstream change is pulled by a recorded
      cherry-pick. Cross-OS seam (decided by the user 2026-10-11): kcp-libs impl/execrunner's process
      attributes (supervisor.go:141 Setpgid, untagged today, which breaks GOOS=windows) move into
      runner_unix.go / runner_windows.go behind a small interface; the windows file returns ErrUnsupported
      until 0011 M1-DENOPOD-RUNNER-WINDOWS, and darwin keeps the unix file until 0012
      M1-DENOPOD-RUNNER-DARWIN replaces what it needs, so 0006:M0-XOS-GATE stays green when the copy lands.
      Dev run mode (decided by the user 2026-10-12; detail decided by Claude, user may veto, dev-run-mode.md
      5): runner_unix.go also sets SWC_UNIT=<the core's unit name> in every DenoPod process's environment,
      so devsup (0006 M2-HOST-BACKEND-PROC) attributes a deno process that left the core's process group to
      the core unit and kills it with the core.
    files: ["internal/denokcp/", "internal/kcplibs/ (execrunner runner_unix.go, runner_windows.go)", "deploy/denokcp/vendor.json", "deploy/denokcp/build-provider.sh (deleted once the in-process provider passes M2-DENOKCP-INPROC)"]
    test_first: >
      The forked packages' own tests, moved with them and green; plus internal/denokcp
      TestTheForkRecordsTheUpstreamCommitsItStartedFrom, and check.sh's cross-OS build+vet step green with
      the copy in the tree. Red until the copy exists.
    done_when: "go test ./internal/denokcp/... ./internal/kcplibs/... green; vendor record check green; GOOS=darwin and GOOS=windows build and vet green."
    risks: ["deno-kcp's third_party/openbao and baoembed (an openbao module-path trick) are not copied; the provider talks to a running bao over its API, which is what socialweb-computer runs."]
    status: todo
    evidence: []
  - id: M2-DENOKCP-INPROC
    milestone: M2
    title: The owned deno-kcp provider running inside socialweb-computer, upgradable without touching VMs
    depends_on: [M2-DENOKCP-FORK, M1-DENO, "0006:M2-KCP-PORT0", "0006:M2-HOST-BACKEND-PROC"]
    decision: >
      Both backends (decided by the user 2026-10-12: dev run mode kcp-native now; details decided by Claude,
      user may veto): "deno processes die with the core" is proved on systemd-user (control-group kill) and
      on proc, where execrunner's children sit in their own process groups with no Pdeathsig
      (supervisor.go:141) and devsup's subreaper attribution by SWC_UNIT (M2-DENOKCP-FORK) kills them with the
      core unit. DenoPod stays its own kind (TypeScript services that die with the core); the HostProcess
      kind (0006 M2-HOSTPROCESS-KIND) generalises its reconciler shape for host processes that outlive the
      core, and a DenoPod is never placed as a HostProcess.
      internal/stack/denoruntime runs the provider in-process with: deno-bin the extracted deno, runs-dir
      <state>/denokcp/runs, the runner timeout NEGATIVE (disabled; services are long-running and a
      DenoPod that wants a limit sets activeDeadlineSeconds), and the kcp client config internal/kcpserver
      hands back (the kcp front URL with the shard-admin context, 0006 M2-KCP-SLOTS; never the per-start
      kcp-admin token, so a kcp slot roll does not invalidate it). Upgrade semantics (decided by the user 2026-10-07: the core binary and
      its deno processes are upgradable while VMs keep running; decided by the user 2026-10-11: the core runs
      as a user unit of a lingering account): deno processes are plain children in the core unit's cgroup
      and die with it on any stop, restart or crash of the core (default KillMode=control-group; linux-proofs
      E1-neg: plain children die on restart, kill -9 and stop); on start the provider finds every DenoPod
      whose status.runID names no live process and restartPolicy Always starts it again from the new closure.
      Nothing that holds a VM is a deno process (each VM is its own transient service, plan 0007
      M2-VM-RUNTIME), so restarting every deno process never touches a VM.
    files: ["internal/stack/denoruntime/"]
    test_first: >
      Behind livegate: TestADenoPodAppliedToTheKcpRunsOnTheEmbeddedDeno and
      TestAnUpgradeRestartsEveryRecordedDenoPodOnTheNewClosureExactlyOnce (run the stack as a user unit
      under a test prefix; three cases: `systemctl --user restart` of the unit, `kill -9` of its main
      process, and `upgrade` to a build with a different closure sha256: every DenoPod Running on the new
      code, one deno process each, no deleted DenoPod returns, no deno process of the old unit left); on proc
      in a dev instance: TestAKilledCoreLeavesNoDenoProcessOnTheProcBackend (kill -9 of the core unit's main
      process and `dev restart core`). Red first.
    done_when: "both green on hat-8 on systemd-user and on proc."
    risks: []
    status: todo
    evidence: []
  - id: M2-SERVICE-TEMPLATE
    milestone: M2
    title: One service DenoPod template instead of a supervisor script per manifest
    depends_on: [M1-TS-CLOSURE, M2-DENOKCP-INPROC, "0006:M2-TEMPLATE"]
    decision: >
      deploy/denopods/service.yaml renders the supervisor script the test bed repeats (70-bidder.yaml:35-92)
      from typed fields: entry and cwd relative to the TypeScript source root (M1-TS-SOURCE; never an
      absolute host path), args, deno flags (always --no-code-cache), env, permissions, probe,
      restartPolicy Always. Preloads: KCP_SHIM first, then the service's own (the door's undici-preload.ts).
      The test bed's 20-70 manifests become values for this template; vendored originals stay records.
      Permissions (decided by the user 2026-10-11: explicit deno permissions, no -A, no --allow-run, no
      /dev/kvm, no D-Bus socket path, enforced in the DenoPod template and tested): `permissions` is a
      required typed list per service; the template refuses -A/--allow-all; --allow-run and --allow-ffi
      render only when the values file names them with a reason, and the bidder's values (0007
      M5-RUN-BIDDER) name neither; read/write are scoped to the service's state dir and the TypeScript tree;
      every service gets --deny-read and --deny-write for /dev/kvm and $XDG_RUNTIME_DIR, because deno runs as
      the same uid as the user manager and its permission sandbox is the only boundary to the bus there.
    files: ["deploy/denopods/service.yaml", "deploy/sets.yaml", "internal/manifests"]
    test_first: >
      TestEveryServiceDenoPodNamesItsEntryRelativeToTheSourceRoot, TestTheTemplateRefusesAllowAll,
      TestEveryRenderedServiceDeniesDevKvmAndTheRuntimeDir, TestAllowRunRendersOnlyWithAReason and, behind
      livegate, TestTwoPreloadsBothRunBeforeTheEntry; red first.
    done_when: "the market bed's services start from the template on hat-8 with the probes of M1-TESTBED run 9 passing."
    risks: []
    status: todo
    evidence: []
  - id: M3-DOOR-DENOPOD
    milestone: M3
    title: The door runs as a DenoPod
    depends_on: [M2-SERVICE-TEMPLATE, "0006:M3-SERVE-GATEWAY-KCP"]
    decision: >
      `serve gateway kcp` applies a door DenoPod in root:socialweb-door (type denoruntime) with the env the
      entrypoint sets today (container-entrypoint.sh:305-312), STATE_DIR on the persistent state dir, a
      fixed PORT 8788 behind caddy (the gateway application's front, an edge exception to 0006
      principle.port0_rule listed in deploy/edge-ports.yaml; every other gateway DenoPod binds 0), and the door's explicit permission list (M2-SERVICE-TEMPLATE; any
      --allow-run it needs is named with its reason). A door restart (upgrade) must not cost a node; what the
      door must re-populate after one is plan 0007 M6-GATEWAY-REPOPULATE.
    files: ["internal/stack/gatewaykcp", "deploy/denopods/door.values.yaml", "deploy/sets.yaml"]
    test_first: >
      Behind livegate, on a FRESH state dir (no container-era state is ever opened; fresh deploy, decided by
      the user 2026-10-12): TestTheDoorDenoPodServesApiConfigAndKeepsItsClaimsAcrossACoreRestart (claims the
      door DenoPod wrote before `systemctl --user restart` of the gateway unit are listed by the restarted
      door DenoPod, unchanged); red while the door is a child process.
    done_when: "on hat-8 the door DenoPod serves /api/config on a fresh state dir and lists, after a core restart, the claims it wrote before it."
    risks: ["The door's per-process secrets server for guests in flight (plan 0005 M3-NODE-LOSS) is made durable by plan 0007 M6-CLAIM-RESUME (split from M6-GATEWAY-REPOPULATE 2026-10-12); until then a door restart still fails Bidding/Provisioning claims."]
