plan: 0008-embedded-deno-and-typescript-denopods
written: 2026-10-07
queued: >
  QUEUED. Starts only after plan 0005 (docs/plans/0005-zero-ssh-market-nodes.yaml) is complete and its
  acceptance checks ACC-ZERO, ACC-MESH and ACC-NOSSH pass on prod with UTC readings recorded there.
  Its first items also wait on plan 0006's assets and apply items, named in depends_on.
source: >
  Split out of plan 0006 (same user request of 2026-10-07): Go and TypeScript are both first class in
  socialweb-computer. The binary carries a pinned deno runtime and the TypeScript codebase
  (atproto-market, the door, the ssh door and their org-root closure) in the style of sshai's
  policy_engine, and every long-running TypeScript service runs as a deno-kcp DenoPod reconciled by the
  deno-kcp provider linked into socialweb-computer, so kcp holds which services run.
state_rules:
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, hat-8 or prod readings with UTC timestamps).
  - Open items are mirrored in NEXT.yaml (P8-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user.
  - An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment on socialweb.computer, the vendored deno-kcp
    test bed, and the atproto-market requester libraries.
  not_owned: >
    The market protocol records and lexicons; the core architecture (nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data). Upstream deno-kcp and kcp-libs: changes
    are proposed upstream and carried here as recorded patches (the deploy/denokcp/kcp-libs-*.patch
    precedent) until they land.
research:
  sshai_policy_engine:
    commit: "publicdomainrelay/sshai a00ab8c9ff721e22f95855b9164b8d031e4cf295 (main, 2026-06-10)"
    findings:
      - "src/policy_engine/common/deno_embed_linux_amd64.go:1-7: //go:build embed_deno && linux && amd64, //go:embed deno_embedded/deno-linux-amd64.zip into a []byte; one such file per platform, deno_noembed.go returns nil under !embed_deno"
      - "common/deno_manager.go:20 pins DenoVersion v2.1.4; :51-90 resolution order embedded -> PATH -> download from GitHub; :95-135 extracts the zip to <cache>/deno-embedded/deno and chmods 0755; :112-115 reuses an already extracted file WITHOUT a version or hash check"
      - "Makefile:15-53 download-deno-all fetches the five platform zips; .goreleaser.yaml:12-19 builds with -tags embed_deno"
      - "The TypeScript is NOT in an embed.FS in sshai: src/policy_engine/ts/ is a separate deno program (deno.json tasks api/run, main.ts), bundled actions are copied by the Dockerfile to /bundled-actions and found through BUNDLED_ACTIONS_DIR (Dockerfile:71-73, common/workflow.go:659-663), and Go spawns deno run --allow-all --no-prompt per step (common/workflow.go:893). Embedding the TypeScript tree itself is new here."
  ts_embedding_precedent: "kcp-libs f6911d2 impl/assets/dns.go:8-11 already go:embeds TypeScript (dnsshim.ts, dnsprobe.ts) that the deno-kcp provider materialises as the KCP_SHIM preload"
  deno_kcp:
    commit: "deno-kcp 25d10f92 (local checkout), test bed vendored at f5b7c10c; kcp-libs f6911d2"
    findings:
      - "cmd/deno-kcp-provider/main.go:17 imports github.com/johnandersen777/deno-kcp/internal/provider: an internal package, not importable from this module; :75-109 flags (kubeconfig, host, runs-dir, deno-bin, pod-timeout default 5m, service-domain kcp.local, openbao-*)"
      - "go.mod:85 replace github.com/publicdomainrelay/kcp-libs => ../kcp-libs; requires kcp-dev/sdk v0.33.1 and k8s.io v0.36.4, the same as ours"
      - "api/v1alpha1/types_denopod.go:22-68 DenoPodSpec (template + restartPolicy + exec probes + activeDeadlineSeconds + ttl) and status (phase, runID, restarts, ready, outputs map[string]string, conditions); finalizer denopod.deno.computer/run (:70); types_shared.go:51-65 DenoPodTemplate (denoJson, denoLock, script, permissions, serviceAccount, apiServer, env)"
      - "kcp-libs impl/execrunner/supervisor.go:141 starts each run with Setpgid and no Pdeathsig, :220-229 writes state.json (pid, start ticks), :249-268 and :394 recover a run after a provider restart by pid plus start ticks; :156 and :322 stop is SIGKILL to the whole process group, so a deno script gets no chance to clean up"
      - "kcp-libs impl/execrunner/pod.go:17 DefaultPodTimeout 5m, :61-62 maps only Timeout 0 to the default, :101-105 enforces the timeout only when > 0: a negative timeout disables it without an upstream change"
      - "the test bed's DenoPods name host paths: deploy/examples/atproto/market/70-bidder.yaml:14-15 SERVICE_ENTRY/SERVICE_CWD under /home/johnandersen777/src/publicdomainrelay-kcp, rewritten per run by apply.sh:171 with sed; :35-92 is the supervisor script every service DenoPod repeats; :78-79 prepends --preload KCP_SHIM; :116-119 allows KCP_SERVER, KCP_NAMESPACE, KCP_TOKENS"
  ts_closure_measured:
    - "deno info --json over the door (socialweb-computer-k8s/hono-socialweb-computer-k8s/mod.ts), hono-bidder/mod.ts and hono-socialweb-computer-ssh/mod.ts on 2026-10-07: 389 distinct local files, 1842618 bytes, from atproto-market, deno-worker-sandbox, did-key-ingress-proxy, hono-compute-provider, hono-jsr, hono-pds, policy-engine, typescript-helpers, socialweb-computer-kcp, socialweb-computer-ssh; 234-237 remote modules and 211-261 npm packages per entry"
    - "deploy/control-plane-container/build.sh:42-64 already derives the per-repo closure from deno info and rsyncs it, excluding node_modules and .git; Dockerfile:206-210 then deno caches the door at image build"
    - "deno 2.9.3 (Dockerfile:142 and the hat-8 host); `deno run --help`: --preload takes a list of files"
items:
  - id: M1-DENO
    milestone: M1
    title: A pinned deno inside the binary, run offline, never from PATH
    depends_on: ["0006:M1-ASSETS"]
    decision: >
      deno 2.9.3 linux/amd64 is one more internal/assets entry (sha256 pinned in versions.json; the
      Dockerfile's DENO_VERSION and versions.json held equal by test). internal/denorun builds every deno
      argv: DENO_DIR is the extracted closure's cache, DENO_NO_UPDATE_CHECK=1, DENO_NO_PROMPT=1,
      --cached-only and --frozen on every run so a service never reaches jsr.io or npmjs at runtime and
      a lockfile drift is a start failure, not a silent re-resolve. Decided by Claude, user may veto.
    files: ["internal/assets (deno entry)", "internal/denorun/", "internal/versions/versions.json"]
    test_first: >
      internal/denorun TestADenoRunNeverReachesTheNetworkForItsModules: run a fixture entry importing a
      jsr and an npm package from an extracted fixture cache inside `unshare -rn` (no network); red when
      --cached-only is dropped (the run tries to fetch) and green with it.
    done_when: "test green; `socialweb-computer version` prints deno 2.9.3 and its sha256."
    risks: ["A cache missing one module fails at first import of it, possibly long after start; M1-TS-CLOSURE's check runs every entry with --cached-only at build time."]
    status: todo
    evidence: []
  - id: M1-TS-CLOSURE
    milestone: M1
    title: The TypeScript closure of every entrypoint, with its dependency cache, as one deterministic embedded archive
    depends_on: [M1-DENO]
    decision: >
      A build-time tool (cmd/socialweb-tsbundle, not shipped; it reuses the deno info walk build.sh:42-64
      already does) takes the entry list in deploy/ts-entries.yaml (the door and its undici-preload.ts,
      hono-bidder, hono-socialweb-computer-ssh, the request CLI of M4-RUN-REQUEST, and the test bed's
      hono-plc, hono-atproto-relay, hono-did-key-ingress-proxy and hono-pds), copies each needed sibling
      repo into a staging org root (same relative layout, because deno.json import maps reach siblings
      by ../), runs `deno install --frozen --entrypoint` per entry with DENO_DIR inside the staging dir,
      then runs every entry once with --cached-only under `deno check` to prove the cache is complete.
      The archive is tar (entries sorted, mtime SOURCE_DATE_EPOCH, uid/gid 0, symlinks kept) compressed
      with zstd, and a manifest.json lists every repo with its git commit (a dirty repo is refused in a
      release build), every file's sha256 and every entry. Decided by Claude, user may veto: the archive
      is one file inside an embed.FS (`//go:embed tsbundle/closure.tar.zst tsbundle/manifest.json`)
      rather than the source tree itself in an embed.FS, because go:embed refuses symlinks and
      node_modules is made of them, and it skips names starting with . or _ unless every pattern is
      prefixed all:. The manifest stays readable without extraction.
    files: ["cmd/socialweb-tsbundle/", "deploy/ts-entries.yaml", "internal/tsbundle/ (embed + extract to <state>/ts/<sha256>/, read-only after extraction)", "deploy/check.sh"]
    test_first: >
      internal/tsbundle TestTwoBundlesOfTheSameCommitsAreByteIdentical and
      TestAnExtractedTreeWhoseFileChangedIsRefused (one byte flipped under <state>/ts/<sha256>); and
      cmd/socialweb-tsbundle TestADirtySiblingRepoIsRefusedForARelease. All red against an empty tool.
    done_when: >
      Archive built from hat-8's org root; its size recorded here (feeds 0006:M0-SIZE-BUDGET); every
      entry starts from the extracted tree offline; check.sh --full rebuilds and compares.
    risks:
      - "node_modules size (117-143 MiB per repo on disk today) may dominate; deno install per repo shares one DENO_DIR, and duplicate npm trees across repos are measured before any dedupe trick is tried."
      - "A sibling repo checked out at a branch other than the one prod expects ships silently; the manifest's commit list is printed by `socialweb-computer version` and recorded in each deploy's evidence."
    status: todo
    evidence: []
  - id: M2-DENOKCP-INPROC
    milestone: M2
    title: The deno-kcp provider linked into socialweb-computer
    depends_on: [M1-DENO, "0006:M1-KCP-CHILD"]
    decision: >
      deno-kcp's provider is internal (cmd/deno-kcp-provider/main.go:17), so decided by Claude, user may
      veto: propose upstream a public package github.com/johnandersen777/deno-kcp/provider exposing
      Run(ctx, Config) with today's main.go wiring (registry, execrunner engine and pod, policy client,
      OpenBao options, metrics), and until it lands carry it as deploy/denokcp/deno-kcp-public-provider.patch.
      The build vendors deno-kcp and kcp-libs source at the commits deploy/denokcp/vendor.json records
      (third_party/deno-kcp, third_party/kcp-libs, written by a script from git archive like
      build-provider.sh does, with both patches applied) and go.mod replaces both modules with those
      paths. Config for socialweb-computer: deno-bin is the extracted deno, runs-dir
      <state>/denokcp/runs, pod timeout NEGATIVE (disabled; pod.go:61 maps only 0 to 5m and :101-105
      enforces only > 0) because services are long-running and a DenoPod that wants a limit sets
      activeDeadlineSeconds. Recovery: execrunner can re-adopt a DenoPod process still alive by runID
      (supervisor.go:249-268, :394), but under docker (PID 1 exit ends the container) and under systemd
      with KillMode=control-group or mixed (the unit's remaining processes are killed when the main
      process exits) nothing survives the Go process, so what kcp gives us is the record: on restart the
      provider finds every DenoPod with a stale runID, and restartPolicy Always starts it again. Adoption
      of live processes is only reachable with KillMode=process, which this plan does not use (decided by
      Claude, user may veto). The VMs of plan 0007 are different: they live in runner containers owned by
      dockerd, outside this cgroup, and survive.
    files: ["third_party/deno-kcp, third_party/kcp-libs (generated, recorded)", "go.mod (replace)", "deploy/denokcp/vendor.json", "deploy/denokcp/deno-kcp-public-provider.patch", "internal/stack/denoruntime/"]
    test_first: >
      Behind livegate: internal/stack/denoruntime TestADenoPodAppliedToTheEmbeddedKcpRunsOnTheEmbeddedDeno
      and TestARestartedProviderStartsEveryDenoPodItsKcpRecordsAndNoSecondCopy (run the stack in a child
      process, kill -9 its whole process group, start it again on the same state dir: every DenoPod
      Running again with a new status.runID and exactly one deno process each). Red before the provider
      is linked.
    done_when: "both green on hat-8; the deno-kcp provider binary is no longer a test dependency of the market bed (build-provider.sh still exists for comparison runs)."
    risks:
      - "If 0006:M0-KCP-EMBED-SPIKE chose in-process kcp (kcp-dev Kubernetes fork), deno-kcp and kcp-libs must also build against the fork; the spike measures that."
      - "Upstream may reject the public package; then the patch is carried indefinitely and recorded as such."
    status: todo
    evidence: []
  - id: M2-SERVICE-TEMPLATE
    milestone: M2
    title: One service DenoPod template instead of a supervisor script per manifest
    depends_on: [M1-TS-CLOSURE, M2-DENOKCP-INPROC, "0006:M2-TEMPLATE"]
    decision: >
      deploy/denopods/service.yaml is one template rendering the supervisor script every test bed
      DenoPod repeats (70-bidder.yaml:35-92) with typed fields: entry and cwd relative to the extracted
      org root (never an absolute host path; apply.sh:171's sed rewrite goes away), args, deno flags,
      env, the permission set, the probe, restartPolicy Always. The preload chain is KCP_SHIM first, then
      the service's own preloads (the door needs hono-socialweb-computer-k8s/undici-preload.ts,
      container-entrypoint.sh:313-314). The test bed manifests 20-70 are re-expressed as values for this
      template; the vendored originals stay as vendored records.
    files: ["deploy/denopods/service.yaml", "deploy/sets.yaml (market-testbed now renders through it)", "internal/manifests"]
    test_first: >
      internal/manifests TestEveryServiceDenoPodNamesItsEntryRelativeToTheTree (no absolute path in any
      rendered DenoPod) and, behind livegate, TestTwoPreloadsBothRunBeforeTheEntry (a fixture entry
      asserting both preload markers are set); red first.
    done_when: "the market bed's services start from the template on hat-8 with the same probes passing as M1-TESTBED run 9."
    risks: ["deno 2.9.3 documents --preload as taking a list; two --preload flags are proven by the test, not assumed."]
    status: todo
    evidence: []
  - id: M3-DOOR-DENOPOD
    milestone: M3
    title: The door runs as a DenoPod in the provider workspace
    depends_on: [M2-SERVICE-TEMPLATE, "0006:M3-SERVE-GATEWAY-KCP"]
    decision: >
      `serve gateway kcp` stops starting the door as a deno child and instead applies a door DenoPod
      (service template) in a workspace of type denoruntime, root:socialweb-door, with the env the
      entrypoint sets today (container-entrypoint.sh:305-312) as template values, STATE_DIR on the
      persistent volume, and the door's kcp credentials from the provider workspace. The door must keep
      its fixed address (8788, behind caddy), so the DenoPod's PORT is fixed, not leased. Decided by
      Claude, user may veto: the door workspace binds only denoruntime; the door's NodeClaim and cluster
      access keep using the kubeconfig it uses today, unchanged.
    files: ["internal/stack/gatewaykcp", "deploy/denopods/door.values.yaml", "deploy/sets.yaml"]
    test_first: >
      Behind livegate on a copy of a prod-shaped volume: TestTheDoorDenoPodServesApiConfigAndReadsTheSameClaims;
      red while the door is still a child process (no DenoPod exists).
    done_when: "hat-8 shadow (0006:M5-SHADOW procedure) reads the door identically; `kubectl get denopods -A` on the embedded kcp shows the door Running."
    risks:
      - "The door holds per-process secrets servers for guests in flight (plan 0005 M3-NODE-LOSS: a restarted door marks Bidding/Provisioning claims Failed); the DenoPod's restartPolicy Always must not restart it more often than the container restarted it before. Restarts are counted in status.restarts and read during the shadow run."
    status: todo
    evidence: []
  - id: M4-RUN-GATEWAY-SSH
    milestone: M4
    title: socialweb-computer run gateway ssh
    depends_on: [M2-SERVICE-TEMPLATE]
    decision: >
      A local embedded kcp under <state-dir>/kcp, the in-process deno-kcp provider, and one DenoPod
      running socialweb-computer-ssh's hono-socialweb-computer-ssh/mod.ts from the extracted tree, with
      its cli-args-env options passed as template values from socialweb-computer's own options (the
      option names and env names are the ssh door's own). kcp binds loopback only. Decided by Claude,
      user may veto: the ssh door's json-file-store-fs state lives under <state-dir>/ssh-door, outside
      the DenoPod run dir, so a DenoPod recreate keeps it.
    files: ["internal/stack/gatewayssh", "deploy/denopods/ssh-door.values.yaml"]
    test_first: >
      cmd/socialweb-computer TestRunGatewaySshServesTheSshDoorsConfigEndpointFromTheEmbeddedTree (live,
      hat-8; red before the subcommand exists).
    done_when: "the ssh door answers on its port and its existing deno test suite (socialweb-computer-ssh task test) still passes against the extracted tree."
    risks: ["The ssh door's own live test drives runComputeContract against a bidder; it is not re-run here, only its unit suite."]
    status: todo
    evidence: []
  - id: M4-RUN-REQUEST
    milestone: M4
    title: socialweb-computer run request, a one-shot requester through requestCompute
    depends_on: [M1-TS-CLOSURE]
    decision: >
      A thin CLI hono-compute-request (atproto-market, following the CLI layer of CLAUDE.md: Command from
      cli-args-env, no Deno.env.get) over @publicdomainrelay/compute-request-xrpc requestCompute,
      releaseCompute and awaitComputeNetwork (plan 0005 M2-EVENT-CORE). `run request` runs it directly
      under the embedded deno (no kcp: a one-shot command should not start an apiserver), writes the
      serialized ContractState to --state-file at every event, returns at onNetwork by default, and
      `socialweb-computer run request --release --state-file <f>` submits vm.delete from the saved
      state. Everything goes through the RFP flow; nothing provisions or reaches a guest any other way.
    files: ["atproto-market/hono-compute-request/ (mod.ts, cli-args-env.json, deno.json)", "atproto-market/deno.json workspace", "deploy/ts-entries.yaml", "internal/stack/request"]
    test_first: >
      atproto-market test/compute_request_cli_test.ts: the CLI against the fakes compute_request_test.ts
      already uses writes a state file after onRfpSubmitted and onAccepted, and --release from that file
      submits exactly one vm.delete; red before the CLI exists.
    done_when: >
      test green; on the market bed, `socialweb-computer run request` against the bed's bidder reaches
      onNetwork and `--release` gets vm.delete 200 and the guest container gone.
    risks: ["Whether the requester's state should live in kcp instead of a file is asked below."]
    status: todo
    evidence: []
  - id: M4-TESTBED-PORT
    milestone: M4
    title: The market test bed driven by socialweb-computer instead of accept.sh and apply.sh
    depends_on: [M2-SERVICE-TEMPLATE, "0006:M2-APPLY"]
    decision: >
      `socialweb-computer testbed up|accept|down` reproduces accept.sh (574 lines) and apply.sh (303
      lines): embedded kcp on kernel-chosen ports (port 0 read back from the listener, never
      listen-close-rebind), OpenBao from the extracted bao in dev mode, the denoruntime set, the
      market-testbed set, and the same checks (23 at M1-TESTBED run 9). internal/marketbed's live test
      drives the subcommand. accept.sh and apply.sh are kept until the port has passed twice, then
      deleted.
    files: ["internal/stack/testbed", "internal/marketbed/live_test.go", "deploy/examples/atproto/market/accept.sh, apply.sh (deleted at the end)"]
    test_first: >
      internal/marketbed TestTheMarketTestBedRentsAFirecrackerGuestThroughTheRFPFlow switched to the
      subcommand; red until it exists.
    done_when: "two PASS readings of the live test through the subcommand, with the same check list as accept.sh run 9."
    risks: ["accept.sh's port and bed-collision guards (ports 2583-2589, plan 0005 M1-AGENT-SPLIT evidence) must come along; the subcommand refuses a second bed on the same host by a lock file."]
    status: todo
    evidence: []
acceptance:
  where: hat-8
  checks:
    - id: ACC8-OFFLINE
      text: Every service DenoPod starts with the host's network to jsr.io and registry.npmjs.org blocked, from the embedded closure alone.
      status: todo
      evidence: []
    - id: ACC8-PINNED
      text: The closure manifest names a git commit for every sibling repo, `socialweb-computer version` prints them, and a one-byte change to an extracted file is refused at the next start.
      status: todo
      evidence: []
    - id: ACC8-RESTART
      text: A systemctl kill -s KILL of the unit running socialweb-computer, then its automatic restart, brings every DenoPod its kcp records back to Running with exactly one deno process each, and no DenoPod that was deleted before the kill comes back.
      status: todo
      evidence: []
questions_for_user:
  - "deno-kcp's provider is an internal package. May we propose a public github.com/johnandersen777/deno-kcp/provider package upstream and carry it as a patch until it lands, or should socialweb-computer carry the deno-kcp-provider binary as an exec'd asset instead?"
  - "Should DenoPod processes survive a crash of the socialweb-computer process (KillMode=process, adopted on restart as execrunner already supports), or die with it and be restarted from the kcp record (the plan's default)?"
  - "Should `run request` keep the requester's ContractState in a local kcp (so `kubectl get` shows contracts) instead of a state file?"
  - "Which sibling repo branches are prod: main everywhere, or pinned commits recorded per deploy?"
  - "Is the test bed's own deno-kcp provider binary (build-provider.sh) to be retired once the in-process provider passes, or kept as an independent cross-check?"
