  - id: M2-DENOKCP-INPROC
    milestone: M2
    title: The owned deno-kcp provider running inside socialweb-computer, upgradable without touching VMs
    depends_on: [M2-DENOKCP-FORK, M1-DENO, "0006:M2-KCP-PORT0", "0006:M2-HOST-BACKEND-PROC"]
    decision: >
      Both backends (decided by the user 2026-10-12: dev run mode kcp-native now; details decided by Claude,
      user may veto): "deno processes die with the core" is proved on systemd-user (control-group kill) and
      on proc, where execrunner's children sit in their own process groups with no Pdeathsig
      (supervisor.go:141) and devsup's subreaper attribution by SWC_UNIT (M2-DENOKCP-FORK) kills them with the
      core unit. DenoPod stays its own kind (TypeScript services that die with the core); the HostProcess
      kind (0006 M2-HOSTPROCESS-KIND) generalises its reconciler shape for host processes that outlive the
      core, and a DenoPod is never placed as a HostProcess.
      internal/stack/denoruntime runs the provider in-process with: deno-bin the extracted deno, runs-dir
      <state>/denokcp/runs, the runner timeout NEGATIVE (disabled; services are long-running and a
      DenoPod that wants a limit sets activeDeadlineSeconds), and the kcp client config internal/kcpserver
      hands back (the kcp front URL with the shard-admin context, 0006 M2-KCP-SLOTS; never the per-start
      kcp-admin token, so a kcp slot roll does not invalidate it). Upgrade semantics (decided by the user 2026-10-07: the core binary and
      its deno processes are upgradable while VMs keep running; decided by the user 2026-10-11: the core runs
      as a user unit of a lingering account): deno processes are plain children in the core unit's cgroup
      and die with it on any stop, restart or crash of the core (default KillMode=control-group; linux-proofs
      E1-neg: plain children die on restart, kill -9 and stop); on start the provider finds every DenoPod
      whose status.runID names no live process and restartPolicy Always starts it again from the new closure.
      Nothing that holds a VM is a deno process (each VM is its own transient service, plan 0007
      M2-VM-RUNTIME), so restarting every deno process never touches a VM.
    files: ["internal/stack/denoruntime/"]
    test_first: >
      Behind livegate: TestADenoPodAppliedToTheKcpRunsOnTheEmbeddedDeno and
      TestAnUpgradeRestartsEveryRecordedDenoPodOnTheNewClosureExactlyOnce (run the stack as a user unit
      under a test prefix; three cases: `systemctl --user restart` of the unit, `kill -9` of its main
      process, and `upgrade` to a build with a different closure sha256: every DenoPod Running on the new
      code, one deno process each, no deleted DenoPod returns, no deno process of the old unit left); on proc
      in a dev instance: TestAKilledCoreLeavesNoDenoProcessOnTheProcBackend (kill -9 of the core unit's main
      process and `dev restart core`). Red first.
    done_when: "both green on hat-8 on systemd-user and on proc."
