  - id: M4-RUN-REQUEST
    milestone: M4
    title: socialweb-computer run request, contracts held as ComputeContract objects in kcp
    depends_on: [M1-TS-CLOSURE, "0006:M2-KCP-PORT0", "0006:M2-APPLY"]
    decision: >
      Principle (user 2026-10-12, 0006 `principle`): a `run request` is an application instance - its own
      kcp, the requester manifest set, a profile - and meets bidders only over the atproto market protocol.
      Decided by the user 2026-10-07: run request keeps its state in kcp objects. Kind ComputeContract
      (socialweb.computer/v1alpha1, export computecontracts, apigen) with spec {vm request, bidder
      allow/deny lists, policy refs, keepUntil} and status.contract = the same ContractState fields
      NodeClaim.status.contract carries (plan 0005 M2-CODEGEN), so the requester core writes one shape for
      both. `run request` starts a kcp on port 0 (0006:M2-KCP-PORT0) under ~/.local/state/socialweb-computer and a
      DenoPod (or, for a one-shot, a deno child) running a thin CLI hono-compute-request in atproto-market
      (CLAUDE.md CLI layer) over compute-request-xrpc requestCompute, awaitComputeNetwork and
      releaseCompute; every handler awaits a status write (the M2-CLAIM-RECEIPT pattern). Subcommands:
      run request [--wait onNetwork], run request list, run request release <name>, run request resume
      <name> (a restarted CLI resumes a contract from its object, including one accepted before the
      restart). Everything goes through the RFP flow.
    files: ["api/v1alpha1/computecontract_types.go", "atproto-market/hono-compute-request/", "atproto-market/lib (a ComputeContract store over kcp REST, beside the door's nodeclaim-kcp)", "internal/stack/request", "deploy/ts-entries.yaml"]
    test_first: >
      atproto-market test/compute_request_cli_test.ts: against fakes, the CLI writes status.contract at
      onRfpSubmitted, onAccepted and onReceipt, and `release` from a fresh process submits exactly one
      vm.delete from the object; red first.
    done_when: "test green; on the market bed `run request` reaches onNetwork, `run request list` shows it, `release` gets vm.delete 200 and the guest is gone."
    risks: []
    status: todo
    evidence: []
  - id: M4-TESTBED-PORT
    milestone: M4
    title: The market test bed driven by socialweb-computer instead of accept.sh and apply.sh
    depends_on: [M2-SERVICE-TEMPLATE, M1-BED-PARALLEL, "0006:M2-APPLY", "0006:M2-KCP-PORT0", "0006:M1-DEV-INSTANCE", "0006:M2-BOOTSTRAP-LAYER", "0006:M2-HOSTPROCESS-KIND"]
    decision: >
      Principle (user 2026-10-12): the bed is the seed of the application-instance model - a composition of
      application instances (its atproto network, bidders each with their own PDS pod under the bed profile,
      requesters) brought up by applying manifest sets, each instance talking to the others only over the
      market protocol; how its services split into instances is pending multi-server-to-kcp.md (fold
      pending). Third fold 2026-10-12 (decided by the user: dev run mode kcp-native now; drop the fixed ports 2583-2589
      and the one-bed lock): `testbed up` = `dev up --profile bed` (0006 M1-DEV-INSTANCE, M2-BOOTSTRAP-LAYER:
      the instance's own kcp on kine -> postgres behind a port-0 front, host-backend=proc), then the bed's
      sets; every bed service port renders to 0 and is read back from the service's onListen report (the
      leases of M1-BED-PARALLEL are kept only for ports that must be stable within a run); there is no lock
      file and no one-bed rule; N beds run on one host, one per dev instance.
      `socialweb-computer testbed up|accept|down`: kcp on port 0 (0006:M2-KCP-PORT0), an OpenBaoServer object for the bed's dev vault, the denoruntime and market-testbed sets, the
      same checks as accept.sh run 9. The bed's bidder is `run bidder` (0007 M5-RUN-BIDDER) and its guests
      come up only through the requester's RFP, bid, accept and cloud-init. Decided by Claude, user may veto
      (2026-10-11): every unit a bed starts is named socialweb-bed-<runid>-... so no production prefix
      (socialweb-vm-<hid>-, socialweb-bao-, socialweb-pg-, socialweb-cluster-) ever matches it, and a bed on
      hat-8 never adopts, audits or garbage-collects a real bidder's units on the same account (or the
      reverse); under proc the bed's units are its own devsup's, which already separates them. accept.sh and
      apply.sh are deleted after two passes.
    files: ["internal/stack/testbed", "internal/marketbed/live_test.go", "deploy/examples/atproto/market/accept.sh, apply.sh (deleted at the end)"]
    test_first: "TestTheMarketTestBedRentsAFirecrackerGuestThroughTheRFPFlow switched to the subcommand; TestTwoBedsOnOneHostEachRentAGuestThroughTheRFPFlow through `testbed up` in two dev instances (two requesters, two bidders; guests only via runComputeContract); red until it exists."
    done_when: "two PASS readings through the subcommand with accept.sh run 9's check list, and one two-bed reading on hat-8 (UTC); 0006 M1-NO-FIXED-PORTS' ratchet holds no testbed entry."
    risks: []
    status: todo
    evidence: []
