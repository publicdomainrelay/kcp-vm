queued: >
  QUEUED. Plan 0005 is complete (2026-10-10, NEXT.yaml P5), but the user paused plans 0006, 0007 and 0008
  while they are refined; no item below moves to doing until the user says so. Its items also wait on the
  plan 0006 items named in depends_on.
source: >
  Split out of plan 0006 (same user request of 2026-10-07): Go and TypeScript are both first class in
  socialweb-computer. The binary carries a pinned deno and the TypeScript codebase; every long-running
  TypeScript service runs as a DenoPod reconciled by a deno-kcp provider that this repo now owns (the
  user decided to fork and vendor deno-kcp); kcp records which services run, and the core binary and its
  deno processes can be upgraded while VMs keep running.
state_rules:
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, hat-8 or prod readings with UTC timestamps).
  - Open items are mirrored in NEXT.yaml (P8-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user; one marked
    "decided by the user 2026-10-07" or "decided by the user 2026-10-11" was.
  - >
    RFP flow is the spine (org-root CLAUDE.md). The market bed's guests come up only through `run bidder`
    and the requester's RFP, bid, accept and cloud-init user_data; no item boots a guest any other way.
  - >
    Linux only (decided by the user 2026-10-11). OS-specific process code (Setpgid, Pdeathsig) lives in
    GOOS-tagged files; darwin and windows stubs return ErrUnsupported until plans 0012 and 0011, and
    0006:M0-XOS-GATE keeps both building and vetting.
  - An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment, the vendored deno-kcp test bed, the
    atproto-market requester libraries, and (decided by the user 2026-10-07) the forked copies of
    deno-kcp and kcp-libs this plan brings into the repo. hono-compute-provider and atproto-market may
    be changed by commit; never pushed.
  not_owned: >
    The market protocol records and lexicons; the core architecture (nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data).
