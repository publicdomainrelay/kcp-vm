  - id: M1-DENOPOD-RUNNER-WINDOWS
    milestone: M1
    title: The forked DenoPod runner on Windows - a job object per run, identity by creation time
    depends_on: [M0-GATE, "0008:M2-DENOKCP-FORK"]
    decision: >
      The runner's process-group code (kcp-libs supervisor.go:141 Setpgid, :156/:322 SIGKILL of the group,
      :249-268 recovery by pid and start ticks) gets a windows file: each run is a process created
      suspended, assigned to its own job object (JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE), then resumed; stop
      is TerminateJobObject; recovery uses internal/hostos.ProcStart (GetProcessTimes creation time). Every
      per-run job is nested in the bidder service's own kill-on-close job (M2-BIDDER-SERVICE-WINDOWS), so a
      crash of the core binary kills every deno process and no VM (VMs are not in any job of ours).
    files: ["internal/kcplibs/impl/execrunner/supervisor_windows.go (or the landed fork path)", "internal/hostos/job_windows.go"]
    test_first: "Windows livegate: TestAKilledRunnerParentTakesEveryDenoChildWithIt and TestARunIsRecoveredByPidAndCreationTime. Red first (today the package does not build for windows)."
    done_when: "GOOS=windows build of the runner green; both tests green on the Windows host."
    risks: ["Deno on Windows spawns its own subprocesses rarely; any it spawns inherit the job unless CREATE_BREAKAWAY_FROM_JOB is allowed, which the job forbids."]
    status: todo
    evidence: []
  - id: M1-HOSTUNIT-SCM
    milestone: M1
    title: The host-unit seam on Windows - install-time SCM services started and stopped by the bidder
    depends_on: [M0-GATE, "0006:M2-HOST-UNITS"]
    decision: >
      On Linux the host-unit seam starts transient systemd units at runtime. On Windows VMs need no host
      unit (HCS owns them), and the only other long-lived child of a bidder is its OpenBao
      (0007:M4-BIDDER-VAULT). Creating SCM services at runtime needs SC_MANAGER_CREATE_SERVICE, which a
      non-admin identity lacks, so (decided by Claude, user may veto) the installer creates
      socialweb-computer-vault-<handle> once (ImagePath = the extracted bao under runtime/<sha256>/, its
      own virtual account), with a service DACL granting the bidder's account start, stop and query; the
      windows backend of the seam maps Start/Stop/Inspect onto those pre-installed services and refuses
      any unit it was not installed with, naming the installer command. A bao asset change re-points the
      ImagePath through the same elevated upgrade path as M2-BINARY-UPGRADE-WINDOWS.
    files: ["internal/hostsvc/scm_windows.go (or the landed seam package)", "internal/hostsvc/scm_windows_test.go"]
    test_first: "Windows livegate: TestThePreinstalledVaultServiceOutlivesTheBidderAndIsAdopted; offline: TestAnUninstalledUnitIsRefusedNamingTheInstaller. Red first."
    done_when: "Both green; the bidder's vault survives a TerminateProcess of the bidder with its KV readable after."
