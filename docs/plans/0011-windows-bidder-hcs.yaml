  - id: M1-GUEST-IMAGE-HV
    milestone: M1
    title: The guest kernel, initramfs and rootfs for Hyper-V, built on Linux, carried as windows-only assets, written to VHDs in pure Go
    depends_on: [M0-GATE, "0006:M1-ASSETS", "0007:M2-BACKPORT"]
    decision: >
      A Windows host has no Linux kernel to copy (cmd/socialweb-nodeimage/main.go:42-45), so the guest
      image is built by the release build on Linux and embedded only in the windows/amd64 binary (0006's
      per-OS asset pipeline): an x86_64 kernel with the Hyper-V drivers built in (the M0 config), the
      initramfs whose init waits for the root by label (not /dev/vda), and the rootfs tar (the same
      preinstall manifest 0007 inventoried, M1-FC-INVENTORY). On the host, the controller converts the
      rootfs tar to an ext4 VHD once per image fingerprint under runtime/<sha256>/ and writes the
      per-guest cidata VHD with tar2ext4; a guest's rootfs is a copy (differencing VHDX through
      virtdisk.dll is a later optimisation, recorded, not built). Whether this kernel is a separate
      hypervisor target or one multi-driver x86_64 kernel shared with firecracker/qemu is the user's
      question; until answered, a separate target (decided by Claude, user may veto).
