  - id: M2-BIDDER-SERVICE-WINDOWS
    milestone: M2
    title: run bidder as a Windows service, its deno children dying with it, its VMs not
    depends_on: [M1-VMHOST-HCS, M1-NETWORK-HNS, M1-GUEST-IMAGE-HV, M1-DENOPOD-RUNNER-WINDOWS, M1-HOSTUNIT-SCM, "0007:M5-RUN-BIDDER"]
