  - id: M2-INSTALLER-WINDOWS
    milestone: M2
    title: One elevated install step - features, account, group, HNS network, firewall, Defender, services
    depends_on: [M2-BIDDER-SERVICE-WINDOWS]
    decision: >
      `socialweb-computer install bidder --handle <h>` run once from an elevated prompt (the user's
