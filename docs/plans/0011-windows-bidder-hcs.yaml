plan: 0011-windows-bidder-hcs
written: 2026-10-11
queued: >
  QUEUED. Starts only after plan 0006 (docs/plans/0006-socialweb-computer-unified-binary.yaml) and plan
  0007 (docs/plans/0007-compute-provider-kcp.yaml) are complete on Linux, every item done with evidence
  and their acceptance checks ACC6-* and ACC7-* recorded, and after the plan 0008
  (docs/plans/0008-embedded-deno-and-typescript-denopods.yaml) items M1-DENO, M1-TS-CLOSURE,
  M2-DENOKCP-FORK, M2-DENOKCP-INPROC, M2-SERVICE-TEMPLATE and M4-TESTBED-PORT are done. Then M0-REVISIT
  runs first; no other item may move to doing before it is done. Every item is executed ON a Windows
  host (decided by the user 2026-10-11); the executor works on that host, not on hat-8.
source: >
  The user's decisions of 2026-10-09..11: macOS and Windows bidder work is deferred out of plans 0006,
  0007 and 0008 into their own plans (this one for Windows, 0012 for macOS). Plans 0006 and 0007 build the
  cross-OS seams on Linux: Go interfaces, GOOS build-tagged files, and per-OS embedded assets compiled in
  only for the target OS. Expected seam names (they may differ as landed; M0-REVISIT reconciles): a VM
  host/runtime interface (Start, Inspect returning a Verdict Running|Lost|Unknown, Stop with a grace,
  List by owner) with one backend per OS; a host-unit/service-manager interface; an OS-neutral
  ComputeVM status.runtime {backend, ref, instance, pid?, startTime?}; a content-addressed binary install
  versions/<sha256>/; asset dirs runtime/<sha256>/ garbage-collected only when nothing references them.
  Headless servers only. A VM survives a crash or upgrade of the core binary and any logout; a host
  reboot makes every VM Lost, replaced through a new RFP. The mechanism is the native one per OS. The
  invariant: no socialweb-computer code is in a running VM's process tree; the OS service manager or VMM
  owns the VM directly. On Windows that is an HCS compute system created with
  ShouldTerminateOnLastHandleClosed=false and no helper process; our code only does one-shot preparation
  (disks, network endpoint, the create call) and later opens, inspects and stops the system by id. All
  code, docs, architecture and plan items are changeable; the best solution wins.
state_rules:
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, readings from the Windows host with UTC timestamps, the host's Windows edition and build
    named in each reading).
  - Open items are mirrored in NEXT.yaml (P11-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user; one marked
    "decided by the user 2026-10-11" was.
  - An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>.
  - >
    M0-REVISIT must run before any other item moves to doing, and must be redone (its status back to
    doing, every item that depends on it re-checked) whenever plan 0006, 0007 or 0008 changes a seam,
    the ComputeVM schema, the asset pipeline, the controller or the install/upgrade flow after
    M0-REVISIT's recorded commit SHA.
  - >
    RFP flow is the spine (org-root CLAUDE.md). Every test or spike that needs a live guest drives the
    requester (runComputeContract) against a real local bidder through RFP, bid, accept and cloud-init
    user_data. No test, spike or code boots a guest any other way: no hand-made compute system, no
    hand-attached VHD, no hand-written authorized_keys. Zero ssh sessions to any guest.
ownership:
  owned: >
    All code in socialweb-computer-kcp (including the Windows backends and build-tagged files this plan
    adds), the forked kcp, deno-kcp and kcp-libs copies plans 0006 and 0008 vendor, and the Windows host
    the user provides for this plan. hono-compute-provider and atproto-market may be changed by commit;
    never pushed.
  not_owned: >
    The market protocol records and lexicons, and the core architecture: nodes and guests only ever born
    through requester -> RFP -> bid -> accept -> cloud-init user_data, reached only through the relay.
    Windows itself (vmcompute, HNS, SCM behaviour) is measured, never patched.
research:
  measured_on: >
    2026-10-11 on hat-8 (Linux) from this repo at f0460fd (main) and from published documentation only.
    NOTHING in this block was observed on a Windows host; every Windows behaviour below is a claim the
    M0 items measure. The lifecycle notes this plan was to be written from (scratchpad
    lifecycle-windows.md, lifecycle-synthesis.md, lifecycle-linux.md) were not on disk when it was
    written; M0-REVISIT re-reads whatever 0006/0007 recorded in their place.
  in_repo_today:
    - "internal/hostos already has a Windows half: proc_windows.go:23-40 process identity from OpenProcess + GetProcessTimes creation time, :62 Alive, :100 Terminate; lock_windows.go:19 LockFileEx; portrange_windows.go:21 netsh dynamic port range; sysproc_windows.go:18 DieWithParent has no Pdeathsig equivalent"
    - "docs/ARCHITECTURE.md:2223-2280 (The host platform): the Windows column is design and cross-compilation only (GOOS=windows go build ./... and go vet clean), no Windows binary has ever run; the gateway-side node substrate on Windows is qemu with -machine q35,accel=whpx:tcg and slirp networking. That is the clusterprovider's own node substrate, not a market bidder, and this plan does not change it."
    - "internal/portscan/scan_windows.go:1-15 shells out to netstat -ano"
    - "cmd/socialweb-nodeboot/main.go:37-38 the user_data reaches a firecracker guest on a second read-only ext4 disk labelled cidata (cloud-init NoCloud); :457 seed dir /var/lib/cloud/seed/nocloud"
    - "cmd/socialweb-nodeinit/main.go:14-16 the guest's PID 1 loads the transport module and waits for /dev/vda; under Hyper-V the SCSI disks arrive through hv_storvsc as /dev/sd*, so the init's device wait is per hypervisor"
    - "cmd/socialweb-nodeimage/main.go:42-45 the image builder extracts THIS host's own kernel and module tree; a Windows host has neither, so a Windows bidder's guest kernel and rootfs must be built elsewhere and carried as assets"
    - "kcp-libs impl/execrunner/supervisor.go:141 SysProcAttr{Setpgid: true}: the DenoPod runner does not compile for GOOS=windows (syscall.SysProcAttr has no Setpgid there), so plan 0008's forked runner needs a Windows half before run bidder can exist on Windows"
    - "atproto-market lib/common/cloud-init-common/mod.ts:110 UserDataModule, :135-153 the registry, :1225-1231 the registered modules; the guest-side modules detect arch with uname -m (:487-494, :739-746, :1101-1108), so an amd64 Windows guest is the arch every module already serves"
    - "atproto-market lib/requester-xrpc/mod.ts:881 runComputeContract; atproto-market/test/bidder_container_integration_test.ts:132 the canonical local harness (local dispatcher, fake PLC, bidder, requester)"
    - "atproto-market lexicons/com/publicdomainrelay/temp/compute/vm.json:19-45 compute.vm has cpus, mem, disk, network, location, role, user_data and NO arch field"
  hcs:
    - "HCS ComputeSystem document carries Owner and ShouldTerminateOnLastHandleClosed (hcsshim internal/hcs/schema2/compute_system.go; https://learn.microsoft.com/en-us/virtualization/api/hcs/schemareference). hcsshim's own utility VMs set ShouldTerminateOnLastHandleClosed: true (hcsshim internal/uvm/create.go:413) and default Owner to the executable name (:230-246), so the false setting this plan depends on is not the path hcsshim exercises."
    - "Chipset.LinuxKernelDirect {KernelFilePath, InitRdPath, KernelCmdLine}, schema 2.2 (https://learn.microsoft.com/en-us/virtualization/api/hcs/schemareference#LinuxKernelDirect); WSL2 boots its kernel this way and attaches ComPorts 0 and 1 to named pipes (microsoft/WSL src/windows/service/exe/WslCoreVm.cpp, read 2026-10-10)"
    - "HcsOpenComputeSystem(id, requestedAccess, &handle) re-attaches to an existing system by id (https://learn.microsoft.com/en-us/virtualization/api/hcs/reference/hcsopencomputesystem); HcsEnumerateComputeSystems takes a query (hcsshim internal/vmcompute: vmcompute.HcsEnumerateComputeSystems), which is how a restarted bidder lists what it owns"
    - "HcsGrantVmAccess adds an ACL entry for the VM's per-system virtual account to a file (https://learn.microsoft.com/en-us/virtualization/api/hcs/reference/hcsgrantvmaccess): every VHD and the kernel/initrd must be granted, or the worker cannot open them"
    - "HcsCreateComputeSystem's securityDescriptor parameter is reserved and must be NULL (https://learn.microsoft.com/virtualization/api/hcs/reference/HcsCreateComputeSystem); who may call it is decided by the vmcompute service's own access check, which no document states for a Hyper-V Administrators member who is not an Administrator. Podman v6 runs Hyper-V machines for Hyper-V Administrators members after a one-time admin registry setup, but through WMI/VMMS (libhvee), not HCS (https://blog.podman.io/?p=21919, https://github.com/containers/libhvee). Unproven for HCS: M0-HCS-ACCOUNT."
    - "hcsshim ext4/tar2ext4 writes an ext4 image from a tar in pure Go and can append a VHD footer (https://github.com/microsoft/hcsshim/blob/main/ext4/tar2ext4/tar2ext4.go), so rootfs and cidata VHDs need no mkfs.ext4 on Windows"
  hns:
    - "HNS/HCN: networks, endpoints, namespaces and policies through a JSON-schema C API; the service checks the ACL against the caller's token (https://learn.microsoft.com/en-us/windows-server/networking/technologies/hcn/hcn-top, https://learn.microsoft.com/en-us/virtualization/api/hcn/hns_schema). Network types include NAT and ICS (hcsshim hcn/hcnnetwork.go); flag EnableNonPersistent (8) makes a network vanish at reboot."
    - "WinNAT allows a limited number of NAT internal prefixes per host, and WSL2 and Docker Desktop each create one; a collision with an existing prefix is the expected failure (measured in M0-HNS-NETWORK, not assumed)."
  windows_services:
    - "Virtual accounts NT SERVICE\\<service> need no password and are local managed accounts (https://learn.microsoft.com/en-us/windows/security/identity-protection/access-control/service-accounts); golang.org/x/sys/windows/svc implements a service; golang.org/x/sys/windows/svc/mgr installs one"
    - "Job objects with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE terminate every process in the job when the last handle closes (https://learn.microsoft.com/en-us/windows/win32/procthread/job-objects): the Windows equivalent of deno children dying with the bidder"
    - "A running .exe cannot be overwritten or deleted on Windows; it can be renamed. versions/<sha256>/socialweb-computer.exe plus an SCM ImagePath change avoids touching the running file."
items:
  - id: M0-REVISIT
    milestone: M0
    title: Re-read what 0006, 0007 and 0008 actually landed and amend this plan to match before anything else
    depends_on: []
    decision: >
      Decided by the user 2026-10-11: everything is changeable and the plan follows what landed, not what
      was expected. Before any execution, on the Windows host's checkout: re-read the status and evidence
      of every item of plans 0006, 0007 and 0008, docs/ARCHITECTURE.md (at least sections 5, 9 The host
      platform, 12, 13), NEXT.yaml, and the code as landed: the VM host/runtime seam (its interface,
      Verdict type, Stop grace, List by owner), the host-unit/service-manager seam, the GOOS build-tagged
      files and which ones are stubs for windows, the per-OS asset pipeline (internal/assets, how a
      windows-only asset is staged and pinned in versions.json), the ComputeVM schema (status.runtime and
      its field managers), the ComputeVM controller's re-population rule, the install and upgrade flow
      (versions/<sha256>/, GC of runtime/<sha256>/), the DenoPod runner, the market test bed command and
      plan 0006 M0-SIZE-BUDGET's platform matrix (it said darwin carries client modes only and named no
      windows target; both are superseded by the user's 2026-10-11 decisions). Then amend THIS file: item
      ids, decisions, depends_on (cross-plan ids to the real landed ids), files (real package paths) and
      the acceptance checks, so every later item names code that exists. Anything 0006/0007 left
      Linux-only that a Windows backend needs (an interface method, a schema field) is written as a new
      item here, not patched in silently.
    files: ["docs/plans/0011-windows-bidder-hcs.yaml (this file)"]
    test_first: >
      None (reconciliation). The reading is a diff of this file before and after, plus `GOOS=windows
      GOARCH=amd64 go build ./... && go vet ./...` on the landed tree (expected green with stubs) and a
      list of every symbol in the seams that has no windows implementation.
    done_when: >
      This file amended and committed; evidence names the socialweb-computer-kcp commit SHA (and the
      hono-compute-provider and atproto-market SHAs) it was checked against, the list of renamed or added
      items, and the windows stub list.
    risks:
      - "If 0006/0007 change after this ran, the state rule sends this item back to doing; the evidence keeps every SHA it was run against."
    status: todo
    evidence: []
  - id: M0-HOST-BASELINE
    milestone: M0
    title: Record the Windows host and run the landed binary's non-VM modes on it
    depends_on: [M0-REVISIT]
    decision: >
      Read and record: Windows edition, version and build (winver, Get-ComputerInfo), CPU virtualization
      and SLAT, which optional features are enabled (Microsoft-Hyper-V-All, VirtualMachinePlatform,
      HypervisorPlatform, Containers), vmcompute, vmms and hns service states and file versions, whether
      WSL2 or Docker Desktop is installed and the NAT prefixes they hold (Get-NetNat), Defender state,
      the BitLocker state, and the group membership of the executor's account. Then build the landed tree
      for windows/amd64 on this host and run, as an unprivileged user: `version --json`, `check-host`,
      in-process kcp on port 0 with its OnListen ports (0006:M2-KCP-PORT0), the embedded deno (0008:M1-DENO)
      running one fixture entry with --cached-only, an OpenBaoServer object (0006:M2-OPENBAO-SERVER) with
      the windows bao asset, and one DenoPod through the forked runner. Each that fails is an item added
      here by name. Fallback if in-process kcp's embedded etcd does not run on Windows: record the error
      and add an item for etcd as a separate embedded child (an etcd windows/amd64 release asset) with the
      same OnListen contract; decided by Claude, user may veto.
    files: ["evidence only; new items appended to this file for every failure"]
    test_first: "None (measurement). The reading is each command's output and exit status with UTC timestamps."
    done_when: "Host record committed in evidence; each of the five non-VM modes recorded as works or fails-with-item."
    risks:
      - "Windows Home has no Hyper-V role but has VirtualMachinePlatform (what WSL2 uses); whether HCS VM creation works with only VirtualMachinePlatform is recorded here because it decides which editions the installer accepts."
      - "The DenoPod runner (kcp-libs supervisor.go:141 Setpgid) is expected to fail to build for windows; that becomes M1-DENOPOD-RUNNER-WINDOWS, not a blocker for the M0 spikes, which may run the bidder's deno as a plain child in the scratch branch."
    status: todo
    evidence: []
  - id: M0-SCRATCH-BACKEND
    milestone: M0
    title: A scratch-branch HCS backend behind the landed VM host seam, renting one guest through the RFP flow
    depends_on: [M0-HOST-BASELINE]
    decision: >
      The live spikes need a guest, and a guest is only ever born through the RFP flow (org-root
      CLAUDE.md), so this item builds the smallest HCS backend that lets `socialweb-computer run bidder`
      on this host win an RFP and boot the guest from its cloud-init user_data. Scratch branch only;
      nothing here is merged; M1 items rebuild it test-first. Content: a guest kernel (x86_64, Hyper-V
      drivers built in: CONFIG_HYPERV, CONFIG_HYPERV_STORAGE (hv_storvsc), CONFIG_HYPERV_NET (hv_netvsc),
      CONFIG_HYPERV_VSOCKETS, CONFIG_SERIAL_8250 console, ext4 built in) built on hat-8 from the kernel
      source the Linux image pipeline uses; the rootfs from the Linux image pipeline converted to an ext4
      VHD by hcsshim ext4/tar2ext4 on this host; the cidata seed (user-data, meta-data) written by the same
      pure-Go path; a compute system document with Owner socialweb-computer-<handle>,
      ShouldTerminateOnLastHandleClosed false, Chipset.LinuxKernelDirect, two SCSI attachments, one network
      adapter on an HNS endpoint, ComPorts 0 to a named pipe; HcsGrantVmAccess on every file. Driven by
      runComputeContract against the market bed or, if the bed does not yet run on Windows (M0-HOST-BASELINE),
      against the canonical harness shape of atproto-market/test/bidder_container_integration_test.ts with
      the bidder pointed at its local dispatcher. The guest reaches onNetwork and the requester's tunnel
      answers; zero ssh.
    files: ["scratch branch only: internal/vmhost (hcs scratch backend), the kernel config, the disk writer; evidence names the branch and SHA"]
    test_first: >
      The live rent itself: the requester's runComputeContract onNetwork callback fires within the boot
      timeout, the guest's cloud-init log (read from the COM1 pipe) shows every module of the user_data
      finished, zero ssh sessions. Recorded red first (e.g. the kernel without hv_storvsc built in hangs
      waiting for its root) and then green.
    done_when: "One guest rented through the RFP flow on this host reached onNetwork and was released with vm.delete 200; boot time and the guest's console log recorded."
    risks:
      - "cmd/socialweb-nodeinit/main.go:14-16 waits for /dev/vda; under Hyper-V the root arrives as /dev/sda. The scratch init waits for the disk by label, which M1-GUEST-IMAGE-HV makes the rule."
      - "If LinuxKernelDirect is refused on this build (schema 2.2), the fallback is UEFI boot from the rootfs VHD with the kernel inside it (WslCoreVm.cpp's other path); recorded and taken into M1-GUEST-IMAGE-HV."
    status: todo
    evidence: []
  - id: M0-HCS-ACCOUNT
    milestone: M0
    title: Can a non-admin member of Hyper-V Administrators create, open and stop HCS compute systems and HNS endpoints
    depends_on: [M0-SCRATCH-BACKEND]
    decision: >
      Measure, with the scratch bidder of M0-SCRATCH-BACKEND run as each candidate identity in turn:
      (a) a virtual account NT SERVICE\socialweb-computer-bidder-<handle> added to Hyper-V Administrators
      and nothing else, (b) a plain local user in Hyper-V Administrators, (c) LocalSystem. For each:
      HcsEnumerateComputeSystems, HcsCreateComputeSystem (through a real RFP rent), HcsOpenComputeSystem,
      HcsShutdownComputeSystem/HcsTerminateComputeSystem, HcsGrantVmAccess, HcnCreateEndpoint and
      HcnDeleteEndpoint on an existing network, HcnCreateNetwork. Record each HRESULT. The preferred
      outcome is (a) for everything except HcnCreateNetwork, which the installer does once as admin.
      Fallback decisions if (a) fails: first, LocalSystem for the bidder service with every deno child
      started under a restricted token (CreateRestrictedToken dropping Administrators and SeDebug, a low
      integrity level, inside the kill-on-close job) so TypeScript never runs as SYSTEM; second, if HCS is
      unusable without admin and LocalSystem is refused by the user, the WMI/VMMS path (Msvm_* through
      libhvee's shape) with persistent VMs that a startup sweep deletes after a reboot so reboot = Lost
      still holds. Which fallback was taken is recorded and asked of the user (questions_for_user).
    files: ["evidence only (HRESULT table per identity)"]
    test_first: "None (measurement). The table is the reading: identity x call -> HRESULT, with the UTC time and Windows build."
    done_when: "The table is complete for all three identities and the chosen identity is written into M2-INSTALLER-WINDOWS and M2-BIDDER-SERVICE-WINDOWS."
    risks:
      - "Membership changes need a new logon token: a service must be restarted, a user must log off and on, before a membership reading counts."
    status: todo
    evidence: []
  - id: M0-HCS-SURVIVAL
    milestone: M0
    title: A compute system with ShouldTerminateOnLastHandleClosed=false outlives its creator; what vmcompute restart does
    depends_on: [M0-SCRATCH-BACKEND]
    decision: >
      With a guest rented through the RFP flow by the scratch bidder: (1) TerminateProcess the bidder
      (taskkill /F /PID) and read, every 5 s for 10 minutes, the compute system's State and RuntimeId from
      a fresh HcsOpenComputeSystem in another process, plus the guest's onNetwork heartbeat and the
      requester's tunnel; (2) repeat with the bidder stopped through SCM; (3) Restart-Service vmcompute
      while the guest runs and record whether the system, its RuntimeId and its vmwp.exe survive, and
      whether HcsOpenComputeSystem still works after; (4) Restart-Service hns and record the endpoint and
      the guest's network. Fallback if (1) fails (the system dies with its creator): the VM's owner becomes
      a dedicated, install-time SCM service per bidder whose only code is the create call and a handle
      held open (this breaks the 'no socialweb code in the VM's tree' invariant and is asked of the user
      before it is built); if (3) kills guests, a vmcompute restart is treated like a reboot (every
      ComputeVM Lost) and documented.
    files: ["evidence only"]
    test_first: "None (measurement). Readings: state/RuntimeId timeline across each event, UTC timestamps."
    done_when: "Each of the four events has a recorded outcome; the Verdict mapping for M1-VMHOST-HCS is written from them."
    risks: ["vmcompute restart may be refused while systems run; the refusal is the reading."]
    status: todo
    evidence: []
  - id: M0-HCS-IDENTITY
    milestone: M0
    title: Re-attach by id, list by Owner, and what makes a VM 'the same VM' across a bidder restart
    depends_on: [M0-SCRATCH-BACKEND]
    decision: >
      Measure: HcsEnumerateComputeSystems with a query naming Owners [socialweb-computer-<handle>] returns
      exactly this bidder's systems and none of WSL's or Docker's; HcsGetComputeSystemProperties returns
      RuntimeId, State and Owner; RuntimeId is stable across a bidder restart and changes if a system with
      the same Id is recreated. Decision this item writes (decided by Claude, user may veto):
      status.runtime = {backend: hcs, ref: <compute system Id, a GUID the controller chooses and records
      before the create call>, instance: <RuntimeId>}; pid and startTime are omitted on Windows because the
      worker process is not ours. Verdict: Running iff open succeeds AND Owner matches AND RuntimeId equals
      status.runtime.instance AND State is Running; Lost iff open returns 'not found' or RuntimeId differs
      or State is Stopped; Unknown on any other error (access denied, vmcompute unavailable), which the
      controller retries and never turns into a release.
    files: ["evidence only; the Verdict table is copied into M1-VMHOST-HCS's decision"]
    test_first: "None (measurement)."
    done_when: "Enumerate/open/properties outputs recorded before and after a bidder restart; Verdict table recorded."
    risks: []
    status: todo
    evidence: []
  - id: M0-HNS-NETWORK
    milestone: M0
    title: An HNS NAT network for guests, an endpoint per guest, tenant isolation, and coexistence with WSL and Docker
    depends_on: [M0-HCS-ACCOUNT]
    decision: >
      Measure: HcnCreateNetwork of type NAT with a /24 the installer chooses (refusing a prefix any
      existing Get-NetNat or HNS network holds), with and without EnableNonPersistent; who may create it
      (M0-HCS-ACCOUNT's table); an endpoint per guest created at Start and deleted at Stop versus an
      install-time endpoint pool; whether two RFP-born guests on the same NAT network reach each other
      (tenant isolation) and whether an endpoint ACL policy (HNS ACL policy, Action Block, RemoteAddresses
      the network's prefix except the gateway) stops it; which host address a guest dials to reach the
      bidder's services (the NAT gateway address; the bidder's onNetwork, OIDC issuer and JSR listeners
      must bind it, and pointGuestAtHost from compute-provider-common must name it); and the Windows
      Firewall rule needed for guest -> gateway traffic. With WSL2 and Docker Desktop present and running,
      record whether our network coexists. Fallback if isolation by ACL fails: one NAT network per guest
      (prefix pool), or the ICS network type; recorded.
    files: ["evidence only"]
    test_first: "None (measurement): guest A -> guest B probe result (from cloud-init runcmd output of RFP-born guests, read on the COM pipe), guest -> gateway result, before and after the ACL."
    done_when: "Network creation privilege, isolation result, the guest's host address and the coexistence result recorded; the network decision written into M1-NETWORK-HNS."
    risks:
      - "A probe between two guests needs both born through the RFP flow, with the probe in their user_data; no ssh into either."
    status: todo
    evidence: []
  - id: M0-COM-CONSOLE
    milestone: M0
    title: The guest console on a COM-port named pipe, reconnected after the core binary restarts
    depends_on: [M0-HCS-SURVIVAL]
    decision: >
      Measure: ComPorts 0 bound to \\.\pipe\socialweb-vm-<id>-com1; the bidder connects as the pipe
      client and writes console lines to <workDir>/console.log; after TerminateProcess of the bidder and
      its restart, can a new client connect to the same pipe of the running VM, and is output written
      while nobody was connected lost or buffered? Decision if reconnect works: the controller reconnects
      at re-population. If it does not: console output after a core restart is lost until the guest's next
      reboot (which never happens; a Lost VM is replaced), and the console is diagnostics only; asked of the
      user (questions_for_user).
    files: ["evidence only"]
    test_first: "None (measurement)."
    done_when: "Reconnect outcome and the size of the gap recorded."
    risks: []
    status: todo
    evidence: []
  - id: M0-BINARY-SWAP
    milestone: M0
    title: Upgrading a running service whose exe is locked, through versions/<sha256>/ and the SCM ImagePath
    depends_on: [M0-HCS-SURVIVAL, M0-HCS-ACCOUNT]
    decision: >
      With the scratch bidder installed as an SCM service at versions/<sha A>/socialweb-computer.exe and a
      guest rented: write versions/<sha B>/socialweb-computer.exe, ChangeServiceConfig the ImagePath,
      restart the service; read: the guest's RuntimeId unchanged, the new process's version, the old exe
      deletable only after the service stopped using it. Also measure: Defender scanning a newly written
      exe (time to first start), and whether the virtual account may rewrite its own service's config
      (expected no: the upgrade runs elevated or through a service DACL granting SERVICE_CHANGE_CONFIG to
      the account; recorded). Fallback if the ImagePath change is refused for the chosen identity: the
      upgrade command runs elevated (one admin prompt per upgrade), recorded; a fixed-path launcher exe is
      not introduced, because it would be a second binary to upgrade.
    files: ["evidence only"]
    test_first: "None (measurement)."
    done_when: "Swap reading recorded: RuntimeId before/after, service downtime, Defender delay."
    risks: []
    status: todo
    evidence: []
  - id: M0-GATE
    milestone: M0
    title: Write every M0 outcome into the M1+ items and stop for the user where a fallback was taken
    depends_on: [M0-HCS-ACCOUNT, M0-HCS-SURVIVAL, M0-HCS-IDENTITY, M0-HNS-NETWORK, M0-COM-CONSOLE, M0-BINARY-SWAP]
    decision: >
      Amend M1+ decisions and files from the M0 readings; mark any item made unnecessary as blocked with
      the reason; if any M0 item took a fallback that changes an invariant (a helper owning the VM, WMI
