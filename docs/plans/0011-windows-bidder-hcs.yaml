  - id: M1-VMHOST-HCS
    milestone: M1
    title: The Windows backend of the VM host seam over HCS, with no helper process
    depends_on: [M0-GATE, "0007:M2-CONTROLLER", "0007:M1-API"]
    decision: >
      vmhost_windows.go (build tag windows) implements the landed seam: Start writes the compute system
      document (Owner socialweb-computer-<handle>, ShouldTerminateOnLastHandleClosed false, LinuxKernelDirect,
      SCSI rootfs + cidata, the HNS endpoint, ComPorts 0 pipe, memory and processor count from the
      ComputeVM spec), grants VM access to each file, creates, starts, then closes its handle; it records
      status.runtime {backend hcs, ref Id, instance RuntimeId}. Inspect returns the Verdict table of
      M0-HCS-IDENTITY. Stop(grace) calls HcsShutdownComputeSystem, waits up to grace for State Stopped,
      then HcsTerminateComputeSystem, then deletes the endpoint and the work dir. List(owner) is
      HcsEnumerateComputeSystems by Owner. Calls go through golang.org/x/sys/windows LazySystemDLL on
      computecore.dll (vmcompute.dll where the build lacks it) with a small owned wrapper, CGO_ENABLED=0;
      hcsshim is imported only for ext4/tar2ext4 (decided by Claude, user may veto: hcsshim's hcs package is
      container-oriented and pulls a large tree). An HCS system of this Owner with no ComputeVM is the
      controller's orphan rule (0007:M2-CONTROLLER), never touched if its Owner differs.
    files: ["internal/vmhost/hcs_windows.go (or the landed seam package)", "internal/vmhost/hcs_windows_test.go", "internal/hcsapi/ (windows-only wrapper)"]
    test_first: >
      Offline on any OS: TestTheHcsDocumentForAComputeVMSetsOwnerAndNeverTerminatesOnLastHandle (golden
      JSON) and TestTheHcsVerdictTable (fake API: not found -> Lost, RuntimeId differs -> Lost, access
      denied -> Unknown). Windows-only behind livegate: TestAnHcsSystemOutlivesItsStarterAndIsAdoptedByTheNext
      run through the RFP-flow fixture of 0007 (a rented guest, its bidder killed, a new bidder adopts by
      Id). Red first.
    done_when: "Offline tests green in check.sh on Linux; the livegate test green on the Windows host with readings."
    risks: ["computecore.dll exports differ by Windows build; the wrapper resolves each proc lazily and check-host names any missing one."]
    status: todo
