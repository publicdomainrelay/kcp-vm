    depends_on: [M3-LIVE-SURVIVE]
    decision: >
      With a guest rented through the RFP flow: Restart-Computer. After boot the bidder service starts
      (automatic start), the controller re-populates: the ComputeVM is Lost (HCS has no system with that
      Id), no compute system is created for it, and the requester's releaseCompute of that receipt gets
      vm.delete 200 and the Lost ComputeVM and its work dir are deleted. The requester-side replacement
      through a new RFP is plan 0005 M3-NODE-LOSS's and is not re-proved here.
    files: ["internal/marketbed/live_test.go (TestAWindowsHostRebootLeavesLostComputeVMsThatStillRelease, a two-phase test resumed after boot)"]
