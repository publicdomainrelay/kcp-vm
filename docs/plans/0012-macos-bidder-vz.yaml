    depends_on: [M1-GUEST-IMAGE-ARM64, "0006:M4-BUILD", "0006:M0-SIZE-BUDGET"]
    decision: >
      The reproducible build (0006:M4-BUILD) gains darwin/arm64 carrying: the core binary (CGO_ENABLED=0,
      ad-hoc signed by the Go linker), deno darwin/arm64, bao darwin/arm64, vfkit darwin/arm64 signed with
      the virtualization entitlement before pinning (M0-VFKIT-ASSET), gvproxy if chosen, the arm64 guest
      image, the TypeScript closure; no k3s, kine, postgres, firecracker or pasta (`serve gateway kcp`
      refuses by name on darwin). darwin/amd64 is the user's question (recommended: not built until asked).
      Notarization and Developer ID are the user's question; until answered, the release is ad-hoc signed
