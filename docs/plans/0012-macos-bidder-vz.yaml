    title: The one piece of root code - a launchd broker that submits only vfkit, gvproxy and bao jobs as _socialweb
    depends_on: [M0-GATE]
    decision: >
      Built only if M0-GATE chose the system domain (a); if the user/<uid> domain works this item is set
      blocked with that reason. `socialweb-computer internal launchd-broker` runs as a root LaunchDaemon
      (/Library/LaunchDaemons/computer.socialweb.launchd-broker.plist, KeepAlive true) listening on a unix
      socket mode 0600 owned by _socialweb; it checks the peer with getpeereid (uid _socialweb only) and
      accepts four verbs: submit(spec), bootout(label), print(label), list(prefix). submit refuses unless:
      the label has the computer.socialweb.vm./vault./gvproxy. prefix of a registered handle; Program is
      a file under the state dir's runtime/<sha256>/ whose sha256 matches its directory name and an asset
      pin of the installed binary; UserName is forced to _socialweb; the plist path is under the state dir;
      no KeepAlive, no MachServices, no Sockets keys. The broker runs nothing but `launchctl bootstrap`,
      `bootout`, `print` and `list` (or their launchd equivalents) and holds no VM. It is in no VM's
      process tree (launchd is the parent of every job it submits).
