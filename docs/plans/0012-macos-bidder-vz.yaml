questions_for_user:
  - "Where do VM jobs live: (a) the system domain as _socialweb, submitted by a small root launchd broker whose only verbs are submit/bootout/print/list of vfkit, gvproxy and bao jobs; (b) the user/<uid> background domain of _socialweb with no root code at runtime, if M0 proves it works with nobody logged in; (c) an install-time slot pool; (d) an auto-login GUI account? Recommended: (b) if M0-LAUNCHD-DOMAIN proves it, else (a); never (d) (it breaks headless and needs FileVault off)."
  - "The VMM: vfkit (pinned, third-party, the launchd job's program, so none of our code is in the VM's tree), an own cgo VZ helper, or purego bindings in our binary? Recommended: vfkit. An own helper or in-binary bindings put our code in the VM's process tree, and Code-Hex/vz still needs CGO_ENABLED=1 and Xcode tools."
  - "Guest networking: VZ NAT (one shared vmnet network, no isolation between tenants unless M0 finds a rootless way) or a gvproxy job per VM (isolated by construction, one extra job and some throughput cost per VM)? Recommended: gvproxy per VM."
  - "Platforms: Apple Silicon only, or Intel Macs too (x86_64 guests, a second image and test host)? And the minimum macOS? Recommended: Apple Silicon only; minimum macOS 14, raised to the tested host's version if 14 cannot be tested."
  - "FileVault: require it off (the bidder returns unattended after any reboot), or allow it on (after an unplanned reboot the bidder stays down until someone unlocks the disk; planned reboots use fdesetup authrestart)? Recommended: allow it on and document it; reboot = Lost anyway, and a disk-encrypted host is the safer default."
  - "Arch in the market protocol (records and lexicons are not owned by these plans): compute.vm has no arch field (vm.json:19-45), so a Mac bidder serving arm64 guests cannot tell a requester whose user_data assumes amd64. Options: (a) add an optional arch to compute.vm, absent meaning amd64, and an arm64-only bidder bids only when arch is arm64; (b) the bidder publishes its arch in its offering and requesters filter; (c) no protocol change, arm64 guests with Rosetta binfmt and a documented risk. Recommended: (a), with M0-ARCH-MODULES's table attached."
  - "Signing: ship ad-hoc signed binaries and assets (no Apple account; a downloaded binary needs its quarantine attribute cleared once), or sign with a Developer ID certificate and notarize the core binary and vfkit (needs the Apple Developer Program)? Recommended: ad-hoc until a public release, then Developer ID plus notarization."
