      - "ARCHITECTURE section 10 'A custom resource is intent only while an operator of ours that runs IN the tenant cluster has not reconciled it'"
      - "tests: internal/scale TestACustomResourceCountsOnlyWhileItsInClusterOperatorHasNotReconciledIt (no status, Ready False, stale condition generation, lagging status.observedGeneration and finalizer-held deletion count; Ready True, deleted without finalizer, beside-the-control-plane kind and unregistered kind do not), TestAnUnreconciledCustomResourceAsksForOneNodeAndAReconciledOneForNone, TestNoOperatorOfOursRunsInTheTenantClusterToday, TestCustomResourceOfReadsTheFieldsTheRuleNeeds, the CR row of TestDemandAgreesWithIntentOnEveryIntentFixture; internal/clusterprovider TestAnInClusterOperatorKindNeedsALister"
      - "watched to fail (scratch mutations, restored): InCluster flag ignored -> 1 FAIL; stale generation ignored -> 1; CRs not intent -> 2"
      - "green: deploy/check.sh --fast exit 0"
      - "registry empty by design; correct only once M4-ESO-BESIDE lands -- until then ESO in the tenant is baseline and its CRs are not intent, which is the behaviour before this item"
