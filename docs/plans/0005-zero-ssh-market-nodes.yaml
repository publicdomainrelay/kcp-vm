plan: 0005-zero-ssh-market-nodes
written: 2026-10-07
source: >
  Decided with the user on 2026-10-07 in a question-by-question session after prod was found pinned
  at six market nodes for 7.5 idle hours. goal.txt carries the same content in compressed form.
state_rules:
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, prod or GitLab readings with UTC timestamps).
  - Open items are mirrored in NEXT.yaml.
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment on socialweb.computer, the vendored
    deno-kcp test bed, and the atproto-market requester libraries.
  not_owned: >
    The market protocol records and lexicons, and the core architecture: kcp in front of
    k3s --disable-agent clusters at zero nodes, with nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data. Changes there are asked first.
m3_contract:
  decided: "2026-10-07, decided by Claude, user may veto (names only; the mechanism is the user's)"
  api: "commit 0c1c7e5: ClusterLink (spec cluster/service/targetPort, status phase/endpointId/did/ticket/message), NodeClaim.status.grant {issuer, subject, audience, role}; NodeClaim schema revision 3"
  links:
    - "one ClusterLink per tenant cluster per service, named <clusterKey>-apiserver and <clusterKey>-openbao, in the cluster's home workspace; spec and status written by the provider only"
    - "each is a dumbpipe listen-tcp process-group component started after k3s, forwarding to the k3s apiserver port or the cluster OpenBao port on loopback"
    - "iroh secret key per link generated once and kept in the cluster OpenBao, KV v2 mount socialweb-links, path <service>; dumbpipe gets it as IROH_SECRET; the public key is published as did:key (multicodec ed25519-pub 0xed01, base58btc, z prefix)"
  node_secrets:
    - "the provider writes KV v2 mount socialweb-nodes, path <nodeName>: token, nodePassword, serverCA, apiserverTicket, advertiseAddress, apiserverPort; deleted at release"
    - "policy node-<nodeName>: read on socialweb-nodes/data/<nodeName> only"
  jwt:
    - "the door writes status.grant at accept from the winning bid's grant (issuer, subject) plus audience socialweb.computer/node/<clusterKey>/<nodeName>"
    - "the provider ensures JWT auth mount jwt-<first 12 hex of sha256(issuer)> with oidc_discovery_url = issuer, and role <nodeName> with bound_subject, bound_audiences, user_claim sub, token_ttl 5m, token_policies node-<nodeName>; role and policy deleted at release"
  guest:
    - "the --secrets capability delivers /etc/socialweb/node/openbao-ticket, /etc/socialweb/node/openbao-ca.pem and /etc/socialweb/node/claim.json {node, cluster, jwtMount, role, audience, kvMount, kvPath}"
    - "user_data units: socialweb-openbao-link (dumbpipe connect-tcp --addr 127.0.0.1:18200), socialweb-node-secrets (oneshot: exchange the workload token for the audience at the bidder issuer, POST /v1/auth/<jwtMount>/login, read the KV path, write files 0600), socialweb-apiserver-link (advertise address on lo, dumbpipe connect-tcp --addr <advertiseAddress>:<apiserverPort>), k3s-agent; all Restart=always; no sshd use"
    - "the cluster OpenBao serving certificate must verify as 127.0.0.1 with the delivered CA"
  door:
    - "requestCompute handlers: write contract state; at accept write status.grant; return at onSecretsFetched, then dispose capabilities; no ssh session; release only when the claim is deleted; startup never releases a live claim"
acceptance:
  where: >
    Our GitLab (inspect git log -p docs/gitlab/, ssh gitlab, $GITLAB_TOKEN, chrome devtools MCP for
    the OAuth flow) running against a cluster created through the SPA on prod.
  checks:
    - id: ACC-ZERO
      text: An idle cluster sits at 0 nodes; a pipeline scales it up; nodes scale in one by one and it returns to 0 with the control plane Ready.
      status: todo
      evidence: []
    - id: ACC-MESH
      text: A pod on node A reaches a pod on node B, and DNS resolves on a node that does not run CoreDNS.
      status: todo
      evidence: []
    - id: ACC-NOSSH
      text: Logs show zero ssh sessions to any guest for the whole run.
      status: todo
      evidence: []
items:
  - id: M0-BASELINE
    milestone: M0
    title: Measured baseline delta so a cluster holding only our stuff reads as nothing deployed
    decision: >
      Record the objects our installers wrote plus a hash of their live spec read back after apply;
      pods are resolved through their controller chain to a baseline workload; a baseline workload
      whose spec changed counts as intent. Chosen by the user over hand-stamping.
    status: done
    evidence:
      - "commit 65cd9d7 An idle cluster of only our own add-ons scales to zero"
      - "installer applies under field manager socialweb-addons; provider records what that manager applied with a live spec hash in the cluster's addon-baseline.json; scale.Narrow drops baseline workloads and pods whose owner is counted"
      - "tests watched to fail then pass: TestOurInstalledOperatorAloneIsNothingDeployed (demand 6 before), TestABaselineWorkloadWhoseSpecChangedIsIntent, TestATenantWorkloadBesideTheBaselineIsIntent, TestABaselineEntryNamesOneNamespace, TestTheSpecHashIsStableAndSeesAReplicaChange, TestObserveLeavesAnIdleClusterOfOurAddOnsAtNoIntent, TestTheBaselineIsWhatOurFieldManagerApplied, TestTheBaselineSurvivesARoundTripThroughItsFile; deploy/check.sh --fast green"
      - "prod 2026-10-07T16:48:28Z baseline measured: 3 ESO Deployments in default"
  - id: M0-DEMAND
    milestone: M0
    title: Demand stops counting a pod and its owning workload twice
    decision: A pod whose controller workload is counted is not counted again.
    status: done
    evidence:
      - "commit 65cd9d7 (same change as M0-BASELINE)"
      - "tests watched to fail then pass: TestAPodAndItsDeploymentAreOneUnitOfDemand (6, want 3), TestPodsOfACountedJobStatefulSetOrDaemonSetAreNotCountedTwice"
  - id: M0-PROD-ZERO
    milestone: M0
    title: Prod idle cluster observed at 0 nodes with control plane Ready and no new RFPs
    decision: Proof required before M1 starts.
    status: done
    evidence:
      - "2026-10-07T16:48:30Z..16:51:37Z 96 of 96 scale passes: None, nodes 0, nothing running and no node; 0 RFPs, 0 claims, 0 no_bids"
      - "2026-10-07T16:52:07Z independent check: 111 of 111 passes in 5m None nodes 0; rfps=0 no_bids=0; tenant get nodes: No resources found; /readyz ok"
  - id: M0-PROD-BIDDER
    milestone: M0
    title: Retire the bidder that ran on the prod host
    decision: The user decided no bidder runs on prod; both doors rely on user-run bidders.
    status: done
    evidence:
      - >
        2026-10-07 ~16:00 UTC: socialweb-computer-bidder-firecracker stopped, disabled, unit moved
        out of /etc/systemd/system; 6 fc-1379be663dd9-* containers removed; no process left under
        its guests dir; 17G of guest disks deleted; bidder-key.hex, bidder.env and the unit kept in
        /root/retired-bidder; systemctl is-active reads inactive; prod / at 26%.
  - id: M0-TMP
    milestone: M0
    title: Delete hat-8's three dead /tmp directories, never /tmp/live-k3s-*
    decision: >
      /tmp/rfp-guests, /tmp/nodeboot-check, /tmp/nodeimage-preinstall-check only, each re-checked for
      open files and process cwds immediately before deletion.
    status: done
    evidence:
      - "2026-10-07T16:51Z: no process cmdline or cwd referenced any of the three (own shell excluded), none written in the last hour; rfp-guests 6.6G, nodeboot-check 6.6G, nodeimage-preinstall-check 5.6G removed (its root-owned stage/ via sudo after /proc/mounts showed no mount under it)"
      - "2026-10-07T16:52:03Z /tmp 24G tmpfs at 12% (2.6G used, was 92%); all 7 /tmp/live-k3s-* untouched"
  - id: M1-TESTBED
    milestone: M1
    title: Vendor deno-kcp CRDs and deploy/examples/atproto/market (with PR 2's bidder and bob PDS) as the live test bed
    decision: >
      Vendored into this repo (user chose vendoring over building in deno-kcp). The bidder runs
      --compute-provider-firecracker with our nodeimage and nodeboot. Replaces the ad-hoc local
      dispatcher plus fake PLC harness for live tests. The bidder and requester use the in-cluster
      PLC (https://127.0.0.1:2587) and the test bed's own dispatcher (relay.localhost:2588, TLS front
      for guests on 2589), never plc.directory or xrpc.fedproxy.com; the bidder runs --policy open
      because every identity is minted per run (decided by Claude, user may veto).
    status: done
    evidence:
      - "commit e997fe6 vendor deno-kcp f5b7c10c (pr-2) schemas, exports, workspace types, scripts and the market example; deploy/denokcp/vendor.json records commit and sha256 per file"
      - "commit c1451df build-provider.sh builds deno-kcp at the recorded commit against kcp-libs f6911d2 plus kcp-libs-no-default-issuer.patch (OpenBao 2.6/2.7 answer 400 'no default issuer' on an empty PKI mount; kcp-libs read only 404 as no authority)"
      - "commit fb6da3a firecracker bidder, dispatcher, TLS front, market-requester/mod.ts (runComputeContract, no ssh session), accept.sh market checks, provider --pod-timeout 24h, livegate test"
      - "commit d4448f2 guest onNetwork end to end (TLS front reads the HTTP/2 authority; requester user_data sets CURL_HOME=/root so units read the bidder's .curlrc)"
      - "commit 3e1f2c6 guest work root under /var/tmp, apply.sh refuses a work root whose firecracker socket path exceeds 107 bytes"
      - "tests watched to fail then pass: TestTheVendoredDenoKcpTreeIsExactlyItsRecord, TestTheRecordMatchesTheDenoKcpCommitItNames, TestEveryVendoredManifestDecodesAgainstTheVendoredSchemas (no vendor.json, then pass; a mutated 70-bidder.yaml fails all three); TestTheMarketTestBedRentsAFirecrackerGuestThroughTheRFPFlow (FAIL 964 s at 2026-10-07T20:09:51Z, guest socket path too long; PASS 684 s at 2026-10-07T20:22:12Z)"
      - "accept.sh on hat-8 2026-10-07: run 1 17:23Z 0/17 (OpenBao 400); run 2 17:30:42Z deno-worker bidder as upstream, accept: pass 17/17 (upstream bidder registered did:plc:lm4cljto7fyrug2xgjvsefh3 in the public plc.directory); run 3 17:45Z firecracker bidder up, RFP 403 scope filter (only-me); run 4 17:53Z bid, accept, receipt verified, guest booted, every DenoPod killed at the 5m pod timeout; runs 5-8 vm.delete 200 and guest gone, guest never got its OIDC token; run 9 19:53:16Z accept: pass 23/23, onNetwork iroh ticket 335 s after the RFP, vm.delete 200, guest container gone 2 s after release"
      - "deploy/check.sh --fast green 2026-10-07T20:23:04Z on the branch merged with main"
  - id: M1-MARKET-ONLY
    milestone: M1
    title: Retire clusterprovider's local firecracker and qemu substrates
    decision: >
      The market path with a local bidder covers the same test bed; one node path remains. The VMM
      code survives where the bidder's nodeboot needs it. decided by deepseek executor, lead may
      veto: the subnet allocator STAYS in the composition root, because internal/materialiser
      requires it to release a cluster's range beside its ports on teardown and removing it ripples
      through materialiser, the legacy-key migrator and check-host for no behaviour a market cluster
      has; the node hosts no longer take it. decided by deepseek executor, lead may veto: the node
      record sweep keeps walking and keeps refusing to signal on a record it cannot verify, but a
      record from a retired substrate is now REPORTED and left in place rather than reaped, because
      the market path writes no record at all (a rented node is a NodeClaim) and every remaining
      record names a process whose argv this provider can no longer reconstruct.
    status: done
    evidence:
      - "commit cd12808: internal/nodeqemu deleted; internal/nodefirecracker trimmed to the image, manifest, namespace-child, fingerprint and guest-document halves the bidder's nodeboot builds and boots; SOCIALWEB_CLUSTERPROVIDER_SUBSTRATE accepts market alone and refuses firecracker/qemu by name and retirement date; the variables only the retired substrates read (FIRECRACKER, QEMU, NODE_AGENT, IMAGE_OUT_DIR, IMAGE_CONFIG, NETWORK, NODE_DISK_MIB) are refused rather than parsed; GuestDialled, GuestGateway, nodeVaultStage, the per-node network allocation, AssertGuestAdvertiseInvariant, dialFromAGuest and internal/nodevm's guest-dial helpers deleted; internal/clusterprovider's guest advertise invariant and image-config check deleted; deploy/control-plane-container's computer target and nodeimage-qemu stage, deploy/test-rig and cmd/socialweb-rig-inputs deleted; run-container.sh keeps the k8s target"
      - "tests watched to fail then pass: cmd/socialweb-clusterprovider TestTheRetiredSubstratesAreRefusedAtStartup, TestTheRetiredSubstratesAreRefusedAndNameTheirRetirement, TestNoPlacementSuppliesAProcessIdentityAnyMore, TestTheMarketSweepLeavesARetiredSubstratesRecordAlone, TestASweepLeavesARecordWhoseSubstrateItCannotRead, TestShutdownLeavesTheMarketNodesToTheNextProvider, TestTheCredentialSourceIsTheClustersOwnCA; internal/clusterstack TestAStackWithNoDialFlagValidates, TestOnlyAMarketClusterDropsFlannel; internal/portallocator dropped AssertGuestAdvertiseInvariant and AssertGuestDialAddress with no remaining caller"
      - "deploy/check.sh --fast green 2026-10-07T21:50:55Z on the branch at cd12808 (gofmt, go build, apigen no drift, go vet, staticcheck, cargo, go test ./...); go build ./... and go vet ./... clean again at b2e931a 2026-10-07T21:51:03Z"
  - id: M1-AGENT-SPLIT
    milestone: M1
    title: Split socialweb-nodeagent into a static guest binary (init and agent) and a host binary (namespace and VMM runner)
    decision: >
      User suggested the split; market guests stop carrying a host half that always fails. Mapping on
      2026-10-07 showed nodeboot already re-execs ITSELF for the namespace verb, and the agent verb
      needs an identity disk only local substrates attach, so on market guests it always exits
      KCP_AGENT fatal. With M1-MARKET-ONLY the split therefore lands as: guest binary
      socialweb-nodeinit (initramfs /init only), host binary socialweb-nodeboot (unchanged); the agent
      verb, /kcp/kcpagent and kcp-agent.service are deleted, the guest joining through cloud-init
      units (M3-UNITS). Done in one change with M1-MARKET-ONLY after M1-TESTBED proves the market
      path, because both rewrite the same files. decided by Claude, user may veto. decided by
      deepseek executor, lead may veto: the image configuration's old key names are REFUSED with a
      message naming the new ones rather than accepted for a release, and the operator's
      configurations under /home/johnandersen777/kcp-image/ were rewritten to the new names and
      fingerprinted again (the old spellings are refused, so leaving them would have made every
      build host fail).
    status: doing
    evidence:
      - "commit cd12808: cmd/socialweb-nodeagent -> cmd/socialweb-nodeinit with the init verb alone; agent.go, audit.go, agent_test.go, the guest identity-disk join, LoadNodeDocument, /kcp/kcpagent and kcp-agent.service deleted; kcp-agent.service added to rootfs staleUnits so an image built on a base that carried it retires it; image config keys init_package/init_binary/init_go_flags with RefuseRenamedKeys refusing agent_package/agent_binary/agent_go_flags; every JSON config in the repo and scripts/deploy-firecracker-bidder.sh updated"
      - "image built by the real builder from the renamed configuration 2026-10-07T21:47:45Z (logs/image-build.log): fingerprint sha256-bcdfbb6824a7743d8fd4c15d1be1ad1bda35785fe97a0f1278ebfa507b98be00, stage /kcp holds guest.yaml alone, multi-user.target.wants holds no kcp unit, and the initramfs's /init is a stripped static x86-64 Go binary whose strings carry KCP_INIT fatal and 13 nodeinit markers and no KCP_AGENT marker"
      - "internal/nodefirecracker TestAnInitPackageIsRelativeToTheModuleAndNotToWhereTheReaderStands and cmd/socialweb-nodeimage TestAnImageBuiltBeforeTheRecordCoveredTheInitIsRefused, plus the input-role table renamed; fingerprint tests updated deliberately (the input's name and content are both inputs)"
      - "the market test bed live test was attempted twice and did NOT reach a verdict on this change: 2026-10-07T21:48Z SKIPPED (ports 2583-2589 held by an earlier session's bed), then 2026-10-07T21:55:29Z FAIL in 120 s with the BED's own bring-up broken -- apply.sh failed 3/3, no OpenBao ready, no DenoPod in any workspace, the OpenBao CA unreadable, and no guest work directory ever created -- while that other session's bed came back up on the same fixed ports (ss shows the listeners again). The failure is upstream of everything this change touches: the bed never reached an RFP, so the node image, the init binary and the renamed image keys were never read. Nothing in this change is known-failing; the live reading is owed on a host with no second bed running"
      - "REOPENED 2026-10-07T22:50Z by the lead: the image bcdfbb68 above was built WITHOUT -preinstall (image.json preinstall \"\"), so its rootfs carries no cloud-init (no /etc/cloud, no cloud-init.target.wants, no /usr/bin/cloud-init; debugfs on the bidder store). Prod guest fc-1379be663dd9-4d49fee1 booted it 22:23Z, console stops after fcnet.service, no cloud-init stage, door node_claim_ended outcome network_timeout 22:43:08Z. Done needs an image built WITH preinstall-market.json, shipped, and a market guest that runs cloud-init on it"
  - id: M1-IMAGE-SHIP
    milestone: M1
    title: The bidder installer ships exactly the image the current inputs name, never a stale one
    decision: >
      scripts/deploy-firecracker-bidder.sh asked the build host -ensure -json -reuse-stale, which answers with
      the newest whole image in the store whatever its inputs, so it shipped bcdfbb68 (no preinstall) while the
      current inputs fingerprint to sha256-144a6d33 (target ensure 2026-10-07T22:22Z reusedFrom bcdfbb68). The
      build host's ensure must name the exact image of the current inputs, building it when absent through
      sudo -n with the go.mod toolchain (the preinstall chroot needs CAP_SYS_CHROOT) and handing ownership back;
      the target keeps -reuse-stale (busybox naming). An image whose manifest lacks the preinstall the config
      asks for is refused. decided by Claude, user may veto. decided by deepseek executor, lead may veto: the
      build host's ask is a new non-building mode of the builder (socialweb-nodeimage -ensure -json -present-only)
      rather than a reuse answered by the store, because -ensure alone answers the same question by BUILDING and
      an unprivileged build only fails at the preinstall chroot, after the base image and every seeded image have
      been unpacked into the stage (option A, chosen by the lead 2026-10-07T22:50Z); the build under sudo runs
      with TMPDIR unset (env -u TMPDIR) because the preinstall chroot inherits TMPDIR and dpkg's ca-certificates
      configure step then dies in mktemp; -reuse-stale with -present-only is refused rather than ordered. The
      build host's own step (a) runs for real in --dry-run too, because it is the question and it writes nothing,
      and the store is not checksummed in a preview of a host that does not hold the image yet.
    status: doing
    evidence:
      - "5409398 nodeimage: -ensure refuses any image it resolves (present, reused or built) whose manifest disagrees with the run about whether a preinstall exists, naming the image and the manifest; -present-only is the non-building presence question (prints {state:absent,...} and exits non-zero when the exact-fingerprint image is not whole, builds/reuses/writes nothing); a host that must not build asks it before deciding to build"
      - "9797f50 + ea4f664 bidder deploy (ea4f664 is the state of the installer to run): the build host answers in two steps -- (a) -ensure -json -present-only as the invoking user, (b) sudo -n env -u TMPDIR on the toolchain the go line in go.mod selects, then chown the new image dir and the stage back and ask (a) again, which must answer present; --dry-run prints every one of these steps; the target keeps -reuse-stale but its resolved dir must now be the shipped fingerprint, and remote_vars is a function so the target's script can carry FINGERPRINT"
      - "tests watched to fail then pass: TestEnsureRefusesAnImageThatRecordsNoPreinstallWhenOneIsNamed and TestEnsureRefusesAnImageThatRecordsAPreinstallWhenNoneIsNamed (before: the stale image was handed back), with controls TestEnsureUsesAnImageThatRecordsThePreinstallTheInputsName, TestPresentOnlySaysAbsentAndBuildsNothing, TestPresentOnlySaysPresentForTheImageTheInputsName; TestTheBidderDeployShipsTheImageTheInputsNameAndBuildsItUnderSudo runs the script with --dry-run and asserts the build host's ask is -present-only with no -reuse-stale, the sudo build step with TMPDIR unset and the go.mod toolchain, and the chown back (before: the preview died on '-reuse-stale asked for an image already in the store, and the store at ... holds none that this configuration could have produced')"
      - "deploy/check.sh --fast green at ea4f664 (gofmt, go build, apigen no drift, go vet, staticcheck, cargo fmt, cargo test, go test ./...) -- the last commit, and the working tree the check ran on is that commit"
      - "not proven here, and the lead runs them: a real build under the new (b) and a real install. Expect the first real install to fail at the target's check if the target's store still holds the preinstall-less bcdfbb68 newer than the shipped image: that is the check doing its job, and the fix is to reap the target's other store directories"
  - id: M1-BIDDER-UNIT
    milestone: M1
    title: System template unit socialweb-computer-bidder@<handle>.service
