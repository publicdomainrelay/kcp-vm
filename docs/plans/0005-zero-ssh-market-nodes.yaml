  - id: M3-NODE-LOSS
    milestone: M3
    title: A Node NotReady for 90s is released and replaced; door or provider restarts never reap
    decision: >
      User chose 90s. Door half decided by Claude, user may veto: a restarted door adopts Joining and
      Running claims with no write and no release; it marks Bidding and Provisioning claims Failed and
      does not release them, because their guest's user_data names the old door's per-process secrets
      server, so the guest can never fetch, and awaitComputeNetwork would only find an address the door
      no longer needs; the release comes with the claim's deletion from the receipt it carries. stop()
      releases nothing and writes nothing.
    status: done
    evidence:
      - "deployed 2026-10-07 ~19:44Z with main 6af8994 (adoption, shutdown no longer reaps, per-node scale-in 932b139): 19:45:36Z passes None nothing running and no node, ClusterLinks re-recorded after restart; a restart with live market nodes awaits a bidder"
