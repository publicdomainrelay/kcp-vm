  - id: M3-BAO-SYNC
    milestone: M3
    title: The cluster OpenBao's JWT mounts, roles, policies and KV entries match the live claims, always
    decision: >
      User asked 2026-10-07 that the plans keep OpenBao backends and roles in sync with what is active.
      Read live 22:53Z: the tenant OpenBao holds 5 jwt-* mounts, one per issuer bob has had (its issuer
      is a fresh did:key relay keypair every restart), and only jwt-df356681a07e serves a live node. Rule:
      per cluster, desired = for each live (Adoptable) claim with a grant: mount jwt-<sha12(issuer)>,
      role <node>, policy node-<node>, KV socialweb-nodes/<node>. The provider reconciles actual to desired
      every confirm pass and at adoption: a role, policy or KV entry with no live claim is deleted; a
      jwt-* mount with no role left is disabled. Release keeps revoking eagerly; the reconcile is the
      backstop for restarts and crashes. Unit test against a fake OpenBao seeded with stale mounts/roles;
      live reading on prod: after a release and after a provider restart, `bao auth list` and
      `bao list auth/<m>/role` name exactly the live nodes. Plan 0007's stable bidder keys shrink the
      churn; this keeps the store honest regardless. decided by Claude, user may veto.
    status: todo
    evidence: []
