  - id: M2-BID-LATENCY
    milestone: M2
    title: A first-free winner is accepted within 0.5 s of its bid, not after 6 s of policy evaluation
    decision: >
      User asked 2026-10-07 why first-free waits. Measured on prod (door log, claim node96 23:16Z):
      firstFree true, bidWindowSec 30; bid present 23:16:04.97Z, first_free_winner 23:16:11.30Z. The window
      is not the cost: BidCollector waits on allow() = decideBid + evaluateCandidate, which spent ~3 s
      silent (policy worker start, record/DID resolution) then ~3.3 s scanning the same delegated-trust
      vouch chains (badgeBlueKeys, operator vouches) three times, uncached. Fix in the requester libs
      (owned; no protocol change): per-DID cache of delegated-trust/vouch results with a TTL, pre-warm the
      vouched candidates found at bidder_discovery while bids are awaited, one warm policy worker per
      door, timing logs per phase. decided by Claude, user may veto.
    status: doing
    evidence: []
  - id: M4-SCALE-IN
    milestone: M4
    title: Per-node scale-in
    decision: >
      A node holding nothing beyond baseline for the 2m hold is cordoned, drained and released.
      Supersedes plan 0002 section 4.4 (all-or-nothing). Decided by Claude, user may veto: "nothing
      beyond baseline" means no live pod bound to the node other than DaemonSet pods, mirror pods,
      k3s add-on pods and pods of measured-baseline workloads; one node per hold (a release restarts
      the hold of the nodes left), emptiest (fewest baseline pods) then newest; never below the
      target while intent exists; no release while a Pending pod with no node is younger than the
      hold, and never of a node a Pending pod is nominated or hostname-pinned to; per-node idle
      clocks in memory (a provider restart restarts the hold); only nodes this provider process
      holds; cordon, re-observe, uncordon and keep a node that took work or whose eviction is
      refused, evict through the Eviction API, then the existing teardownHeld. A DaemonSet is never
      intent or demand (its desired count follows the nodes).
