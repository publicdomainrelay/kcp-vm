  - id: M4-PENDING-CRS
    milestone: M4
    title: Intent counts workloads beyond baseline plus our operators' CRs not yet reconciled
    decision: >
      User chose workloads plus pending CRs; leftover namespaces, RBAC and ConfigMaps never hold nodes.
      Decided by Claude, user may veto: a CR counts as intent only if its operator runs IN the tenant
      cluster and the CR is not reconciled, because an operator beside the control plane (ESO after
      M4-ESO-BESIDE) reconciles at zero nodes. Registry scale.Operators of {Group, Kind,
      ReadyCondition, InCluster}; not reconciled = ReadyCondition not True, or that condition's or
      status.observedGeneration older than metadata.generation, or deleting behind a finalizer; each
      such CR is one unit of demand. scale.OurOperators ships empty: no operator of ours runs in a
      tenant cluster once ESO moves. NodeObserver refuses to observe when the registry names an
      in-cluster kind and no lister is supplied.
    status: done
    evidence:
      - "fb4ca07 internal/scale/operators.go (Operators, OperatorKind.Reconciled, Unreconciled, CustomResourceOf, OurOperators), Observation.UnreconciledCustomResources in Intent and Demand and carried through Narrow"
