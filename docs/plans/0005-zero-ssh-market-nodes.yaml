plan: 0005-zero-ssh-market-nodes
written: 2026-10-07
source: >
  Decided with the user on 2026-10-07 in a question-by-question session after prod was found pinned
  at six market nodes for 7.5 idle hours. goal.txt carries the same content in compressed form.
state_rules:
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, prod or GitLab readings with UTC timestamps).
  - Open items are mirrored in NEXT.yaml.
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the prod deployment on socialweb.computer, the vendored
    deno-kcp test bed, and the atproto-market requester libraries.
  not_owned: >
    The market protocol records and lexicons, and the core architecture: kcp in front of
    k3s --disable-agent clusters at zero nodes, with nodes only ever born through
    requester -> RFP -> bid -> accept -> cloud-init user_data. Changes there are asked first.
acceptance:
  where: >
    Our GitLab (inspect git log -p docs/gitlab/, ssh gitlab, $GITLAB_TOKEN, chrome devtools MCP for
    the OAuth flow) running against a cluster created through the SPA on prod.
  checks:
    - id: ACC-ZERO
      text: An idle cluster sits at 0 nodes; a pipeline scales it up; nodes scale in one by one and it returns to 0 with the control plane Ready.
      status: todo
      evidence: []
    - id: ACC-MESH
      text: A pod on node A reaches a pod on node B, and DNS resolves on a node that does not run CoreDNS.
      status: todo
      evidence: []
    - id: ACC-NOSSH
      text: Logs show zero ssh sessions to any guest for the whole run.
      status: todo
      evidence: []
items:
  - id: M0-BASELINE
    milestone: M0
    title: Measured baseline delta so a cluster holding only our stuff reads as nothing deployed
    decision: >
      Record the objects our installers wrote plus a hash of their live spec read back after apply;
      pods are resolved through their controller chain to a baseline workload; a baseline workload
      whose spec changed counts as intent. Chosen by the user over hand-stamping.
    status: done
    evidence:
      - "commit 65cd9d7 An idle cluster of only our own add-ons scales to zero"
      - "installer applies under field manager socialweb-addons; provider records what that manager applied with a live spec hash in the cluster's addon-baseline.json; scale.Narrow drops baseline workloads and pods whose owner is counted"
      - "tests watched to fail then pass: TestOurInstalledOperatorAloneIsNothingDeployed (demand 6 before), TestABaselineWorkloadWhoseSpecChangedIsIntent, TestATenantWorkloadBesideTheBaselineIsIntent, TestABaselineEntryNamesOneNamespace, TestTheSpecHashIsStableAndSeesAReplicaChange, TestObserveLeavesAnIdleClusterOfOurAddOnsAtNoIntent, TestTheBaselineIsWhatOurFieldManagerApplied, TestTheBaselineSurvivesARoundTripThroughItsFile; deploy/check.sh --fast green"
      - "prod 2026-10-07T16:48:28Z baseline measured: 3 ESO Deployments in default"
  - id: M0-DEMAND
    milestone: M0
    title: Demand stops counting a pod and its owning workload twice
    decision: A pod whose controller workload is counted is not counted again.
    status: done
    evidence:
      - "commit 65cd9d7 (same change as M0-BASELINE)"
      - "tests watched to fail then pass: TestAPodAndItsDeploymentAreOneUnitOfDemand (6, want 3), TestPodsOfACountedJobStatefulSetOrDaemonSetAreNotCountedTwice"
  - id: M0-PROD-ZERO
    milestone: M0
    title: Prod idle cluster observed at 0 nodes with control plane Ready and no new RFPs
    decision: Proof required before M1 starts.
    status: done
    evidence:
      - "2026-10-07T16:48:30Z..16:51:37Z 96 of 96 scale passes: None, nodes 0, nothing running and no node; 0 RFPs, 0 claims, 0 no_bids"
      - "2026-10-07T16:52:07Z independent check: 111 of 111 passes in 5m None nodes 0; rfps=0 no_bids=0; tenant get nodes: No resources found; /readyz ok"
  - id: M0-PROD-BIDDER
    milestone: M0
    title: Retire the bidder that ran on the prod host
    decision: The user decided no bidder runs on prod; both doors rely on user-run bidders.
    status: done
    evidence:
      - >
        2026-10-07 ~16:00 UTC: socialweb-computer-bidder-firecracker stopped, disabled, unit moved
        out of /etc/systemd/system; 6 fc-1379be663dd9-* containers removed; no process left under
        its guests dir; 17G of guest disks deleted; bidder-key.hex, bidder.env and the unit kept in
        /root/retired-bidder; systemctl is-active reads inactive; prod / at 26%.
  - id: M0-TMP
    milestone: M0
    title: Delete hat-8's three dead /tmp directories, never /tmp/live-k3s-*
    decision: >
      /tmp/rfp-guests, /tmp/nodeboot-check, /tmp/nodeimage-preinstall-check only, each re-checked for
      open files and process cwds immediately before deletion.
    status: done
    evidence:
      - "2026-10-07T16:51Z: no process cmdline or cwd referenced any of the three (own shell excluded), none written in the last hour; rfp-guests 6.6G, nodeboot-check 6.6G, nodeimage-preinstall-check 5.6G removed (its root-owned stage/ via sudo after /proc/mounts showed no mount under it)"
      - "2026-10-07T16:52:03Z /tmp 24G tmpfs at 12% (2.6G used, was 92%); all 7 /tmp/live-k3s-* untouched"
  - id: M1-TESTBED
    milestone: M1
    title: Vendor deno-kcp CRDs and deploy/examples/atproto/market (with PR 2's bidder and bob PDS) as the live test bed
    decision: >
      Vendored into this repo (user chose vendoring over building in deno-kcp). The bidder runs
      --compute-provider-firecracker with our nodeimage and nodeboot. Replaces the ad-hoc local
      dispatcher plus fake PLC harness for live tests.
    status: todo
    evidence: []
  - id: M1-MARKET-ONLY
    milestone: M1
    title: Retire clusterprovider's local firecracker and qemu substrates
    decision: >
      The market path with a local bidder covers the same test bed; one node path remains. The VMM
      code survives where the bidder's nodeboot needs it.
    status: todo
    evidence: []
  - id: M1-AGENT-SPLIT
    milestone: M1
    title: Split socialweb-nodeagent into a static guest binary (init and agent) and a host binary (namespace and VMM runner)
    decision: >
      User suggested the split; market guests stop carrying a host half that always fails. Mapping on
      2026-10-07 showed nodeboot already re-execs ITSELF for the namespace verb, and the agent verb
      needs an identity disk only local substrates attach, so on market guests it always exits
      KCP_AGENT fatal. With M1-MARKET-ONLY the split therefore lands as: guest binary
      socialweb-nodeinit (initramfs /init only), host binary socialweb-nodeboot (unchanged); the agent
      verb, /kcp/kcpagent and kcp-agent.service are deleted, the guest joining through cloud-init
      units (M3-UNITS). Done in one change with M1-MARKET-ONLY after M1-TESTBED proves the market
      path, because both rewrite the same files. decided by Claude, user may veto.
    status: todo
    evidence: []
  - id: M1-BIDDER-UNIT
    milestone: M1
    title: System template unit socialweb-computer-bidder@<handle>.service
    decision: >
      System template unit (user chose it over a user unit because firecracker needs kvm and
      runuser); %i is the atproto handle; QR sign-in is read from the journal by the operator;
      enabled with systemctl enable --now socialweb-computer-bidder@<handle>.service.
      Decided by Claude, user may veto: the launcher holds the QR sign-in to %i by reading the handle
      the bidder logs and refusing (session deleted, exit 1, restart into a fresh QR) any other
      account; the shared dir is /var/lib/socialweb-computer-bidder/host and every instance runs as
      swc-bidder; MANAGE_DOCKER_DAEMON=no leaves daemon.json alone on a host with other containers.
    status: done
    evidence:
      - "commit 51f9000 The bidder is a template unit keyed by the account's handle (deploy/bidder/socialweb-computer-bidder@.service, deploy/bidder/socialweb-computer-bidder-run, scripts/deploy-firecracker-bidder.sh reworked with --local and --dry-run, test/bidder_unit_test.go)"
      - "tests watched to fail (files absent, script still writing bidder.env and an account secret) then pass: TestTheBidderUnitIsATemplateKeyedByTheAccountHandle, TestNoAccountSecretReachesTheBidder, TestTheBidderDeployInstallsTheTemplate, TestTheLauncherSignsInByQRIntoItsOwnStateDirectory, TestTheLauncherRefusesAnAccountOtherThanItsInstance (restored, scanned, unnamed), TestTheLauncherAcceptsTheHandleInAnyCase, TestTheLauncherRefusesAnInstanceThatIsNotAHandle, TestTheBidderUnitVerifies (systemd-analyze verify, any output fails); deploy/check.sh --fast green"
      - "hat-8 2026-10-07T17:10Z deploy-firecracker-bidder.sh --local (MANAGE_DOCKER_DAEMON=no, prod untouched): rc 0, store verified, template/launcher/common.env installed, module cache warm, target ensure -reuse-stale answered reused from sha256-6e4f4f95...; second run rc 0 with all three unchanged and nothing restarted"
      - "hat-8 2026-10-07T17:11:24Z systemctl start socialweb-computer-bidder@bobvmbuilder.bsky.social with its session seeded as a 0600 swc-bidder copy of ~/.cache/pdr-market/bob-bidder-oauth-session.json: restore refused by the PDS (invalid_grant, Refresh token replayed -- the source file's refresh token was already spent, the source is unchanged), bidder deleted the copy, journal at 17:11:26Z shows the 60-char = frame, the QR, https://qr.fedfork.com/#oauth=did%3Aplc%3Awadxdef7inpvtaen77n7cfxw&n=... and oauth_qr_awaiting_session; bidder_ready not reached without a scan"
      - "hat-8 2026-10-07T17:11:38Z systemctl disable --now: is-active inactive, is-enabled disabled, 0 swc-bidder processes; template, launcher, common.env and bobvmbuilder.bsky.social.env (BIDDER_POLICY=tangled-vouch) left installed"
  - id: M2-EVENT-CORE
    milestone: M2
    title: ABC-layered event-driven requester core in atproto-market
    decision: >
      Callbacks onRfpSubmitted, onBid (accept or deny), onAccepted, onReceipt, onNetwork,
      onSecretsFetched; each decides whether the flow continues or returns. No ssh session is held
      by the core.
    status: done
    evidence:
      - "atproto-market pre-iroh cdb0f9c A compute contract is a state that can be saved, and its events can stop it"
      - "atproto-market pre-iroh 28a1be5 The requester's flow runs without an ssh session, and release stands alone"
      - "packages @publicdomainrelay/compute-request-abc (ContractState, phases requested..released, handlers onRfpSubmitted/onBid/onAccepted/onReceipt/onNetwork/onSecretsFetched, parse/serialize) and @publicdomainrelay/compute-request-xrpc (requestCompute, releaseCompute, awaitComputeNetwork); secrets capability reports onServed -> onSecretsFetched"
      - "tests fail->pass: test/compute_request_test.ts (event order, return at onRfpSubmitted, return at onNetwork submits no vm.delete, onBid deny never accepted, all-denied no contract, onSecretsFetched return, awaitComputeNetwork resume), test/compute_request_state_test.ts (7), test/secrets_capability_test.ts onServed; whole suite 109 passed 0 failed 4 ignored (was 92)"
      - "not yet proven: awaitComputeNetwork backfill path; onSecretsFetched with a real guest; a live early return -- closed by M2-CLAIM-RECEIPT and M3 live runs"
  - id: M2-RELEASE
    milestone: M2
    title: Standalone releaseCompute(receipt) that submits vm.delete
    decision: Release no longer depends on a session returning inside the process that accepted the bid.
    status: done
    evidence:
      - "28a1be5 releaseCompute(pds, state) submits vm.delete from a saved ContractState"
      - "test: releaseCompute from a JSON round-tripped state submits vm.delete from another process; no receipt refs submits nothing"
      - "live: bidder_container_integration_test vm_delete_result 200 through the wrapper (release from the SAME owner DID; the door releases as the owner, so a foreign signer is not needed)"
  - id: M2-WRAPPER
    milestone: M2
    title: runComputeContract reimplemented as a thin wrapper over the event core
    decision: socialweb-computer-ssh and request-vm-ssh stay unchanged (user chose to leave the ssh door on the wrapper).
    status: done
    evidence:
      - "28a1be5 runComputeContract = requestCompute + existing ssh session + releaseCompute unless keepVm; signature, options, ContractFlowResult unchanged; old flow code deleted"
      - "test/bidder_container_integration_test.ts green before (38s) and after (44s), SSH_OK_VIA_IROH"
      - "deno check green: socialweb-computer-ssh (task check, requester-inproc, live_market_test), socialweb-computer-k8s (task check, node-market, requester-inproc, node_market_test, live_market_node_test)"
  - id: M2-CLAIM-RECEIPT
    milestone: M2
    title: NodeClaim tracks receipt and contract URIs
    decision: The claim is the durable record a restarted door resumes from.
    status: todo
    evidence: []
  - id: M2-CODEGEN
    milestone: M2
    title: Go api/v1alpha1 generates the APIResourceSchema and a TS types plus validator package for the door
    decision: >
      Go types are the source of truth; drift check in deploy/check.sh; shared JSON fixtures both
      suites round-trip. Protobuf rejected because CRDs travel as JSON/OpenAPI through kube and kcp.
      Mapping rules (reflection over json tags, apigen:"optional" struct tag, enums from source
      constants, revision lock), decided by Claude, user may veto; recorded in ARCHITECTURE section 6
      "Generated from api/v1alpha1".
    status: done
    evidence:
      - "d1cb357 cmd/socialweb-apigen + internal/apigen: go generate ./api/... writes deploy/*-apiresourceschema.yaml, both APIExports, deploy/apiresourceschema-revisions.json and socialweb-computer-k8s/lib/common/socialweb-computer-k8s-api/mod.ts; Cluster, Node, AtprotoIdentity schemas and both exports byte-identical to the hand-written ones"
      - "d1cb357 NodeClaim status.contract += every ContractState field (version, phase, vmName, requesterDid, marketDid, payload/rfp/policy/bid/accept/receipt strongRefs, winner, receiptOk, vmAddress, bids, release, outcome, error, timestamps), all optional; old six fields kept; schema renamed v1alpha1-2.nodeclaims.socialweb.computer, clusters export re-pointed"
      - "99e894c door: socialweb-computer-k8s-common drops its NodeClaim wire types; the claim view moves to lib/abc; nodeclaim-kcp parses every claim with parseNodeClaim and asserts a status before PATCH"
      - "ee7e07c live proof internal/apigen TestAnAlreadyBoundWorkspaceKeepsTheNewContractFieldsAfterTheSchemaUpgrade on kcp v0.33.0 + kine: already-bound tenant prunes new fields on v1alpha1-1, in-place spec change Forbidden, re-point moves the existing binding to v1alpha1-2 (identity hash unchanged), new fields persist; PASS 14.8s; mutated to re-apply the old export it FAILS (still bound to v1alpha1-1)"
      - "red first: socialweb-computer-k8s/test/k8s_api_fixtures_test.ts failed TS2307 (package missing); internal/apigen fixtures_test failed to build (no model); then both green"
      - "drift red: a Go field added to NodeClaimStatus without a Revision bump -> check.sh FAILED apigen (revision lock: spec of v1alpha1-2 changed); with the bump but not regenerated -> check.sh FAILED apigen drift (diff of lock, export, schema, mod.ts); reverted"
      - "green: deploy/check.sh --fast (ok apigen, 8 generated files); socialweb-computer-k8s deno task check exit 0; deno task test 72 passed 0 failed 1 ignored (from a real-org-root copy; the worktree's ../../ siblings do not resolve)"
      - "deploy needed (not done, user deploys): install-provider.sh applies deploy/nodeclaim-apiresourceschema.yaml (creates v1alpha1-2) then deploy/cluster-apiexport.yaml (re-point); no binding migration; the door and the schema must ship together"
  - id: M2-BACKOFF
    milestone: M2
    title: Exponential no_bids back-off per cluster, capped at 10m
    decision: >
      decided by Claude, user may veto. A claim ending Failed with status.contract.rfpUri set and
      acceptUri empty (nodemarket.MarketDeclined: the requester's NO_CONTRACT_OUTCOMES class, no_bids,
      bids_denied, policy_rejected, which all loop identically) backs that cluster's further market
      provisions off 30s*2^(n-1), capped at 10m; one end counted per confirm pass. A node newly
      joining or intent dropping to none resets it; a provision does not. Classified from record
      URIs, not message text; no status.reason field because APIResourceSchema.spec is immutable
      and a schema change does not reach existing APIBindings (internal/versions/versions.json), so
      no schema bump and no door code change. State in memory only: a provider restart resets it.
      Failures after an accept keep today's behaviour. ARCHITECTURE section 10.
    status: done
    evidence:
      - "0807250 scale.State.Backoff + scale.BackoffDelay + Decision.BackoffUntil; scaledriver Declined/Joined; nodemarket.MarketDeclined + Host.End; confirmHeld reports declined/newly-joined nodes, wiring feeds the driver before the pass and logs backoffUntil on the node-scale line"
      - "0807250 also fixes tenantNodes.retain dropping ordinal 1 when the primary slot was empty: a first node claimed again after the first was given up was never held, confirmed, released or counted in flight (surfaced by the back-off test: one gap read 5s)"
      - "d336b86 door guard: socialweb-computer-k8s test/node_market_test.ts 'a no-bids end keeps the rfp it asked with and names no accept'; door deno task check green, deno task test 67 passed 0 failed 1 ignored (run from a copy at org-root depth, the worktree's ../../ siblings do not resolve)"
      - "tests watched to fail (against stubs: gaps read [5s 5s 5s 5s 5s 5s 5s], the prod loop) then pass: cmd/socialweb-clusterprovider TestNoBidsEndsBackTheMarketOffAtGrowingIntervalsCappedAtTenMinutes (gaps 35s 1m5s 2m5s 4m5s 8m5s 10m5s 10m5s at a 5s pass), TestAMarketNodeThatJoinsResetsTheBackoff, TestIntentGoneResetsTheMarketBackoff, TestAFirstNodeClaimedAgainAfterItWasGivenUpIsHeld; internal/scaledriver TestConsecutiveNoBidsEndsProvisionAtGrowingIntervalsCappedAtTenMinutes, TestAJoinedNodeResetsTheBackoff, TestIntentGoneResetsTheBackoff, TestADeclinedEndRecordsWhyAndUntilWhen; internal/scale TestTheBackoffDoublesFromItsBaseAndStopsAtItsCap, TestADeclinedMarketHoldsTheNextProvisionUntilTheWaitIsOver, TestTheBackoffSurvivesAProvisionAndDiesWithTheIntent; internal/nodemarket TestAnEndWithAnRFPAndNoAcceptIsTheMarketDeclining, TestTheHostReportsADeclinedEndWithTheDoorsWords"
      - "guards that passed first time: TestAFailureAfterABidWasAcceptedDoesNotBackOff, TestANodeCountAtTheTargetIsNotReportedAsBackingOff"
      - "deploy/check.sh --fast green after 0807250"
      - "not yet proven on prod: a cluster with intent and no bidder reading RFPs at 30s/1m/2m/4m/8m/10m gaps and the 'backing off' node-scale line -- needs a deploy"
  - id: M3-CLUSTERLINK
    milestone: M3
    title: ClusterLink CRD and per-cluster dumbpipe listeners for the k3s apiserver and the cluster's OpenBao
    decision: >
      Listeners are procgroup components started after k3s beside postgres, openbao, kine and k3s.
      Guests dial the cluster; the door holds no per-node connection.
    status: todo
    evidence: []
  - id: M3-IROH-KEYS
    milestone: M3
    title: Iroh secret keys persisted in the cluster's OpenBao, public key expressed as did:key
    decision: Stable tickets across deploys; ed25519 encodings per artob/edky.
    status: todo
    evidence: []
  - id: M3-SECRETS-TICKET
    milestone: M3
    title: OpenBao ticket delivered through the --secrets capability
    decision: Only the public portion travels through the secrets flow.
    status: todo
    evidence: []
  - id: M3-JWT
    milestone: M3
    title: Guest authenticates to the cluster OpenBao by JWT and fetches k3s token, node password, server CA and apiserver ticket
    decision: >
      One JWT auth mount per bidder OIDC issuer (oidc_discovery_url is the bidder's public issuer),
      one role per NodeClaim bound to that guest's workload subject and audience, short token TTL,
      read-only on the claim's path, role deleted on release. Mount and discovery details decided
      by Claude, user may veto.
    status: todo
    evidence: []
  - id: M3-UNITS
    milestone: M3
    title: user_data installs systemd units for dumbpipe connect-tcp and the k3s agent; no ssh to guests
    decision: >
      Binaries come from our nodeimage when present, otherwise from the door hash-pinned (static
      musl amd64 and arm64, sha256 written into user_data). Invariant 13 changes from ssh stdin to
      OpenBao JWT over the cluster link.
    status: todo
    evidence: []
  - id: M3-NODE-LOSS
    milestone: M3
    title: A Node NotReady for 90s is released and replaced; door or provider restarts never reap
    decision: User chose 90s.
    status: todo
    evidence: []
  - id: M4-SCALE-IN
    milestone: M4
    title: Per-node scale-in
    decision: >
      A node holding nothing beyond baseline for the 2m hold is cordoned, drained and released.
      Supersedes plan 0002 section 4.4 (all-or-nothing).
    status: todo
    evidence: []
  - id: M4-ESO-BESIDE
    milestone: M4
    title: ESO runs beside the control plane per cluster and is removed from the tenant
    decision: >
      A process in our container against the tenant apiserver, webhook by loopback URL, store
      reaching the cluster OpenBao on loopback; works at zero nodes and closes the ESO-3 market gap.
    status: todo
    evidence: []
  - id: M4-PENDING-CRS
    milestone: M4
    title: Intent counts workloads beyond baseline plus our operators' CRs not yet reconciled
    decision: User chose workloads plus pending CRs; leftover namespaces, RBAC and ConfigMaps never hold nodes.
    status: todo
