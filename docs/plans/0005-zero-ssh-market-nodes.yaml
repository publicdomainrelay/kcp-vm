    milestone: M5
    title: Rust iroh pod mesh in rust/socialweb-meshd
    decision: >
      QUIC datagrams over iroh, a tun device, each peer Node's podCIDR routed to its iroh endpoint id;
      k3s --flannel-backend=none with bridge CNI. Lives in this repo (user chose).
    status: todo
    evidence: []
