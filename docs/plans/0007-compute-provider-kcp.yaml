source: >
  The user's request of 2026-10-07: from what the bidder's firecracker compute provider taught us, build
  compute-provider-kcp. Its TypeScript half is a ComputeProvider the bidder uses, configured
  automatically under `socialweb-computer run bidder`; it launches VMs by applying objects to kcp
  (Go-native, never kubectl); VM state lives in kcp, so a killed bidder still knows its running VMs. The
  user then decided: ComputeVM plus a Go controller; keep both providers, with compute-provider-firecracker
  as the GOLD STANDARD whose learnings are backported into the Go side with parity tests; no docker for
  Go VM runners (unprivileged, /dev/kvm through the kvm group); a lost guest is replaced through a new
  RFP; bidder identity keys live in an OpenBao beside the bidder; and the core binary and deno processes
  of BOTH the bidder and the gateway are upgradable while VMs keep running, each re-populating which VMs
  it owns afterwards. On 2026-10-11 the user decided the lifecycle: headless Linux servers; VMs survive a
  core crash, upgrade and logout; reboot = Lost; the VMM is launched directly by the service manager and no
  socialweb-computer code stays in a running VM's process tree; everything else in the decisions below.
principle:
  stated: >
    Decided by the user 2026-10-12, the ORGANIZING PRINCIPLE of plans 0006-0008 (full text and rules: plan
    0006 `principle`): kcp is a core part of APPLICATIONS, not a per-machine cluster; the virtual Kubernetes
    clusters project is the one traditional use.
  in_this_plan:
    - "A bidder handle is an application instance = its own kcp (one slot on kine-sqlite behind a port-0 front) + the bidder manifest set + a profile. Its state is ComputeVM, OpenBaoServer and HostProcess objects in that kcp; its components (the bidder deno, the vault, each VM unit) are DenoPods and HostProcesses reconciled from them. Two handles on one host never share a kcp; the host is only where they run (/dev/kvm, the shared account, the subuid range stay about the machine)."
    - "Modes are profiles over the one bidder manifest set: OAuth QR mode against a real account has no PDS pod; the market network profile gives the bidder its own PDS pod. No mode is a separate code path."
    - "The bidder and its requesters/gateways talk ONLY over the atproto market protocol (RFP, bid, accept, receipts, onNetwork, vm.hostKeys, vm.terminated). A requester never reads a bidder's ComputeVMs and the gateway never reads them either; what crosses applications is a market record."
    - "Every bidder listener behind the edge binds port 0 and reports into its kcp object's status (0006 principle.port0_rule)."
    - "kcp_use: traditional-exception marks the items that serve the virtual Kubernetes clusters project (NodeClaims, tenant nodes): M3-NODE-LOSS-CLOCK, M6-CLAIM-RESUME, M6-GATEWAY-REPOPULATE, M6-NOSSH-JOIN."
    - "Fifth fold (user 2026-10-12, 0006 principle.decomposition): the bidder is a MarketBidder root object in its own kcp (0006 M2-APP-CONTROLLER), also inside a market network, where the market network's MarketNetwork applies it into the bidder's own kcp and copies the network values onto it. Its sign-in is a MarketIdentity (M1-MARKET-IDENTITY) whose pending actions the foreground CLI renders; every hono-bidder option maps to a root-object field or profile; hono-bidder runs only as a DenoPod entry (kcp only) from M5-RUN-BIDDER on; its keys, relay keypairs, OIDC JWK and OAuth session live only in its OpenBao (M4-BIDDER-VAULT); its guest-facing endpoints become their own DenoPod (M5-BIDDER-COMPONENTS); guests are reached over iroh only."
state_rules:
  - TypeScript lives in this repository (decided by the user 2026-10-12): the closure's ten repositories were vendored with their history under ts/<repository>/ and the originals are frozen; a path this plan names under ts/ is changed here, never in the original.
  - Item status (todo, doing, done, blocked) lives here; the git history is the evidence. No evidence lists are added (user, 2026-10-12).
  - status is one of todo, doing, done, blocked.
  - An item is done when its done_when holds on main; the commits say how.
  - Open items are mirrored in NEXT.yaml (P7-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user; one marked
    "decided by the user 2026-10-07", "decided by the user 2026-10-11" or "decided by the user 2026-10-12"
    was.
  - An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>.
  - >
    RFP flow is the spine (org-root CLAUDE.md). Every test that needs a live guest drives the requester
    (requestCompute / runComputeContract) against a bidder through RFP, bid, accept and cloud-init
    user_data. No test or code boots a guest any other way: no fixture-booted guest, no boot from a
    boot-spec, no hand-made user_data. Live unit mechanics without a guest use stand-in executables in
    transient units.
  - >
    Linux only (decided by the user 2026-10-11). OS-specific bodies live in GOOS-tagged files behind the
    vmruntime, hostsvc and guestnet interfaces; darwin and windows compile stubs returning ErrUnsupported,
    gated by 0006:M0-XOS-GATE. The Windows backend is plan 0011, the macOS backend plan 0012.
  - >
    Dev run mode is kcp-native now (decided by the user 2026-10-12; 0006 state rule): every VM unit is a
    HostProcess child of its ComputeVM, placed on systemd-user in production and on proc (devsup) in dev
    and tests; a bidder's kcp is one slot on kine-sqlite. Dev adds no provisioning path: a dev instance's
    guests come up only through runComputeContract against that instance's bidder.
  - >
    Market network per workstream (decided by the user 2026-10-12; 0006 state rule). This plan's live tests run in the
    task's own market network (a git worktree of this repository; 0008 M1-MARKET-NETWORK-PARALLEL, later
    `dev up --profile market-network`), with the market network's own bidders and
    requesters. The shared real bidder (bobvmbuilder on hat-8) and alice are a final soak only, after the
    market network tests pass.
  - >
    Every org repo works on `main` and is pushed to GitHub as work lands (decided by the user 2026-10-12):
    atproto-market, hono-compute-provider, typescript-helpers, did-key-associator and socialweb-computer-k8s
    changes for this plan are committed on main (or merged to it from a worktree branch) and pushed when
    the item or its red-first step lands.
  - >
    A new NSID the bidder or the requester writes follows M1-PROTOCOL-CHECKLIST, in its order, before any
    live run publishes it.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the vendored deno-kcp market network, and the atproto-market requester
    libraries. Decided by the user 2026-10-07: anything in hono-compute-provider and atproto-market may be
    changed; decided by the user 2026-10-12: committed on main and pushed to GitHub as work lands (replaces
    "committed only, never pushed"). Also changed by this plan, same rule: typescript-helpers (oauth-scope
    role sets) and did-key-associator (QR client scope, deploy script) for M1-PROTOCOL-CHECKLIST,
    M1-QR-DEPLOY and M4-HOST-KEYS, and socialweb-computer-k8s (the door) for M6-*.
  not_owned: >
    The market protocol records and lexicons. This plan changes no existing record, NSID or wire shape: the
    bid config, receipt, onNetwork and vm.delete records stay what the firecracker provider writes. The only
    protocol additions are two bidder-authored records carried in the existing market.event envelope:
    com.publicdomainrelay.temp.compute.events.vm.terminated (decided by the user 2026-10-12,
    M4-TERMINATION-EVENT) and com.publicdomainrelay.temp.compute.events.vm.hostKeys (decided by the user
    2026-10-12: guest-reported SSH host keys replicating onNetwork; the separate NSID rather than new
    onNetwork fields decided by Claude, user may veto; M4-HOST-KEYS). kcp objects introduced here are local
    state of one host and are never published.
research:
  measured_on: "2026-10-07; hono-compute-provider c06b2ad, atproto-market 117ab30, deno-kcp 25d10f92, kcp-libs f6911d2, this repo 13349d6. Lifecycle research and proofs 2026-10-09..11 against f0460fd and hono-compute-provider 4d7da59, see vm_lifecycle_2026_10_11"
  compute_provider_abc: "hono-compute-provider lib/abc/compute-provider/mod.ts:39-55 ComputeProvider {name, provision, destroy, createBidConfig, injectAcceptBundle, getDroplet?, setup?, teardown?} (OS-free; no TypeScript seam needed for other host OSes)"
