  - id: M2-VM-RUNTIME
    milestone: M2
    title: The Linux VM runtime - one-shot prep, one transient service per VM whose tree is pasta -> firecracker, graceful stop
    depends_on: [M0-VM-USERNS, M1-DECIDE, M1-GUEST-IMAGE, "0006:M2-HOST-UNITS", "0006:M2-HOST-BACKEND-PROC", "0006:M2-HOST-CONFORMANCE", "0006:M1-ASSETS", "0006:M2-VM-TREE-AUDIT"]
    decision: >
      Third fold 2026-10-12 (decided by the user: dev run mode kcp-native now, ComputeVMs placed through
      HostProcess; details decided by Claude, user may veto, dev-run-mode.md 4.2 and 5): Runtime composes a
      hostsvc.Manager of EITHER backend and produces the VM's UnitSpec (the HostProcess child's spec, placed
      by the supervisor, 0006 M2-HOSTPROCESS-KIND; M2-CONTROLLER owns that child); Watch is Manager.Watch;
      on proc the tree is devsup -> the unit's process group (userns stage gone, pasta -> firecracker), the
      cgroup limits are recorded unenforced through Capabilities().EnforcesLimits=false as a ComputeVM status
      condition, and the VM's memory stays capped by firecracker's machine-config; the API socket lives
      under the instance's runtime dir ($XDG_RUNTIME_DIR/swc/<id8>/swvm/ in dev). The userns stage is the one
      M0-VM-USERNS chose. RuntimeRef.backend names the placement backend (systemd-user | proc); the
      hypervisor is status.image.hypervisor.
      Replaces M2-UNPRIVILEGED-RUNNER (deleted 2026-10-11: it started each guest as a resident `internal
      nodeboot` wrapper, and its test booted a guest from a fixture boot-spec, an RFP-spine violation).
      Decided by the user 2026-10-07: no docker for VM runners; unprivileged through /dev/kvm via the kvm
      group, never chmod. Decided by the user 2026-10-11: no socialweb code in the VM's process tree; ONE
      shared lingering account; identical guest network; console to a capped file; graceful stop first
      (SendCtrlAltDel over the API socket, a grace window measured live on the market network, then the unit
      stops with KillSignal=SIGKILL; x86_64 only, arm64 goes straight to SIGKILL until a guest-side shutdown
      path exists). Decided by Claude, user may veto (exploration B1-B3, linux-proofs E1-E5): internal/vmruntime
      (interface Runtime {Capabilities, Prepare, Start, Inspect, Stop, List, Cleanup}; VMSpec, RuntimeRef,
      Verdict, LostReason; ForHost() picks the backend compiled for GOOS) with firecracker_linux.go composing
      hostsvc, internal/guestnet (pasta_linux.go), internal/guestdisk (clone_linux.go FICLONE with copy
      fallback, truncate, seed.go pure-Go NoCloud cidata drive) and internal/fcapi (firecracker client over
      the unix socket + config writer), plus unsupported_other.go. Seed, decided by the user 2026-10-12: a
      SEPARATE pure-Go NoCloud cidata drive (vfat or iso9660 labelled cidata, written without any host tool);
      the rootfs is copied as-is (reflink clone) and only truncated to the contract's disk; the guest grows
      its own root (M1-GUEST-IMAGE); debugfs, e2fsck and resize2fs are not run on, or needed by, any host.
      Prep is one-shot in the controller: clone
      the rootfs, truncate to the contract's disk, write cidata.img (user-data, meta-data), fc.json
      (boot-source, drives rootfs + cidata, machine-config, network-interfaces host_dev_name fctap0 + MAC),
      params.json; the work dir is <state>/handles/<hid>/vms/<name> (0700, one uid); the API socket is
      $XDG_RUNTIME_DIR/swvm/<short-id>.sock (< 108 bytes, unlinked before start). Per-VM user namespace,
      decided by the user 2026-10-12 (replaces the shared-account blast-radius limit): `install bidder`
      (0006:M1-INSTALL) reserves ONE subuid AND subgid range for the shared account (65536 ids x 256 slots);
      each VM unit runs pasta and firecracker in its own user namespace mapped to its own 65536-id sub-range
      (inside 0..65535 -> host base + k*65536 ..), the rootless-podman pattern through the distro's setuid
      newuidmap/newgidmap, so a VMM escape lands in an unprivileged host uid that owns nothing. Decided by
      Claude, user may veto: the slot k is the lowest index not named by any loaded socialweb-vm-* unit of
      the ACCOUNT (every handle shares the range), chosen under an flock on <state>/vmslots.lock held until
      StartTransientUnit returns (two handles' controllers never pick the same slot), and carried in the
      unit's argv, so adoption reads it back from the unit and no counter is persisted. The VMM's host uid
      gets access to exactly its own work files by POSIX ACL entries the controller sets in prep (an owner
      may name any uid in an ACL; no chown, no privilege): rw on rootfs.ext4, r on cidata.img and fc.json, x
      on the path to the work dir and the API socket dir (incl. $XDG_RUNTIME_DIR), rwx on its socket dir;
      nothing else under the account's home, state dir, vault or another VM's dir names a slot uid. The
      supplementary kvm group is retained across the userns entry (no setgroups call), so /dev/kvm opens by
      group. The first stage of ExecStart is a one-shot that creates the user namespace, has the maps written
      by newuidmap/newgidmap and execve's pasta inside it, leaving no process behind (the util-linux
      `unshare --map-users` pattern: a short-lived helper child writes the maps and exits);
      unshare(CLONE_NEWUSER) refuses a multi-threaded caller, so which binary runs that stage - a
      single-threaded stage of ours, or the host's util-linux unshare >= 2.38 as a stated host prerequisite
      beside newuidmap - is measured by M0-VM-USERNS (moved there 2026-10-12, with its fallbacks). Unit
      socialweb-vm-<hid>-<name>.service (hid = first 10 hex of sha256(handle)): ExecStart = <userns stage,
      slot k> --
      runtime/<pasta-sha>/pasta --config-net (the identical address plan; host address = pasta's mapped
      gateway, constant) -- /bin/sh -c 'exec "$0" "$1"' runtime/<vmexec-sha>/socialweb-vmexec params.json (the
      trampoline SELinux requires); socialweb-vmexec (new tiny asset, cmd/socialweb-vmexec) creates the
      persistent tap and bridge over netlink in pasta's namespace (the nodevm.WireNamespace logic without
      exec'ing ip) and execve's runtime/<fc-sha>/firecracker --id <vm-name> --config-file fc.json --api-sock
      <sock>; after start the cgroup holds pasta + firecracker only. Properties: Type=exec, Restart=no,
      KillMode=control-group, KillSignal=SIGKILL (firecracker ignores SIGTERM as PID 1 of pasta's PID
      namespace), TimeoutStopSec=10, MemoryMax = guest mem + VMM overhead, MemorySwapMax=0, OOMPolicy=stop,
      TasksMax, CPUQuota, CPUWeight, Slice=socialweb-b-<hid>.slice (not app.slice), no AllowedCPUs, no
      IOWeight, no ManagedOOMPreference, Environment=TZ=UTC, StandardOutput=append:<work>/console.log and
      StandardError=append:<work>/vmm.log (tenant data never enters the host journal; the controller caps
      each file by copy-truncate rotation keeping one bounded predecessor, and both go with the work dir on
      release), PropExecStart(argv, false), CollectMode=inactive. Start records RuntimeRef {backend
      systemd-firecracker, ref unit, instance InvocationID, pid = the firecracker pid (the cgroup's process
      whose exe is the pinned firecracker), startTime, hostBootID, vmmID}, then polls GET / for {id ==
      vmmID, state Running} within the boot timeout. Stop: x86_64 PUT /actions SendCtrlAltDel, wait
      spec.stopGraceSeconds (default = the grace window measured in M6-BIDDER-UPGRADE, recorded in
      versions.json) for the unit to go inactive, then StopUnit (SIGKILL to the cgroup); aarch64 StopUnit at
      once; then record Result, ResetFailedUnit, remove the work dir and socket. The resident namespace verb,
      nodevm.RunNamespace, WriteNamespaceRecord, FindVMM, WriteInstance and cmd/socialweb-nodeboot are
      deleted. Live measurement (linux-proofs E8, 2026-10-12, through the RFP flow): SendCtrlAltDel -> firecracker
      exit 0 took 0.21 s on an IDLE guest (the guest's ctrl-alt-del.target -> reboot.target, which firecracker
      treats as VM exit); the grace window with a k3s workload is still to measure (M6-BIDDER-UPGRADE). Two live
      defects of today's provider (E8) this runtime must make impossible, decided by Claude, user may veto:
      (a) VM death unnoticed - after firecracker exited, the nodeboot parents and the runner container stayed
      up and the bidder never noticed. Here the VMM is the only child of pasta in the unit: when firecracker
      exits for ANY reason (guest reboot or poweroff, CtrlAltDel, crash, kill) pasta exits and the unit goes
      inactive or failed with nothing of the VM left in its cgroup; Inspect reports that on the next call, and
      Runtime exposes a Watch (D-Bus PropertiesChanged on the unit's ActiveState) so the controller learns it
      within seconds instead of a pass interval. (b) Work dirs never removed - 32 dirs, 63 GB on hat-8. Here
      Stop and Cleanup remove the work dir (rootfs clone, cidata, console and vmm logs) and the API socket
      for every terminal outcome (released, Lost, Failed, boot timeout), and List reports work dirs under
      <state>/handles/<hid>/vms/ so the controller can collect any with no ComputeVM (M2-CONTROLLER).
    files: ["internal/vmruntime/", "internal/guestnet/", "internal/guestdisk/", "internal/fcapi/", "internal/vmruntime/subids_linux.go (slot choice, flock, ACL grants)", "cmd/socialweb-vmexec/ (tap stage; userns stage if chosen)", "internal/nodevm, internal/nodefirecracker (deleted or reduced)", "cmd/socialweb-nodeboot (deleted)", "docs/bidder-host.md (kvm group and subuid range via `install bidder`)"]
    test_first: >
      Offline: TestPrepareWritesASeedDriveAndFcJsonAndNoHostToolIsExecd, TestTheVMUnitSpecHasSigkillSwapZeroAndNoIgnoreFailure,
      TestTheApiSocketPathIsUnder108BytesAndUnlinkedFirst, TestStopSendsCtrlAltDelThenWaitsTheGraceThenStopsTheUnit
      (fake fc API and fake hostsvc, x86_64), TestStopOnAarch64GoesStraightToStopUnit, TestTheConsoleFileIsCappedByRotation,
      TestCleanupRemovesTheWorkDirAndSocketForEveryTerminalOutcome (released, Lost, Failed, boot timeout),
      TestTheSubRangeSlotIsTheLowestNotNamedByAnyLoadedVMUnitOfTheAccount (another handle's units count),
      TestTwoConcurrentPreparesNeverPickTheSameSlot, TestPrepareGrantsTheSlotUidItsOwnWorkFilesByACLAndNothingElse,
      TestTheSeedIsASeparateCidataDriveAndTheRootfsIsNotEdited (fc.json lists two drives; the rootfs bytes
      equal the image's up to its original size).
      Behind livegate on hat-8 with stand-ins (a stand-in VMM that ignores SIGTERM like firecracker, pinned as
      a test asset; never a guest): TestTwoVMUnitsMapDisjointSubRanges (two stand-in VM units:
      /proc/<vmm>/uid_map and gid_map name disjoint sub-ranges inside the account's reserved range),
      TestTheVMMUidOwnsNoBidderFile (no file under the account's home and state dir is owned by either
      stand-in VMM's host uid; from inside the stand-in, opening the bidder vault dir, the kcp state and the
      other VM's rootfs is EACCES while its own rootfs opens and /dev/kvm opens by group),
      TestTheVMUnitsTreeIsPastaAndTheStandInOnly (0006:M2-VM-TREE-AUDIT passes; the userns stage is gone),
      TestAStopOfAVMMThatIgnoresSigtermEndsWithinTimeoutStopSec, TestTheVMUnitSurvivesSystemctlRestartOfTheBidderUnit,
      TestAVMMThatExitsOnItsOwnEndsItsUnitAndLeavesNoProcess (the stand-in exits 0 and, separately, is killed:
      the unit is inactive/failed, its cgroup is empty, pasta is gone, and Watch reported it within 2 s - E8
      defect a). The stand-in live tests run through the 0006 M2-HOST-CONFORMANCE harness on systemd-user and
      on proc (TestTheVMUnitsTreeIsPastaAndTheStandInOnly and TestAVMMThatExitsOnItsOwnEndsItsUnitAndLeavesNoProcess
      on both), plus TestOnProcTheComputeVMRecordsLimitsUnenforced. Red first.
    done_when: "offline and stand-in tests green; a real guest's boot, stop grace, tree audit and the no-leak readings are proved by M6-BIDDER-UPGRADE through the RFP flow."
    risks:
      - "E8 measured 0.21 s from SendCtrlAltDel to exit on an IDLE guest; the grace with a k3s workload is unmeasured, so a 10 s placeholder stays the default until M6-BIDDER-UPGRADE records the loaded value."
      - "The CI kernel (M1-GUEST-IMAGE) must keep CONFIG_SERIO_I8042 and CONFIG_KEYBOARD_ATKBD (E8's guest had both) or SendCtrlAltDel does nothing and every stop waits the full grace."
      - "pasta's mapped-gateway flag differs across pasta versions; the flag is pinned against the pinned pasta asset's own --help in this item."
      - "pasta inside an already-unprivileged user namespace (mapped to a subuid) still has to create its net namespace and the tap; proved with the stand-in first, and the SELinux pasta_t trampoline (linux-proofs E4) re-measured under the extra namespace."
      - "Whether firecracker's jailer-free run inside a subuid namespace keeps /dev/kvm by the retained supplementary group on every target distro is measured; if a distro drops it, the fallback is an ACL entry on /dev/kvm for the reserved range, written by install, recorded as a deviation."
