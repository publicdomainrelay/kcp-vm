  - id: M6-GATEWAY-REPOPULATE
    milestone: M6
    kcp_use: "traditional-exception (virtual Kubernetes clusters project: NodeClaims; 0006 principle)"
    title: After an upgrade the gateway re-populates every VM it owns, including ones rented from bidders elsewhere
    depends_on: ["0008:M3-DOOR-DENOPOD", "0006:M3-CLUSTER-UNITS", M4-BIDDER-VAULT, M6-CLAIM-RESUME, M4-HOST-KEYS, M3-NODE-LOSS-CLOCK]
    decision: >
      Decided by the user 2026-10-07: the gateway's core binary and deno processes are upgradable while VMs
      keep running, and afterwards it re-populates which VMs it owns from NodeClaims, receipts and market
      records. Decided by the user 2026-10-12: control-plane continuity across upgrades of the finished system
      is blue/green behind a per-cluster front (0006:M3-CP-CONTINUITY), and in-flight claims resume
      (M6-CLAIM-RESUME). Decided by Claude, user may veto: the door builds one ownership table at start and on
      a timer from (1) every NodeClaim's status.contract, (2) the accept records its requester repos wrote
      and the vm.delete events they submitted, (3) the receipts in the winners' repos that reference those
      accepts, (4) onNetwork records, and (5) the tenant clusters' Node objects. The record scan (2)-(4) runs
      only for claims carrying status.contract.acceptPending and for receipts with no claim at all; every
      other claim is resolved from the claim alone. Rules: a receipt with a claim and a joined Node is
      adopted (no write); a receipt with a claim and no Node follows plan 0005 M3-NODE-LOSS with the rebased
      clock (M3-NODE-LOSS-CLOCK); a vm.delete already submitted is never submitted twice. A receipt with NO
      claim (the claim lost while the VM lives) is ADOPTED FIRST with a usage check (decided by the user
      2026-10-12, replacing the 2026-10-11 release-unless-joined default): the door writes a claim in the new
      phase Adopting and matches the guest to a tenant Node only when all three agree - the Node's name equals
      the guest name (vmName) in the door's own compute.vm record for that receipt, the cluster's OpenBao
      holds role node-<name>, and the receipt's bidder-signed vm.hostKeys record (M4-HOST-KEYS, verified
      and bound to the receipt) is present as the guest's signed identity; any disagreement is no match.
      Then: joined and Ready -> adopted into that cluster (the claim moves to the phase a joined claim has,
      no vm.delete, no RFP); not joined, but its user_data targets a cluster that still exists (the cluster
      named by the ticket and claim.json the door's vm record carried) -> wait the join grace (the 2 m
      never-Ready grace, rebased to pathUpSince by M3-NODE-LOSS-CLOCK) and adopt on join; the cluster is
      gone, or the grace passes with no join -> release once (releaseCompute, one vm.delete). Control planes
      stay up across the upgrade (0006:M3-CLUSTER-UNITS), so joined nodes stay Ready.
    files: ["socialweb-computer-k8s/lib/socialweb-computer-k8s-node-market (ownership table, Adopting phase, adoption match)", "api/v1alpha1 NodeClaim (phase Adopting, in M6-CLAIM-RESUME's schema revision)", "ts/atproto-market/lib (requester record listing helpers)"]
