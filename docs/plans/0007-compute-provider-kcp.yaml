  - id: M2-CONTROLLER
    milestone: M2
    title: The Go ComputeVM controller boots, adopts by the tri-state Verdict, and releases
    depends_on: [M1-API, M2-VM-RUNTIME, "0006:M2-APPLY"]
    decision: >
      internal/computevm, a client-go informer loop over the bidder's kcp (decided by Claude, user may veto,
      2026-10-11: no dependency on the forked deno-kcp controller factory). A ComputeVM without
      deletionTimestamp: Preparing (image ensure, prep), Booting (unit started), Running (GET / Running). With
      deletionTimestamp: Releasing, graceful stop (M2-VM-RUNTIME), remove the work dir, drop the finalizer.
      Re-population after any restart or upgrade (decided by the user 2026-10-07: the bidder re-populates from
      ComputeVM plus live VMM state) by the Verdict, decided by the user 2026-10-11 (mismatch on an active unit
      = Lost and StopUnit immediately; unreachable bus or socket = Unknown, retried, never Lost), evaluated in
      order: bus dial/auth/timeout -> Unknown (condition RuntimeObserved=Unknown, phase unchanged, backoff);
      status.runtime.hostBootID != the current boot_id -> Lost(HostRebooted), nothing to stop; unit NoSuchUnit
      -> Lost(UnitGone); unit failed or inactive -> Lost(UnitFailed | OOMKilled | VMMExited from Result and
      ExecMainStatus), recorded, then ResetFailedUnit; unit active with InvocationID != recorded, or the
      recorded pid failing pidfd_open / start ticks / pidfd_send_signal(0), or GetUnitByPIDFD answering
      UnixProcessIdUnknown, NoUnitForPID or another unit -> Lost(IdentityMismatch) and StopUnit immediately;
      identity matches but the API socket is unreachable or times out -> Unknown; GET / id != vmmID or state !=
      Running -> Lost(IdentityMismatch) and StopUnit immediately; all match -> Running. A Lost guest is never
      booted again (decided by the user 2026-10-07: replaced through a new RFP; plan 0005 M3-NODE-LOSS does
      that from the requester side), and the receipt stays releasable. Orphans: a unit with prefix
      socialweb-vm-<hid>- of THIS handle and no ComputeVM is reported and stopped after a 10-minute grace;
      units of other handles on the shared account and of beds (socialweb-bed-*) are never touched (name
      filter in hostsvc.List). A user-manager restart, linger removal or `loginctl terminate-user` leaves no
      units: every ComputeVM goes Lost(UnitGone), the same as a reboot. Against the two E8 live defects
      (2026-10-12; decided by Claude, user may veto): (a) a VM that dies is noticed - the controller consumes
      vmruntime Watch, so a unit going inactive or failed while its ComputeVM is not Releasing becomes
      Lost(VMMExited | UnitFailed | OOMKilled) within seconds, not at the next pass; the provider learns it
      from the ComputeVM watch (M3-TS-PROVIDER), and the requester's side replaces the node through plan 0005
      M3-NODE-LOSS. (b) nothing of a VM outlives it - the finalizer is removed only after the work dir and the
      API socket are gone (Cleanup verified by stat), for a Lost or Failed ComputeVM as well as a released
      one; a work dir under <state>/handles/<hid>/vms/ with no ComputeVM of this handle and no unit is
      removed after the same 10-minute grace as an orphan unit, and every removal is logged with its size.
    files: ["internal/computevm/", "internal/stack/bidder"]
    test_first: >
      Offline (fake hostsvc, fake fc API, fake kcp), one test per Verdict row, plus
      TestAnUnreachableBusIsUnknownNeverLost, TestAnUnreachableApiSocketWithMatchingIdentityIsUnknown,
      TestIdentityMismatchStopsTheUnitImmediately, TestABootIDChangeMakesEveryVMLostWithoutStartingAnything,
      TestALostGuestIsNeverBootedAgain, TestDeletingAComputeVMStopsGracefullyAndRemovesItsWorkDirBeforeTheFinalizerGoes,
      TestAnotherHandlesUnitIsNeverTouched, TestABedUnitIsNeverTouched,
      TestAVMMExitObservedByWatchMakesTheComputeVMLostWithinOneEvent (E8 defect a),
      TestTheFinalizerStaysUntilTheWorkDirIsGoneForReleasedLostAndFailed and
      TestAWorkDirWithNoComputeVMAndNoUnitIsRemovedAfterTheGrace (E8 defect b; a fake vms/ tree seeded with
      32 orphan dirs is empty after one pass past the grace, another handle's dirs untouched). Red first.
    done_when: "offline tests green; live proofs are M6-*."
    risks: ["A false Lost costs a tenant a VM (LXD shipped this bug); every Lost row names a definite answer from the kernel or systemd, and the tests pin that transport errors never reach a Lost row."]
