semantics:
  bidder_deno_restarts_or_upgrades: "DenoPods restart on the new closure; setup() rebuilds getDroplet from ComputeVMs; ContractStore seeds activeContracts; the vault keeps the did, issuer URL and keys; VMs never notice."
  bidder_core_binary_upgraded_or_killed: "kcp, the controller and the deno processes stop with the unit; VM units and the vault unit are separate and keep running; on start the controller re-populates from ComputeVM plus live VMM state (unit active, pid start ticks, API socket)."
  gateway_upgraded: "control planes in their own units keep serving; the door re-populates its ownership table from claims, receipts, market records and Nodes; joined nodes stay Ready; no RFP and no vm.delete is caused by the restart."
  kcp_state_lost_on_a_bidder: "every socialweb-vm unit of this bidder becomes an orphan and is stopped after its grace; its receipts can no longer be honoured - a stated limit; the bidder state dir is durable state, backed up with its vault."
  host_reboots: "transient units are gone, so every VM is gone; Running ComputeVMs become Lost; the requester replaces them through new RFPs (plan 0005 M3-NODE-LOSS) and releases the old receipts, which delete the Lost ComputeVMs."
  vm_delete: "bidder onVmDelete -> provider.destroy -> DELETE ComputeVM -> finalizer stops the unit and removes the work dir -> 404 -> 200 to the requester."
