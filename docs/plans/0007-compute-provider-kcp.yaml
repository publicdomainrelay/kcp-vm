    - "cmd/socialweb-nodeboot/main.go:26-29 boots from -spec, stops by -stop -work-dir; :283-288 refuses a second boot in a work dir already holding a guest; it re-execs itself for the namespace verb, and pasta runs inside the guest's namespace to wire the tap and start the VMM (:305-310); the namespace verb (nodevm.RunNamespace -> nodefirecracker.runVMM, namespace.go:15-58) STAYS RESIDENT as firecracker's parent with Pdeathsig and writes instance.json (exploration F2); prep is in-process: reflink clone, NoCloud seed written with host debugfs -w, grow with host e2fsck + resize2fs (F3); console unbounded into <work>/guest.console (F4); node images built ON THE BIDDER with chroot + apt-get + go build, kernel = the host's /boot kernel (F5)"
