  - id: M1-API
    milestone: M1
    title: ComputeVM in api/v1alpha1 with an OS-neutral status, generated schema, export, workspace type and TypeScript wire types
    depends_on: [M1-DECIDE, "0005:M2-CODEGEN", "0006:M2-MANIFESTS"]
    decision: >
      Go types are the source of truth (plan 0005 M2-CODEGEN). ComputeVM spec: vm {cpus, mem, disk, role},
      owner {handle} (shared account, decided by the user 2026-10-11: the controller and GC namespace by
      handle), userDataSecret, requester {did, plc}, contract {receiptUri, receiptCid, acceptUri, acceptCid,
      submitEventUrl, acceptedAt}, image {reuseStale}, stopGraceSeconds. No network index anywhere: every
      guest gets the identical address plan in its own pasta namespace (decided by the user 2026-10-11), so
      user_data enrichment is final at create time and there is no two-phase write. Status through /status by
      two field managers (decided by Claude, user may veto), OS-neutral so the Windows and macOS backends
      (plans 0011, 0012) need no schema revision: the controller owns phase (Pending, Preparing, Booting,
      Running, Releasing, Lost, Failed), lostReason (HostRebooted, UnitGone, UnitFailed, OOMKilled, VMMExited,
      IdentityMismatch), observedGeneration, network {guestIP, hostAddress, prefix, mac}, image {ref, sha256,
      hypervisor}, runtime {backend (free string, no enum), ref, instance, pid, startTime (opaque string),
      hostBootID, vmmID}, workDir, bootedAt, message, conditions (Prepared, Started, RuntimeObserved
      True|False|Unknown, GuestReported) - Unknown is a CONDITION, the phase stays what it was; the provider
      owns market {onNetworkUri, address, hostKeys[] {type, publicKey, fingerprint}, hostKeysUri,
      reportedAt} (host keys from the guest's own report, M4-HOST-KEYS). Finalizer computevm.socialweb.computer/release;
      printer columns phase, guestIP, requester, age. Export computevms; WorkspaceType bidder binds
