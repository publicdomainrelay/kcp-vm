semantics:
  bidder_deno_restarts_or_upgrades: "DenoPods restart on the new closure; setup() rebuilds getDroplet from ComputeVMs; ContractStore seeds activeContracts; the vault keeps the did, issuer URL and keys; VMs never notice."
  bidder_core_binary_upgraded_or_killed: "the controller and the deno processes stop with the bidder unit (control-group); VM units, the vault unit and the handle's kcp units (kine on sqlite, the one slot, front; 0006:M2-KCP-SLOTS, corrected 2026-10-12) are separate units and keep running; on start the controller re-populates by the Verdict (unit, InvocationID, firecracker pid + start ticks, GET / id and state)."
  bidder_kcp_upgraded: "the handle's one kcp slot is restarted on the new asset (sqlite store copied first); kcp is down for its restart (~6 s measured on kine); VM units and the vault keep running; once kcp answers the controller re-adopts every VM by the Verdict; no VM is stopped because kcp was down (decided by the user 2026-10-12)."
  dev_instance: "under host-backend=proc every unit above is a child of the instance's devsup instead of the user manager: units survive a core restart and are adopted; every unit dies with devsup (dev down, crash), which is read as a user-manager stop (every ComputeVM Lost(UnitGone)); guests still come up only through runComputeContract (decided by the user 2026-10-12)."
  bidder_logout: "with linger, logging out of every session changes nothing."
  user_manager_stops: "user@<uid> restart, `loginctl terminate-user`, or linger removed: every unit stops; treated as a reboot - every ComputeVM Lost(UnitGone), none booted again."
  gateway_upgraded: "control planes in their own member units keep serving (0006:M3-CLUSTER-UNITS); k3s/kine upgrades are blue/green slots behind the per-cluster front (0006:M3-CP-SLOTS); the door resumes Bidding and Provisioning claims (M6-CLAIM-RESUME) and re-populates its ownership table from claims, receipts, market records and Nodes; joined nodes stay Ready; no RFP and no vm.delete is caused by the restart."
  our_path_down: "a cluster cold start, link restart or front restart is our outage: NotReady time counts only from when the apiserver and both ClusterLinks are back (M3-NODE-LOSS-CLOCK), so it never releases a tenant's node whose path returns."
  vmm_exits_on_its_own: "guest reboot, poweroff, crash or kill: firecracker exits, pasta exits, the unit is inactive or failed with nothing left in its cgroup; the controller sees it through Watch within seconds, marks the ComputeVM Lost, and the requester replaces the node (plan 0005 M3-NODE-LOSS); the work dir is removed before the finalizer goes."
  kcp_state_lost_on_a_bidder: "every socialweb-vm unit of this handle becomes an orphan and is stopped after its grace; its receipts can no longer be honoured - a stated limit; the bidder state dir is durable state, backed up with its vault."
  host_reboots: "transient units are gone, so every VM is gone; on start every ComputeVM whose hostBootID differs is Lost(HostRebooted) without probing; the requester replaces them through new RFPs (plan 0005 M3-NODE-LOSS) and releases the old receipts, which delete the Lost ComputeVMs."
  identity_mismatch: "an active unit whose InvocationID, VMM pid, start ticks or firecracker id differs from the record is Lost(IdentityMismatch) and its unit is stopped at once; an unreachable bus or API socket is Unknown and retried, never Lost."
  vm_delete: "bidder onVmDelete -> provider.destroy -> DELETE ComputeVM -> finalizer: SendCtrlAltDel (x86_64), grace, StopUnit with SIGKILL, work dir (console included) removed -> 404 -> 200 to the requester."
