      live run publishes it. The door's ContractState.hostKeys rides in M6-CLAIM-RESUME's one NodeClaim
      schema revision, so the door half lands with or after that revision.
      Decided by the user 2026-10-12: guest SSH host keys are guest-reported, replicating how onNetwork works:
      new atproto record(s) plus plumbing so the requester receives the host key(s) with the ssh command;
      request-vm-ssh and the gateway/door validate against the sent key as the known host key (no TOFU, no
      host-side scan). Decided by Claude, user may veto: ONE new record
      com.publicdomainrelay.temp.compute.events.vm.hostKeys (record, key tid) {keys [{type (ssh-ed25519,
      ecdsa-sha2-nistp256, ssh-rsa), publicKey (the base64 blob of a known_hosts line), fingerprint
      (SHA256:...)}], observedAt, createdAt}, written by the BIDDER in its own repo and wrapped in the
      existing com.publicdomainrelay.temp.market.event envelope {receipt, payload, signatures (the bidder's
      inline signature)}, submitted to the accept's submitEvent when it names one, firehose otherwise -
      exactly the vm.onNetwork and vm.terminated (M4-TERMINATION-EVENT) path. A separate NSID rather than new
      fields on onNetwork, because (a) onNetwork's shape stays field-for-field what the firecracker provider
      writes (ACC7-NO-PROTOCOL-CHANGE), (b) the keys exist only after cloud-init's ssh module, which is not
      the moment the network report fires, and (c) vm.terminated set the precedent of a new event NSID in the
      same envelope. Guest side (delivered only by user_data, the RFP spine): a hostKeysReporterModule in
      atproto-market lib/common/cloud-init-common's registry runs after cloud-init's ssh module, reads
      /etc/ssh/ssh_host_*_key.pub (the guest image bakes no host key, M1-GUEST-IMAGE), signs its single-use
      provisioning token with the ed25519 host key (`ssh-keygen -Y sign -n prove-sshd`, the proof today's
      provisioning exchange already uses) and POSTs {keys, signature, token} to the bidder's /v1/host-keys
      (same base URL and auth as /v1/on-network). Bidder side: the report is accepted only with a valid
      proof of possession over the token the bidder issued for that guest (so only the guest born from that
      user_data can report), at most once per receipt (a second, different report is refused and logged),
      then published as vm.hostKeys. The host-side scan is deleted: hono-compute-provider
      lib/oidc-issuer-hono getPublicKeyFromSshd (mod.ts:446-483, ssh-keyscan, through `container exec` into
      the runner container) goes, and provisioningValidate (:520-544) verifies the guest's signature against
      the reported ed25519 key bound to the same token. Requester side: the contract watch takes vm.hostKeys
      like vm.terminated (envelope signature verified, bound to the receipt and its bidder; forged or unbound
      events rejected) into ContractState.hostKeys; sshTunnelArgs (atproto-market lib/requester-xrpc/mod.ts:609-620,
      today StrictHostKeyChecking=no and UserKnownHostsFile=/dev/null) writes a per-contract known_hosts with
      exactly the reported keys under a HostKeyAlias derived from the receipt and passes
      StrictHostKeyChecking=yes; request-vm-ssh waits (bounded) for the keys and refuses to ssh without them.
      Gateway side: the door keeps ContractState.hostKeys on the NodeClaim (in the one NodeClaim schema
      revision of M6-CLAIM-RESUME) and every ssh command it prints or runs (today
      socialweb-computer-k8s hono-socialweb-computer-k8s/mod.ts:177, StrictHostKeyChecking=no) and the ssh
      door (0008:M4-RUN-GATEWAY-SSH) use the same known_hosts + StrictHostKeyChecking=yes. The record is also
      the guest's signed identity in M6-GATEWAY-REPOPULATE's adoption match. Both providers emit it (the
      firecracker provider now; compute-provider-kcp through M4-ONNETWORK). Like vm.terminated, the new NSID
      needs its scope in the bidder role set (typescript-helpers) and the QR client scope
      (did-key-associator), and the bidder re-signs in. Fifth fold 2026-10-12 (decided by the user: iroh is
      the only guest transport): after 0008 M1-STRIP-LEGACY-TRANSPORTS the only ssh path to a guest is the
      iroh (dumbpipe) ProxyCommand; the per-contract known_hosts and StrictHostKeyChecking=yes are written
      once, on that path (the websocat ProxyCommand of sshTunnelArgs is deleted, not fixed), so the
      requester half lands after the strip (execution_order shared files).
