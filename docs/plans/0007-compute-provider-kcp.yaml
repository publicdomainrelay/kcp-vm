  - id: M6-CLAIM-RESUME
    milestone: M6
    title: A restarted door resumes Bidding and Provisioning claims - per-claim secrets-server key in OpenBao, served state on the NodeClaim
    depends_on: []
    decision: >
      Split from M6-GATEWAY-REPOPULATE 2026-10-12. Decided by the user 2026-10-12: in-flight (Bidding,
      Provisioning) claims resume across a door restart, with a per-claim secrets-server key in OpenBao and
      served-state on the NodeClaim. Today the per-contract secrets server's Secp256k1 keypair, ingress
      subdomain and grant live in memory (atproto-market lib/guest-capability-secrets/mod.ts:50-75), so a
      restarted door marks those claims Failed (socialweb-computer-k8s node-market ORPHANED_PHASES, :487-495)
      and the guest's user_data names a secrets URL nobody serves. Decided by Claude, user may veto
      (control-plane-handover.md 7): (1) the keypair is created once per claim in the cluster's OpenBao at KV
      socialweb-door/claims/<claim>/secrets-ingress with check-and-set 0 (a losing writer takes the winner's
      value, the clusterlink EnsureKey pattern), so the ingress subdomain and the URL in the guest's user_data
      are a function of that key; (2) NodeClaim status.secrets {ingressDid, keyRef, url, servedAt} records
      what was served; (3) on restart the door re-creates the ingress from the key, rebuilds the authorizer
      grant from status.grant and the bundle (ticket, CA, claim.json are deterministic), and resumes
      awaitComputeNetwork, so the claim reaches Joining; (4) write-ahead status.contract.acceptPending
      {bidUri} before the accept record is written, so a restart between accept intent and accept record
      looks for an accept naming that RFP in the requester's repo and completes or releases exactly once.
      One NodeClaim schema revision carries status.secrets, acceptPending and M6-GATEWAY-REPOPULATE's
      Orphaned phase (APIResourceSchema.spec is immutable; versions.json our-crds). The KV path is in
      0006:M3-BAO-SYNC's desired set (live claim -> kept; claim gone -> deleted). Bidding/Provisioning leave
      ORPHANED_PHASES.
