  - id: M3-NODE-LOSS-CLOCK
    milestone: M3
    title: Our own outage never counts against a tenant's node - the NODE-LOSS clock counts only from when our side of the path is back up
    depends_on: []
    decision: >
      Decided by Claude, user may veto (control-plane-handover.md 6, Q-H6): plan 0005 M3-NODE-LOSS releases a
      market node whose Ready is False/Unknown for 90 s, timed from the tenant Node's lastTransitionTime
      (cmd/socialweb-clusterprovider/nodes.go:194-223). When OUR side of the path was down (a cluster cold
      start, a link restart, a front restart, a user-manager restart of the gateway), that clock bills our
      outage to the tenant's VM. NotReady time now counts from max(lastTransitionTime, pathUpSince), where
      pathUpSince is, per cluster, when the provider last saw BOTH the cluster's apiserver answer /readyz at
      status.URL (the front port after 0006:M3-APISERVER-FRONT) AND both ClusterLinks Listening, after any
      moment either was not; held in memory, and a provider start counts as path-up for the clusters it
      brings up or adopts. No rebase across a kcp, door or provider restart alone: the tenant's kcm keeps
      running and writes real transitions, so a node that died then is released on time. The never-Ready
      join grace (2 m, config.go:51) is rebased the same way.
    files: ["cmd/socialweb-clusterprovider/nodes.go (loss rule)", "internal/clusterprovider (pathUpSince per cluster from the readyz probe and ClusterLink phases)"]
