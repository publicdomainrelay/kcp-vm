  - id: M6-GATEWAY-REPOPULATE
    milestone: M6
    title: After an upgrade the gateway re-populates every VM it owns, including ones rented from bidders elsewhere
    depends_on: ["0008:M3-DOOR-DENOPOD", "0006:M3-CLUSTER-SCOPES", M4-BIDDER-VAULT]
    decision: >
      Decided by the user 2026-10-07: the gateway's core binary and deno processes are upgradable while VMs
      keep running, and afterwards it re-populates which VMs it owns from NodeClaims, receipts and market
      records. Decided by Claude, user may veto: the door builds one ownership table at start and on a
      timer from (1) every NodeClaim's status.contract, (2) the accept records its requester repos wrote
      and the vm.delete events they submitted, (3) the receipts in the winners' repos that reference those
      accepts, (4) onNetwork records, and (5) the tenant clusters' Node objects. Rules: a receipt with a
      claim and a joined Node is adopted (no write); a receipt with a claim and no Node follows plan 0005
      M3-NODE-LOSS (90 s, then release); a receipt with NO claim (claim lost while the VM lives) gets a
      claim written in phase Orphaned and is released by releaseCompute unless its Node is joined, in which
      case it is adopted; a vm.delete already submitted is never submitted twice. A restart no longer fails
      Bidding and Provisioning claims: the door's ingress keypair moves into the cluster OpenBao (stable
      secrets-server URL, the M4-BIDDER-VAULT pattern) and the secrets capability's served state is read
      back from the claim, so awaitComputeNetwork resumes them. Control planes stay up across the upgrade
      (0006:M3-CLUSTER-SCOPES), so joined nodes stay Ready.
    files: ["socialweb-computer-k8s/lib/socialweb-computer-k8s-node-market (ownership table, Orphaned phase)", "api/v1alpha1 NodeClaim (phase Orphaned: a schema revision and export re-point)", "atproto-market/lib (requester record listing helpers)", "socialweb-computer-k8s door ingress key loader"]
