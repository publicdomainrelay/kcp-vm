    title: Guest SSH host keys are guest-reported in a bidder-signed vm.hostKeys record and every ssh to a guest verifies them - no host-side scan, no TOFU
    depends_on: [M1-PROTOCOL-CHECKLIST, M1-QR-DEPLOY]
    decision: >
