questions_for_user:
  - "A receipt the gateway finds with no NodeClaim gets an Orphaned claim and is released unless its Node is joined (then adopted). Is release the right default for an unclaimed, unjoined VM?"
  - "Seed transport: a separate pure-Go NoCloud cidata drive plus in-guest resize, removing debugfs, e2fsck and resize2fs from hosts (M2-VM-RUNTIME, M1-GUEST-IMAGE)? Recommended: yes; it is also the only shape that ports to Hyper-V (0011) and VZ (0012)."
  - "Guest host keys become guest-reported (a cloud-init module posts fingerprints with onNetwork) instead of a host-side scan inside the guest's namespace (M2-BACKPORT, M4-ONNETWORK)? Recommended: yes; no host code then enters a guest's namespace."
