plan: 0007-compute-provider-kcp
written: 2026-10-07
revised: >
  2026-10-07, with the user's answers to the plan's questions (decisions below marked 'decided by the user
  2026-10-07'). 2026-10-11, folded from docs/research/2026-10-11-vm-lifecycle/ (user-decisions.md,
  plan-0006-0007-linux-exploration.md, linux-proofs.md, lifecycle-synthesis.md); decisions from
  user-decisions.md (and the user's graceful-stop decision relayed the same day) are marked 'decided by the
  user 2026-10-11'. Linux only with cross-OS seams (Windows: plan 0011, macOS: plan 0012); no
  socialweb-computer code in a running VM's process tree; VMs as transient services in the user manager of
  ONE shared lingering bidder account; identical guest network per guest; CI-built guest images; console to
  a capped file; graceful stop then SIGKILL; tri-state Verdict with mismatch = Lost + stop now. New:
  M1-GUEST-IMAGE, M2-VM-RUNTIME (replaces M2-UNPRIVILEGED-RUNNER, deleted). Dependencies on 0006 renamed
  (M2-HOST-SCOPES -> M2-HOST-UNITS, M3-CLUSTER-SCOPES -> M3-CLUSTER-UNITS, M1-KCP-PORT0 -> M2-KCP-PORT0).
  2026-10-12, folded from user-decisions.md (2026-10-12 lines), control-plane-handover.md and linux-proofs.md
  E8: the live CtrlAltDel stop measurement (0.21 s, idle guest) recorded on M2-VM-RUNTIME; the two live
  defects of today's provider (VM death unnoticed; destroyed guests' work dirs never removed) named as what
  M2-VM-RUNTIME and M2-CONTROLLER must prevent, with tests and ACC7-NO-LEAK; new M3-NODE-LOSS-CLOCK (our own
  outage never counts against a tenant's node) and M6-CLAIM-RESUME (split from M6-GATEWAY-REPOPULATE: a
  restarted door resumes Bidding and Provisioning claims, decided by the user 2026-10-12). 2026-10-12, the
  user's decision of a bidder-authored termination event (user-decisions.md, 2026-10-12 line): new
  M4-TERMINATION-EVENT; ownership.not_owned and ACC7-NO-PROTOCOL-CHANGE now allow exactly one protocol
  addition, com.publicdomainrelay.temp.compute.events.vm.terminated.
queued: >
  OPEN. The plan 0005 gate is satisfied: plan 0005 is complete with all 40 items done and its acceptance
  checks ACC-ZERO, ACC-MESH and ACC-NOSSH done with evidence (verified 2026-10-12). Only each item's own
  depends_on (within this plan and on plans 0006 and 0008) now governs when it starts.
source: >
  The user's request of 2026-10-07: from what the bidder's firecracker compute provider taught us, build
  compute-provider-kcp. Its TypeScript half is a ComputeProvider the bidder uses, configured
  automatically under `socialweb-computer run bidder`; it launches VMs by applying objects to kcp
  (Go-native, never kubectl); VM state lives in kcp, so a killed bidder still knows its running VMs. The
  user then decided: ComputeVM plus a Go controller; keep both providers, with compute-provider-firecracker
  as the GOLD STANDARD whose learnings are backported into the Go side with parity tests; no docker for
  Go VM runners (unprivileged, /dev/kvm through the kvm group); a lost guest is replaced through a new
  RFP; bidder identity keys live in an OpenBao beside the bidder; and the core binary and deno processes
  of BOTH the bidder and the gateway are upgradable while VMs keep running, each re-populating which VMs
  it owns afterwards. On 2026-10-11 the user decided the lifecycle: headless Linux servers; VMs survive a
  core crash, upgrade and logout; reboot = Lost; the VMM is launched directly by the service manager and no
  socialweb-computer code stays in a running VM's process tree; everything else in the decisions below.
state_rules:
  - This file is the only state. Every step updates status and evidence.
  - status is one of todo, doing, done, blocked.
  - An item is done only when its evidence is recorded (commit SHAs, test names watched to fail and
    then pass, hat-8 readings with UTC timestamps).
  - Open items are mirrored in NEXT.yaml (P7-*).
  - A decision marked "decided by Claude, user may veto" was not confirmed by the user; one marked
    "decided by the user 2026-10-07", "decided by the user 2026-10-11" or "decided by the user 2026-10-12"
    was.
  - An item names its dependencies in depends_on; an item may not start while one of them is not done.
    Cross-plan dependencies are written <plan>:<item id>.
  - >
    RFP flow is the spine (org-root CLAUDE.md). Every test that needs a live guest drives the requester
    (requestCompute / runComputeContract) against a bidder through RFP, bid, accept and cloud-init
    user_data. No test or code boots a guest any other way: no fixture-booted guest, no boot from a
    boot-spec, no hand-made user_data. Live unit mechanics without a guest use stand-in executables in
    transient units.
  - >
    Linux only (decided by the user 2026-10-11). OS-specific bodies live in GOOS-tagged files behind the
    vmruntime, hostsvc and guestnet interfaces; darwin and windows compile stubs returning ErrUnsupported,
    gated by 0006:M0-XOS-GATE. The Windows backend is plan 0011, the macOS backend plan 0012.
ownership:
  owned: >
    All code in socialweb-computer-kcp, the vendored deno-kcp test bed, and the atproto-market requester
    libraries. Decided by the user 2026-10-07: anything in hono-compute-provider and atproto-market may be
    changed, committed only, never pushed.
  not_owned: >
    The market protocol records and lexicons. This plan changes no existing record, NSID or wire shape: the
    bid config, receipt, onNetwork and vm.delete records stay what the firecracker provider writes. The only
    protocol addition is the record com.publicdomainrelay.temp.compute.events.vm.terminated (decided by the
    user 2026-10-12, M4-TERMINATION-EVENT), bidder-authored and carried in the existing market.event
    envelope. kcp objects introduced here are local state of one host and are never published.
research:
  measured_on: "2026-10-07; hono-compute-provider c06b2ad, atproto-market 117ab30, deno-kcp 25d10f92, kcp-libs f6911d2, this repo 13349d6. Lifecycle research and proofs 2026-10-09..11 against f0460fd and hono-compute-provider 4d7da59, see vm_lifecycle_2026_10_11"
  compute_provider_abc: "hono-compute-provider lib/abc/compute-provider/mod.ts:39-55 ComputeProvider {name, provision, destroy, createBidConfig, injectAcceptBundle, getDroplet?, setup?, teardown?} (OS-free; no TypeScript seam needed for other host OSes)"
  firecracker_gold_standard:
    - "lib/compute-provider-firecracker/mod.ts:563 guests is an in-memory Map, :643 the network index an in-memory counter, :734-749 destroy stops only guests in that Map"
    - ":629-732 provision: name fc-<shortId(requester)>-<8 hex> (:641), work dir <workRoot>/<name> (:642), enrichment order: OIDC enricher (:647), onNetwork base URL (:650), the requester-named relay address else the container's gateway (:662), JSR URL (:663), guest pointed at host with the guest TLS port (:664, :521-524), /root/.curlrc --resolve (:548); disk from the contract (:608-610, :670); mem parsed (:812-827)"
    - ":29-37 NSIDs and SECRETS_PREFIX /root/secrets/digitalocean.com/serviceaccount; :612-627 bid config wif.simple with to_issue exchange-firecracker-oidc, token_path ${SECRETS_PREFIX}/token (c06b2ad: the bid config names the token path the provisioning script writes); :161-166 injectAcceptBundle at the accept path; :347-515 preinstall manifest (packages, files, runs baked into the image, leftToBoot); :592-606 image ensure with reuseStale and fingerprint; :574-590 a JSR registry for guests; :751-807 POST /v1/on-network; :837-848 the issuer's droplet view (containerName for the host-key scan done from inside the guest's container, oidc-sub tags, guest IP); :860-871 issuer mounted in serve.onConnected; :697-710 rbac record created at provision and deleted at destroy"
    - "lib/microvm-firecracker/mod.ts:155-163 the bidder must not hold /dev/kvm, so each guest boots in its own privileged runner container (:203-216, no restart policy), work dir chmod 0777 (:186-189), result.json polled (:218-245), stop = kill + rm (:254-277); :48-58 the host address a guest dials is the container's default gateway; compute-provider-firecracker/mod.ts:129-145, :643, :660-664 the guest's network and the host address it dials depend on the allocated index, and user_data (/etc/hosts, .curlrc --resolve, JSR URL) is rewritten with it (exploration F6)"
    - "cmd/socialweb-nodeboot/main.go:26-29 boots from -spec, stops by -stop -work-dir; :283-288 refuses a second boot in a work dir already holding a guest; it re-execs itself for the namespace verb, and pasta runs inside the guest's namespace to wire the tap and start the VMM (:305-310); the namespace verb (nodevm.RunNamespace -> nodefirecracker.runVMM, namespace.go:15-58) STAYS RESIDENT as firecracker's parent with Pdeathsig and writes instance.json (exploration F2); prep is in-process: reflink clone, NoCloud seed written with host debugfs -w, grow with host e2fsck + resize2fs (F3); console unbounded into <work>/guest.console (F4); node images built ON THE BIDDER with chroot + apt-get + go build, kernel = the host's /boot kernel (F5)"
  restart_defects:
    - "live, hat-8 2026-10-07 (lead's reading): restarting a bidder loses its receipts; vm.delete then fails (404 through the dispatcher) and the guest leaks. In code: atproto-market lib/market-bidder/mod.ts:175 activeContracts is in memory, lib/market-bidder-compute/mod.ts:395-409 answers an unknown receipt with 400 and destroys nothing"
    - "live, 13349d6: a restarted bidder ran old provider code from a stale DENO_DIR v8_code_cache_v2 (bid_config token path and node image of the previous version) until the cache was moved aside; the launcher now passes --no-code-cache (plan 0008 M1-DENO keys DENO_DIR by closure sha256)"
    - "atproto-market hono-bidder/mod.ts:103-113 a fresh relay keypair per process, so the issuer URL guests were told, and the OpenBao JWT mount plan 0005 keys by issuer, move on every restart; hono-compute-provider lib/oidc-issuer-hono/mod.ts:42-53 the signing key store defaults to memory"
    - "plan 0005 M3-NODE-LOSS (door half): a restarted door adopts Joining and Running claims but marks Bidding and Provisioning claims Failed, because their guest's user_data names the old door's per-process secrets server"
  kcp_side_precedent:
    - "kcp-libs impl/execrunner/pod.go:184-196 KCP_TOKEN, KCP_SERVER, KCP_WORKSPACE for a DenoPod with a serviceAccount; deno-kcp main.go:89 token TTL 1h"
    - "socialweb-computer-k8s lib/socialweb-computer-k8s-nodeclaim-kcp/mod.ts:172-192 a TypeScript kcp REST client; api/v1alpha1/resources.go:18-22 + cmd/socialweb-apigen generate schemas, exports and TS wire types"
  vm_lifecycle_2026_10_11:
    files:
      - "docs/research/2026-10-11-vm-lifecycle/user-decisions.md (authoritative)"
      - "docs/research/2026-10-11-vm-lifecycle/plan-0006-0007-linux-exploration.md (A gaps, B seams and interfaces, C revised items, D questions)"
      - "docs/research/2026-10-11-vm-lifecycle/linux-proofs.md (E0-E7, hat-8, systemd 259.9, firecracker v1.13.1)"
      - "docs/research/2026-10-11-vm-lifecycle/lifecycle-synthesis.md"
    proven_on_linux:
      - "E1/E4b: a transient service in the user manager holding pasta -> VMM stand-in survives restart, kill -9 and stop of the bidder unit; kill -9 of pasta (MainPID) makes systemd kill the VMM (control-group); kill -9 of the VMM ends pasta with 137 and the unit is failed"
      - "E4: pasta -> /bin/sh -c 'exec \"$0\" ...' trampoline -> helper creates a persistent tap with CAP_NET_ADMIN in pasta's userns, then execve's; the cgroup then holds exactly pasta + the VMM; direct exec of our binary from pasta is DENIED under SELinux enforcing (pasta_t), so the trampoline is required; pasta also makes a PID namespace in which the VMM is PID 1"
      - "E4-term/E5: firecracker has no SIGTERM handler and, as PID 1 of pasta's PID namespace, ignores SIGTERM, so a plain `systemctl stop` hangs until TimeoutStopSec (45 s default) then SIGKILLs"
      - "E5: --config-file boots immediately with --api-sock already bound; GET / returns {id, state, vmm_version}; PUT /actions SendCtrlAltDel is x86_64 only (guest needs i8042/atkbd) and 400 before boot; do not use --no-api; --id must be [A-Za-z0-9-]{1,64}; host_dev_name attaches to a pre-created tap, name <= 15 bytes; api-sock path < 108 bytes and a stale socket file makes firecracker exit (unlink first); log timestamps are local time with no offset (run with TZ=UTC)"
      - "E2: PropExecStart(argv, false) + CollectMode=inactive keeps a crashed VM's Result; MemoryMax needs MemorySwapMax=0 or the guest swaps; OOMPolicy=stop gives Result=oom-kill; AllowedCPUs and IOWeight are not enforced in the user manager"
      - "E3: Lost = ESRCH, start-ticks mismatch, UnixProcessIdUnknown, NoUnitForPID, NoSuchUnit; Unknown = only dial/auth/timeout; GetUnitByPIDFD works on the VMM child as well as on MainPID"
      - "E1: StartTransientUnit on an existing name fails 'already loaded': a restarted bidder adopts, never re-creates"
    live_e8_2026_10_12:
      - "E8, live through the RFP flow (alice-request.sh -> socialweb-computer-bidder@bobvmbuilder.bsky.social on hat-8, firecracker provider, runner-container era, guest fc-1379be663dd9-6e867147): PUT /actions SendCtrlAltDel at 00:06:21.6827Z, the guest ran systemd shutdown to reboot.target, 'Firecracker exiting successfully. exit_code=0' at 00:06:21.8913Z: 0.21 s for an IDLE guest. The guest kernel had CONFIG_SERIO_I8042=y and CONFIG_KEYBOARD_ATKBD=y; ctrl-alt-del.target -> reboot.target, which firecracker treats as VM exit. The grace window with a workload (k3s agent + pods) is still to be measured."
      - "E8 defect 1 (VM death unnoticed): after firecracker exited, the nodeboot parents stayed alive and the runner container stayed Up; the bidder never noticed the VM died and the requester's ssh session hung until closed by hand (then vm.delete 200)."
      - "E8 defect 2 (work dirs leak): destroyed guests' work dirs are never removed: 32 dirs, 63 GB on disk (1.6 TB apparent, sparse rootfs) on hat-8."
    control_plane_handover_2026_10_11:
      - "docs/research/2026-10-11-vm-lifecycle/control-plane-handover.md 7: Joining/Running claims are durable (NodeClaim status.contract + status.grant + the cluster vault); Bidding/Provisioning die with the door only because the per-contract secrets-server keypair and grant are in memory (atproto-market lib/guest-capability-secrets/mod.ts:50-75); the accept written just before a crash is a VM no claim names (ARCHITECTURE section 9)"
      - "control-plane-handover.md 6: NODE-LOSS needs no rebase across a kcp/door/provider restart (the tenant's kcm keeps writing real transitions) but DOES when our side of the path was down (cluster cold start, link restart, front restart): count from max(lastTransitionTime, pathUpSince)"
items:
  - id: M1-DECIDE
    milestone: M1
    title: Record the ComputeVM-plus-Go-controller design and the VM lifecycle in ARCHITECTURE
    depends_on: []
    decision: >
      Decided by the user 2026-10-07: a typed ComputeVM CRD reconciled by a Go controller, not a DenoPod
      per VM. The bidder runs as a DenoPod and writes ComputeVMs; kcp lists running VMs. Reasons kept on
      record: deleting a DenoPod SIGKILLs its group (supervisor.go:156,:322) so no release runs; the 5m
      runner timeout (pod.go:17) killed the bed's bidder mid-contract (run 4); DenoPod status has no typed
      guest fields; booting needs /dev/kvm reach the TypeScript sandbox must not hold. Also recorded, decided
      by the user 2026-10-11: no socialweb-computer code in a running VM's process tree (the VMM is launched
      by the user manager; our code is one-shot prep; the vmexec helper execve's away); every VM is one
      transient service in the user manager of ONE shared lingering account (swc-bidder), units namespaced by
      handle; reboot = Lost; the tri-state Verdict (Running | Lost | Unknown) with identity mismatch on an
      active unit = Lost + StopUnit immediately and an unreachable bus or socket = Unknown, never Lost;
      graceful stop (SendCtrlAltDel, grace, then SIGKILL); identical guest network per guest; CI-built
      images; console to a capped file in the work dir, never the host journal; explicit deno permissions
      for the bidder; and the shared-account limit (isolation between handles is by name and path only).
    files: ["docs/ARCHITECTURE.md (section 5 subsection 'Host processes and the VM lifecycle')"]
    test_first: "None (decision record)."
    done_when: "ARCHITECTURE subsection committed with these citations."
    risks: []
    status: todo
    evidence: []
  - id: M1-FC-INVENTORY
    milestone: M1
    title: Inventory what compute-provider-firecracker learned, as requirements the Go side must meet
    depends_on: []
    decision: >
      Decided by the user 2026-10-07: compute-provider-firecracker (TypeScript) is the gold standard; it
      was sourced from nodeboot/nodeimage and has advanced since. This item reads it (and
      microvm-firecracker, node-image-firecracker, oidc-issuer-hono's enricher, cloud-init-common's
      modules it composes) and writes docs/compute-provider-requirements.yaml: one entry per learning
      with id, the TypeScript source line, the behaviour, whether the Go side already meets it, and the
      parity test that will prove it. At least: user_data enrichment order and idempotence; the accept
      bundle at the accept path (accept.json); the onNetwork reporter, its targets and the relay.localhost
      alias; SECRETS_PREFIX and the token path the provisioning script writes; .curlrc --resolve and
      CURL_HOME; guest TLS port rewrite; network range, index and MAC (kept for the firecracker provider);
      disk size from the contract and mem parsing; image ensure, fingerprint, reuseStale and the preinstall
      manifest; the JSR registry for guests; the issuer's droplet view; rbac records created and deleted;
      boot timeout and result.json fields; the work dir's two writers. Added 2026-10-11 (decided by Claude,
      user may veto), each a requirement that changes with no container: the host address a guest dials
      (constant pasta gateway, not the runner container's gateway), console capture (capped file), graceful
      stop, image provenance (CI-built, not host-built), seed transport (a drive, not debugfs), the guest
      host keys (guest-reported, not a host-side scan in the guest's namespace), and a boot timeout with no
      result.json (no resident writer: Running is read from firecracker GET /). Added 2026-10-12: the two E8
      live defects of today's provider (a VMM that exits is not noticed; destroyed guests' work dirs are never
      removed) are recorded as requirements the Go side must NOT inherit, with M2-VM-RUNTIME's and
      M2-CONTROLLER's tests as their parity tests.
    files: ["docs/compute-provider-requirements.yaml"]
    test_first: >
      hono-compute-provider test/requirements_inventory_test.ts: every exported function and every
      logger event name in lib/compute-provider-firecracker/mod.ts and lib/microvm-firecracker/mod.ts is
      referenced by some requirement entry; red before the file exists.
    done_when: "inventory committed; test green; each entry names its parity test id."
    risks: ["The firecracker provider keeps moving; the test re-runs on every hono-compute-provider change so a new learning cannot land without an entry."]
    status: todo
    evidence: []
  - id: M1-API
    milestone: M1
    title: ComputeVM in api/v1alpha1 with an OS-neutral status, generated schema, export, workspace type and TypeScript wire types
    depends_on: [M1-DECIDE, "0006:M1-K8S-FORK"]
    decision: >
      Go types are the source of truth (plan 0005 M2-CODEGEN). ComputeVM spec: vm {cpus, mem, disk, role},
      owner {handle} (shared account, decided by the user 2026-10-11: the controller and GC namespace by
      handle), userDataSecret, requester {did, plc}, contract {receiptUri, receiptCid, acceptUri, acceptCid,
      submitEventUrl, acceptedAt}, image {reuseStale}, stopGraceSeconds. No network index anywhere: every
      guest gets the identical address plan in its own pasta namespace (decided by the user 2026-10-11), so
      user_data enrichment is final at create time and there is no two-phase write. Status through /status by
      two field managers (decided by Claude, user may veto), OS-neutral so the Windows and macOS backends
      (plans 0011, 0012) need no schema revision: the controller owns phase (Pending, Preparing, Booting,
      Running, Releasing, Lost, Failed), lostReason (HostRebooted, UnitGone, UnitFailed, OOMKilled, VMMExited,
      IdentityMismatch), observedGeneration, network {guestIP, hostAddress, prefix, mac}, image {ref, sha256,
      hypervisor}, runtime {backend (free string, no enum), ref, instance, pid, startTime (opaque string),
      hostBootID, vmmID}, workDir, bootedAt, message, conditions (Prepared, Started, RuntimeObserved
      True|False|Unknown, GuestReported) - Unknown is a CONDITION, the phase stays what it was; the provider
      owns market {onNetworkUri, address, hostKeys[], reportedAt}. Finalizer computevm.socialweb.computer/release;
      printer columns phase, guestIP, requester, age. Export computevms; WorkspaceType bidder binds
      denoruntime, computevms and hostprocesses (for the bidder's OpenBaoServer). apigen's second TypeScript
      target writes hono-compute-provider/lib/common/compute-provider-kcp-common/mod.ts, drift-checked when
      the sibling is present.
    files: ["api/v1alpha1/computevm_types.go", "api/v1alpha1/resources.go", "internal/apigen", "deploy/*computevm*.yaml, deploy/workspacetype-bidder.yaml", "deploy/sets.yaml (bidder)", "hono-compute-provider/lib/common/compute-provider-kcp-common/"]
    test_first: "TestComputeVMRoundTripsThroughTheSharedFixtures (Go and the generated TS validator), TestTheComputeVMSchemaIsRevisionLocked, TestTheComputeVMSchemaHasNoBackendEnumAndNoNetworkIndex; red first."
    done_when: "check.sh --fast green with apigen no drift; both fixture suites green."
    risks: ["APIResourceSchema.spec is immutable; the first revision is reviewed field by field, including that no Linux-only field (unit, pasta pid, API socket) is in it."]
    status: todo
    evidence: []
  - id: M1-COMMON-EXTRACT
    milestone: M1
    title: Move the firecracker provider's pure user_data and network functions into compute-provider-common
    depends_on: []
    decision: >
      Two impls of one ABC must not import each other (org-root CLAUDE.md). Move unchanged into
      lib/common/compute-provider-common: injectAcceptBundle, onNetworkUrlFromBundle, onNetworkTargets,
      onNetworkReporterModule, withOnNetworkBaseUrl, withOnNetworkReporter, addressTheRequesterNamed,
      pointGuestAtHost, the curlrc module, injectJsrUrl, networkFor, guestMacFor, shortId, parseMemMiB,
      preinstallManifest and the NSID and path constants. Firecracker imports them; its behaviour is the
      reference and does not change (it keeps networkFor and its index). compute-provider-kcp calls
      pointGuestAtHost with the constant host address (M3-BIDDER-FLAG), never a container gateway.
    files: ["hono-compute-provider/lib/common/compute-provider-common/mod.ts", "hono-compute-provider/lib/compute-provider-firecracker/mod.ts", "hono-compute-provider/deno.json"]
    test_first: "test/user_data_enrichment_golden_test.ts (goldens captured from firecracker before the move); fails to compile before, passes after; the suite stays green."
    done_when: "golden test green; deno task test green."
    risks: ["Helpers closing over module state (jsrPort, nextIndex) stay in the impl and are passed in."]
    status: todo
    evidence: []
  - id: M1-GUEST-IMAGE
    milestone: M1
    title: Guest images (kernel + rootfs) built in CI per hypervisor x arch, pinned by sha256, fetched and verified on bidders
    depends_on: [M1-FC-INVENTORY, "0006:M1-ASSETS"]
    decision: >
      Decided by the user 2026-10-11: guest images are built in CI on a Linux build host per hypervisor x
      arch, pinned by sha256, shipped as assets; bidders need no root, chroot, apt or go toolchain. Decided by
      Claude, user may veto: targets firecracker-x86_64 and firecracker-aarch64 here (hyperv-x86_64 is plan
      0011, vz-arm64 plan 0012). Each image = a kernel with a pinned config (virtio-mmio; i8042 + atkbd on
      x86_64 so SendCtrlAltDel reaches the guest), a raw ext4 rootfs with cloud-init (NoCloud datasource,
      resize_rootfs/growpart enabled so the guest grows its own fs to the disk size the controller truncates
      to), the guest init socialweb-nodeinit (a guest binary, built here, not a host asset), the preinstall
      manifest of M1-FC-INVENTORY baked in, and a manifest {hypervisor, arch, kernel sha256, rootfs sha256,
      inputs}. cmd/socialweb-nodeimage moves to the build pipeline (scripts/build-guest-image.sh, run by CI;
      a `dev`-tag verb remains for local builds); the host's /boot kernel stops being an input, so every
      bidder boots the same kernel. versions.json pins each image's URL and sha256; internal/guestimage
      fetches, verifies and stores images keyed by (hypervisor, arch, sha256) under the account's state dir
      and refuses a mismatch. Images are not embedded in the binary (0006:M0-SIZE-BUDGET). A guest boot from
      the image is proved only through the RFP flow (M6-*).
    files: ["scripts/build-guest-image.sh", "cmd/socialweb-nodeimage (build pipeline; dev tag)", "cmd/socialweb-nodeinit", "internal/guestimage/", "internal/versions/versions.json (image pins)", "deploy/guest-kernel/firecracker-x86_64.config, firecracker-aarch64.config"]
    test_first: >
      internal/guestimage TestAnImageWhoseShaDiffersIsRefused and TestAnImageIsFetchedOnceAndReusedByHash;
      build-pipeline TestTheGuestKernelConfigHasTheGracefulStopAndVirtioMmioDrivers (reads the pinned
      config); red first.
    done_when: "both images built by CI twice with equal sha256; pins recorded; a bidder host fetches and verifies them with no root."
    risks:
      - "A raw ext4 rootfs with no partition table must grow through cloud-init's resizefs on /dev/vda; unproven, measured in the first M6 run (df inside the guest reported through onNetwork or the guest's own log), with a partitioned image as the fallback."
      - "Moving off the host kernel changes the module set the guest relies on (iptables, bridge, overlay for k3s); the kernel config lists them and the M6 join proves them."
    status: todo
    evidence: []
  - id: M2-VM-RUNTIME
    milestone: M2
    title: The Linux VM runtime - one-shot prep, one transient service per VM whose tree is pasta -> firecracker, graceful stop
    depends_on: [M1-DECIDE, M1-GUEST-IMAGE, "0006:M2-HOST-UNITS", "0006:M1-ASSETS", "0006:M2-VM-TREE-AUDIT"]
    decision: >
      Replaces M2-UNPRIVILEGED-RUNNER (deleted 2026-10-11: it started each guest as a resident `internal
      nodeboot` wrapper, and its test booted a guest from a fixture boot-spec, an RFP-spine violation).
      Decided by the user 2026-10-07: no docker for VM runners; unprivileged through /dev/kvm via the kvm
      group, never chmod. Decided by the user 2026-10-11: no socialweb code in the VM's process tree; ONE
      shared lingering account; identical guest network; console to a capped file; graceful stop first
      (SendCtrlAltDel over the API socket, a grace window measured live on the market bed, then the unit
      stops with KillSignal=SIGKILL; x86_64 only, arm64 goes straight to SIGKILL until a guest-side shutdown
      path exists). Decided by Claude, user may veto (exploration B1-B3, linux-proofs E1-E5): internal/vmruntime
      (interface Runtime {Capabilities, Prepare, Start, Inspect, Stop, List, Cleanup}; VMSpec, RuntimeRef,
      Verdict, LostReason; ForHost() picks the backend compiled for GOOS) with firecracker_linux.go composing
      hostsvc, internal/guestnet (pasta_linux.go), internal/guestdisk (clone_linux.go FICLONE with copy
      fallback, truncate, seed.go pure-Go NoCloud cidata drive) and internal/fcapi (firecracker client over
      the unix socket + config writer), plus unsupported_other.go. Prep is one-shot in the controller: clone
      the rootfs, truncate to the contract's disk, write cidata.img (user-data, meta-data), fc.json
      (boot-source, drives rootfs + cidata, machine-config, network-interfaces host_dev_name fctap0 + MAC),
      params.json; the work dir is <state>/handles/<hid>/vms/<name> (0700, one uid); the API socket is
      $XDG_RUNTIME_DIR/swvm/<short-id>.sock (< 108 bytes, unlinked before start). Unit
      socialweb-vm-<hid>-<name>.service (hid = first 10 hex of sha256(handle)): ExecStart =
      runtime/<pasta-sha>/pasta --config-net (the identical address plan; host address = pasta's mapped
      gateway, constant) -- /bin/sh -c 'exec "$0" "$1"' runtime/<vmexec-sha>/socialweb-vmexec params.json (the
      trampoline SELinux requires); socialweb-vmexec (new tiny asset, cmd/socialweb-vmexec) creates the
      persistent tap and bridge over netlink in pasta's namespace (the nodevm.WireNamespace logic without
      exec'ing ip) and execve's runtime/<fc-sha>/firecracker --id <vm-name> --config-file fc.json --api-sock
      <sock>; after start the cgroup holds pasta + firecracker only. Properties: Type=exec, Restart=no,
      KillMode=control-group, KillSignal=SIGKILL (firecracker ignores SIGTERM as PID 1 of pasta's PID
      namespace), TimeoutStopSec=10, MemoryMax = guest mem + VMM overhead, MemorySwapMax=0, OOMPolicy=stop,
      TasksMax, CPUQuota, CPUWeight, Slice=socialweb-b-<hid>.slice (not app.slice), no AllowedCPUs, no
      IOWeight, no ManagedOOMPreference, Environment=TZ=UTC, StandardOutput=append:<work>/console.log and
      StandardError=append:<work>/vmm.log (tenant data never enters the host journal; the controller caps
      each file by copy-truncate rotation keeping one bounded predecessor, and both go with the work dir on
      release), PropExecStart(argv, false), CollectMode=inactive. Start records RuntimeRef {backend
      systemd-firecracker, ref unit, instance InvocationID, pid = the firecracker pid (the cgroup's process
      whose exe is the pinned firecracker), startTime, hostBootID, vmmID}, then polls GET / for {id ==
      vmmID, state Running} within the boot timeout. Stop: x86_64 PUT /actions SendCtrlAltDel, wait
      spec.stopGraceSeconds (default = the grace window measured in M6-BIDDER-UPGRADE, recorded in
      versions.json) for the unit to go inactive, then StopUnit (SIGKILL to the cgroup); aarch64 StopUnit at
      once; then record Result, ResetFailedUnit, remove the work dir and socket. The resident namespace verb,
      nodevm.RunNamespace, WriteNamespaceRecord, FindVMM, WriteInstance and cmd/socialweb-nodeboot are
      deleted. Live measurement (linux-proofs E8, 2026-10-12, through the RFP flow): SendCtrlAltDel -> firecracker
      exit 0 took 0.21 s on an IDLE guest (the guest's ctrl-alt-del.target -> reboot.target, which firecracker
      treats as VM exit); the grace window with a k3s workload is still to measure (M6-BIDDER-UPGRADE). Two live
      defects of today's provider (E8) this runtime must make impossible, decided by Claude, user may veto:
      (a) VM death unnoticed - after firecracker exited, the nodeboot parents and the runner container stayed
      up and the bidder never noticed. Here the VMM is the only child of pasta in the unit: when firecracker
      exits for ANY reason (guest reboot or poweroff, CtrlAltDel, crash, kill) pasta exits and the unit goes
      inactive or failed with nothing of the VM left in its cgroup; Inspect reports that on the next call, and
      Runtime exposes a Watch (D-Bus PropertiesChanged on the unit's ActiveState) so the controller learns it
      within seconds instead of a pass interval. (b) Work dirs never removed - 32 dirs, 63 GB on hat-8. Here
      Stop and Cleanup remove the work dir (rootfs clone, cidata, console and vmm logs) and the API socket
      for every terminal outcome (released, Lost, Failed, boot timeout), and List reports work dirs under
      <state>/handles/<hid>/vms/ so the controller can collect any with no ComputeVM (M2-CONTROLLER).
    files: ["internal/vmruntime/", "internal/guestnet/", "internal/guestdisk/", "internal/fcapi/", "cmd/socialweb-vmexec/", "internal/nodevm, internal/nodefirecracker (deleted or reduced)", "cmd/socialweb-nodeboot (deleted)", "docs/bidder-host.md (kvm group via `install bidder`)"]
    test_first: >
