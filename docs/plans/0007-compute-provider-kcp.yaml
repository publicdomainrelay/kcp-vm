      desired = the fixed identity set (mount bidder: repo-key, relay-keypair, oidc-jwk; policy
      bidder-read; the DenoPod's token role) plus, for each live ComputeVM, whatever per-guest policy,
      role or KV path the provider issues under the owned prefix guests/<computevm>; a per-guest entry
      whose ComputeVM is gone is deleted; the pass runs every controller pass, at startup, after an
      upgrade and when the vault unit's InvocationID changed. (2) One stable issuer per bidder is the
      cluster-side invariant: the issuer URL derives from the relay keypair, so a restart, upgrade or OIDC
      signing-key rotation never changes it. Signing-key rotation is explicit (`socialweb-computer run bidder
      rotate-signing-key`) and keeps the issuer URL: the new key is added to the JWKS, tokens are signed with
      it, and the old key stays published until the longest token TTL has passed, so no cluster needs a new
      mount. Relay-keypair rotation changes the issuer and therefore the jwt-<sha12(issuer)> mount on every
      cluster; it is a separate explicit command, refused while any ComputeVM is Running unless --drain,
      which waits for each guest to be released. Clusters drop the old mount through 0005 M3-BAO-SYNC's rule
      (a jwt-* mount with no role left is disabled) once its last node is released, never earlier.
