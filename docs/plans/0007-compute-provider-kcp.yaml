items:
  - id: M0-VM-USERNS
    milestone: M0
    title: "Spike: firecracker opens /dev/kvm inside a per-VM subuid user namespace with pasta - a single-threaded vmexec stage vs util-linux unshare"
    depends_on: []
    decision: >
      Decided by the user 2026-10-12: an M0 spike with a fallback for the per-VM subuid user namespaces
      decided the same day (M2-VM-RUNTIME). unshare(CLONE_NEWUSER) refuses a multi-threaded caller (EINVAL),
      and every Go process is multi-threaded, so the stage that creates the namespace must be single-threaded
      or must create it with clone() for a fresh child. newuidmap/newgidmap (setuid, the distro's) are host
      prerequisites, written by `install bidder`'s subuid/subgid range (0006 M1-INSTALL) and checked by
      check-host. Candidates, measured on hat-8 (Fedora 44, SELinux enforcing) in a scratch branch: (A) a
      single-threaded stage of ours - either a Go one-shot that starts the next stage with
      SysProcAttr.Cloneflags=CLONE_NEWUSER and has the maps written by newuidmap/newgidmap on the child's pid
      while the child (exec'd in the new namespace) waits on an inherited pipe before execve'ing pasta, or a
      tiny static non-Go stage asset - with the stage gone from the tree after start; (B) util-linux unshare
      >= 2.38 `--map-users=<inner>:<outer>:65536 --map-groups=...` (it forks a short-lived helper that runs
      newuidmap and exits), a host prerequisite beside newuidmap. Each candidate, under the SELinux pasta_t
      trampoline (linux-proofs E4): pasta creates its net namespace and the tap inside the subuid namespace,
      firecracker opens /dev/kvm by the retained supplementary kvm group (no setgroups), the work files are
      reachable by ACL only, the unit's tree after start is pasta + the VMM only, the stage adds no resident
      process, and the start latency added. Measured with stand-ins first (a stand-in VMM that opens /dev/kvm
      and ignores SIGTERM, in transient units of the systemd-user backend and under devsup), then ONE guest
      through the RFP flow: alice-request.sh -> RFP -> bid -> accept -> cloud-init user_data against a
      scratch-branch bidder whose firecracker launch goes through the chosen stage (the guest is born only
      from user_data; nothing is booted by hand). Decided by Claude, user may veto: prefer (A) (no new host
      prerequisite, and our stage is pinned like every asset); (B) is the fallback when (A) fails or costs
      more than a small file. If NEITHER keeps /dev/kvm, the next fallback is an ACL entry on /dev/kvm for the
      reserved range written by install (recorded as a deviation); if a target distro refuses unprivileged
      user namespaces outright, check-host refuses that host by name and the user is asked - there is no
      silent fallback to running VMMs as the shared account's uid.
    files: ["scratch branch only (stage code, stand-in, measurements)", "docs/research/2026-10-11-vm-lifecycle/vm-userns-spike.md (readings)"]
    test_first: "None (measurement). Readings: per candidate, uid_map/gid_map of the stand-in VMM, /dev/kvm open result, the unit's process list after start, added latency, SELinux denials (ausearch), and for the chosen stage the RFP-flow guest's boot to onNetwork with its VMM's uid_map recorded (UTC)."
    done_when: "the stage chosen and recorded with readings; the fallback's status recorded; M2-VM-RUNTIME's decision updated to name the stage."
    risks:
      - "Fedora's pasta SELinux policy may deny pasta inside an unprivileged user namespace the trampoline does not cover; recorded with the denial, and the profile change (install-time) named."
      - "The RFP-flow guest needs the live market network on hat-8; until 0008 M1-MARKET-NETWORK-PARALLEL lands the run is serialized with every other market network run."
    status: done
    evidence:
  - id: M1-DECIDE
    milestone: M1
    title: Record the ComputeVM-plus-Go-controller design and the VM lifecycle in ARCHITECTURE
    depends_on: []
    decision: >
      Decided by the user 2026-10-07: a typed ComputeVM CRD reconciled by a Go controller, not a DenoPod
      per VM. The bidder runs as a DenoPod and writes ComputeVMs; kcp lists running VMs. Reasons kept on
      record: deleting a DenoPod SIGKILLs its group (supervisor.go:156,:322) so no release runs; the 5m
      runner timeout (pod.go:17) killed the market network's bidder mid-contract (run 4); DenoPod status has no typed
      guest fields; booting needs /dev/kvm reach the TypeScript sandbox must not hold. Also recorded, decided
      by the user 2026-10-11: no socialweb-computer code in a running VM's process tree (the VMM is launched
      by the user manager; our code is one-shot prep; the vmexec helper execve's away); every VM is one
      transient service in the user manager of ONE shared lingering account (swc-bidder), units namespaced by
      handle; reboot = Lost; the tri-state Verdict (Running | Lost | Unknown) with identity mismatch on an
      active unit = Lost + StopUnit immediately and an unreachable bus or socket = Unknown, never Lost;
      graceful stop (SendCtrlAltDel, grace, then SIGKILL); identical guest network per guest; images built
      off the bidder (2026-10-12: by a build-host script on any Linux host, CI shells out to it later);
      console to a capped file in the work dir, never the host journal; explicit deno permissions
      for the bidder. Decided by the user 2026-10-12, also recorded: per-VM subuid user namespaces (each VM
      unit's pasta and firecracker run in their own user namespace mapped to a distinct sub-range of the
      account's reserved subuid/subgid range, so a VMM escape lands in an unprivileged uid that owns no
      bidder file; Unix accounts are never created on demand); the seed is a separate cidata drive and the
      guest grows its own root; guest SSH host keys are guest-reported and verified, never scanned from the
      host (M4-HOST-KEYS). Decided by the user 2026-10-12 (third fold), also recorded: every VM unit is a
      HostProcess child of its ComputeVM placed on systemd-user (production) or proc (dev); a bidder's kcp is
      one slot on kine-sqlite and its upgrade is a short kcp restart VMs never notice.
    files: ["docs/ARCHITECTURE.md (section 5 subsection 'Host processes and the VM lifecycle')"]
    test_first: "None (decision record)."
    done_when: "ARCHITECTURE subsection committed with these citations."
    risks: []
    status: done
