workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^task\//
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [test]

default:
  tags: [socialweb-computer-kcp]
  interruptible: true

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "20"
  GIT_CLEAN_FLAGS: -ffdx

.toolchain:
  before_script:
    - test -n "$HOME" && test "$(id -u)" != 0
    - export CI_STATE="$HOME/.tmp/ci"
    - export TMPDIR="$CI_STATE/tmp/$CI_JOB_ID" GOCACHE="$CI_STATE/go-build" GOMODCACHE="$CI_STATE/go-mod" DENO_DIR="$CI_STATE/deno-dir"
    - mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$DENO_DIR"
    - platform="$(go env GOOS)/$(go env GOARCH)"
    - deno_url="$(jq -er --arg p "$platform" '.assets.deno.fetch[$p].url' internal/versions/versions.json)"
    - deno_sha="$(jq -er --arg p "$platform" '.assets.deno.fetch[$p].sha256' internal/versions/versions.json)"
    - export DENO_BIN="$CI_STATE/deno/$deno_sha/deno"
    - |
      if [ ! -x "$DENO_BIN" ]; then
        curl -fsSL --max-time 120 -o "$TMPDIR/deno.zip" "$deno_url"
        echo "$deno_sha  $TMPDIR/deno.zip" | sha256sum -c --quiet -
        mkdir -p "$(dirname "$DENO_BIN")"
        unzip -q -o "$TMPDIR/deno.zip" deno -d "$(dirname "$DENO_BIN")"
      fi
    - export PATH="$(dirname "$DENO_BIN"):$PATH"
    - export OUT="$CI_STATE/out/$CI_COMMIT_SHA"
    - go version && deno --version | head -1
  after_script:
    - rm -rf "$HOME/.tmp/ci/tmp/$CI_JOB_ID"

.containers:
  before_script:
    - !reference [.toolchain, before_script]
    - export RUSTUP_HOME="$CI_STATE/rustup" CARGO_HOME="$CI_STATE/cargo" PATH="$CI_STATE/cargo/bin:$PATH"
    - mkdir -p "$CI_STATE/release-build" "$CI_STATE/podman/run" && chmod 0700 "$CI_STATE/podman/run"
    - |
      if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
        init="$CI_STATE/release-build/rustup-init"
        curl -fsSL --max-time 120 -o "$init" https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
        echo "$(curl -fsSL --max-time 30 https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init.sha256 | cut -d' ' -f1)  $init" | sha256sum -c --quiet -
        chmod 0755 "$init"
        timeout -k 10 300 "$init" -y --quiet --no-modify-path --profile minimal --default-toolchain none
        rm -f "$init"
      fi
    - (cd rust && timeout -k 10 300 rustup toolchain install && rustc --version)
    - export CONTAINER=podman XDG_RUNTIME_DIR="$CI_STATE/podman/run" CONTAINERS_STORAGE_CONF="$CI_STATE/podman/storage.conf" CONTAINERS_CONF="$CI_STATE/podman/containers.conf"
    - printf '[storage]\ndriver = "overlay"\ngraphroot = "%s"\nrunroot = "%s"\n[storage.options.overlay]\nignore_chown_errors = "true"\n' "$CI_STATE/podman/storage" "$CI_STATE/podman/run/storage" >"$CONTAINERS_STORAGE_CONF"
    - printf '[engine]\ncgroup_manager = "cgroupfs"\nevents_logger = "file"\n[containers]\ncgroups = "disabled"\n' >"$CONTAINERS_CONF"

integration:
  stage: test
  extends: [.containers]
  timeout: 90m
  interruptible: false
  variables:
    SOCIALWEB_IT_ACCOUNT: socialweb-ci
    SOCIALWEB_IT_LIVE_SLOT: none
    SOCIALWEB_IT_RUN_ROOT: /var/tmp/swcci
  script:
    - export SOCIALWEB_IT_GUEST_IMAGE="https://socialweb-computer-kcp.sfo3.digitaloceanspaces.com/main/$CI_COMMIT_SHA/guest-image/firecracker-x86_64"
    - export SOCIALWEB_IT_PUBLISH="/var/tmp/swcci/bin-$CI_JOB_ID" SOCIALWEB_IT_ARTIFACTS="$CI_PROJECT_DIR/it-artifacts"
    - timeout -k 30 5280 go test -tags integration -count=1 -v -timeout 87m ./test/integration/ 2>&1 | tee "$TMPDIR/it.log"
    - grep -E '^(--- |ok|FAIL)' "$TMPDIR/it.log"
  after_script:
    - |
      bin="/var/tmp/swcci/bin-$CI_JOB_ID/bin/socialweb-computer"
      for d in /var/tmp/swcci/*/dev/*/; do
        [ -x "$bin" ] && [ -d "$d" ] || continue
        echo "dev down $(basename "$d") (left by a stopped run)"
        XDG_RUNTIME_DIR="/run/user/$(id -u)" timeout -k 10 200 "$bin" dev down --instance "$(basename "$d")" --state-dir "$(dirname "$d")" >/dev/null 2>&1 &
      done
      wait
      for r in /var/tmp/swcci/*/; do case "$r" in */bin-*/) ;; *) rm -rf "$r" ;; esac; done
    - rm -rf "/var/tmp/swcci/bin-$CI_JOB_ID" "$HOME/.tmp/ci/tmp/$CI_JOB_ID"
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [it-artifacts/]
