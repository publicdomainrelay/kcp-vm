#cloud-config
apt:
  preserve_sources_list: true
write_files:
  - path: /root/.ssh/authorized_keys
    owner: root:root
    permissions: "0600"
    content: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOoOBDH+AJTYi8hyaHzmgt3lBG2JTjFQhtPLq1n2O5Jb root@compute-7204e8fd
  - path: /etc/ssh/sshd_config.d/10-tunnel.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Key-only root login; reached through the xrpc relay tunnel (the
      # compute-provider harness also TCP-probes :22 directly for readiness).
      PermitRootLogin prohibit-password
      PasswordAuthentication no
  - path: /etc/systemd/system/tunnel-subscriber.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=xrpc tunnel subscriber (ssh-over-relay)
      After=network-online.target sshd.service ssh.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/deno run -A jsr:@publicdomainrelay/hono-did-key-ingress-proxy-tunnel-subscriber --ingress-proxy-host xrpc.fedproxy.com --aud-host xrpc.fedproxy.com --private-key-from-sshd-host-key /etc/ssh/ssh_host_ed25519_key --fqdn-file /run/guest-fqdn --target-host 127.0.0.1 --target-port 22
      Restart=always
      RestartSec=5
      TimeoutStopSec=10
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/bin/pi
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      export PATH="/usr/local/bin:${PATH}"
      export DENO_DIR="${DENO_DIR:-/root/.cache/deno}"
      exec deno run -A npm:@earendil-works/pi-coding-agent "$@"
  - path: /usr/local/bin/setup-pi.sh
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      STAMP=/var/lib/setup-pi.done
      [ -f "${STAMP}" ] && exit 0

      export PATH="/usr/local/bin:${PATH}"
      export DENO_DIR="${DENO_DIR:-/root/.cache/deno}"

      if ! command -v deno >/dev/null 2>&1; then
        curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/usr/local sh
        chmod 755 /usr/local/bin/deno
      fi

      for attempt in $(seq 1 5); do
        if deno run -A npm:@earendil-works/pi-coding-agent install git:github.com/willnewby/pi-cocore >/dev/null 2>&1; then
          break
        fi
        if [ "${attempt}" = 5 ]; then
          echo "pi plugin install failed after ${attempt} attempts" >&2
          exit 1
        fi
        echo "pi plugin install failed (attempt ${attempt}); retrying" >&2
        sleep $((attempt * 5))
      done

      mkdir -p /root/.pi/agent

      # Merge, never overwrite. pi records what it installed as `packages` in this
      # same file, so writing our two keys wholesale would drop the plugin that was
      # just installed -- leaving a guest with the extension on disk, the token on
      # disk, and "No API key found for the selected model" when it runs.
      deno eval '
      const path = "/root/.pi/agent/settings.json";
      let settings = {};
      try { settings = JSON.parse(Deno.readTextFileSync(path)); } catch { /* first boot */ }
      settings.defaultProvider = "cocore";
      settings.defaultModel = "prism-ml/Ternary-Bonsai-27B-GGUF-Q2_0";
      Deno.writeTextFileSync(path, JSON.stringify(settings, null, 2) + "\n");
      '

      touch "${STAMP}"
  - path: /usr/local/bin/setup-secrets.sh
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      STAMP=/var/lib/setup-secrets.done
      [ -f "${STAMP}" ] && exit 0

      ACCEPT_JSON="/root/secrets/publicdomainrelay.com/market/accept.json"
      SECRETS_URL="https://did-key-zq3shqs7q4tuehzevsdcurcnemz4bpdt1e69oki3yxwcbxusj.xrpc.fedproxy.com"
      SECRETS_ROUTE="/xrpc/com.publicdomainrelay.temp.compute.secrets.getSecrets"
      SECRETS_AUD="api://ATProto?actx=did:plc:lpfuqerea3deuoyrn7ojser4"

      if [ -z "${SECRETS_URL}" ] || [ -z "${SECRETS_AUD}" ]; then
        echo "secrets module misconfigured: missing url or aud" >&2
        exit 1
      fi

      for _ in $(seq 1 60); do
        [ -f "${ACCEPT_JSON}" ] && break
        sleep 2
      done
      [ -f "${ACCEPT_JSON}" ] || { echo "accept.json never appeared at ${ACCEPT_JSON}" >&2; exit 1; }

      # The bidder writes bid_config as a strongRef wrapper ({uri, cid, value}); older
      # bidders inlined the record. Accept either.
      WIF="$(jq -c '.bid_config.value // .bid_config // {}' "${ACCEPT_JSON}")"
      TOKEN_PATH="$(printf '%s' "${WIF}" | jq -r '.token_path // empty')"
      URL_PATH="$(printf '%s' "${WIF}" | jq -r '.url_path // empty')"
      URL_ROUTE="$(printf '%s' "${WIF}" | jq -r '.url_route // "/v1/oidc/issue"')"
      [ -n "${TOKEN_PATH}" ] || { echo "accept.json has no bid_config token_path" >&2; exit 1; }
      [ -n "${URL_PATH}" ] || { echo "accept.json has no bid_config url_path" >&2; exit 1; }

      for _ in $(seq 1 60); do
        [ -s "${TOKEN_PATH}" ] && [ -s "${URL_PATH}" ] && break
        sleep 2
      done
      [ -s "${TOKEN_PATH}" ] || { echo "workload identity token never appeared at ${TOKEN_PATH}" >&2; exit 1; }

      WID_TOKEN="$(cat "${TOKEN_PATH}")"
      ISSUER_BASE="$(cat "${URL_PATH}")"

      # The provider assigned this subject at /v1/oidc/prove from the droplet tags.
      # Echo it back verbatim so the exchanged token keeps the same identity.
      SUBJECT="$(printf '%s' "${WID_TOKEN}" | cut -d. -f2 \
        | tr '_-' '/+' | sed -e 's/$/==/' | base64 -d 2>/dev/null | jq -r .sub)"
      [ -n "${SUBJECT}" ] && [ "${SUBJECT}" != "null" ] || { echo "could not read sub from workload identity token" >&2; exit 1; }

      EXCHANGED=""
      for attempt in $(seq 1 10); do
        EXCHANGED="$(curl -sf \
          -H "Authorization: Bearer ${WID_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$(jq -nc --arg aud "${SECRETS_AUD}" --arg sub "${SUBJECT}" '{aud: $aud, sub: $sub, ttl: 300}')" \
          "${ISSUER_BASE}${URL_ROUTE}" | jq -r '.token // empty')" || true
        [ -n "${EXCHANGED}" ] && break
        echo "token exchange failed (attempt ${attempt}); retrying" >&2
        sleep 5
      done
      [ -n "${EXCHANGED}" ] || { echo "token exchange failed against ${ISSUER_BASE}${URL_ROUTE}" >&2; exit 1; }

      BUNDLE=""
      for attempt in $(seq 1 10); do
        BUNDLE="$(curl -sf -H "Authorization: Bearer ${EXCHANGED}" "${SECRETS_URL}${SECRETS_ROUTE}")" || true
        [ -n "${BUNDLE}" ] && break
        echo "secrets fetch failed (attempt ${attempt}); retrying" >&2
        sleep 5
      done
      [ -n "${BUNDLE}" ] || { echo "secrets fetch failed against ${SECRETS_URL}${SECRETS_ROUTE}" >&2; exit 1; }

      umask 077
      COUNT="$(printf '%s' "${BUNDLE}" | jq 'length')"
      i=0
      while [ "${i}" -lt "${COUNT}" ]; do
        SECRET_PATH="$(printf '%s' "${BUNDLE}" | jq -r ".[${i}].path")"
        install -d -m 0700 -o root -g root "$(dirname "${SECRET_PATH}")"
        printf '%s' "${BUNDLE}" | jq -j ".[${i}].value" > "${SECRET_PATH}"
        chown root:root "${SECRET_PATH}"
        chmod 0600 "${SECRET_PATH}"
        i=$((i + 1))
      done

      echo "wrote ${COUNT} secrets"
      touch "${STAMP}"
  - path: /etc/systemd/system/setup-secrets.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Fetch compute contract secrets via workload identity exchange
      After=network-online.target provisioning-token.service
      Wants=network-online.target
      ConditionPathExists=!/var/lib/setup-secrets.done

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      User=root
      ExecStart=/usr/local/bin/setup-secrets.sh
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
bootcmd: []
runcmd:
  - - sh
    - -c
    - command -v deno || { apt-get update && apt-get install -y curl unzip; curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/usr/local sh; chmod 755 /usr/local/bin/deno; }
  - systemctl daemon-reload
  - systemctl enable --now ssh || systemctl enable --now sshd
  - systemctl enable --now tunnel-subscriber.service
  - /usr/local/bin/setup-pi.sh
  - systemctl daemon-reload
  - systemctl enable setup-secrets.service
  - systemctl start --no-block setup-secrets.service
disable_root: false
ssh_pwauth: false
packages:
  - curl
  - unzip
  - ca-certificates
  - jq

