objective:
  one_sentence: >
    A tenant cluster whose k3s NODES scale to zero while its kcp + `k3s server --disable-agent`
    control plane stays live.
  why_disable_agent_matters: >
    A single-node k3s where the server IS the node can never produce zero nodes. `--disable-agent`
    is what makes "zero nodes" a real state rather than a contradiction.
  scope:
    in: kcp, k3s, k3s-node-in-firecracker, rustfs, kine, openbao, postgres
    out: >
      Every other repo. Provisioning guests through the market/RFP flow. The market's SSH door
      (its report surface is in scope, the door is not). Multi-node per cluster (v1 is 0-or-1).

standing_constraints:
  - No comments in code, ever. Decisions live in docs/ARCHITECTURE.md. An enforced hard rule.
  - Always update docs. The doc is the decision record; code carries none.
  - Launch subagents for all work; the main thread coordinates and verifies.
  - Node runs as a guest VM (firecracker). Nothing on the L0 host needs root.
  - Scope subagents so they do not need to talk to each other. When they must, tell them how.

