do_not_rederive:
  - Cold boot to an init marker is 0.300 s. Boot is NOT the problem; the 10 s goal is met 30x.
  - >
    SNAPSHOT RESTORE IS REFUTED as the provisioning primitive. restore-to-Ready 9.974 s against cold
    9.079 / 9.158 / 10.768 s, so restore buys nothing in time; and a restored guest cannot make a NEW
    node because restore does not re-run boot-time units, so the identity adoption never runs and a
    snapshot frozen as one node comes back as that node. Nodes boot COLD from their own rootfs clone.
  - Kernel 6.18.48 PANICS on this AMD host at restore (Bad FPU state, XRSTOR/AMX). Validate an image by RESTORING it, never by comparing versions.
  - The reported "332 s boot" was FABRICATED: a literal echo in run/initrd/init. Never trust a guest's self-report; the harness times on the host.
  - pasta + a tap inside the pasta netns works; an unprivileged tap in the HOST netns fails. The apiserver stays on loopback; --tls-san carries the address the guest dials.
  - k3s check-config reads the kernel CONFIG file and never checks whether a module is LOADED. It returns 0 over a missing module. This is why the module set is MEASURED, not checked.
  - iptables-restore is all-or-nothing, which is why the module list is 48 and not 43.
  - A named build context is mounted READ-ONLY, so a stage cannot write the store through one. /boot cannot even BE a context (/boot/efi is 0700).
  - The agent binary carries Go's VCS stamp, so a commit changing no agent source still moves every image's name. -buildvcs=false fixes it; agentBinaryDigest still identifies the source by content.
  - The advertise port and the k3s secure port are ONE lease answering both --apiserver flags, not two.

known_traps:
  stale_gopls:
    symptom: >
      gopls repeatedly reports undefined symbols, unused imports and missing interface methods that
      the compiler disagrees with. It happened 6+ times in one session, including a large dump
      claiming a dozen files were missing a method that exists.
    rule: The COMPILER is the authority. Run `go build ./...` before acting on any diagnostic.
    root_cause_update: >
      2026-09-24 (DEV-2): the tools were built with go1.23.7 and could not type-check this go1.26.4
      module. gopls/staticcheck/govulncheck are now rebuilt with go1.26.4 and staticcheck has no
      `(compile)` lines. The trap was a stale tool build, not gopls flakiness.
  subagent_claims:
    rule: >
      Verify the artefact, not the summary -- including a subagent's. Read the deployed file rather
      than the doc's description of it; run the binary rather than its report.
  fake_registries:
    rule: >
      Every test that runs the reconciler substitutes a fake whose MountStatus answers from
      Spec.Running. A fake that answers the question underneath the question is how a vacuous gate
      survived a green suite for as long as it did.
    status_update: >
      2026-09-24 (REL-6): the three live-proof fakes now answer 401 live / 503 Draining / 502 reaped
      from host liveness and DeletionTimestamp, not from Spec.Running.
  validate_sh:
    rule: >
      Container names are fixed, so a killed run blocks the next one; each run now removes its own
      name first. The host-contract step is gated on a POSITIVE assertion (the summary line must be
      present), not an exit-code allowlist, because check-host exits 2 without printing one.
    status_update: >
      2026-09-24 (REL-3): the final `go test` is now also gated on a positive `--- PASS: $TEST` line,
      because go test exits 0 on SKIP and on `[no tests to run]`.
  caveman_builder_agent:
    rule: >
      caveman:cavecrew-builder has Read/Edit/Write/Grep/Glob ONLY -- no Bash. It cannot compile,
      test, or commit. Use it only when correctness is established by reading; otherwise dispatch
      general-purpose or run the verification yourself.

the_recurring_defect:
  statement: >
    The dominant failure in this repo is a thing that reads GREEN while being WRONG. Prefer
    instruments that can fail. When adding a guard, watch it fail before trusting it.
  instances:
    - k3s check-config returning 0 over a missing module
    - pods 1/1 over an incomplete firewall
    - an advertise port nothing bound
    - TestEveryVerbIsBound asserting not-404 (presence) while getKubeconfig was permanently dead
    - check-host printing "holds 212" from free/budget when the store held 2
    - an EMPTY /etc/rancher/node/password that opens read-write while k3s 400s for ever
    - validate.sh's `|| true` making the host-contract step unable to fail
    - the shut gate reading 401 as shut, so a SERVING cluster was reaped
    - a list outliving its work -- three times in one day
    - "2026-09-24: the teardown gate reaping on 300/429/500/504 (REL-2); Probe claiming Ready on a 503 (REL-1); the ClientCA pair check hashing openssl's empty stdin so junk compared equal (SEC-5); validate.sh exiting 0 on SKIP (REL-3); the live proofs' fakes answering 200 (REL-6)"
  practice: >
    Run the artefact. Watch the guard fail. Report the reading, not the intention. If a claim is
    greener than the fact, the claim is the bug.

orientation:
  layout: |
    api/v1alpha1/          wire types only. No logic, no I/O
    internal/${concept}/   one package per concern; the interface declared where consumed
    cmd/${binary}/         the CLI layer; nothing else builds a binary
    deploy/                install scripts, manifests, audit policy, the control-plane container
  dependencies: "api <- internal <- cmd, one way. A new substrate or transport is a NEW PACKAGE, not a branch inside an existing one."
  binaries: [socialweb-clusterprovider, socialweb-gateway, socialweb-credential, socialweb-nodeimage, socialweb-nodeinit, socialweb-computer-kcp-check-host, socialweb-nodeboot]
  key_packages:
    internal/nodefirecracker: the firecracker half of a market guest's boot, on the bidder's host (image, manifest, namespace child)
    internal/nodemarket: the one node path, a NodeClaim the door fulfils under the owner's atproto session
    internal/noderecord: pid + start time + cmdline-identity record and reap; reap-never-adopt
    internal/kernelmodules: the builder's module check, shared by the builder and check-host
    internal/subnetallocator: pool 10.100.0.0/16 -> /24 per cluster
    internal/liveports: flock port rendezvous for concurrent proofs
    internal/materialiser: the reconciler; shut()/reached() gate a teardown
    internal/kcpclient: kcp client; ServiceAccountName is the DID mapping's one spelling
    internal/livegate: the SOCIALWEB_REQUIRE_LIVE / -short gate for live tests
  start_here: docs/ARCHITECTURE.md sections 1 (objective), 3 (zero state), 9 (a node), 11 (teardown and the gate), 12 (code layout), 13 (invariants), 14 (the open list), 15 (settled decisions, with the readings)
