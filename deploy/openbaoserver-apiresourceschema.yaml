                  - name
                  - sha256
              exec:
                type: string
              listen:
                type: string
              init:
                type: object
                properties:
                  shares:
                    type: integer
                    format: int32
                  threshold:
                    type: integer
                    format: int32
              restartPolicy:
                type: string
                enum:
                  - Never
                  - OnFailure
                  - Always
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
