apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.openbaoservers.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: OpenBaoServer
    listKind: OpenBaoServerList
    plural: openbaoservers
    singular: openbaoserver
  scope: Cluster
  versions:
