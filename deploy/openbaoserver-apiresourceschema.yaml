                    type: string
                  clientCert:
                    type: string
                  clientKey:
                    type: string
                  certAuthMount:
                    type: string
                  certAuthRole:
                    type: string
                  kvMount:
                    type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Address
          type: string
          jsonPath: .status.address
        - name: Initialized
          type: boolean
          jsonPath: .status.initialized
        - name: Sealed
          type: boolean
          jsonPath: .status.sealed
        - name: Instance
          type: string
          jsonPath: .status.runtime.instance
