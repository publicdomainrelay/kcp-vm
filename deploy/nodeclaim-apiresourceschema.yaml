apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.nodeclaims.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: NodeClaim
    listKind: NodeClaimList
    plural: nodeclaims
    singular: nodeclaim
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              cluster:
                type: string
              nodeName:
                type: string
              ownerDid:
                type: string
              apiserverPort:
                type: integer
              advertiseAddress:
                type: string
              tokenFile:
                type: string
              nodePasswordFile:
                type: string
              serverCAFile:
                type: string
              denyBidderDids:
                type: array
                items:
                  type: string
            required:
              - cluster
              - nodeName
              - ownerDid
              - apiserverPort
              - advertiseAddress
              - tokenFile
              - nodePasswordFile
              - serverCAFile
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                  - Pending
                  - Bidding
                  - Provisioning
                  - Joining
                  - Running
                  - Failed
                  - Released
              contract:
                type: object
                properties:
                  vmUri:
                    type: string
                  rfpUri:
                    type: string
                  acceptUri:
                    type: string
                  receiptUri:
                    type: string
                  receiptCid:
                    type: string
                  submitEventRef:
                    type: string
              fqdn:
                type: string
              message:
                type: string
