name: ssh-gateway
entry: hono-socialweb-computer-ssh
stateDir: "{{.StateDir}}"
serviceAccount: deno-runner
tls: none
args: ["--ssh-port", "0", "--ssh-hostname", "127.0.0.1", "--http-port", "0", "--serve-addr", "127.0.0.1", "--state-dir", "{{.StateDir}}", "--web-dir", "{{.WebDir}}", "--iroh-dial-socket", "{{.IrohDial.Socket}}", "--openbao-server", "{{.Vault.Server}}", "--openbao-client", "{{.Vault.Client}}", "--openbao-kcp-workspace", "{{.Kcp.Workspace}}", "--openbao-kcp-token-file", "{{.Kcp.TokenFile}}", "--openbao-kcp-ca-cert-file", "{{.Kcp.CAFile}}"{{.ExtraArgs}}]
permissions:
  net: true
  env: {{.EnvAllow}}
  sys: [hostname]
  read: ["{{.Vault.CA}}", "{{.Vault.ClientDir}}"{{.ExtraRead}}]
probe:
  host: ssh-gateway.default.app.svc.kcp.local
  path: /oauth-client-metadata.json
