apiVersion: v1
kind: ServiceAccount
metadata:
  name: socialweb-computer-k8s
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: socialweb-computer-k8s-web-app
rules:
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities"]
    verbs: ["create", "list", "patch"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: socialweb-computer-k8s-web-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: socialweb-computer-k8s-web-app
subjects:
  - kind: ServiceAccount
    name: socialweb-computer-k8s
    namespace: default
