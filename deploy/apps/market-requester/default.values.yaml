name: requester
entry: request-vm-ssh
stateDir: "{{.StateDir}}"
serviceAccount: deno-runner
tls: none
args: ["--port", "0", "--pds-state-path", "{{.StateDir}}/pds", "--market-identity-kcp-workspace", "{{.Kcp.Workspace}}", "--compute-contract-kcp-workspace", "{{.Kcp.Workspace}}", "--identity-vault-openbao-server", "{{.Vault.Server}}", "--identity-vault-openbao-client", "{{.Vault.Client}}", "--identity-vault-kcp-workspace", "{{.Kcp.Workspace}}"{{.ExtraArgs}}]
projected:
  - {name: kcp-token, serviceAccountToken: {name: requester, workspace: "{{.Kcp.Workspace}}"}}
  - {name: kcp-ca, kcpCA: {}}
  - {name: vault, openBaoClient: {server: "{{.Vault.Server}}", client: "{{.Vault.Client}}", workspace: "{{.Kcp.Workspace}}"}}
env:
  SERVE_PORT: "0"
permissions:
  net: true
  env: [SERVE_PORT, PORT, PORT_FILE, LISTENERS_FILE, STATUS_FILE, PATH, HOME, BUNDLED_ACTIONS_DIR]
  sys: [hostname]
probe:
  host: requester.default.app.svc.kcp.local
  path: /xrpc/_health
