name: requester
entry: request-vm-ssh
stateDir: "{{.StateDir}}"
serviceAccount: deno-runner
tls: trust
trust: ["{{.CABundle}}"]
args: ["--port", "0", "--pds-state-path", "{{.StateDir}}/pds", "--market-identity-kcp-workspace", "{{.Kcp.Workspace}}", "--market-identity-kcp-token-file", "{{.Kcp.TokenFile}}", "--market-identity-kcp-ca-cert-file", "{{.Kcp.CAFile}}", "--compute-contract-kcp-workspace", "{{.Kcp.Workspace}}", "--compute-contract-kcp-token-file", "{{.Kcp.TokenFile}}", "--compute-contract-kcp-ca-cert-file", "{{.Kcp.CAFile}}", "--identity-vault-openbao-server", "{{.Vault.Server}}", "--identity-vault-openbao-client", "{{.Vault.Client}}", "--identity-vault-kcp-workspace", "{{.Kcp.Workspace}}", "--identity-vault-kcp-token-file", "{{.Kcp.TokenFile}}", "--identity-vault-kcp-ca-cert-file", "{{.Kcp.CAFile}}", "--guest-ca-file", "{{.CABundle}}", "--guest-curl-home", "/root"{{.ExtraArgs}}]
env:
  SERVE_PORT: "0"
permissions:
  net: true
  env: [SERVE_PORT, PORT, PORT_FILE, LISTENERS_FILE, STATUS_FILE, PATH, HOME, BUNDLED_ACTIONS_DIR]
  sys: [hostname]
  read: ["{{.CABundle}}", "{{.Vault.CA}}", "{{.Vault.ClientDir}}"]
probe:
  host: requester.default.app.svc.kcp.local
  path: /xrpc/_health
