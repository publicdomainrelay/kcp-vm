name: guest-kcp
entry: hono-bidder-guest
stateDir: "{{.Guest.StateDir}}"
serviceAccount: deno-runner
tls: trust
trust: [{{.Trust}}]
args: ["--role", "kcp", "--vault-openbao-server", "{{.Vault.Server}}", "--vault-openbao-client", "{{.Guest.VaultClient}}", "--vault-kcp-server", "{{.Vault.KcpServer}}", "--vault-kcp-token-file", "{{.Guest.TokenFile}}", "--vault-kcp-ca-cert-file", "{{.Guest.CAFile}}", "--kcp-server", "{{.Kcp.Server}}", "--kcp-workspace", "{{.Kcp.Workspace}}", "--kcp-token-file", "{{.Guest.TokenFile}}", "--kcp-ca-file", "{{.Guest.CAFile}}", "--handle", "{{.Guest.Handle}}", "--plc-directory-url", "{{.PlcDirectoryUrl}}", "--ingress-proxy-host", "{{.IngressProxyHost}}", "--serve-port", "0"{{.Guest.ExtraArgs}}]
env:
  PORT: "0"
  SERVE_PORT: "0"
permissions:
  net: true
  env: [SERVE_PORT, PORT, PORT_FILE, LISTENERS_FILE, STATUS_FILE, KCP_NAMESPACE]
  sys: [hostname]
  read: [{{.Guest.Read}}]
probe:
  host: guest-kcp.default.app.svc.kcp.local
  path: /.well-known/openid-configuration
