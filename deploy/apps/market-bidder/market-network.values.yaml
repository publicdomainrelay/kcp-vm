name: bidder
entry: hono-bidder
stateDir: "{{.StateDir}}"
serviceAccount: deno-runner
tls: trust
trust: ["{{.CABundle}}"]
args: ["--atproto-identity-mode", "pdsAccount", "--atproto-handle", "{{.Handle}}", "--atproto-pds-url", "{{.PdsUrl}}", "--identity-vault-openbao-server", "{{.Vault.Server}}", "--identity-vault-openbao-client", "{{.Vault.Client}}", "--identity-vault-kcp-server", "{{.Vault.KcpServer}}", "--identity-vault-kcp-token-file", "{{.Vault.TokenFile}}", "--identity-vault-kcp-ca-cert-file", "{{.Vault.KcpCAFile}}", "--serve-port", "0", "--relay-url", "{{.RelayUrls}}", "--plc-directory-url", "{{.PlcDirectoryUrl}}", "--ingress-proxy-host", "{{.IngressProxyHost}}", "--policy", "{{.Policy}}"{{.ProviderArgs}}, "--contract-store-dir", "{{.StateDir}}/contracts", "--guest-tls-port", "{{.GuestTLSPort}}"{{.ExtraArgs}}]
env:
  PORT: "0"
  SERVE_PORT: "0"
  PDS_STATE_PATH: "{{.StateDir}}/pds-state"
permissions:
  net: true
  env: true
  sys: true
  read: ["{{.CABundle}}", "{{.Vault.CA}}", "{{.Vault.ClientDir}}"{{.ProviderRead}}]
  write: [{{.ProviderWrite}}]
  run:
    allow: ["ssh-keygen", "bash", "deno"{{.ProviderRun}}]
    reason: >-
      the firecracker compute provider starts, inspects, stops and lists each guest's VM unit through the
      Linux VM runtime command (socialweb-computer internal vm; with spec.kcp the bidder runs none: the
      ComputeVM controller in its own core boots its guests), the guest OIDC issuer verifies ssh
      signatures with ssh-keygen, and the in-process policy engine runs a policy workflow's run steps in
      bash and its actions as deno subprocesses (deno is the pinned deno the template runs on)
probe:
  host: bidder.default.app.svc.kcp.local
  path: /oauth-client-metadata.json
