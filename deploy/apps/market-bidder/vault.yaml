apiVersion: socialweb.computer/v1alpha1
kind: OpenBaoServer
metadata:
  name: bidder
spec:
  asset:
    name: bao
    sha256: ""
  clients:
    - name: bidder
      kvMount: bidder
    - name: computevm
      policies: ["computevm-guest-user-data"]
    - name: guest-kcp
      policies: ["bidder-guest-kcp"]
  declared:
    policies:
      - name: bidder-guest-kcp
        rules:
          - path: bidder/data/relay-keypair/kcp
            capabilities: ["create", "read", "update"]
          - path: bidder/data/oidc-jwk/kcp
            capabilities: ["create", "read", "update"]
          - path: bidder/data/guests/+/provisioning
            capabilities: ["create", "read", "update"]
          - path: bidder/metadata/guests
            capabilities: ["list"]
          - path: bidder/metadata/guests/
            capabilities: ["list"]
      - name: computevm-guest-user-data
        rules:
          - path: bidder/data/guests/+/user-data
            capabilities: ["read"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bidder
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bidder
rules:
  - apiGroups: ["socialweb.computer"]
    resources: ["openbaoservers"]
    verbs: ["get", "list"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["socialweb.computer"]
    resources: ["marketidentities/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bidder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bidder
subjects:
  - kind: ServiceAccount
    name: bidder
    namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guest-kcp
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guest-kcp
rules:
  - apiGroups: ["socialweb.computer"]
    resources: ["openbaoservers"]
    verbs: ["get", "list"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["socialweb.computer"]
    resources: ["computevms/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guest-kcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guest-kcp
subjects:
  - kind: ServiceAccount
    name: guest-kcp
    namespace: default
