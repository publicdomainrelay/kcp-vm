# One ExternalSecret proving the path end to end: the value is authored in OpenBao at
# secret/data/k3s/eso-demo and materialised into the tenant cluster as the Secret
# default/openbao-demo. The namespace is rewritten by internal/eso to the tenant namespace.
#
# The External Secrets controller is a process beside the cluster's control plane, in the
# provider's process group, not a pod in the tenant (NEXT.yaml ESO-4). It reconciles this object
# whenever the control plane is up, including at ZERO nodes. Nothing here authors a value in k3s;
# the Secret is a copy whose only writer is that controller.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-demo
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-demo
    creationPolicy: Owner
  data:
    - secretKey: demo
      remoteRef:
        key: k3s/eso-demo
        property: demo
