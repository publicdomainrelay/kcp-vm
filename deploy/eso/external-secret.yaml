# One ExternalSecret proving the path end to end: the value is authored in OpenBao at
# secret/data/k3s/eso-demo and materialised into the tenant cluster as the Secret
# default/openbao-demo. The namespace is rewritten by internal/eso to the tenant namespace.
#
# The tenant cluster can scale to ZERO nodes. When it has none, the ESO controller has no node to
# run on, so it neither refreshes nor reconciles this object: the last materialised Secret stays
# in the store and serves stale data until a node returns. Nothing here authors a value in k3s;
# the Secret is a copy whose only writer is ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-demo
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-demo
    creationPolicy: Owner
  data:
    - secretKey: demo
      remoteRef:
        key: k3s/eso-demo
        property: demo
