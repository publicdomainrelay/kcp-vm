---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gwmint
  namespace: users
  labels:
    app.kubernetes.io/part-of: socialweb-computer
    socialweb.computer/role: mint
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gwmint
  namespace: users
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames:
      - __SOCIALWEB_OWNER_SERVICE_ACCOUNT__
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
    resourceNames:
      - __SOCIALWEB_OWNER_SERVICE_ACCOUNT__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gwmint
  namespace: users
subjects:
  - kind: ServiceAccount
    name: gwmint
    namespace: users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gwmint
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: socialweb-owner
  labels:
    app.kubernetes.io/part-of: socialweb-computer
    socialweb.computer/role: owner
subjects:
  - kind: ServiceAccount
    name: __SOCIALWEB_OWNER_SERVICE_ACCOUNT__
    namespace: users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: socialweb-mint-identity
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
        scope: Namespaced
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
        scope: Namespaced
  matchConditions:
    - name: only-in-users
      expression: request.namespace == 'users'
  validations:
    - expression: >-
        request.resource.resource == 'serviceaccounts'
          ? request.userInfo.username == 'system:serviceaccount:users:gwmint'
          : (request.userInfo.username == 'system:admin' && 'system:masters' in request.userInfo.groups)
            || request.userInfo.username == '__SOCIALWEB_ESO_USER__'
      message: "only the tenant mint may request ServiceAccount tokens, and only the provisioning cluster-admin or the External Secrets controller that materialises its vault-backed Secrets may write Secrets in this namespace"
    - expression: request.namespace == 'users'
      message: "ServiceAccount tokens may only be requested in users"
    - expression: request.resource.resource != 'serviceaccounts' || request.name.matches('^did-[a-z2-7]+$')
      message: "the target must be a DID-derived ServiceAccount name"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: socialweb-mint-identity
spec:
  policyName: socialweb-mint-identity
  validationActions: ["Deny"]
  matchResources: {}
