# Stable public edge entry points: the only fixed TCP or UDP ports allowed
# behind the edge (plan 0006 principle.port0_rule, M1-NO-FIXED-PORTS). Every
# other listener binds port 0 and reports its address. Extended only by a user
# decision. files are path globs, relative to this repository's root, a port is
# allowed in.
edge_ports:
  - name: caddy
    port: 443
    files: ["scripts/deploy.sh"]
    reason: >
      caddy is the public HTTPS entry point of a host; it terminates TLS for every public name and proxies
      to the application fronts below (decided by the user 2026-10-12).
  - name: gateway-kcp-front
    port: 6443
    files: ["scripts/deploy.sh", "deploy/container-entrypoint.sh"]
    reason: >
      the gateway application's kcp front on 127.0.0.1:6443, which caddy proxies its kcp origin to
      (0006 M2-KCP-FRONT); only the gateway's production config, never a bed or a dev instance.
  - name: door
    port: 8788
    files: ["scripts/deploy.sh", "deploy/container-entrypoint.sh"]
    reason: >
      the door, the gateway application's HTTP front that caddy proxies its public origin to
      (0008 M3-DOOR-DENOPOD).
