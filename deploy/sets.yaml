sets:
  - name: provider
    summary: the socialweb provider workspace, its schemas and exports, and the account and cluster WorkspaceTypes (was install-provider.sh)
    values: None
    phases:
      - name: workspace
        workspace: root
        files:
          - path: workspace-socialweb-provider.yaml
        after:
          - kind: Workspace
            for: Ready
      - name: schemas
        workspace: root:socialweb-provider
        files:
          - path: cluster-apiresourceschema.yaml
          - path: node-apiresourceschema.yaml
          - path: nodeclaim-apiresourceschema.yaml
          - path: clusterlink-apiresourceschema.yaml
          - path: atprotoidentity-apiresourceschema.yaml
          - path: cluster-apiexport.yaml
          - path: atprotoidentity-apiexport.yaml
      - name: workspacetypes
        workspace: root
        files:
          - path: workspacetype-account.yaml
          - path: workspacetype-cluster.yaml
        after:
          - kind: APIExport
            name: clusters
            workspace: root:socialweb-provider
            for: IdentityValid
          - kind: APIExport
            name: atprotoidentities
            workspace: root:socialweb-provider
            for: IdentityValid

  - name: permission-inventory
    summary: the four provider ServiceAccounts, then their ClusterRoles and bindings named to the live provider cluster (was apply-permission-inventory.sh)
    values: PermissionInventory
    phases:
      - name: provider-cluster
        workspace: root
        before:
          - kind: Workspace
            name: socialweb-provider
            for: Ready
            capture:
              into: ProviderCluster
              from: LogicalCluster
      - name: subjects
        workspace: root:socialweb-provider
        files:
          - path: permission-inventory.yaml
            kinds: [ServiceAccount]
      - name: grants
        workspace: root:socialweb-provider
        files:
          - path: permission-inventory.yaml
            exceptKinds: [ServiceAccount]

  - name: denoruntime
    summary: the deno provider workspace, the DenoPod, DenoRun, DenoJob, OpenBao and policy schemas and exports, and the workflow and denoruntime WorkspaceTypes (was denokcp/install-provider.sh)
    values: None
    phases:
      - name: workspace
        workspace: root
        files:
          - path: workspace-deno-provider.yaml
        after:
          - kind: Workspace
            for: Ready
      - name: schemas
        workspace: root:deno-provider
        files:
          - path: denokcp/policyworkflowrun-apiresourceschema.yaml
          - path: denokcp/policyworkflowrun-apiexport.yaml
          - path: denokcp/denopod-apiresourceschema.yaml
          - path: denokcp/denorun-apiresourceschema.yaml
          - path: denokcp/denojob-apiresourceschema.yaml
          - path: denokcp/runtrigger-apiresourceschema.yaml
          - path: denokcp/policyengine-apiresourceschema.yaml
          - path: denokcp/policyworkflowpod-apiresourceschema.yaml
          - path: denokcp/openbao-apiresourceschema.yaml
          - path: denokcp/denoruntime-apiexport.yaml
      - name: workspacetypes
        workspace: root
        files:
          - path: denokcp/workspacetype-workflow.yaml
          - path: denokcp/workspacetype-denoruntime.yaml
        after:
          - kind: APIExport
            name: policyworkflowruns
            workspace: root:deno-provider
            for: IdentityValid
          - kind: APIExport
            name: denoruntime
            workspace: root:deno-provider
            for: IdentityValid
      - name: bindings
        workspace: root:deno-provider
        files:
          - path: denoruntime-provider-bindings.yaml
        after:
          - kind: APIBinding
            for: Ready

  - name: bidder
    summary: the ComputeVM schema and export beside the provider's, the bidder WorkspaceType binding denoruntime, computevms and hostprocesses (plan 0007 M1-API), and the computevms binding in root that the ComputeVM controller of a bidder application instance applies with it (plan 0007 M2-CONTROLLER); needs the provider workspace and the hostprocesses set
    values: None
    phases:
      - name: schemas
        workspace: root:socialweb-provider
        files:
          - path: computevm-apiresourceschema.yaml
          - path: computevm-apiexport.yaml
        after:
          - kind: APIExport
            name: computevms
            for: IdentityValid
          - kind: APIExport
            name: hostprocesses
            for: IdentityValid
      - name: workspacetypes
        workspace: root
        files:
          - path: workspacetype-bidder.yaml
      - name: bindings
        workspace: root
        files:
          - path: computevms-binding.yaml
        after:
          - kind: APIBinding
            for: Ready

  - name: hostprocesses
    summary: the HostProcess, Postgres and OpenBaoServer schemas and their export in the provider workspace and its binding in root, applied by every core so the application's own kcp holds its host processes, the bootstrap mirrors, its postgres servers and its OpenBao servers (plan 0006 M2-HOSTPROCESS-KIND, M2-POSTGRES, M2-OPENBAO-SERVER); needs the provider workspace
    values: None
    phases:
      - name: schemas
        workspace: root:socialweb-provider
        files:
          - path: hostprocess-apiresourceschema.yaml
          - path: postgres-apiresourceschema.yaml
          - path: openbaoserver-apiresourceschema.yaml
          - path: hostprocess-apiexport.yaml
        after:
          - kind: APIExport
            name: hostprocesses
            for: IdentityValid
      - name: bindings
        workspace: root
        files:
          - path: hostprocesses-binding.yaml
        after:
          - kind: APIBinding
            for: Ready

  - name: dev-host
    summary: the dev-instances and dev-instance WorkspaceTypes and the root:dev workspace of a dev host, whose root:dev:<instance> workspaces hold each child instance's HostProcess objects (plan 0006 M4-DEV-PARENT-KCP); needs the hostprocesses set
    values: None
    phases:
      - name: workspacetypes
        workspace: root
        before:
          - kind: APIExport
            name: hostprocesses
            workspace: root:socialweb-provider
            for: IdentityValid
        files:
          - path: workspacetype-dev-instance.yaml
            kinds: [WorkspaceType]
      - name: workspace
        workspace: root
        files:
          - path: workspacetype-dev-instance.yaml
            kinds: [Workspace]
        after:
          - kind: Workspace
            name: dev
            for: Ready

  - name: market-identity
    summary: the MarketIdentity schema and export in an application's own workspace (plan 0007 M1-MARKET-IDENTITY)
    values: MarketIdentity
    phases:
      - name: schemas
        workspace: "{{.Workspace}}"
        files:
          - path: marketidentity-apiresourceschema.yaml
          - path: marketidentity-apiexport.yaml
        after:
          - kind: APIExport
            name: marketidentities
            for: IdentityValid

  - name: applications
    summary: the MarketNetwork, MarketBidder, MarketRequester and Gateway schemas and their export in the provider workspace and its binding in root, applied by every core so each application's root object lives in its own kcp (plan 0006 M2-APP-CONTROLLER); needs the provider workspace
    values: None
    phases:
      - name: schemas
        workspace: root:socialweb-provider
        files:
          - path: marketnetwork-apiresourceschema.yaml
          - path: marketbidder-apiresourceschema.yaml
          - path: marketrequester-apiresourceschema.yaml
          - path: gateway-apiresourceschema.yaml
          - path: marketnetwork-apiexport.yaml
        after:
          - kind: APIExport
            name: applications
            for: IdentityValid
      - name: bindings
        workspace: root
        files:
          - path: applications-binding.yaml
        after:
          - kind: APIBinding
            for: Ready

  - name: market-bidder
    summary: the components of a MarketBidder application in its own kcp - its own OpenBaoServer and the account that reads it in root, the root:app workspace and, per profile, the bidder DenoPod rendered from deploy/apps/market-bidder/<profile>.values.yaml (a phase named <component>@<profile> belongs to that profile only); applied by internal/appctl
    values: MarketBidder
    phases:
      - name: vault
        workspace: root
        files:
          - path: apps/market-bidder/vault.yaml
        after:
          - kind: OpenBaoServer
            name: bidder
            for: Ready
      - name: workspace
        workspace: root
        files:
          - path: apps/workspace-app.yaml
        after:
          - kind: Workspace
            for: Ready
      - name: rbac
        workspace: root:app
        before:
          - kind: APIBinding
            for: Ready
        files:
          - path: market-network/10-rbac.yaml
      - name: bidder@market-network
        workspace: root:app
        files:
          - path: apps/market-bidder/market-network.values.yaml
            template: denopods/service.yaml

  - name: gateway
    summary: the components of a Gateway application in its own kcp - the root:app workspace, the MarketIdentity schema bound there (one MarketIdentity per web app account) and, per profile, the socialweb-computer-k8s web app DenoPod rendered from deploy/apps/gateway/<profile>.values.yaml (a phase named <component>@<profile> belongs to that profile only); its root vault is the OpenBaoServer root-vault the app controller declares; applied by internal/appctl
    values: Gateway
    phases:
      - name: workspace
        workspace: root
        files:
          - path: apps/workspace-app.yaml
        after:
          - kind: Workspace
            for: Ready
      - name: rbac
        workspace: root:app
        before:
          - kind: APIBinding
            for: Ready
        files:
          - path: apps/gateway/web-app-rbac.yaml
      - name: identity-schemas
        workspace: root:socialweb-provider
        files:
          - path: marketidentity-apiresourceschema.yaml
          - path: marketidentity-apiexport.yaml
        after:
          - kind: APIExport
            name: marketidentities
            for: IdentityValid
      - name: identity-binding
        workspace: root:app
        files:
          - path: apps/gateway/marketidentities-binding.yaml
        after:
          - kind: APIBinding
            for: Ready
      - name: socialweb-computer-k8s@prod
        workspace: root:app
        files:
          - path: apps/gateway/prod.values.yaml
            template: denopods/service.yaml
      - name: socialweb-computer-k8s@market-network
        workspace: root:app
        files:
          - path: apps/gateway/market-network.values.yaml
            template: denopods/service.yaml

  - name: market-requester
    summary: the components of a MarketRequester application (one `run request` invocation) in its own kcp - the ComputeContract and MarketIdentity schemas bound in root, its own OpenBaoServer and the account the requester reads its objects with, the root:app workspace and, per profile, the requester DenoPod rendered from deploy/apps/market-requester/<profile>.values.yaml; applied by internal/appctl (plan 0008 M4-RUN-REQUEST)
    values: MarketRequester
    phases:
      - name: schemas
        workspace: root:socialweb-provider
        files:
          - path: computecontract-apiresourceschema.yaml
          - path: computecontract-apiexport.yaml
          - path: marketidentity-apiresourceschema.yaml
          - path: marketidentity-apiexport.yaml
        after:
          - kind: APIExport
            name: computecontracts
            for: IdentityValid
          - kind: APIExport
            name: marketidentities
            for: IdentityValid
      - name: bindings
        workspace: root
        files:
          - path: apps/market-requester/bindings.yaml
        after:
          - kind: APIBinding
            for: Ready
      - name: vault
        workspace: root
        files:
          - path: apps/market-requester/vault.yaml
        after:
          - kind: OpenBaoServer
            name: requester
            for: Ready
      - name: workspace
        workspace: root
        files:
          - path: apps/workspace-app.yaml
        after:
          - kind: Workspace
            for: Ready
      - name: rbac
        workspace: root:app
        before:
          - kind: APIBinding
            for: Ready
        files:
          - path: market-network/10-rbac.yaml
      - name: requester@market-network
        workspace: root:app
        files:
          - path: apps/market-requester/market-network.values.yaml
            template: denopods/service.yaml
      - name: requester@default
        workspace: root:app
        files:
          - path: apps/market-requester/default.values.yaml
            template: denopods/service.yaml

  - name: market-network
    summary: the shared services of a MarketNetwork application - its OpenBaoServer network (the PKI the deno runtime issues the services' certificates from, through a client that holds only that policy), PLC, relay, dispatcher and its TLS front, two PDSes and the verifier - applied by its reconciler (internal/appctl); the bidders are child applications with their own kcp; needs denoruntime and a running deno provider
    values: MarketNetwork
    phases:
      - name: vault
        workspace: root
        files:
          - path: market-network/05-vault.yaml
        after:
          - kind: OpenBaoServer
            name: network
            for: Ready
      - name: workspaces
        workspace: root
        files:
          - path: market-network/00-workspaces.yaml
        after:
          - kind: Workspace
            for: Ready
      - name: rbac-global
        workspace: root:global
        before:
          - kind: APIBinding
            for: Ready
        files:
          - path: market-network/10-rbac.yaml
      - name: rbac-relay
        workspace: root:relay
        before:
          - kind: APIBinding
            for: Ready
        files:
          - path: market-network/10-rbac.yaml
      - name: rbac-alice
        workspace: root:alice
        before:
          - kind: APIBinding
            for: Ready
        files:
          - path: market-network/10-rbac.yaml
      - name: rbac-bob
        workspace: root:bob
        before:
          - kind: APIBinding
            for: Ready
        files:
          - path: market-network/10-rbac.yaml
      - name: openbao-global
        workspace: root:global
        files:
          - path: market-network/15-openbao-global.yaml
      - name: openbao-relay
        workspace: root:relay
        files:
          - path: market-network/15-openbao-relay.yaml
      - name: openbao-alice
        workspace: root:alice
        files:
          - path: market-network/15-openbao-alice.yaml
      - name: openbao-bob
        workspace: root:bob
        files:
          - path: market-network/15-openbao-bob.yaml
        after:
          - kind: OpenBao
            name: openbao
            workspace: root:global
            for: Ready
          - kind: OpenBao
            name: openbao
            workspace: root:relay
            for: Ready
          - kind: OpenBao
            name: openbao
            workspace: root:alice
            for: Ready
          - kind: OpenBao
            name: openbao
            workspace: root:bob
            for: Ready
      - name: plc
        workspace: root:global
        files:
          - path: market-network/20-global-plc.yaml
            template: denopods/service.yaml
      - name: dispatcher
        workspace: root:relay
        files:
          - path: market-network/35-relay-dispatcher.yaml
            template: denopods/service.yaml
        after:
          - kind: DenoPod
            name: dispatcher
            for: Address
            capture:
              into: DispatcherPort
              from: AddressPort
      - name: dispatcher-tls
        workspace: root:relay
        files:
          - path: market-network/36-relay-dispatcher-tls.yaml
        after:
          - kind: DenoPod
            name: dispatcher-tls
            for: Address
            capture:
              into: GuestTLSPort
              from: AddressPort
      - name: alice-pds
        workspace: root:alice
        files:
          - path: market-network/40-alice-pds.yaml
            template: denopods/service.yaml
      - name: bob-pds
        workspace: root:bob
        files:
          - path: market-network/60-bob-pds.yaml
            template: denopods/service.yaml
        after:
          - kind: DenoPod
            name: pds
            for: Address
      - name: relay
        workspace: root:relay
        files:
          - path: market-network/30-relay-relay.yaml
            template: denopods/service.yaml
      - name: verifier
        workspace: root:alice
        before:
          - kind: DenoPod
            name: pds
            for: Ready
            bestEffort: true
          - kind: DenoPod
            name: relay
            workspace: root:relay
            for: Address
            bestEffort: true
        files:
          - path: market-network/50-verifier.yaml

unapplied:
  - path: sets.yaml
    why: this index
  - path: audit-policy.yaml
    why: an audit.k8s.io Policy file a k3s apiserver reads at start through --audit-policy-file, never an object
  - path: apps/option-map.yaml
    why: maps every cli-args-env option of hono-bidder and request-vm-ssh to a root-object field, the network value, a ComputeContract field, a profile, the state dir, a listener report, the options passthrough, the foreground CLI or a legacy-transport removal; internal/appctl reads it to accept spec.options and `run request`'s passthrough (plans 0006 M2-APP-CONTROLLER, 0008 M4-RUN-REQUEST)
  - path: apps/market-network/market-network.values.yaml
    why: the market-network profile's NetworkApp defaults for each bidder and the gateway, merged with dev up's app-values into the MarketNetwork spec by internal/appctl, never an object
  - path: ts-entries.yaml
    why: the TypeScript closure entries cmd/socialweb-tsbundle bundles (plan 0008 M1-TS-CLOSURE), a build input, never an object
  - path: kcp-audit-policy.yaml
    why: the Policy file kcp reads at start through --audit-policy-file (run-kcp-instance.sh, the image), never an object
  - path: tenant-grant.yaml
    why: applied into each tenant k3s cluster by internal/clusterprovider (tenant.go) with its owner placeholder rewritten, never into kcp
  - path: eso/cluster-secret-store.yaml
    why: applied into each tenant k3s cluster by internal/eso with its vault values rewritten, never into kcp
  - path: eso/external-secret.yaml
    why: applied into each tenant k3s cluster by internal/eso, never into kcp
