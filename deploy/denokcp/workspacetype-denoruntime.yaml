apiVersion: tenancy.kcp.io/v1alpha1
kind: WorkspaceType
metadata:
  name: denoruntime
spec:
  extend:
    with:
      - name: workflow
        path: root
      - name: universal
        path: root

  defaultAPIBindings:
    - export: policyworkflowruns
      path: root:deno-provider
    - export: denoruntime
      path: root:deno-provider
