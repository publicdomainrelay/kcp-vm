apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.openbaos.deno.computer
spec:
  group: deno.computer
  names:
    kind: OpenBao
    listKind: OpenBaoList
    plural: openbaos
    singular: openbao
    shortNames:
      - obao
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              namespace:
                type: string
                description: >-
                  The OpenBao namespace this Kubernetes namespace is served by,
                  for example alice.default. It holds the intermediate CA that
                  the workloads in this namespace are issued from, and it chains
                  to the root CA in the OpenBao root namespace.
            required:
              - namespace
          status:
            type: object
            properties:
              namespace:
                type: string
              serial:
                type: string
              chain:
                type: string
              ready:
                type: boolean
              message:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
