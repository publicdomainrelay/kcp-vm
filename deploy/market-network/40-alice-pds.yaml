name: pds
entry: hono-pds
stateDir: "{{.StateDir}}/alice-pds"
memory: 512Mi
serviceAccount: deno-runner
tls: serve
args: ["--port", "0", "--hostname", "127.0.0.1", "--kv-path", "{{.StateDir}}/alice-pds/kv.sqlite3"]
env:
  PORT: "0"
  HOSTNAME: "127.0.0.1"
  PDS_PUBLIC_HOSTNAME: pds.default.alice.svc.kcp.local
  PDS_PLC_DIRECTORY_URL: https://plc.default.global.svc.kcp.local
  PDS_CRAWLERS: https://relay.default.relay.svc.kcp.local
  PDS_SUBSCRIBE_REPOS_FORMAT: json
  PDS_PRIVATE_KEY_HEX: "{{.PDSPrivateKeyHex}}"
permissions:
  net: true
  env: true
  sys: true
probe:
  host: pds.default.alice.svc.kcp.local
  path: /xrpc/_health
