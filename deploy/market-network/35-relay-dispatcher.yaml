name: dispatcher
entry: hono-did-key-ingress-proxy
edge: "a market network front: it binds port 0 once and keeps that port across a core restart (ports.json)"
stateDir: "{{.StateDir}}/relay-dispatcher"
memory: 512Mi
serviceAccount: deno-runner
tls: trust
args: ["--hostname", "relay.localhost", "--port", "{{.Ports.Dispatcher}}", "--additional-hosts", "dispatcher.default.relay.svc.kcp.local,*", "--plc-directory-url", "https://plc.default.global.svc.kcp.local"]
env:
  PORT: "{{.Ports.Dispatcher}}"
permissions:
  net: true
  env: true
  sys: true
probe:
  host: dispatcher.default.relay.svc.kcp.local
  path: /.well-known/did.json
