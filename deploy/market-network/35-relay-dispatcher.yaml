name: dispatcher
entry: hono-did-key-ingress-proxy
cwd: ts/did-key-ingress-proxy
stateDir: "{{.StateDir}}/relay-dispatcher"
serviceAccount: deno-runner
tls: trust
args: ["--hostname", "relay.localhost", "--port", "0", "--additional-hosts", "dispatcher.default.relay.svc.kcp.local,*", "--plc-directory-url", "https://plc.default.global.svc.kcp.local"]
env:
  PORT: "0"
permissions:
  net: true
  env: true
  sys: true
probe:
  host: dispatcher.default.relay.svc.kcp.local
  path: /.well-known/did.json
