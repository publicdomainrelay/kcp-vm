name: plc
entry: hono-plc
edge: "a market network front: it binds port 0 once and keeps that port across a core restart (ports.json)"
stateDir: "{{.StateDir}}/global-plc"
memory: 256Mi
serviceAccount: deno-runner
tls: serve
args: ["--port", "{{.Ports.Plc}}", "--hostname", "127.0.0.1", "--state-path", "{{.StateDir}}/global-plc/plc.json"]
env:
  PORT: "{{.Ports.Plc}}"
  HOSTNAME: "127.0.0.1"
permissions:
  net: true
  env: true
  sys: true
probe:
  host: plc.default.global.svc.kcp.local
  path: /health
