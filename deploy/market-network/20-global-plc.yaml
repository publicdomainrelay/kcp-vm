name: plc
entry: hono-plc
cwd: ts/atproto-market
stateDir: "{{.StateDir}}/global-plc"
serviceAccount: deno-runner
tls: serve
args: ["--port", "0", "--hostname", "127.0.0.1"]
env:
  PORT: "0"
  HOSTNAME: "127.0.0.1"
permissions:
  net: true
  env: true
  sys: true
probe:
  host: plc.default.global.svc.kcp.local
  path: /health
