name: "{{.Bidder.Name}}"
entry: hono-bidder
stateDir: "{{.StateDir}}/bob-{{.Bidder.Name}}"
serviceAccount: deno-runner
tls: trust
args: ["--atproto-identity-mode", "pdsAccount", "--atproto-handle", "{{.Bidder.Handle}}", "--atproto-pds-url", "https://pds.default.bob.svc.kcp.local", "--identity-vault-file", "{{.StateDir}}/bob-{{.Bidder.Name}}/identity-vault.json", "--serve-port", "0", "--relay-url", "https://relay.default.relay.svc.kcp.local", "--plc-directory-url", "https://plc.default.global.svc.kcp.local", "--ingress-proxy-host", "relay.localhost:{{.DispatcherPort}}", "--policy", "open", "--compute-provider-firecracker", "--compute-provider-firecracker-work-root", "{{.Firecracker.WorkRoot}}", "--compute-provider-firecracker-vmruntime-command", {{.Firecracker.VMRuntimeCommand}}, "--contract-store-dir", "{{.StateDir}}/bob-{{.Bidder.Name}}/contracts", "--guest-tls-port", "{{.GuestTLSPort}}"]
env:
  PORT: "0"
  SERVE_PORT: "0"
  REPO_PRIVATE_KEY_HEX: "{{.Bidder.PrivateKeyHex}}"
  PDS_STATE_PATH: "{{.StateDir}}/bob-{{.Bidder.Name}}/pds-state"
  REPO_PRIVATE_KEY_HEX_PATH: "{{.StateDir}}/bob-{{.Bidder.Name}}/repo-private-key.hex"
  OAUTH_SESSION_PATH: "{{.StateDir}}/bob-{{.Bidder.Name}}/oauth-session.json"
permissions:
  net: true
  env: true
  sys: true
  read: ["{{.Firecracker.WorkRoot}}"]
  write: ["{{.Firecracker.WorkRoot}}"]
  run:
    allow: ["ssh-keygen", "bash", "deno", {{.Firecracker.VMRuntimeExec}}]
    reason: >-
      the firecracker compute provider starts, inspects, stops and lists each guest's VM unit through the
      Linux VM runtime command (socialweb-computer internal vm), the guest OIDC issuer verifies ssh
      signatures with ssh-keygen, and the in-process policy engine runs a policy workflow's run steps in
      bash and its actions as deno subprocesses (deno is the pinned deno the template runs on)
probe:
  host: "{{.Bidder.Name}}.default.bob.svc.kcp.local"
  path: /oauth-client-metadata.json
