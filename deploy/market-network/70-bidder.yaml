name: "{{.Bidder.Name}}"
entry: hono-bidder
cwd: ts/atproto-market
stateDir: "{{.StateDir}}/bob-{{.Bidder.Name}}"
serviceAccount: deno-runner
tls: trust
args: ["--atproto-identity-mode", "pdsAccount", "--atproto-handle", "{{.Bidder.Handle}}", "--atproto-pds-url", "https://pds.default.bob.svc.kcp.local", "--identity-vault-file", "{{.StateDir}}/bob-{{.Bidder.Name}}/identity-vault.json", "--serve-port", "0", "--relay-url", "https://relay.default.relay.svc.kcp.local", "--plc-directory-url", "https://plc.default.global.svc.kcp.local", "--ingress-proxy-host", "relay.localhost:{{.DispatcherPort}}", "--policy", "open", "--compute-provider-firecracker", "--compute-provider-firecracker-nodeimage", "{{.Firecracker.NodeImage}}", "--compute-provider-firecracker-nodeboot", "{{.Firecracker.NodeBoot}}", "--compute-provider-firecracker-config", "{{.Firecracker.Config}}", "--compute-provider-firecracker-repo-dir", "{{.Firecracker.RepoDir}}", "--compute-provider-firecracker-preinstall", "{{.Firecracker.Preinstall}}", "--compute-provider-firecracker-vmm", "{{.Firecracker.VMM}}", "--compute-provider-firecracker-runner-image", "{{.Firecracker.RunnerImage}}", "--compute-provider-firecracker-work-root", "{{.Firecracker.WorkRoot}}", "--compute-provider-firecracker-container-labels", "swc.market-network={{.NetworkID}},swc.bidder={{.Bidder.Name}}", "--compute-provider-firecracker-reuse-image", "--contract-store-dir", "{{.StateDir}}/bob-{{.Bidder.Name}}/contracts", "--guest-tls-port", "{{.GuestTLSPort}}"{{.Firecracker.ExtraArgs}}]
env:
  PORT: "0"
  SERVE_PORT: "0"
  REPO_PRIVATE_KEY_HEX: "{{.Bidder.PrivateKeyHex}}"
  PDS_STATE_PATH: "{{.StateDir}}/bob-{{.Bidder.Name}}/pds-state"
  REPO_PRIVATE_KEY_HEX_PATH: "{{.StateDir}}/bob-{{.Bidder.Name}}/repo-private-key.hex"
  OAUTH_SESSION_PATH: "{{.StateDir}}/bob-{{.Bidder.Name}}/oauth-session.json"
permissions:
  net: true
  env: true
  sys: true
  read: ["{{.Firecracker.NodeImage}}", "{{.Firecracker.Config}}", "{{.Firecracker.RepoDir}}", "{{.Firecracker.Preinstall}}", "{{.Firecracker.WorkRoot}}"{{.Firecracker.ExtraRead}}]
  write: ["{{.Firecracker.WorkRoot}}"{{.Firecracker.ExtraWrite}}]
  run:
    allow: ["docker", "ssh-keygen", "{{.Firecracker.NodeImage}}"{{.Firecracker.ExtraRun}}]
    reason: >-
      the firecracker compute provider builds the guest image with the node image tool, boots each guest
      in a docker runner container, and the guest OIDC issuer verifies ssh signatures with ssh-keygen; until
      0007 M5-RUN-BIDDER makes compute-provider-kcp the bidder's provider
probe:
  host: "{{.Bidder.Name}}.default.bob.svc.kcp.local"
  path: /oauth-client-metadata.json
