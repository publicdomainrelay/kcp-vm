apiVersion: v1
kind: ServiceAccount
metadata:
  name: deno-runner
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deno-runner-read-pods
rules:
  - apiGroups: ["deno.computer"]
    resources: ["denopods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deno-runner-read-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deno-runner-read-pods
subjects:
  - kind: ServiceAccount
    name: deno-runner
    namespace: default
