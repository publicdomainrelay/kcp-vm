apiVersion: socialweb.computer/v1alpha1
kind: OpenBaoServer
metadata:
  name: {{.Bidder.Name}}
spec:
  # The bidder's own OpenBao: its repo key, every relay keypair, each provider's
  # OIDC signing key and its sessions live here, never in kcp and never in a
  # file of the bidder's. The OpenBaoServer controller runs bao on port 0 and
  # reports the address and the file refs of the client certificate it issued
  # for client bidder; the bidder logs in with that certificate to a policy
  # that reaches the bidder kv mount only.
  exec: {{.BaoPath}}
  clients:
    - name: bidder
      kvMount: bidder
