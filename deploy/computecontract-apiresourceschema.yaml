                            - fingerprint
                      observedAt:
                        type: string
                      event:
                        type: object
                        properties:
                          uri:
                            type: string
                          cid:
                            type: string
                        required:
                          - uri
                          - cid
                      payload:
                        type: object
                        properties:
                          uri:
                            type: string
                          cid:
                            type: string
                        required:
                          - uri
                          - cid
                    required:
                      - keys
                      - observedAt
                      - event
                      - payload
                  outcome:
                    type: string
                    enum:
                      - no_bids
                      - bids_denied
                      - policy_rejected
                      - returned
                      - receipt_invalid
                      - network_timeout
                      - complete
                  error:
                    type: string
                  timestamps:
                    type: object
                    properties:
                      requested:
                        type: string
                      rfp_submitted:
                        type: string
                      winner_selected:
                        type: string
                      accepted:
                        type: string
                      receipt:
                        type: string
