                        required:
                          - uri
                          - cid
                      payload:
                        type: object
                        properties:
                          uri:
                            type: string
                          cid:
                            type: string
                        required:
                          - uri
                          - cid
                      ok:
                        type: boolean
                      status:
                        type: integer
                    required:
                      - event
                      - payload
                      - ok
                  termination:
                    type: object
                    properties:
                      reason:
                        type: string
                      exitCode:
                        type: integer
                      observedAt:
                        type: string
                      event:
                        type: object
                        properties:
                          uri:
                            type: string
                          cid:
                            type: string
                        required:
                          - uri
                          - cid
                      payload:
                        type: object
                        properties:
                          uri:
                            type: string
                          cid:
                            type: string
                        required:
                          - uri
                          - cid
                      request:
                        type: object
                        properties:
                          uri:
                            type: string
                          cid:
                            type: string
                        required:
                          - uri
                          - cid
                    required:
                      - reason
                      - observedAt
                      - event
                      - payload
                  hostKeys:
                    type: object
                    properties:
                      keys:
                        type: array
                        items:
                          type: object
                          properties:
