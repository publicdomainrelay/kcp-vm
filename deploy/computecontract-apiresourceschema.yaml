                  - Failed
              message:
                type: string
              secretsUrl:
                type: string
              secretsFetchedAt:
                type: string
              contract:
                type: object
                properties:
                  vmUri:
                    type: string
                  rfpUri:
                    type: string
                  acceptUri:
                    type: string
                  receiptUri:
                    type: string
                  receiptCid:
                    type: string
                  submitEventRef:
                    type: string
                  version:
                    type: integer
                  phase:
                    type: string
                    enum:
                      - requested
                      - rfp_submitted
                      - winner_selected
                      - accepted
                      - receipt
                      - network
                      - released
                  vmName:
                    type: string
                  requesterDid:
                    type: string
                  marketDid:
                    type: string
                  payload:
                    type: object
                    properties:
                      uri:
                        type: string
                      cid:
                        type: string
                    required:
                      - uri
                      - cid
                  rfp:
                    type: object
                    properties:
                      uri:
                        type: string
                      cid:
                        type: string
                    required:
                      - uri
                      - cid
                  policy:
                    type: object
                    properties:
                      uri:
                        type: string
                      cid:
                        type: string
                    required:
                      - uri
                      - cid
                  bid:
                    type: object
                    properties:
                      uri:
                        type: string
                      cid:
                        type: string
                    required:
                      - uri
                      - cid
                  winner:
                    type: object
                    properties:
                      did:
                        type: string
                      submitAccept:
                        type: string
                    required:
                      - did
                  acceptPending:
                    type: object
                    properties:
                      bidUri:
                        type: string
                    required:
                      - bidUri
                  accept:
                    type: object
                    properties:
                      uri:
                        type: string
                      cid:
                        type: string
                    required:
                      - uri
                      - cid
                  receipt:
                    type: object
                    properties:
                      uri:
                        type: string
                      cid:
                        type: string
                    required:
                      - uri
                      - cid
                  receiptOk:
                    type: boolean
                  vmAddress:
                    type: string
                  bids:
                    type: integer
                  release:
                    type: object
                    properties:
