                        type: string
                      released:
                        type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              execution:
                type: object
                properties:
                  step:
                    type: string
                  stepStartedAt:
                    type: string
                  lastEventAt:
                    type: string
                  lastError:
                    type: string
                  attempts:
                    type: integer
                    format: int32
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Contract
          type: string
          jsonPath: .status.contract.phase
        - name: Winner
          type: string
          jsonPath: .status.contract.winner.did
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
