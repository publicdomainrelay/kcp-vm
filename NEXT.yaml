  - id: P8-M1
    title: OPEN - a pinned deno and the TypeScript closure inside the binary, run offline.
    body: >
      OPEN: the plan 0005 gate is satisfied (ACC-ZERO, ACC-MESH, ACC-NOSSH done); items start per their
      depends_on, incl. plan 0006 M1-ASSETS. Plan 0008 (docs/plans/0008-embedded-deno-and-typescript-denopods.yaml)
