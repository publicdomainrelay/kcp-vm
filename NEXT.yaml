about: >
  The live backlog. docs/ARCHITECTURE.md section 14 mirrors this file: an item is written here and
  in section 14 when it is opened, and moves to section 15, with its before-and-after readings,
  when it is closed. Closed items are NOT kept here, because a backlog that lists its own history
  reads as complete. An item is a claim about the design, so each one names the instrument that
  would close it, and an item whose instrument does not exist is not yet an item.

  This file was declared the live backlog by AGENTS.md, README.md, handoff.yaml and section 14 of
  the architecture document, and it did not exist. Four references to a missing file is the defect
  class this repo keeps finding in the other direction, so the file is written rather than the
  references struck: section 14 already held the items, and a mirror that does not exist is a
  backlog nobody can read.

  Opened and closed on 2026-10-05 and therefore NOT listed below: CCM-1 (the cloud controller
  manager is now in the process group and stamps a live Node with its provider ID) and AUTO-1 (the
  scale decision carries a target total and three concurrent pods produce three nodes). Both are in
  section 15 with their readings.

  Opened and closed on 2026-10-06 and therefore NOT listed below: MARKET-2 (a market cluster's
  tenant credential is signed from its own ClientCA on disk, chosen by the substrate, so the vault
  is no longer on the path between the provider and the tenant apiserver). It is in section 15 with
  its readings, including the production failure it closed and the test watched to fail without it.

  Opened and closed on 2026-10-06 and therefore NOT listed below: MOUNT-1 (a cluster's kubeconfig
  mount child was created before the Cluster CR reported a status.URL, and kcp copies that URL into
  the workspace's spec.URL only while reconciling the mount, so the child kept an empty spec.URL and
  the mount served kcp itself). It is in section 15 with its readings, including the production
  reading and the four subtests watched to fail against the old unconditional create.

  Opened and closed on 2026-10-07 and therefore NOT listed below: ESO-3 (the tenant add-ons applied
  a ClusterSecretStore to a tenant cluster no External Secrets Operator was ever installed into, so
  the pass failed every 2 s with an unknown kind until the pass installed the operator first). It is
  in section 15 with its readings, including the production failure it closed and the ordering test
  watched to fail with the sequence inverted.

  Opened and closed on 2026-10-07 and therefore NOT listed below: ESO-4 (the tenant add-ons pass
  awaited the External Secrets controller rollout, so every pass on a cluster with zero nodes - the
  normal resting state - stalled 180 s waiting for a pod the node-scale pass, which runs after the
  pass the wait blocks, is what would schedule). It is in section 15 with its readings, including
  the production process listing and the test watched to fail without the skip.

  Opened and closed on 2026-10-07 and therefore NOT listed below: MARKET-3 (a market cluster's scale
  pass named the next node from the tenant cluster's joined-node list alone, so - because a market
  Provision returns before its machine joins - every provision in a pass resolved to the same ordinal
  and re-wrote the one claim already in flight: the count included the claim, the naming did not).
  It is in section 15 with its readings, including the production log cadence, the claim and node
  counts before the change, and the test watched to fail against the old ordinal.

  Opened and closed on 2026-10-07 and therefore NOT listed below: MARKET-4 (a market node was counted
  in flight while its claim fell short of Running and not after, so a claim that had reached Running
  with its k3s agent not yet registered was in NEITHER half of the count: the pass read zero and
  rented the whole target again - 15 machines for a ceiling of 10). The count is now the tenant
  cluster's own node list. It is in section 15 with its readings, including the production node
  count and the two tests watched to fail against the old predicate.

  Opened and closed on 2026-10-07 and therefore NOT listed below: MARKET-5 (a cluster's first node
  was named at construction, so a restart re-claimed node1 whatever its claim said, and
  kcpclient.WriteNodeClaimTo leaves a claim whose spec matches exactly as it was -- Failed status and
  the door's old words included -- so the provider read its own fresh claim as a failure and released
  it 2 s later). It is in section 15 with its readings, including the production claim/release pair
  and the test watched to fail without the free-ordinal rule reaching the primary host.

  Opened and closed on 2026-10-07 and therefore NOT listed below: FLAKE-2 (the door's node-session
  test failed about one run in four, because its fake guest let ssh2 generate the host key it then
  handed back to ssh2 to parse, and ssh2's own generator occasionally emits a key ssh2's own parser
  refuses). It is in section 15 with its readings, including both of the causes that were proposed and
  refuted first, the rate measured with and without concurrency, and the fixed key that closed it.

  Opened and closed on 2026-10-07 and therefore NOT listed below: MARKET-6 (a Node whose guest the
  door's restart reaped stayed in the tenant cluster reading Ready and took pods, and the door had the
  word for it all along -- it wrote Failed for a claim it reaped and for one it could not confirm
  released, and Released is its own vocabulary for the first). It is in section 15 with its readings,
  including pipeline 74's trace, the rate, and the reason the obvious reconcile was recorded as unsafe
  before the phase distinction made it safe.

  Opened and closed on 2026-10-07 and therefore NOT listed below: GL-2 (a GitLab runner off the kcp
  host could not reach a tenant apiserver, or so it was recorded -- the apiserver binds loopback and
  the only route is the mount, a reverse proxy carrying bearers, and whether exec survives it was
  unmeasured). It closed by measurement rather than by a change: an off-host `kubectl exec` reaches
  containerd through `kcp.socialweb.computer`, and the kubernetes executor that ran five green jobs at
  once runs every job script with `pods/exec`. It is in section 15 with the readings, including what
  the front exposes to a caller with no credential.

  Opened and closed on 2026-10-07 and therefore NOT listed below: GL-1 (the minting CLI had never
  been run against a real cluster's data dir -- and could not have been, because the container image
  built eight other commands and not this one). It is in section 15 with the readings, including the
  identity the apiserver reported back for the credential it minted, and the refusal that protects
  an existing set.

  Opened and closed on 2026-10-07 and therefore NOT listed below: MINT-1 (the rename that gives a mint
  credential its cluster's key ran inside the clusterprovider, which the entrypoint starts AFTER the
  gateway, so every mint in between named a file that was about to be renamed and was refused). The
  clusterprovider gained a `migrate` subcommand and the entrypoint runs it before the gateway starts.
  It is in section 15 with its readings, and the ordering is pinned by a test that reads the
  entrypoint.

  Opened and closed on 2026-10-07 and therefore NOT listed below: MARKET-1 (the startup sweep could
  only reap records written by the substrate the gateway was configured for, because a node record did
  not say which substrate wrote it -- and the identity inside one is the argv THAT substrate gave the
  process). The record now carries its substrate and the sweep resolves the identity per record. It is
  in section 15 with the closing reading the item asked for: a state dir carrying a firecracker record,
  swept by a gateway configured for market, leaving no process from that record running.

  Opened and closed on 2026-10-07 and therefore NOT listed below: ESO-3 (the tenant store's vault
  server is the cluster's own subnet gateway, which a guest substrate binds and routes and the market
  substrate does neither -- so the demo ExternalSecret read SecretSyncedError on every market cluster
  and had never synced there). The store is no longer written where nothing can reach it, and the
  operator still is. It is in section 15 with the production readings, including the loopback-only
  listener and the count of binders on the gateway address.

  Opened and closed on 2026-10-07 and therefore NOT listed below: ESO-2 (the tenant grant admitted the
  External Secrets controller by the literal namespace `default`, so an install anywhere else was
  denied and the denial read as a broken ExternalSecret). Taking the reading found a second half: the
  installer ignored `ESO_NAMESPACE` altogether -- the upstream bundle names `default` in sixteen places
  and defines no Namespace object -- so the grant and the install could not have agreed however the
  render was fixed. Both are closed, and it is in section 15 with the readings, taken in both
  directions.

  Opened and closed on 2026-10-07 and therefore NOT listed below: FLAKE-3 (the OpenBao live gate lent
  itself a port by listening on :0 and closing, so a second `go test` of this repo running at the same
  time could take it, and the gate's plain-HTTP probe then reached somebody else's TLS listener). The
  start now retries with a fresh port when either the vault cannot bind or something else answers.
  It is in section 15 with the reading: ten concurrent runs, all green.

  Opened and closed on 2026-10-07 and therefore NOT listed below: FLAKE-1 (a gate test was recorded as
  resolving a live registry tag, so --fast could fail for reasons unrelated to a change). It closed
  the other way round: the package reaches no registry at all, the failures were the IMAGE'S NAME
  moving because it carries the digest of an agent binary that is built twice in one test process, and
  the test now SKIPS with both digests and the mechanism when an input changes under it, where it used
  to report a red about something else. It is in section 15 with the reproduction, the fix, and the
  instrument watched to fire.

open:
  - id: ESO-4
    title: The External Secrets Operator runs as tenant pods, so it works only while a node exists.
    body: >
      It is installed into each tenant cluster as three Deployments. At zero nodes its pods are
      Pending, so an ExternalSecret syncs only while some tenant workload happens to hold a node, and
      on the market substrate its store cannot reach the cluster vault at all (ESO-3). Since
      2026-10-07 those Deployments are a measured baseline (ARCHITECTURE section 10), so they no
      longer pin nodes; they still do no work at zero. Decided with the user: the operator moves
      BESIDE the control plane, one controller process per tenant cluster in the provider's process
      group (as the cloud controller manager is), pointed at the tenant apiserver, with its webhook
      reached by URL on loopback and the cluster vault reachable on loopback. The in-cluster baseline
      then holds CRDs and RBAC and no workloads.
    instrument: >
      A tenant cluster at ZERO nodes syncing an ExternalSecret from its own vault into a Secret, on
      the market substrate, with no ESO pod in the tenant.
  - id: P5-M1
    title: The live test bed is the vendored deno-kcp market, and the market is the only node path.
    body: >
      Plan 0005 items M1-TESTBED, M1-MARKET-ONLY, M1-AGENT-SPLIT (M1-BIDDER-UNIT done). The plan file holds
      each item's decision, status and evidence; this entry mirrors that the milestone is open.
    instrument: >
      A live test that applies the vendored market example (PLC, relay, PDSs, a firecracker bidder on
      our nodeimage) and gets a tenant node through RFP, bid, accept and cloud-init.
  - id: P5-M2
    title: The requester is event driven and a node's contract survives the process that accepted it.
    body: >
      Plan 0005 items M2-EVENT-CORE, M2-RELEASE, M2-WRAPPER, M2-CLAIM-RECEIPT, M2-CODEGEN,
      M2-BACKOFF.
    instrument: >
      A door restarted between accept and release still releases the node with vm.delete from the
      receipt recorded on its NodeClaim.
  - id: P5-M3
    title: Guests join without ssh, through cluster links and the cluster's OpenBao.
    body: >
      Plan 0005 items M3-CLUSTERLINK, M3-IROH-KEYS, M3-SECRETS-TICKET, M3-JWT, M3-UNITS,
      M3-NODE-LOSS. ARCHITECTURE invariant 13 changes with it.
    instrument: >
      A market node joins and runs a pod with zero ssh sessions in any log, and survives a deploy of
      the control plane container.
  - id: P5-M4
    title: Nodes scale in one at a time, and ESO runs beside the control plane.
    body: >
      Plan 0005 items M4-SCALE-IN, M4-ESO-BESIDE, M4-PENDING-CRS. ESO-4 closes with M4-ESO-BESIDE.
      A tenant DaemonSet must not count as intent on its own, or a cluster with one never reaches zero.
    instrument: >
      A cluster at three nodes whose demand falls to one releases two nodes, then reaches zero.
  - id: P5-M5
    title: Pods reach pods on other nodes and DNS works on every node.
    body: >
      Plan 0005 items M5-DNS and M5-MESHD (rust/socialweb-meshd).
    instrument: >
      A pod on node A reaches a pod on node B, and a name resolves from a node not running CoreDNS.
  - id: P5-M6
    title: GitLab's instance runner stops taking untagged jobs and the old stated limits are fixed.
    body: >
      Plan 0005 items M6-RUNNER1, M6-LIMITS, M6-DOCS, then the plan's acceptance checks ACC-ZERO,
      ACC-MESH and ACC-NOSSH on our GitLab.
    instrument: >
      The plan's three acceptance checks, each with UTC readings from prod and GitLab.

limits:
  - title: A process-group member that binds no port and leaves no record is not swept.
    body: >
      The startup sweep finds a previous gateway's survivors by the node record each substrate leaves
      under the state dir and matches it against the argv the process was started with. The cloud
      controller manager binds no port and leaves no record, deliberately, because its work is to
      reconcile Node objects against the instance snapshot rather than to own a node. So a controller
      left behind by a gateway that died WITHOUT its reverse-order reap is not discoverable by that
      sweep; the group's own Reap stops it in the ordinary case (invariant 21), so this is the
      abnormal path only -- which is exactly the path a sweep exists for, and why this is stated
      rather than hidden. A sweep that found processes by PID alone would find every process on the
      host, and a pid record can be reused by an unrelated process: both alternatives are worse than
      a controller that outlives a SIGKILLed gateway and binds nothing. A host that sees one stops it
      by hand.

  - title: A node cannot reach another node, so a cluster with more than one has no cluster DNS
      for the Pods on the others.
    body: >
      Every guest sits behind its own pasta instance, and pasta is user-mode networking: it carries
      a guest's traffic out to the host's network and nothing between two guests. So the guests of
      one cluster have no path to each other and k3s's flannel overlay has nothing to run over. A
      Pod's resolver is cluster DNS, cluster DNS is CoreDNS, and CoreDNS runs on ONE node; measured
      on a live five-node cluster, TCP to the CoreDNS Pod IP is reachable from a Pod on the node
      CoreDNS runs on and unreachable from the Pods on the other four, and `nslookup` there answers
      `connection timed out; no servers could be reached`. Anything that resolves a name therefore
      works on a ONE-node cluster and on the node CoreDNS happens to sit on, and fails elsewhere.
      This is worse than a race and it is not a startup delay: it does not go away with time. Found
      by running five GitLab jobs on five freshly-booted nodes, where three died on `Could not
      resolve host ... Timeout while contacting DNS servers` and were reported as `script_failure`.
      The runner-side wait in `pre_get_sources_script` bounds the wait and names it, and does not
      fix it. Recorded as a limit rather than an open item because the instrument is
      `TestFiveGitLabJobPodsScaleToFiveNodesAndBackToZero` together with the pod-to-pod reachability
      reading in `docs/plans/0004` section 6a, and the shape of the fix -- a shared L2 for one
      cluster's guests, or a CoreDNS on every node -- is a change to the node network rather than a
      bug in it.

  - title: The node ceiling is ten, and every node is a booted guest.
    body: >
      `SOCIALWEB_CLUSTERPROVIDER_SCALE_MAX_NODES` defaults to 10 and
      `SOCIALWEB_CLUSTERPROVIDER_SCALE_PODS_PER_NODE` to 8; the two together are the whole cost
      model, because every node is a booted guest and the cap is what bounds what one cluster can
      rent. A ceiling below one is refused rather than clamped. `scripts/deploy.sh` passes 10 and
      one pod per node, because the GitLab runner this cluster serves uses pod anti-affinity: one
      job pod occupies one node whatever `podsPerNode` says, so a default of eight would answer
      five queued jobs with one node. Measured on 2026-10-07: five jobs at once, each on a distinct
      market node, all green, with the count never above the ceiling (section 15).

  - title: Scale-in is all-or-nothing, and that is a stated limit.
    body: >
      While there is work the target only grows, to the cap. When the work stops the cluster goes to
      ZERO, not to an intermediate count. Scaling three nodes to two needs an answer to "which node,
      and does its work move", and no instrument here measures that yet, so the branch that would do
      it is not written rather than written wrong. See `docs/plans/0002` section 4.4.

  - title: The instance snapshot is load-bearing, and absent reads as empty.
    body: >
      The cloud controller manager reads the guest set from `<DataDir>/nodes.json`, and its reader
      answers `(known=false, err=nil)` for an absent file AND for an empty array - so both are the
      DELETE path. Writing `[]` protects nothing; what protects a live Node is that the snapshot
      lists it. A snapshot that parses and is wrong is worse than one that is missing, and a
      snapshot that exists and cannot be parsed is an error that patches nothing (invariant 14).
      Recorded as a limit rather than an item because the provider writes the file on every
      provision, teardown and reap and once at startup, so the absent case is not reachable by the
      ordinary path - only by a state dir that was removed under a running controller.

  - title: A host a caller adds to the vault's certificate is not served until the vault restarts.
    body: >
      `vaultcert.EnsureVaultTLSCertificate` re-signs the leaf under the cluster's existing CA when a
      caller asks for one more host, so no client loses the anchor it trusts (section 15). What it
      cannot do is make the RUNNING vault serve the new leaf. OpenBao reads `tls_cert_file` once at
      start, and a caller that adds a host reaches `vaultcert` with a data dir and a host list and no
      process handle: the vault step's own gate (`internal/clusterprovider/steps.go`, `gate`) runs the
      vault a whole pass before the tenant add-on pass and the node disk stage exist, and those two
      are closures in `cmd/socialweb-clusterprovider` (`eso.go`, `nodes.go`) built without the
      materialiser's process group, whose `LocalHost` is the only thing holding the vault's
      `processrunner.Process`. On a market cluster the two host sets differ by construction: bring-up
      asks for `SOCIALWEB_MARKET_ADVERTISE_ADDRESS` and loopback (`internal/clusterprovider/stack.go`),
      the tenant add-on pass asks for the `10.100.0.0/16` gateway `internal/subnetallocator` leases and
      loopback (`cmd/socialweb-clusterprovider/eso.go`). So `https://<gateway>:<vaultPort>` is on the
      leaf on disk and not on the leaf in flight. Measured against a real OpenBao v2.6.2 on 2026-10-07:
      the vault started on a leaf covering `[198.18.255.254 127.0.0.1]`, the tenant add-on pass re-signed
      it to cover `[198.18.255.254 127.0.0.1 10.100.0.1]` on disk, and the vault went on serving
      `[198.18.255.254 127.0.0.1]`; a client dialing it as `10.100.0.1` failed with
      `tls: failed to verify certificate: x509: certificate is valid for 198.18.255.254, 127.0.0.1, not
      10.100.0.1`. Pinned by `TestARunningVaultDoesNotServeAHostItsLeafGainedAfterItStarted` in
      `internal/clusterprovider`. The window is from the re-sign until the vault process next starts:
      the leaf on disk already carries every host a caller has asked for, so a restart - or a cluster
      teardown and bring-up - closes it, and nothing asks for a NEW host after that. The next-best
      behaviour is taken rather than the ideal. The tenant add-on pass REFUSES to hand the
      ExternalSecret a URL the running listener cannot present
      (`vaultcert.RequireServedVaultTLS`, called from `cmd/socialweb-clusterprovider/eso.go`), so that
      pass fails with the reason until the vault has restarted, instead of succeeding onto a Secret
      whose client is guaranteed to fail with a name mismatch. Repairing the listener was refused with
      it: signalling the vault would need a handle the re-sign site does not have, and a reload whose
      completion nothing can observe would let a reload that did not happen and one that did look
      identical - the defect class `ErrNoGuardSeam` exists to prevent. Moving the gateway into the
      FIRST mint was refused too: `subnetallocator.Allocate` walks the pool by occupancy, so the
      gateway is not derivable without the allocator, and leasing a cluster's range in the vault
      bring-up path would change what the zero-node run allocates (section 14).
