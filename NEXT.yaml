  - id: P7-M2
    title: OPEN - the VM runtime with no socialweb code in the VM's tree, parity with the firecracker provider, the Verdict controller, no leaked VM or work dir.
    body: >
      OPEN as P7-M1. Live E8 (2026-10-12, RFP flow): SendCtrlAltDel -> firecracker exit 0.21 s on an idle
      guest; today's provider never noticed a VMM that exited (nodeboot parents and the runner container
